[workspace]
members = ["crates/funk-ir", "crates/funk"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/pmatos/funk"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Tests walk texts nested ten million levels deep; optimized code runs them
# in seconds (ADR-2026-10-30-1334). Debug assertions and overflow checks
# stay on.
[profile.dev]
opt-level = 1
