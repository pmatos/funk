# Derived from LLVM: llvm/test/Transforms/InstSimplify/exact-nsw-nuw.ll,
# ported to fir by hand. LLVM's licence, Apache-2.0 WITH LLVM-exception,
# is in LICENSE.TXT beside this file, and README.md says how the cases
# were chosen and rewritten
# (docs/decisions/testing-and-harness-corpus.md#how-cases-are-chosen-and-rewritten).
#
# Each test runs one function at the arguments given, and its from names
# the LLVM function that the function is. Dividing twice by the signed
# minimum gives 0: udiv by 2^31 leaves 0 or 1, and 0 or 1 by 2^31 is 0.
# @div2 divides by -1 first, which is UB on the signed minimum; LLVM's 0
# refines it.
#
# @shift2 is the negative test that shows lshr exact at work in @shift1:
# without exact, %A lshr %B shl %B is %A with its low %B bits cleared, -16
# on -1 and 4, not %A. LLVM's shl nuw is dropped, a flag that fir's shl
# does not have: the lshr clears the top %B bits, which are the bits that
# the shl shifts out, so the flag never gives poison, and a shift by 32 or
# more is poison with or without it.
#
# @shift1 and @shift3 to @shift5 are left out: their folds rest on lshr
# exact, ashr exact, shl nuw and shl nsw, flags that fir's shifts do not
# have.
source = { file = "llvm/test/Transforms/InstSimplify/exact-nsw-nuw.ll", commit = "7a941dfb2877a0b8cf30323fefa85ad019e0b0f5" }
tests = [
  { func = "@div1", args = ["-1"], results = [{ values = ["0"], witness = [] }], from = "@div1" },
  { func = "@div1", args = ["-2147483648"], results = [{ values = ["0"], witness = [] }], from = "@div1" },
  { func = "@div1", args = ["2147483647"], results = [{ values = ["0"], witness = [] }], from = "@div1" },
  { func = "@div1", args = ["0"], results = [{ values = ["0"], witness = [] }], from = "@div1" },
  { func = "@div2", args = ["5"], results = [{ values = ["0"], witness = [] }], from = "@div2" },
  { func = "@div2", args = ["-1"], results = [{ values = ["0"], witness = [] }], from = "@div2" },
  { func = "@div2", args = ["2147483647"], results = [{ values = ["0"], witness = [] }], from = "@div2" },
  { func = "@div2", args = ["0"], results = [{ values = ["0"], witness = [] }], from = "@div2" },
  { func = "@div2", args = ["-2147483648"], expect = "ub", from = "@div2" },
  { func = "@shift2", args = ["-1", "4"], results = [{ values = ["-16"], witness = [] }], from = "@shift2" },
  { func = "@shift2", args = ["13", "2"], results = [{ values = ["12"], witness = [] }], from = "@shift2" },
  { func = "@shift2", args = ["12", "2"], results = [{ values = ["12"], witness = [] }], from = "@shift2" },
  { func = "@shift2", args = ["5", "0"], results = [{ values = ["5"], witness = [] }], from = "@shift2" },
  { func = "@shift2", args = ["-1", "31"], results = [{ values = ["-2147483648"], witness = [] }], from = "@shift2" },
  { func = "@shift2", args = ["5", "32"], expect = ["poison"], from = "@shift2" },
]
