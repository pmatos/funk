# LICENSE.TXT beside this file, and README.md says how the cases were
# chosen and rewritten
# (docs/decisions/testing-and-harness-corpus.md#how-cases-are-chosen-and-rewritten).
#
# Each test runs one function at the arguments given, and its from names
# the LLVM function that the function is. Each function compares the zext
# and the sext of one i32 at i64, with one of the eight ordered
# predicates. The two are equal on a non-negative value; on a negative one
# the sext is below the zext as signed integers and above it as unsigned
# ones. So eight of them always give true or false, as LLVM folds them,
# and the other eight give true on one sign and false on the other: each
# runs on 0, 1, -1 and the signed minimum.
#
# The file's other functions, @zext_ugt_sext_vec and @sext_ult_zext_vec,
# work on vectors and are left out.
