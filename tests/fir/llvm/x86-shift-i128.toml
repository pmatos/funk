# Derived from LLVM: llvm/test/CodeGen/X86/shift-i128.ll, ported to fir by
# hand. LLVM's licence, Apache-2.0 WITH LLVM-exception, is in LICENSE.TXT
# beside this file, and README.md says how the cases were chosen and
# rewritten
# (docs/decisions/testing-and-harness-corpus.md#how-cases-are-chosen-and-rewritten).
#
# Each test runs one function at the arguments given, and its from names
# the LLVM function that the function is. The file is a code generation
# test: its CHECK lines are x86 assembly, which say nothing that fir can
# run, so each test declares the value that the function's IR computes,
# worked out apart from fir-ref, and runs as native code as well as on
# fir-ref where it is defined.
#
# The @test_*_i128 functions store their shift through a pointer; fir has
# no memory, so each returns it instead. A shift by 128 or more gives
# poison, so the *_outofrange functions, which shift by -1, that is 2^128
# - 1, give poison on every argument, and so do the others on an amount of
# 128 or more: those tests are interpreter-only. @lshr_shl_mask clears the
# top bit. The three @shift_i128_limited_shamt* functions shift by a
# difference of i32s, zero-extended with nneg, a flag that fir's zext does
# not have. An amount with its sign bit set is 2^31 or more, so the shl
# gives poison on it with nneg or without, and dropping the flag changes
# no result. Where the sub has nuw, a %b above the other operand gives
# poison too.
#
# The file's other functions work on vectors and are left out.
