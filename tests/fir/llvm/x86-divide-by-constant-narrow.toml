#
# Each test runs one function at the arguments given, and its from names
# the LLVM function that the function is. The file is a code generation
# test: its CHECK lines are x86 assembly, which say nothing that fir can
# run, so each test declares the value that the function's IR computes,
# worked out apart from fir-ref, and runs as native code as well as on
# fir-ref where it is defined.
#
# This module holds the file's i8, i16 and i32 functions, and
# x86-divide-by-constant-i64 the others. Each function divides, or takes
# the remainder, by a constant, which LLVM lowers with a magic multiply
# and shifts. Native code divides with div or idiv, and each test checks
# the quotient on values at both ends of the range and between. The
# parameter and result attributes zeroext and signext of @test1 to @test4
# and @test6, which tell the x86 calling convention how to pass a narrow
# value, are dropped: they do not change what the function computes.
#
# The file's functions that neither this module nor
# x86-divide-by-constant-i64 holds are left out: the divisions by 15, 257
# and 65535, variants of those by 17, 255 and 65537, and
# @urem_i64_3_optsize, which is @urem_i64_3 with optsize.
