# chosen and rewritten (ADR-2026-11-03-0644).
#
# Each test runs one function at the arguments given, and its from names
# the LLVM function, or its CHECK lines, that the function is. Where LLVM
# folds a select to an operand or a constant, the tests expect that value;
# where it folds it to other ops, the CHECK lines run beside it on the
# same arguments. A select whose arms differ only where its condition
# rules them out is its other arm, or one op: @test1 to @test13 and
# @select_icmp_* test a bit and set or clear it, @select_neutral_add_rhs
# adds 0 where %y is 0, and the recursive ones replace %a with %b where
# the condition says they are equal.
#
# @poison2 and @poison3 choose poison on one arm. fir has no poison
# constant, so each writes it as %p = shl %n, %n with %n = 32, which the
# spec makes poison: on the condition that chooses it the input gives
# poison, and LLVM's %x refines it. @select_sub_cmp gives poison where sub
# nsw overflows, in both forms. The negative tests show where a fold would
# be wrong: @select_neutral_sub_lhs gives 5, not -5, on 5 and 0, and
# @replace_false_op_sgt_neg_and gives 0, not 4, on 4.
#
# The file's other functions are left out: those on vectors, pointers or
# undef, those that use or disjoint or assume, and variants of the
# functions here with commuted arms, other predicates or other constants.
