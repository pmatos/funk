# Derived from LLVM: llvm/test/CodeGen/X86/divide-by-constant.ll, ported
# to fir by hand. LLVM's licence, Apache-2.0 WITH LLVM-exception, is in
# LICENSE.TXT beside this file, and README.md says how the cases were
# chosen and rewritten
# (docs/decisions/testing-and-harness-corpus.md#how-cases-are-chosen-and-rewritten).
#
# Each test runs one function at the arguments given, and its from names
# the LLVM function that the function is. The file is a code generation
# test: its CHECK lines are x86 assembly, which say nothing that fir can
# run, so each test declares the value that the function's IR computes,
# worked out apart from fir-ref, and runs as native code as well as on
# fir-ref where it is defined.
#
# This module holds the file's i64 functions, and
# x86-divide-by-constant-narrow the others. Each function divides, or
# takes the remainder, by a constant, which LLVM lowers with a magic
# multiply and shifts. Native code divides with div or idiv, and each test
# checks the quotient on values at both ends of the range and between.
# LLVM writes constants of 2^63 or more unsigned, and fir writes them as
# the negative values of the same bits: 13835058055282163710 is
# -4611686018427387906. @PR38622 and @PR38622_signed return a struct of an
# i64 and an i32 through insertvalue on undef; fir has no undef and no
# structs, and the functions return the two values as their two results.
#
# The file's functions that neither this module nor
# x86-divide-by-constant-narrow holds are left out: the divisions by 15,
# 257 and 65535, variants of those by 17, 255 and 65537, and
# @urem_i64_3_optsize, which is @urem_i64_3 with optsize.
