# Derived from LLVM: llvm/test/Transforms/InstSimplify/div.ll, ported to
# fir by hand. LLVM's licence, Apache-2.0 WITH LLVM-exception, is in
# LICENSE.TXT beside this file, and README.md says how the cases were
# chosen and rewritten (ADR-2026-11-03-0644).
#
# Each test runs one function at the arguments given, and its from names
# the LLVM function, or its CHECK lines, that the function is. Division by
# zero is immediate UB in fir as in LLVM, so many of these folds hold
# because the input is UB wherever they would be wrong: @zero_dividend on
# 0, @zext_bool_udiv_divisor on false, the eight @*_one_*_divisor
# functions where 1 rem %b is 0, @sdiv_and_one_divisor on an even %x and
# @sdiv_neg_or_divisor on an odd %x. Those runs are interpreter-only tests
# that expect ub; LLVM's folded value refines UB.
#
# @sdiv_minusone_divisor divides -128 by -1 at i8. LLVM's CHECK line
# returns poison, a refinement of the UB that LangRef gives this division;
# fir-ref reports the UB itself. @sdiv_exact_trailing_zeros divides an odd
# number by -42 with exact, which is poison on every argument, as LLVM
# says. @udiv_exact_mul_nsw and @sdiv_exact_mul_nuw give %x, or poison
# where the mul's flag or the division's exact breaks; LLVM's %x refines
# them. The negative tests, which LLVM does not fold, show why:
# @sdiv_exact_trailing_zeros_eq is defined on 40; @udiv_exact_mul, without
# nsw, wraps 24 * %x to a multiple of 24 whose quotient is not %x, and
# gives 0 on 32 and 10 on 42; and @udiv_mul_nsw gives 9, not -1, on -1
# without exact.
#
# The file's other functions are left out: those on vectors, those on
# constants made from pointers, @div1, which calls a function the file
# does not define, and variants of the functions here with other
# constants.
