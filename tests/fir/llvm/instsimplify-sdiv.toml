# Derived from LLVM: llvm/test/Transforms/InstSimplify/sdiv.ll, ported to
# fir by hand. LLVM's licence, Apache-2.0 WITH LLVM-exception, is in
# LICENSE.TXT beside this file, and README.md says how the cases were
# chosen and rewritten (ADR-2026-11-03-0644).
#
# Each test runs one function at the arguments given, and its from names
# the LLVM function that the function is. A value divided by its negation
# is -1. With nsw on the negation, the input is poison or UB wherever that
# is not so: at 0 the division is 0 by 0, UB; at the signed minimum the
# negation is poison, which gives poison as a dividend and UB as a
# divisor; and where %x - %y overflows, @knownnegation's %xy is poison,
# and so is %yx, and a poison divisor is UB, unless %x - %y is 2^31: then
# %yx is the signed minimum, and the poison dividend gives poison, as on 0
# and the signed minimum. LLVM's -1 refines each. The negative tests drop
# nsw, and on the signed minimum the quotient is 1, not -1.
#
# The file's other functions are left out: those on vectors, and
# @knownnegation_bad_1 and @knownnegation_bad_2, variants of
# @knownnegation_bad_3 with nsw on one sub.
source = { file = "llvm/test/Transforms/InstSimplify/sdiv.ll", commit = "7a941dfb2877a0b8cf30323fefa85ad019e0b0f5" }
tests = [
  { func = "@negated_operand", args = ["5"], results = [{ values = ["-1"], witness = [] }], from = "@negated_operand" },
  { func = "@negated_operand", args = ["-7"], results = [{ values = ["-1"], witness = [] }], from = "@negated_operand" },
  { func = "@negated_operand", args = ["2147483647"], results = [{ values = ["-1"], witness = [] }], from = "@negated_operand" },
  { func = "@negated_operand", args = ["0"], expect = "ub", from = "@negated_operand" },
  { func = "@negated_operand", args = ["-2147483648"], expect = ["poison"], from = "@negated_operand" },
  { func = "@knownnegation", args = ["5", "3"], results = [{ values = ["-1"], witness = [] }], from = "@knownnegation" },
  { func = "@knownnegation", args = ["-3", "7"], results = [{ values = ["-1"], witness = [] }], from = "@knownnegation" },
  { func = "@knownnegation", args = ["3", "3"], expect = "ub", from = "@knownnegation" },
  { func = "@knownnegation", args = ["-2147483648", "1"], expect = "ub", from = "@knownnegation" },
  { func = "@knownnegation", args = ["-2147483648", "0"], expect = "ub", from = "@knownnegation" },
  { func = "@knownnegation", args = ["0", "-2147483648"], expect = ["poison"], from = "@knownnegation" },
  { func = "@negated_operand_2", args = ["10"], results = [{ values = ["-1"], witness = [] }], from = "@negated_operand_2" },
  { func = "@negated_operand_2", args = ["-2147483648"], results = [{ values = ["-1"], witness = [] }], from = "@negated_operand_2" },
  { func = "@negated_operand_2", args = ["5"], expect = "ub", from = "@negated_operand_2" },
  { func = "@negated_operand_2", args = ["-2147483643"], expect = ["poison"], from = "@negated_operand_2" },
  { func = "@negated_operand_commute", args = ["5"], results = [{ values = ["-1"], witness = [] }], from = "@negated_operand_commute" },
  { func = "@negated_operand_commute", args = ["0"], expect = "ub", from = "@negated_operand_commute" },
  { func = "@negated_operand_commute", args = ["-2147483648"], expect = "ub", from = "@negated_operand_commute" },
  { func = "@negated_operand_bad", args = ["5"], results = [{ values = ["-1"], witness = [] }], from = "@negated_operand_bad" },
  { func = "@negated_operand_bad", args = ["-2147483648"], results = [{ values = ["1"], witness = [] }], from = "@negated_operand_bad" },
  { func = "@knownnegation_bad_3", args = ["5", "3"], results = [{ values = ["-1"], witness = [] }], from = "@knownnegation_bad_3" },
  { func = "@knownnegation_bad_3", args = ["-2147483648", "0"], results = [{ values = ["1"], witness = [] }], from = "@knownnegation_bad_3" },
]
