# Derived from LLVM: llvm/test/CodeGen/X86/i128-add.ll, ported to fir by
# hand. LLVM's licence, Apache-2.0 WITH LLVM-exception, is in LICENSE.TXT
# beside this file, and README.md says how the cases were chosen and
# rewritten
# (docs/decisions/testing-and-harness-corpus.md#how-cases-are-chosen-and-rewritten).
#
# Each test runs one function at the arguments given, and its from names
# the LLVM function that the function is. The file is a code generation
# test: its CHECK lines are x86 assembly, which say nothing that fir can
# run, so each test declares the value that the function's IR computes,
# worked out apart from fir-ref, and runs as native code as well as on
# fir-ref where it is defined.
#
# @add_i128 adds 1 to %x and the sum to %y, with carries out of the low
# half and wraps at the top.
#
# The file's other function, @add_v1i128, works on a vector and is left
# out.
source = { file = "llvm/test/CodeGen/X86/i128-add.ll", commit = "7a941dfb2877a0b8cf30323fefa85ad019e0b0f5" }
tests = [
  { func = "@add_i128", args = ["0", "0"], results = [{ values = ["1"], witness = [] }], from = "@add_i128" },
  { func = "@add_i128", args = ["18446744073709551615", "0"], results = [{ values = ["18446744073709551616"], witness = [] }], from = "@add_i128" },
  { func = "@add_i128", args = ["-1", "0"], results = [{ values = ["0"], witness = [] }], from = "@add_i128" },
  { func = "@add_i128", args = ["-1", "-1"], results = [{ values = ["-1"], witness = [] }], from = "@add_i128" },
  { func = "@add_i128", args = ["170141183460469231731687303715884105727", "0"], results = [{ values = ["-170141183460469231731687303715884105728"], witness = [] }], from = "@add_i128" },
  { func = "@add_i128", args = ["1512366075204170947332355369683137040", "18446744073709551615"], results = [{ values = ["1512366075204170965779099443392688656"], witness = [] }], from = "@add_i128" },
]
