#
# Each test runs one function at the arguments given, and its from names
# the LLVM function that the function is, or says that it is the form that
# the RUN line asks InstCombine for. The file's RUN line checks only that
# no udiv remains: a udiv by a power of two becomes an lshr, and a udiv by
# a select of two powers of two an lshr by a select. The test.folded
# functions are those forms, written by hand, and run beside the inputs on
# the same arguments. The widths, i33, i49, i59, are ones that the backend
# does not lower, so every test is interpreter-only, and each expects the
# value that the udiv gives.
#
# Every function of the file is here.
