# chosen and rewritten
# (docs/decisions/testing-and-harness-corpus.md#how-cases-are-chosen-and-rewritten).
#
# Each test runs one function at the arguments given, and its from names
# the LLVM function, or its CHECK lines, that the function is. A remainder
# by zero is immediate UB, and so is srem of the signed minimum by -1, so
# a fold to 0 holds wherever the input is defined: @zero_dividend on 0,
# @zext_bool_srem_divisor on false, @select1 and @select2 on 0 and true,
# and @srem_with_sext_bool_divisor on false and on true with the signed
# minimum are UB, which LLVM's 0 refines. @srem_minusone_divisor is UB in
# fir and LangRef, and LLVM's CHECK line gives poison, a refinement of it.
#
# @rem1 and @rem2 take the remainder twice, and @rem1.folded and
# @rem2.folded once, as their CHECK lines do; both run on the same
# arguments, and @rem3, the negative test, gives 0, not -1, on -7 and 3. A
# dividend known to be below the divisor is its own remainder: the two
# @urem_dividend_known_smaller_than_constant_divisor functions run beside
# their CHECK lines, an and and an xor, and
# @urem_constant_dividend_known_smaller_than_divisor gives 250. Each
# @not_urem_ function, a negative test, lets the dividend reach the
# divisor, and gives 0 where it does.
# @urem_dividend_known_smaller_than_divisor, which LLVM does not fold
# although its dividend is at most 250 and its divisor at least 251, gives
# its dividend.
#
# @srem_of_mul_nsw and @urem_of_mul_nuw give 0, or poison where the mul's
# flag breaks, which LLVM's 0 refines. The negative tests show the flag at
# work: with no flag, @srem_of_mul and @urem_of_mul give 65536 on 65536
# and 65537, and with the other flag, @srem_of_mul_nuw gives -1 on 2^30
# and 3, and @urem_of_mul_nsw 1 on -1 and 3. @rem7 and @rem10 shift with
# no flag, so %x shl %y need not be a multiple of %x: on 3 and 31 they
# give -2 and 2. @srem_mul_udiv and @urem_mul_sdiv mix a signed and an
# unsigned division, and give -1 and 1 on -56 and 3.
#
# The three functions of lines 516 to 545 keep LLVM's names with simplify
# spelled correctly. LLVM's names misspell it, dropping its second i, and
# the repository's spelling check rejects them
# (docs/decisions/testing-and-harness-corpus.md#names-the-spelling-check-rejects),
# so each of their tests' from names the function by its file and lines.
# @simplify_urem_of_mul, a urem by 10 of a mul nuw by 30, gives 0 on 0, 3
# and 8, and poison on 9 and -1, where the mul's flag breaks, which LLVM's
# 0 refines. Its negative tests show what the fold needs: with nsw for
# nuw, @simplify_urem_of_mul_fail_bad_flag gives 6 on -1, as the mul gives
# 226 unsigned; with 31, not a multiple of 10,
# @simplify_urem_of_mul_fail_bad_mod gives 1 on 1.
#
# The file's functions that neither this module nor
# instsimplify-rem-widths holds are left out: those on vectors or undef;
# @rem4, which calls a function the file does not define; and @rem5 and
# @rem8, whose fold rests on shl nsw and shl nuw, flags that fir's shl
# does not have.
