# chosen and rewritten (ADR-2026-11-03-0644).
#
# Each test runs one function at the arguments given, and its from names
# the LLVM function, or its CHECK lines, that the function is. A remainder
# by zero is immediate UB, and so is srem of the signed minimum by -1, so
# a fold to 0 holds wherever the input is defined: @zero_dividend on 0,
# @zext_bool_srem_divisor on false, @select1 and @select2 on 0 and true,
# and @srem_with_sext_bool_divisor on false and on true with the signed
# minimum are UB, which LLVM's 0 refines. @srem_minusone_divisor is UB in
# fir and LangRef, and LLVM's CHECK line gives poison, a refinement of it.
#
# @rem1 and @rem2 take the remainder twice, and @rem1.folded and
# @rem2.folded once, as their CHECK lines do; both run on the same
# arguments, and @rem3, the negative test, gives 0, not -1, on -7 and 3.
# @urem_dividend_known_smaller_than_constant_divisor runs beside its CHECK
# lines, an and. @srem_of_mul_nsw and @urem_of_mul_nuw give 0, or poison
# where the mul's flag breaks, which LLVM's 0 refines; without the flag,
# @srem_of_mul and @urem_of_mul_nsw give 65536 and 1.
#
# The file's functions that neither this module nor
# instsimplify-rem-widths holds are left out: those on vectors or undef,
# those that use shl nsw or shl nuw, @rem4, which calls a function the
# file does not define, and variants of the functions here with other
# constants or operands.
