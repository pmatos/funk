# Derived from LLVM: llvm/test/Transforms/InstSimplify/icmp-constant.ll,
# ported to fir by hand. LLVM's licence, Apache-2.0 WITH LLVM-exception,
# is in LICENSE.TXT beside this file, and README.md says how the cases
# were chosen and rewritten (ADR-2026-11-03-0644).
#
# Each test runs one function at the arguments given, and its from names
# the LLVM function that the function is. Each function compares the
# result of an op with a constant that the op's range of results is all on
# one side of, so LLVM folds the icmp to true or false. Where a flag gives
# the range, the op is poison on the arguments that break it, and so is
# the icmp: @tautological9, the @add_nsw_* functions and the @mul_nuw_*
# and @mul_nsw_* ones give poison there, which LLVM's constant refines.
# @udiv5 and @compare_dividend divide by %X, which is UB at 0. LLVM writes
# the i8 constant 255 as 255, and fir as -1. The negative tests, which
# LLVM does not fold, move the constant by one and give the other answer
# on one argument: -128 for the @*_limit functions, and 126 for
# @mul_urem_cmp_constant1, as 126 * 43 is 42 modulo 256. @mul_nsw_by_zero
# and @mul_nuw_by_zero keep LLVM's blocks in their order, in which %m is
# used in a block that comes before the one that defines it, which
# dominates it.
#
# The file's other functions are left out: those on vectors, those that
# use shl nsw, lshr exact or ashr exact, flags that fir's shifts do not
# have, and variants of the functions here with other constants.
