#
# Each test runs one function at the arguments given, and its from names
# the LLVM function that the function is. The file is a code generation
# test: its CHECK lines are x86 assembly, which say nothing that fir can
# run, so each test declares the value that the function's IR computes,
# worked out apart from fir-ref, and runs as native code as well as on
# fir-ref where it is defined.
#
# Each function divides an i128 by a constant, or takes the remainder,
# unsigned: by 2^66, by 2^128 - 2^66 and by 2^128 - 2^66 - 3, which LLVM
# writes as the negative constants that fir writes too, and by 7, 11, 22,
# 56 and 67, which LLVM lowers with a magic multiply, and native code here
# through the runtime helper of ADR-2026-11-03-0415. Each runs on the same
# values.
#
# Every function of the file is here.
