# Derived from LLVM: llvm/test/Transforms/InstCombine/apint-add.ll, ported
# to fir by hand. LLVM's licence, Apache-2.0 WITH LLVM-exception, is in
# LICENSE.TXT beside this file, and README.md says how the cases were
# chosen and rewritten (ADR-2026-11-03-0644).
#
# Each test runs one function at the arguments given, and its from names
# the LLVM function, or its CHECK lines, that the function is. Flipping
# the sign bit with xor and then adding the signed minimum gives the
# operand back, at i1, i15, i47, i65, i111 and i1024; @test4 and @test9
# add 1 to a value whose bit 0 is clear, which is an or, and @test8 adds
# the signed minimum to an xor with a value whose top bit is set, which is
# one xor; @sext zero-extends %x xor -8 from i4 to i7 and adds -8 with
# nsw, which is a sext. Each fold that gives other ops runs beside its
# CHECK lines on the same arguments. @test9's CHECK lines write or
# disjoint, a flag that fir's or does not have: bit 0 of the and is clear,
# so the flag never gives poison there, and the fir form drops it. LLVM
# writes @test4's mask, 562949953421310, unsigned; fir writes that i49
# constant -2. The widths are ones that the backend does not lower, so
# every test is interpreter-only.
#
# The file's other functions are left out: @test3vec and @sext_vec work on
# vectors, and @sext_multiuse is a variant of @sext whose other uses
# divide.
