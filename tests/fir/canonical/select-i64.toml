# Tests of select-i64.fir: select at i64 with each condition, false and
# true, on every pair of boundary bit patterns: 0, 1, -1, the signed
# minimum and the signed maximum (#16). true chooses the first value and
# false the second.
# Each test is differential: fir-ref and native code run it, and the
# native result must equal fir-ref's.
tests = [
  { func = "@select", args = ["false", "0", "0"] },
  { func = "@select", args = ["false", "0", "1"] },
  { func = "@select", args = ["false", "0", "-1"] },
  { func = "@select", args = ["false", "0", "-9223372036854775808"] },
  { func = "@select", args = ["false", "0", "9223372036854775807"] },
  { func = "@select", args = ["false", "1", "0"] },
  { func = "@select", args = ["false", "1", "1"] },
  { func = "@select", args = ["false", "1", "-1"] },
  { func = "@select", args = ["false", "1", "-9223372036854775808"] },
  { func = "@select", args = ["false", "1", "9223372036854775807"] },
  { func = "@select", args = ["false", "-1", "0"] },
  { func = "@select", args = ["false", "-1", "1"] },
  { func = "@select", args = ["false", "-1", "-1"] },
  { func = "@select", args = ["false", "-1", "-9223372036854775808"] },
  { func = "@select", args = ["false", "-1", "9223372036854775807"] },
  { func = "@select", args = ["false", "-9223372036854775808", "0"] },
  { func = "@select", args = ["false", "-9223372036854775808", "1"] },
  { func = "@select", args = ["false", "-9223372036854775808", "-1"] },
  { func = "@select", args = ["false", "-9223372036854775808", "-9223372036854775808"] },
  { func = "@select", args = ["false", "-9223372036854775808", "9223372036854775807"] },
  { func = "@select", args = ["false", "9223372036854775807", "0"] },
  { func = "@select", args = ["false", "9223372036854775807", "1"] },
  { func = "@select", args = ["false", "9223372036854775807", "-1"] },
  { func = "@select", args = ["false", "9223372036854775807", "-9223372036854775808"] },
  { func = "@select", args = ["false", "9223372036854775807", "9223372036854775807"] },
  { func = "@select", args = ["true", "0", "0"] },
  { func = "@select", args = ["true", "0", "1"] },
  { func = "@select", args = ["true", "0", "-1"] },
  { func = "@select", args = ["true", "0", "-9223372036854775808"] },
  { func = "@select", args = ["true", "0", "9223372036854775807"] },
  { func = "@select", args = ["true", "1", "0"] },
  { func = "@select", args = ["true", "1", "1"] },
  { func = "@select", args = ["true", "1", "-1"] },
  { func = "@select", args = ["true", "1", "-9223372036854775808"] },
  { func = "@select", args = ["true", "1", "9223372036854775807"] },
  { func = "@select", args = ["true", "-1", "0"] },
  { func = "@select", args = ["true", "-1", "1"] },
  { func = "@select", args = ["true", "-1", "-1"] },
  { func = "@select", args = ["true", "-1", "-9223372036854775808"] },
  { func = "@select", args = ["true", "-1", "9223372036854775807"] },
  { func = "@select", args = ["true", "-9223372036854775808", "0"] },
  { func = "@select", args = ["true", "-9223372036854775808", "1"] },
  { func = "@select", args = ["true", "-9223372036854775808", "-1"] },
  { func = "@select", args = ["true", "-9223372036854775808", "-9223372036854775808"] },
  { func = "@select", args = ["true", "-9223372036854775808", "9223372036854775807"] },
  { func = "@select", args = ["true", "9223372036854775807", "0"] },
  { func = "@select", args = ["true", "9223372036854775807", "1"] },
  { func = "@select", args = ["true", "9223372036854775807", "-1"] },
  { func = "@select", args = ["true", "9223372036854775807", "-9223372036854775808"] },
  { func = "@select", args = ["true", "9223372036854775807", "9223372036854775807"] },
]
