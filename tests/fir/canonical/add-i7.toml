  { func = "@add_nsw", args = ["-64", "1"], expect = ["-63"] },
  { func = "@add_nsw", args = ["-64", "-1"], expect = ["poison"] },
  { func = "@add_nsw", args = ["-64", "-64"], expect = ["poison"] },
  { func = "@add_nsw", args = ["-64", "63"], expect = ["-1"] },
  { func = "@add_nsw", args = ["63", "0"], expect = ["63"] },
  { func = "@add_nsw", args = ["63", "1"], expect = ["poison"] },
  { func = "@add_nsw", args = ["63", "-1"], expect = ["62"] },
  { func = "@add_nsw", args = ["63", "-64"], expect = ["-1"] },
  { func = "@add_nsw", args = ["63", "63"], expect = ["poison"] },
  { func = "@add_nuw_nsw", args = ["0", "0"], expect = ["0"] },
  { func = "@add_nuw_nsw", args = ["0", "1"], expect = ["1"] },
  { func = "@add_nuw_nsw", args = ["0", "-1"], expect = ["-1"] },
  { func = "@add_nuw_nsw", args = ["0", "-64"], expect = ["-64"] },
  { func = "@add_nuw_nsw", args = ["0", "63"], expect = ["63"] },
  { func = "@add_nuw_nsw", args = ["1", "0"], expect = ["1"] },
  { func = "@add_nuw_nsw", args = ["1", "1"], expect = ["2"] },
  { func = "@add_nuw_nsw", args = ["1", "-1"], expect = ["poison"] },
  { func = "@add_nuw_nsw", args = ["1", "-64"], expect = ["-63"] },
  { func = "@add_nuw_nsw", args = ["1", "63"], expect = ["poison"] },
  { func = "@add_nuw_nsw", args = ["-1", "0"], expect = ["-1"] },
