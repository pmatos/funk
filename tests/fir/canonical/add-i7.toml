  { func = "@add_nuw_nsw", args = ["-64", "0"], expect = ["-64"] },
  { func = "@add_nuw_nsw", args = ["-64", "1"], expect = ["-63"] },
  { func = "@add_nuw_nsw", args = ["-64", "-1"], expect = ["poison"] },
  { func = "@add_nuw_nsw", args = ["-64", "-64"], expect = ["poison"] },
  { func = "@add_nuw_nsw", args = ["-64", "63"], expect = ["-1"] },
  { func = "@add_nuw_nsw", args = ["63", "0"], expect = ["63"] },
  { func = "@add_nuw_nsw", args = ["63", "1"], expect = ["poison"] },
  { func = "@add_nuw_nsw", args = ["63", "-1"], expect = ["poison"] },
  { func = "@add_nuw_nsw", args = ["63", "-64"], expect = ["-1"] },
