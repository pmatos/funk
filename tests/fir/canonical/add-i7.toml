# Tests of add-i7.fir: add at i7, with each set of its
# flags, on every pair of boundary bit patterns: 0, 1, -1, the signed
# minimum and the signed maximum, or false and true at i1. A broken
# flag gives poison (#14).
# The backend does not lower i7, so each test is interpreter-only and
# states the result that fir-ref must give.
tests = [
  { func = "@add", args = ["0", "0"], expect = ["0"] },
  { func = "@add", args = ["0", "1"], expect = ["1"] },
  { func = "@add", args = ["0", "-1"], expect = ["-1"] },
  { func = "@add", args = ["0", "-64"], expect = ["-64"] },
  { func = "@add", args = ["0", "63"], expect = ["63"] },
  { func = "@add", args = ["1", "0"], expect = ["1"] },
  { func = "@add", args = ["1", "1"], expect = ["2"] },
  { func = "@add", args = ["1", "-1"], expect = ["0"] },
  { func = "@add", args = ["1", "-64"], expect = ["-63"] },
  { func = "@add", args = ["1", "63"], expect = ["-64"] },
  { func = "@add", args = ["-1", "0"], expect = ["-1"] },
  { func = "@add", args = ["-1", "1"], expect = ["0"] },
  { func = "@add", args = ["-1", "-1"], expect = ["-2"] },
  { func = "@add", args = ["-1", "-64"], expect = ["63"] },
  { func = "@add", args = ["-1", "63"], expect = ["62"] },
  { func = "@add", args = ["-64", "0"], expect = ["-64"] },
  { func = "@add", args = ["-64", "1"], expect = ["-63"] },
  { func = "@add", args = ["-64", "-1"], expect = ["63"] },
  { func = "@add", args = ["-64", "-64"], expect = ["0"] },
  { func = "@add", args = ["-64", "63"], expect = ["-1"] },
  { func = "@add", args = ["63", "0"], expect = ["63"] },
  { func = "@add", args = ["63", "1"], expect = ["-64"] },
  { func = "@add", args = ["63", "-1"], expect = ["62"] },
  { func = "@add", args = ["63", "-64"], expect = ["-1"] },
  { func = "@add", args = ["63", "63"], expect = ["-2"] },
  { func = "@add_nuw", args = ["0", "0"], expect = ["0"] },
  { func = "@add_nuw", args = ["0", "1"], expect = ["1"] },
  { func = "@add_nuw", args = ["0", "-1"], expect = ["-1"] },
  { func = "@add_nuw", args = ["0", "-64"], expect = ["-64"] },
  { func = "@add_nuw", args = ["0", "63"], expect = ["63"] },
  { func = "@add_nuw", args = ["1", "0"], expect = ["1"] },
  { func = "@add_nuw", args = ["1", "1"], expect = ["2"] },
  { func = "@add_nuw", args = ["1", "-1"], expect = ["poison"] },
  { func = "@add_nuw", args = ["1", "-64"], expect = ["-63"] },
  { func = "@add_nuw", args = ["1", "63"], expect = ["-64"] },
  { func = "@add_nuw", args = ["-1", "0"], expect = ["-1"] },
  { func = "@add_nuw", args = ["-1", "1"], expect = ["poison"] },
  { func = "@add_nuw", args = ["-1", "-1"], expect = ["poison"] },
  { func = "@add_nuw", args = ["-1", "-64"], expect = ["poison"] },
  { func = "@add_nuw", args = ["-1", "63"], expect = ["poison"] },
  { func = "@add_nuw", args = ["-64", "0"], expect = ["-64"] },
  { func = "@add_nuw", args = ["-64", "1"], expect = ["-63"] },
  { func = "@add_nuw", args = ["-64", "-1"], expect = ["poison"] },
  { func = "@add_nuw", args = ["-64", "-64"], expect = ["poison"] },
  { func = "@add_nuw", args = ["-64", "63"], expect = ["-1"] },
  { func = "@add_nuw", args = ["63", "0"], expect = ["63"] },
  { func = "@add_nuw", args = ["63", "1"], expect = ["-64"] },
  { func = "@add_nuw", args = ["63", "-1"], expect = ["poison"] },
  { func = "@add_nuw", args = ["63", "-64"], expect = ["-1"] },
  { func = "@add_nuw", args = ["63", "63"], expect = ["-2"] },
  { func = "@add_nsw", args = ["0", "0"], expect = ["0"] },
  { func = "@add_nsw", args = ["0", "1"], expect = ["1"] },
  { func = "@add_nsw", args = ["0", "-1"], expect = ["-1"] },
  { func = "@add_nsw", args = ["0", "-64"], expect = ["-64"] },
  { func = "@add_nsw", args = ["0", "63"], expect = ["63"] },
  { func = "@add_nsw", args = ["1", "0"], expect = ["1"] },
  { func = "@add_nsw", args = ["1", "1"], expect = ["2"] },
  { func = "@add_nsw", args = ["1", "-1"], expect = ["0"] },
  { func = "@add_nsw", args = ["1", "-64"], expect = ["-63"] },
  { func = "@add_nsw", args = ["1", "63"], expect = ["poison"] },
