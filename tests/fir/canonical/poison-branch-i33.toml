# Tests of poison-branch-i33.fir: the poison and UB rules of br and
# cond_br at i33 (#19, ADR-2026-10-30-0818). %p = add nsw %a, 1 is
# poison when %a is the signed maximum, 4294967295.
# - A poison block argument arrives as poison: br and cond_br pass their
#   successors' values on as they are. br_poison passes %p to ^next,
#   which returns it. cond_br_first passes %p to ^then and %b to ^else,
#   and cond_br_second the other way round, with %b the signed minimum,
#   -4294967296: the successor not taken does not matter, even when it
#   passes poison.
# - A branch on poison is immediate UB, not a choice of successor.
#   branch_on_poison branches on icmp eq %p, %b, which is poison when %p
#   is. branch_on_arg passes %p to ^next first, and branches there on
#   icmp eq of the block argument, which is still poison. Each goes to
#   ^then with %b when the two are equal, and to ^else with %a when they
#   are not.
# The backend does not lower i33, so each test is interpreter-only and
# states the result that fir-ref must give. fir-ref's UB reason is
# "cond_br on poison", but the harness matches ub to any reason
# (ADR-2026-10-30-2135).
tests = [
  { func = "@br_poison", args = ["4294967295"], expect = ["poison"] },
  { func = "@br_poison", args = ["0"], expect = ["1"] },
  { func = "@cond_br_first", args = ["true", "4294967295", "-4294967296"], expect = ["poison"] },
  { func = "@cond_br_first", args = ["false", "4294967295", "-4294967296"], expect = ["-4294967296"] },
  { func = "@cond_br_first", args = ["true", "0", "-4294967296"], expect = ["1"] },
  { func = "@cond_br_first", args = ["false", "0", "-4294967296"], expect = ["-4294967296"] },
  { func = "@cond_br_second", args = ["true", "4294967295", "-4294967296"], expect = ["-4294967296"] },
  { func = "@cond_br_second", args = ["false", "4294967295", "-4294967296"], expect = ["poison"] },
  { func = "@cond_br_second", args = ["true", "0", "-4294967296"], expect = ["-4294967296"] },
  { func = "@cond_br_second", args = ["false", "0", "-4294967296"], expect = ["1"] },
  { func = "@branch_on_poison", args = ["4294967295", "0"], expect = "ub" },
  { func = "@branch_on_poison", args = ["0", "1"], expect = ["1"] },
  { func = "@branch_on_poison", args = ["0", "-1"], expect = ["0"] },
  { func = "@branch_on_arg", args = ["4294967295", "0"], expect = "ub" },
  { func = "@branch_on_arg", args = ["0", "1"], expect = ["1"] },
  { func = "@branch_on_arg", args = ["0", "-1"], expect = ["0"] },
]
