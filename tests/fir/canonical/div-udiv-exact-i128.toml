# Tests of div-udiv-exact-i128.fir: udiv exact at i128 (#22), on pairs
# that divide exactly and pairs that leave a remainder: multiples k * b of
# divisors b of both signs, below and above 2^64, by 1, -1, 3, -2^20 and
# 2^26 - 1, and the same plus 1, and pairs of the signed minimum and
# maximum, 2^64 and all ones.
# Each pair is a differential test and an interpreter-only twin that
# states fir-ref's result: the quotient, or poison where the division
# leaves a remainder, read as unsigned. Where fir-ref gives poison, any
# native value refines it: the helper gives the plain quotient
# (ADR-2026-11-03-0415).
