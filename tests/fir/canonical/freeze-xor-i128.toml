# Tests of freeze-xor-i128.fir: xor %f, %f at i128, where %f freezes
# %p = add nsw %a, 1 (#21, ADR-2026-10-29-2017). On 0, %p is 1, and the
# run makes no choice. On the signed maximum, %p is poison, and freeze
# chooses one of 2^128 values, past the choice budget of 16 bits, so the
# test declares its one result, 0, with a witness whose halves are both
# set, and seeded runs check that the run gives no other. Every use of
# %f sees the same 128 bits, both halves, so native code must return 0
# too.
tests = [
  { func = "@freeze_xor", args = ["0"] },
  { func = "@freeze_xor", args = ["170141183460469231731687303715884105727"], results = [{ values = ["0"], witness = ["18446744073709551621"] }] },
]
