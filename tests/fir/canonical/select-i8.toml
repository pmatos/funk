# Tests of select-i8.fir: select at i8 with each condition, false and
# true, on every pair of boundary bit patterns: 0, 1, -1, the signed
# minimum and the signed maximum (#16). true chooses the first value and
# false the second.
# Each test is differential: fir-ref and native code run it, and the
# native result must equal fir-ref's.
tests = [
  { func = "@select", args = ["false", "0", "0"] },
  { func = "@select", args = ["false", "0", "1"] },
  { func = "@select", args = ["false", "0", "-1"] },
  { func = "@select", args = ["false", "0", "-128"] },
  { func = "@select", args = ["false", "0", "127"] },
  { func = "@select", args = ["false", "1", "0"] },
  { func = "@select", args = ["false", "1", "1"] },
  { func = "@select", args = ["false", "1", "-1"] },
  { func = "@select", args = ["false", "1", "-128"] },
  { func = "@select", args = ["false", "1", "127"] },
  { func = "@select", args = ["false", "-1", "0"] },
  { func = "@select", args = ["false", "-1", "1"] },
  { func = "@select", args = ["false", "-1", "-1"] },
  { func = "@select", args = ["false", "-1", "-128"] },
  { func = "@select", args = ["false", "-1", "127"] },
  { func = "@select", args = ["false", "-128", "0"] },
  { func = "@select", args = ["false", "-128", "1"] },
  { func = "@select", args = ["false", "-128", "-1"] },
  { func = "@select", args = ["false", "-128", "-128"] },
  { func = "@select", args = ["false", "-128", "127"] },
  { func = "@select", args = ["false", "127", "0"] },
  { func = "@select", args = ["false", "127", "1"] },
  { func = "@select", args = ["false", "127", "-1"] },
  { func = "@select", args = ["false", "127", "-128"] },
  { func = "@select", args = ["false", "127", "127"] },
  { func = "@select", args = ["true", "0", "0"] },
  { func = "@select", args = ["true", "0", "1"] },
  { func = "@select", args = ["true", "0", "-1"] },
  { func = "@select", args = ["true", "0", "-128"] },
  { func = "@select", args = ["true", "0", "127"] },
  { func = "@select", args = ["true", "1", "0"] },
  { func = "@select", args = ["true", "1", "1"] },
  { func = "@select", args = ["true", "1", "-1"] },
  { func = "@select", args = ["true", "1", "-128"] },
  { func = "@select", args = ["true", "1", "127"] },
  { func = "@select", args = ["true", "-1", "0"] },
  { func = "@select", args = ["true", "-1", "1"] },
  { func = "@select", args = ["true", "-1", "-1"] },
  { func = "@select", args = ["true", "-1", "-128"] },
  { func = "@select", args = ["true", "-1", "127"] },
  { func = "@select", args = ["true", "-128", "0"] },
  { func = "@select", args = ["true", "-128", "1"] },
  { func = "@select", args = ["true", "-128", "-1"] },
  { func = "@select", args = ["true", "-128", "-128"] },
  { func = "@select", args = ["true", "-128", "127"] },
  { func = "@select", args = ["true", "127", "0"] },
  { func = "@select", args = ["true", "127", "1"] },
  { func = "@select", args = ["true", "127", "-1"] },
  { func = "@select", args = ["true", "127", "-128"] },
  { func = "@select", args = ["true", "127", "127"] },
]
