# Tests of float-rem-f128.fir: frem, fmod at f128
# (ADR-2026-11-09-1549), on the hard inputs: quotients halfway
# between two integers, subnormals, -0, operands far apart,
# infinities and NaN operands.
# Written by scripts/harness/float_arith_cases.py, which computes each
# expected result with scripts/harness/float_ref.py, apart from Lean.
# Each test is interpreter-only: the backend does not lower
# f128, so fir-ref alone runs it and must give what it expects.
# A NaN result is any NaN: its test is interpreter-only and names
# the NaN by a choice of the sign and the mantissa, as signed
# i113. Native code is not compared on a NaN result yet (#219).
tests = [
  { func = "@frem", args = ["5.5", "2.0"], expect = ["-0.5"] },
  { func = "@frem", args = ["2.0", "5.5"], expect = ["2.0"] },
  { func = "@frem", args = ["-5.5", "2.0"], expect = ["0.5"] },
  { func = "@frem", args = ["2.0", "-5.5"], expect = ["2.0"] },
  { func = "@frem", args = ["5.5", "-2.0"], expect = ["-0.5"] },
  { func = "@frem", args = ["-2.0", "5.5"], expect = ["-2.0"] },
  { func = "@frem", args = ["3.0", "2.0"], expect = ["-1.0"] },
  { func = "@frem", args = ["2.0", "3.0"], expect = ["-1.0"] },
  { func = "@frem", args = ["5.0", "2.0"], expect = ["1.0"] },
  { func = "@frem", args = ["2.0", "5.0"], expect = ["2.0"] },
  { func = "@frem", args = ["1.0", "3.0"], expect = ["1.0"] },
  { func = "@frem", args = ["3.0", "1.0"], expect = ["0.0"] },
  { func = "@frem", args = ["2.0", "3.0"], expect = ["-1.0"] },
  { func = "@frem", args = ["3.0", "2.0"], expect = ["-1.0"] },
  { func = "@frem", args = ["4.0", "2.0"], expect = ["0.0"] },
  { func = "@frem", args = ["2.0", "4.0"], expect = ["2.0"] },
  { func = "@frem", args = ["-4.0", "2.0"], expect = ["-0.0"] },
  { func = "@frem", args = ["2.0", "-4.0"], expect = ["2.0"] },
  { func = "@frem", args = ["1.189731495357231765085759326628007e4932", "6.0e-4966"], expect = ["0.0"] },
  { func = "@frem", args = ["6.0e-4966", "1.189731495357231765085759326628007e4932"], expect = ["6.0e-4966"] },
  { func = "@frem", args = ["5.948657476786158825428796633140036e4931", "2.0e-4965"], expect = ["-6.0e-4966"] },
  { func = "@frem", args = ["2.0e-4965", "5.948657476786158825428796633140036e4931"], expect = ["2.0e-4965"] },
  { func = "@frem", args = ["3.362103143112093506262677817321752e-4932", "1.0e-4965"], expect = ["-6.0e-4966"] },
  { func = "@frem", args = ["1.0e-4965", "3.362103143112093506262677817321752e-4932"], expect = ["1.0e-4965"] },
  { func = "@frem", args = ["3.3621031431120935062626778173217526e-4932", "2.0e-4965"], expect = ["6.0e-4966"] },
  { func = "@frem", args = ["2.0e-4965", "3.3621031431120935062626778173217526e-4932"], expect = ["2.0e-4965"] },
  { func = "@frem", args = ["1.0", "0x7fff0000000000000000000000000000"], expect = ["1.0"] },
  { func = "@frem", args = ["0x7fff0000000000000000000000000000", "1.0"], choices = ["0"], expect = ["0x7fff8000000000000000000000000000"] },
  { func = "@frem", args = ["-0.0", "0x7fff0000000000000000000000000000"], expect = ["-0.0"] },
  { func = "@frem", args = ["0x7fff0000000000000000000000000000", "-0.0"], choices = ["-1"], expect = ["0xffffffffffffffffffffffffffffffff"] },
  { func = "@frem", args = ["-0.0", "1.0"], expect = ["-0.0"] },
  { func = "@frem", args = ["1.0", "-0.0"], choices = ["1"], expect = ["0x7fff0000000000000000000000000001"] },
  { func = "@frem", args = ["1.0", "0.0"], choices = ["0"], expect = ["0x7fff8000000000000000000000000000"] },
  { func = "@frem", args = ["0.0", "1.0"], expect = ["0.0"] },
  { func = "@frem", args = ["0x7fff0000000000000000000000000000", "1.0"], choices = ["-1"], expect = ["0xffffffffffffffffffffffffffffffff"] },
  { func = "@frem", args = ["1.0", "0x7fff0000000000000000000000000000"], expect = ["1.0"] },
  { func = "@frem", args = ["0x7fff0000000000000000000000000000", "0x7fff0000000000000000000000000000"], choices = ["1"], expect = ["0x7fff0000000000000000000000000001"] },
  { func = "@frem", args = ["0.0", "0.0"], choices = ["0"], expect = ["0x7fff8000000000000000000000000000"] },
  { func = "@frem", args = ["0xffffffffffffffffffffffffffffffff", "1.0"], choices = ["-1"], expect = ["0xffffffffffffffffffffffffffffffff"] },
  { func = "@frem", args = ["1.0", "0xffffffffffffffffffffffffffffffff"], choices = ["1"], expect = ["0x7fff0000000000000000000000000001"] },
  { func = "@frem", args = ["1.0", "0x7fff0000000000000000000000000001"], choices = ["0"], expect = ["0x7fff8000000000000000000000000000"] },
  { func = "@frem", args = ["0x7fff0000000000000000000000000001", "1.0"], choices = ["-1"], expect = ["0xffffffffffffffffffffffffffffffff"] },
  { func = "@fmod", args = ["5.5", "2.0"], expect = ["1.5"] },
  { func = "@fmod", args = ["2.0", "5.5"], expect = ["2.0"] },
  { func = "@fmod", args = ["-5.5", "2.0"], expect = ["-1.5"] },
  { func = "@fmod", args = ["2.0", "-5.5"], expect = ["2.0"] },
  { func = "@fmod", args = ["5.5", "-2.0"], expect = ["1.5"] },
  { func = "@fmod", args = ["-2.0", "5.5"], expect = ["-2.0"] },
  { func = "@fmod", args = ["3.0", "2.0"], expect = ["1.0"] },
  { func = "@fmod", args = ["2.0", "3.0"], expect = ["2.0"] },
  { func = "@fmod", args = ["-4.0", "2.0"], expect = ["-0.0"] },
  { func = "@fmod", args = ["2.0", "-4.0"], expect = ["2.0"] },
  { func = "@fmod", args = ["1.0", "3.0"], expect = ["1.0"] },
  { func = "@fmod", args = ["3.0", "1.0"], expect = ["0.0"] },
  { func = "@fmod", args = ["-1.189731495357231765085759326628007e4932", "6.0e-4966"], expect = ["-0.0"] },
  { func = "@fmod", args = ["6.0e-4966", "-1.189731495357231765085759326628007e4932"], expect = ["6.0e-4966"] },
  { func = "@fmod", args = ["5.948657476786158825428796633140036e4931", "2.0e-4965"], expect = ["1.0e-4965"] },
  { func = "@fmod", args = ["2.0e-4965", "5.948657476786158825428796633140036e4931"], expect = ["2.0e-4965"] },
  { func = "@fmod", args = ["1.189731495357231765085759326628007e4932", "1.1897314953572317650857593266280069e4932"], expect = ["1.145669756344548161919429759370211e4898"] },
  { func = "@fmod", args = ["1.1897314953572317650857593266280069e4932", "1.189731495357231765085759326628007e4932"], expect = ["1.1897314953572317650857593266280069e4932"] },
  { func = "@fmod", args = ["3.3621031431120935062626778173217526e-4932", "2.0e-4965"], expect = ["6.0e-4966"] },
  { func = "@fmod", args = ["2.0e-4965", "3.3621031431120935062626778173217526e-4932"], expect = ["2.0e-4965"] },
  { func = "@fmod", args = ["1.189731495357231765085759326628007e4932", "0xffff0000000000000000000000000000"], expect = ["1.189731495357231765085759326628007e4932"] },
  { func = "@fmod", args = ["0xffff0000000000000000000000000000", "1.189731495357231765085759326628007e4932"], choices = ["1"], expect = ["0x7fff0000000000000000000000000001"] },
  { func = "@fmod", args = ["0.0", "1.0"], expect = ["0.0"] },
  { func = "@fmod", args = ["1.0", "0.0"], choices = ["0"], expect = ["0x7fff8000000000000000000000000000"] },
  { func = "@fmod", args = ["1.0", "-0.0"], choices = ["-1"], expect = ["0xffffffffffffffffffffffffffffffff"] },
  { func = "@fmod", args = ["-0.0", "1.0"], expect = ["-0.0"] },
  { func = "@fmod", args = ["0xffff0000000000000000000000000000", "1.0"], choices = ["1"], expect = ["0x7fff0000000000000000000000000001"] },
  { func = "@fmod", args = ["1.0", "0xffff0000000000000000000000000000"], expect = ["1.0"] },
  { func = "@fmod", args = ["0xffffffffffffffffffffffffffffffff", "0x7fff0000000000000000000000000000"], choices = ["0"], expect = ["0x7fff8000000000000000000000000000"] },
  { func = "@fmod", args = ["0x7fff0000000000000000000000000000", "0xffffffffffffffffffffffffffffffff"], choices = ["-1"], expect = ["0xffffffffffffffffffffffffffffffff"] },
  { func = "@frem", args = ["poison", "0.0"], expect = ["poison"] },
  { func = "@fmod", args = ["poison", "0.0"], expect = ["poison"] },
]
