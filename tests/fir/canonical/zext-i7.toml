# Tests of zext-i7.fir: zext from i1 to i7 and from i7 to each of i8,
# i16, i32, i33 and i64, on the boundary bit patterns of the operand's
# type: 0, 1, -1, the signed minimum and the signed maximum, or false
# and true at i1 (#17). zext puts zeros above the operand's bits, so an
# operand with its top bit set gives a nonnegative result.
# The backend does not lower i7, so each test is interpreter-only and
# states the result that fir-ref must give.
tests = [
  { func = "@zext_i1_to_i7", args = ["false"], expect = ["0"] },
  { func = "@zext_i1_to_i7", args = ["true"], expect = ["1"] },
  { func = "@zext_i7_to_i8", args = ["0"], expect = ["0"] },
  { func = "@zext_i7_to_i8", args = ["1"], expect = ["1"] },
  { func = "@zext_i7_to_i8", args = ["-1"], expect = ["127"] },
  { func = "@zext_i7_to_i8", args = ["-64"], expect = ["64"] },
  { func = "@zext_i7_to_i8", args = ["63"], expect = ["63"] },
  { func = "@zext_i7_to_i16", args = ["0"], expect = ["0"] },
  { func = "@zext_i7_to_i16", args = ["1"], expect = ["1"] },
  { func = "@zext_i7_to_i16", args = ["-1"], expect = ["127"] },
  { func = "@zext_i7_to_i16", args = ["-64"], expect = ["64"] },
  { func = "@zext_i7_to_i16", args = ["63"], expect = ["63"] },
  { func = "@zext_i7_to_i32", args = ["0"], expect = ["0"] },
  { func = "@zext_i7_to_i32", args = ["1"], expect = ["1"] },
  { func = "@zext_i7_to_i32", args = ["-1"], expect = ["127"] },
  { func = "@zext_i7_to_i32", args = ["-64"], expect = ["64"] },
  { func = "@zext_i7_to_i32", args = ["63"], expect = ["63"] },
  { func = "@zext_i7_to_i33", args = ["0"], expect = ["0"] },
  { func = "@zext_i7_to_i33", args = ["1"], expect = ["1"] },
  { func = "@zext_i7_to_i33", args = ["-1"], expect = ["127"] },
  { func = "@zext_i7_to_i33", args = ["-64"], expect = ["64"] },
  { func = "@zext_i7_to_i33", args = ["63"], expect = ["63"] },
  { func = "@zext_i7_to_i64", args = ["0"], expect = ["0"] },
  { func = "@zext_i7_to_i64", args = ["1"], expect = ["1"] },
  { func = "@zext_i7_to_i64", args = ["-1"], expect = ["127"] },
  { func = "@zext_i7_to_i64", args = ["-64"], expect = ["64"] },
  { func = "@zext_i7_to_i64", args = ["63"], expect = ["63"] },
]
