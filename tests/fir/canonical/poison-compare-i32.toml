# Tests of poison-compare-i32.fir: the poison rules of icmp and select
# at i32 (#16, ADR-2026-10-30-0818). Neither op is ever UB.
# %p = add nsw %a, 1 is poison when %a is the signed maximum,
# 2147483647.
# icmp propagates poison: P_left returns icmp P %p, %b and P_right
# icmp P %b, %p, for each predicate P, with %b = 0.
# select is an exception. select_cond adds true to its condition %c the
# same way, so the condition is poison when %c is true, and the result
# is poison even when both values are the same. select_first returns
# select %c, %p, %b and select_second select %c, %b, %p, with
# %b = -2147483648: the value not chosen does not matter, even when it
# is poison, and the value chosen is given as it is, poison included.
# On the row 0, %p is 1.
# Each test without expect is differential: fir-ref and native code run
# it, and the native result must refine fir-ref's; where fir-ref returns
# poison, any value of the type does. Where fir-ref returns poison, an
# interpreter-only test of the same run checks that it is exactly
# poison; where select does not choose its poison value, one checks that
# it gives the chosen value, which native code must give too.
tests = [
  { func = "@eq_left", args = ["2147483647", "0"] },
  { func = "@eq_left", args = ["2147483647", "0"], expect = ["poison"] },
  { func = "@eq_left", args = ["0", "0"] },
  { func = "@eq_right", args = ["2147483647", "0"] },
  { func = "@eq_right", args = ["2147483647", "0"], expect = ["poison"] },
  { func = "@eq_right", args = ["0", "0"] },
  { func = "@ne_left", args = ["2147483647", "0"] },
  { func = "@ne_left", args = ["2147483647", "0"], expect = ["poison"] },
  { func = "@ne_left", args = ["0", "0"] },
  { func = "@ne_right", args = ["2147483647", "0"] },
  { func = "@ne_right", args = ["2147483647", "0"], expect = ["poison"] },
  { func = "@ne_right", args = ["0", "0"] },
  { func = "@slt_left", args = ["2147483647", "0"] },
  { func = "@slt_left", args = ["2147483647", "0"], expect = ["poison"] },
  { func = "@slt_left", args = ["0", "0"] },
  { func = "@slt_right", args = ["2147483647", "0"] },
  { func = "@slt_right", args = ["2147483647", "0"], expect = ["poison"] },
  { func = "@slt_right", args = ["0", "0"] },
  { func = "@sle_left", args = ["2147483647", "0"] },
  { func = "@sle_left", args = ["2147483647", "0"], expect = ["poison"] },
  { func = "@sle_left", args = ["0", "0"] },
  { func = "@sle_right", args = ["2147483647", "0"] },
  { func = "@sle_right", args = ["2147483647", "0"], expect = ["poison"] },
  { func = "@sle_right", args = ["0", "0"] },
  { func = "@sgt_left", args = ["2147483647", "0"] },
  { func = "@sgt_left", args = ["2147483647", "0"], expect = ["poison"] },
  { func = "@sgt_left", args = ["0", "0"] },
  { func = "@sgt_right", args = ["2147483647", "0"] },
  { func = "@sgt_right", args = ["2147483647", "0"], expect = ["poison"] },
  { func = "@sgt_right", args = ["0", "0"] },
  { func = "@sge_left", args = ["2147483647", "0"] },
  { func = "@sge_left", args = ["2147483647", "0"], expect = ["poison"] },
  { func = "@sge_left", args = ["0", "0"] },
  { func = "@sge_right", args = ["2147483647", "0"] },
  { func = "@sge_right", args = ["2147483647", "0"], expect = ["poison"] },
  { func = "@sge_right", args = ["0", "0"] },
  { func = "@ult_left", args = ["2147483647", "0"] },
  { func = "@ult_left", args = ["2147483647", "0"], expect = ["poison"] },
  { func = "@ult_left", args = ["0", "0"] },
  { func = "@ult_right", args = ["2147483647", "0"] },
  { func = "@ult_right", args = ["2147483647", "0"], expect = ["poison"] },
  { func = "@ult_right", args = ["0", "0"] },
  { func = "@ule_left", args = ["2147483647", "0"] },
  { func = "@ule_left", args = ["2147483647", "0"], expect = ["poison"] },
