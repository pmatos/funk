  { func = "@select_cond", args = ["true", "-1", "-1"], expect = ["poison"] },
  { func = "@select_cond", args = ["false", "-1", "0"] },
  { func = "@select_first", args = ["false", "2147483647", "-2147483648"] },
  { func = "@select_first", args = ["false", "2147483647", "-2147483648"], expect = ["-2147483648"] },
  { func = "@select_first", args = ["true", "2147483647", "-2147483648"] },
  { func = "@select_first", args = ["true", "2147483647", "-2147483648"], expect = ["poison"] },
  { func = "@select_first", args = ["true", "0", "-2147483648"] },
  { func = "@select_second", args = ["true", "2147483647", "-2147483648"] },
  { func = "@select_second", args = ["true", "2147483647", "-2147483648"], expect = ["-2147483648"] },
  { func = "@select_second", args = ["false", "2147483647", "-2147483648"] },
  { func = "@select_second", args = ["false", "2147483647", "-2147483648"], expect = ["poison"] },
  { func = "@select_second", args = ["false", "0", "-2147483648"] },
