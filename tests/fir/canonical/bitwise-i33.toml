# Tests of bitwise-i33.fir: and, or and xor at i33 on every pair of
# boundary bit patterns: 0, 1, -1, the signed minimum and the signed
# maximum, or false and true at i1 (#15).
# The backend does not lower i33, so each test is interpreter-only and
# states the result that fir-ref must give.
tests = [
  { func = "@and", args = ["0", "0"], expect = ["0"] },
  { func = "@and", args = ["0", "1"], expect = ["0"] },
  { func = "@and", args = ["0", "-1"], expect = ["0"] },
  { func = "@and", args = ["0", "-4294967296"], expect = ["0"] },
  { func = "@and", args = ["0", "4294967295"], expect = ["0"] },
  { func = "@and", args = ["1", "0"], expect = ["0"] },
  { func = "@and", args = ["1", "1"], expect = ["1"] },
  { func = "@and", args = ["1", "-1"], expect = ["1"] },
  { func = "@and", args = ["1", "-4294967296"], expect = ["0"] },
  { func = "@and", args = ["1", "4294967295"], expect = ["1"] },
  { func = "@and", args = ["-1", "0"], expect = ["0"] },
  { func = "@and", args = ["-1", "1"], expect = ["1"] },
  { func = "@and", args = ["-1", "-1"], expect = ["-1"] },
  { func = "@and", args = ["-1", "-4294967296"], expect = ["-4294967296"] },
  { func = "@and", args = ["-1", "4294967295"], expect = ["4294967295"] },
  { func = "@and", args = ["-4294967296", "0"], expect = ["0"] },
  { func = "@and", args = ["-4294967296", "1"], expect = ["0"] },
  { func = "@and", args = ["-4294967296", "-1"], expect = ["-4294967296"] },
  { func = "@and", args = ["-4294967296", "-4294967296"], expect = ["-4294967296"] },
  { func = "@and", args = ["-4294967296", "4294967295"], expect = ["0"] },
  { func = "@and", args = ["4294967295", "0"], expect = ["0"] },
  { func = "@and", args = ["4294967295", "1"], expect = ["1"] },
  { func = "@and", args = ["4294967295", "-1"], expect = ["4294967295"] },
  { func = "@and", args = ["4294967295", "-4294967296"], expect = ["0"] },
  { func = "@and", args = ["4294967295", "4294967295"], expect = ["4294967295"] },
  { func = "@or", args = ["0", "0"], expect = ["0"] },
  { func = "@or", args = ["0", "1"], expect = ["1"] },
  { func = "@or", args = ["0", "-1"], expect = ["-1"] },
  { func = "@or", args = ["0", "-4294967296"], expect = ["-4294967296"] },
  { func = "@or", args = ["0", "4294967295"], expect = ["4294967295"] },
  { func = "@or", args = ["1", "0"], expect = ["1"] },
  { func = "@or", args = ["1", "1"], expect = ["1"] },
  { func = "@or", args = ["1", "-1"], expect = ["-1"] },
  { func = "@or", args = ["1", "-4294967296"], expect = ["-4294967295"] },
  { func = "@or", args = ["1", "4294967295"], expect = ["4294967295"] },
  { func = "@or", args = ["-1", "0"], expect = ["-1"] },
  { func = "@or", args = ["-1", "1"], expect = ["-1"] },
  { func = "@or", args = ["-1", "-1"], expect = ["-1"] },
  { func = "@or", args = ["-1", "-4294967296"], expect = ["-1"] },
  { func = "@or", args = ["-1", "4294967295"], expect = ["-1"] },
  { func = "@or", args = ["-4294967296", "0"], expect = ["-4294967296"] },
  { func = "@or", args = ["-4294967296", "1"], expect = ["-4294967295"] },
  { func = "@or", args = ["-4294967296", "-1"], expect = ["-1"] },
  { func = "@or", args = ["-4294967296", "-4294967296"], expect = ["-4294967296"] },
  { func = "@or", args = ["-4294967296", "4294967295"], expect = ["-1"] },
  { func = "@or", args = ["4294967295", "0"], expect = ["4294967295"] },
  { func = "@or", args = ["4294967295", "1"], expect = ["4294967295"] },
  { func = "@or", args = ["4294967295", "-1"], expect = ["-1"] },
  { func = "@or", args = ["4294967295", "-4294967296"], expect = ["-1"] },
  { func = "@or", args = ["4294967295", "4294967295"], expect = ["4294967295"] },
  { func = "@xor", args = ["0", "0"], expect = ["0"] },
  { func = "@xor", args = ["0", "1"], expect = ["1"] },
  { func = "@xor", args = ["0", "-1"], expect = ["-1"] },
  { func = "@xor", args = ["0", "-4294967296"], expect = ["-4294967296"] },
  { func = "@xor", args = ["0", "4294967295"], expect = ["4294967295"] },
  { func = "@xor", args = ["1", "0"], expect = ["1"] },
  { func = "@xor", args = ["1", "1"], expect = ["0"] },
  { func = "@xor", args = ["1", "-1"], expect = ["-2"] },
  { func = "@xor", args = ["1", "-4294967296"], expect = ["-4294967295"] },
  { func = "@xor", args = ["1", "4294967295"], expect = ["4294967294"] },
  { func = "@xor", args = ["-1", "0"], expect = ["-1"] },
  { func = "@xor", args = ["-1", "1"], expect = ["-2"] },
  { func = "@xor", args = ["-1", "-1"], expect = ["0"] },
  { func = "@xor", args = ["-1", "-4294967296"], expect = ["4294967295"] },
  { func = "@xor", args = ["-1", "4294967295"], expect = ["-4294967296"] },
  { func = "@xor", args = ["-4294967296", "0"], expect = ["-4294967296"] },
  { func = "@xor", args = ["-4294967296", "1"], expect = ["-4294967295"] },
  { func = "@xor", args = ["-4294967296", "-1"], expect = ["4294967295"] },
  { func = "@xor", args = ["-4294967296", "-4294967296"], expect = ["0"] },
  { func = "@xor", args = ["-4294967296", "4294967295"], expect = ["-1"] },
  { func = "@xor", args = ["4294967295", "0"], expect = ["4294967295"] },
  { func = "@xor", args = ["4294967295", "1"], expect = ["4294967294"] },
  { func = "@xor", args = ["4294967295", "-1"], expect = ["-4294967296"] },
  { func = "@xor", args = ["4294967295", "-4294967296"], expect = ["-1"] },
  { func = "@xor", args = ["4294967295", "4294967295"], expect = ["0"] },
]
