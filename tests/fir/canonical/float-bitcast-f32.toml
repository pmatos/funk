# Tests of float-bitcast-f32.fir: bitcast from f32 to i32 and
# back (ADR-2026-11-09-1549), on zeros of both signs, subnormals, the
# smallest normal, one, the largest finite values, infinities and
# NaNs with payloads and either sign. Each result is its operand's
# bits. Written by scripts/harness/float_bitcast_cases.py.
# A test without expect is differential: fir-ref and native code
# run it, and the native result must equal fir-ref's. Each case
# is also checked by an interpreter-only test with expect.
tests = [
  { func = "@to_bits", args = ["0.0"] },
  { func = "@to_bits", args = ["0.0"], expect = ["0"] },
  { func = "@of_bits", args = ["0"] },
  { func = "@of_bits", args = ["0"], expect = ["0.0"] },
  { func = "@to_bits", args = ["-0.0"] },
  { func = "@to_bits", args = ["-0.0"], expect = ["-2147483648"] },
  { func = "@of_bits", args = ["-2147483648"] },
  { func = "@of_bits", args = ["-2147483648"], expect = ["-0.0"] },
  { func = "@to_bits", args = ["1.0e-45"] },
  { func = "@to_bits", args = ["1.0e-45"], expect = ["1"] },
  { func = "@of_bits", args = ["1"] },
  { func = "@of_bits", args = ["1"], expect = ["1.0e-45"] },
  { func = "@to_bits", args = ["-1.0e-45"] },
  { func = "@to_bits", args = ["-1.0e-45"], expect = ["-2147483647"] },
  { func = "@of_bits", args = ["-2147483647"] },
  { func = "@of_bits", args = ["-2147483647"], expect = ["-1.0e-45"] },
  { func = "@to_bits", args = ["1.1754942e-38"] },
  { func = "@to_bits", args = ["1.1754942e-38"], expect = ["8388607"] },
  { func = "@of_bits", args = ["8388607"] },
  { func = "@of_bits", args = ["8388607"], expect = ["1.1754942e-38"] },
  { func = "@to_bits", args = ["1.1754944e-38"] },
  { func = "@to_bits", args = ["1.1754944e-38"], expect = ["8388608"] },
  { func = "@of_bits", args = ["8388608"] },
  { func = "@of_bits", args = ["8388608"], expect = ["1.1754944e-38"] },
  { func = "@to_bits", args = ["1.0"] },
  { func = "@to_bits", args = ["1.0"], expect = ["1065353216"] },
  { func = "@of_bits", args = ["1065353216"] },
  { func = "@of_bits", args = ["1065353216"], expect = ["1.0"] },
  { func = "@to_bits", args = ["-1.0"] },
  { func = "@to_bits", args = ["-1.0"], expect = ["-1082130432"] },
  { func = "@of_bits", args = ["-1082130432"] },
  { func = "@of_bits", args = ["-1082130432"], expect = ["-1.0"] },
  { func = "@to_bits", args = ["3.4028235e38"] },
  { func = "@to_bits", args = ["3.4028235e38"], expect = ["2139095039"] },
  { func = "@of_bits", args = ["2139095039"] },
  { func = "@of_bits", args = ["2139095039"], expect = ["3.4028235e38"] },
  { func = "@to_bits", args = ["-3.4028235e38"] },
  { func = "@to_bits", args = ["-3.4028235e38"], expect = ["-8388609"] },
  { func = "@of_bits", args = ["-8388609"] },
  { func = "@of_bits", args = ["-8388609"], expect = ["-3.4028235e38"] },
  { func = "@to_bits", args = ["0x7f800000"] },
  { func = "@to_bits", args = ["0x7f800000"], expect = ["2139095040"] },
  { func = "@of_bits", args = ["2139095040"] },
  { func = "@of_bits", args = ["2139095040"], expect = ["0x7f800000"] },
  { func = "@to_bits", args = ["0xff800000"] },
  { func = "@to_bits", args = ["0xff800000"], expect = ["-8388608"] },
  { func = "@of_bits", args = ["-8388608"] },
  { func = "@of_bits", args = ["-8388608"], expect = ["0xff800000"] },
  { func = "@to_bits", args = ["0x7fc00000"] },
  { func = "@to_bits", args = ["0x7fc00000"], expect = ["2143289344"] },
  { func = "@of_bits", args = ["2143289344"] },
  { func = "@of_bits", args = ["2143289344"], expect = ["0x7fc00000"] },
  { func = "@to_bits", args = ["0xffc00001"] },
  { func = "@to_bits", args = ["0xffc00001"], expect = ["-4194303"] },
  { func = "@of_bits", args = ["-4194303"] },
  { func = "@of_bits", args = ["-4194303"], expect = ["0xffc00001"] },
  { func = "@to_bits", args = ["0x7f800001"] },
  { func = "@to_bits", args = ["0x7f800001"], expect = ["2139095041"] },
  { func = "@of_bits", args = ["2139095041"] },
  { func = "@of_bits", args = ["2139095041"], expect = ["0x7f800001"] },
  { func = "@to_bits", args = ["0xffffffff"] },
  { func = "@to_bits", args = ["0xffffffff"], expect = ["-1"] },
  { func = "@of_bits", args = ["-1"] },
  { func = "@of_bits", args = ["-1"], expect = ["0xffffffff"] },
  { func = "@to_bits", args = ["poison"] },
  { func = "@to_bits", args = ["poison"], expect = ["poison"] },
  { func = "@of_bits", args = ["poison"] },
  { func = "@of_bits", args = ["poison"], expect = ["poison"] },
]
