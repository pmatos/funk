# Tests of float-rem-f16.fir: frem, fmod at f16
# (ADR-2026-11-09-1549), on the hard inputs: quotients halfway
# between two integers, subnormals, -0, operands far apart,
# infinities and NaN operands.
# Written by scripts/harness/float_arith_cases.py, which computes each
# expected result with scripts/harness/float_ref.py, apart from Lean.
# Each test is interpreter-only: the backend does not lower
# f16, so fir-ref alone runs it and must give what it expects.
# A NaN result is any NaN: its test is interpreter-only and names
# the NaN by a choice of the sign and the mantissa, as signed
# i11. Native code is not compared on a NaN result yet (#219).
tests = [
  { func = "@frem", args = ["5.5", "2.0"], expect = ["-0.5"] },
  { func = "@frem", args = ["2.0", "5.5"], expect = ["2.0"] },
  { func = "@frem", args = ["-5.5", "2.0"], expect = ["0.5"] },
  { func = "@frem", args = ["2.0", "-5.5"], expect = ["2.0"] },
  { func = "@frem", args = ["5.5", "-2.0"], expect = ["-0.5"] },
  { func = "@frem", args = ["-2.0", "5.5"], expect = ["-2.0"] },
  { func = "@frem", args = ["3.0", "2.0"], expect = ["-1.0"] },
  { func = "@frem", args = ["2.0", "3.0"], expect = ["-1.0"] },
  { func = "@frem", args = ["5.0", "2.0"], expect = ["1.0"] },
  { func = "@frem", args = ["2.0", "5.0"], expect = ["2.0"] },
  { func = "@frem", args = ["1.0", "3.0"], expect = ["1.0"] },
  { func = "@frem", args = ["3.0", "1.0"], expect = ["0.0"] },
  { func = "@frem", args = ["2.0", "3.0"], expect = ["-1.0"] },
  { func = "@frem", args = ["3.0", "2.0"], expect = ["-1.0"] },
  { func = "@frem", args = ["4.0", "2.0"], expect = ["0.0"] },
  { func = "@frem", args = ["2.0", "4.0"], expect = ["2.0"] },
  { func = "@frem", args = ["-4.0", "2.0"], expect = ["-0.0"] },
  { func = "@frem", args = ["2.0", "-4.0"], expect = ["2.0"] },
  { func = "@frem", args = ["65500.0", "6.0e-8"], expect = ["0.0"] },
  { func = "@frem", args = ["6.0e-8", "65500.0"], expect = ["6.0e-8"] },
  { func = "@frem", args = ["32770.0", "2.0e-7"], expect = ["-6.0e-8"] },
  { func = "@frem", args = ["2.0e-7", "32770.0"], expect = ["2.0e-7"] },
  { func = "@frem", args = ["6.1e-5", "1.0e-7"], expect = ["-6.0e-8"] },
  { func = "@frem", args = ["1.0e-7", "6.1e-5"], expect = ["1.0e-7"] },
  { func = "@frem", args = ["6.104e-5", "2.0e-7"], expect = ["6.0e-8"] },
  { func = "@frem", args = ["2.0e-7", "6.104e-5"], expect = ["2.0e-7"] },
  { func = "@frem", args = ["1.0", "0x7c00"], expect = ["1.0"] },
  { func = "@frem", args = ["0x7c00", "1.0"], choices = ["0"], expect = ["0x7e00"] },
  { func = "@frem", args = ["-0.0", "0x7c00"], expect = ["-0.0"] },
  { func = "@frem", args = ["0x7c00", "-0.0"], choices = ["-1"], expect = ["0xffff"] },
  { func = "@frem", args = ["-0.0", "1.0"], expect = ["-0.0"] },
  { func = "@frem", args = ["1.0", "-0.0"], choices = ["1"], expect = ["0x7c01"] },
  { func = "@frem", args = ["1.0", "0.0"], choices = ["0"], expect = ["0x7e00"] },
  { func = "@frem", args = ["0.0", "1.0"], expect = ["0.0"] },
  { func = "@frem", args = ["0x7c00", "1.0"], choices = ["-1"], expect = ["0xffff"] },
  { func = "@frem", args = ["1.0", "0x7c00"], expect = ["1.0"] },
  { func = "@frem", args = ["0x7c00", "0x7c00"], choices = ["1"], expect = ["0x7c01"] },
  { func = "@frem", args = ["0.0", "0.0"], choices = ["0"], expect = ["0x7e00"] },
  { func = "@frem", args = ["0xffff", "1.0"], choices = ["-1"], expect = ["0xffff"] },
  { func = "@frem", args = ["1.0", "0xffff"], choices = ["1"], expect = ["0x7c01"] },
  { func = "@frem", args = ["1.0", "0x7c01"], choices = ["0"], expect = ["0x7e00"] },
  { func = "@frem", args = ["0x7c01", "1.0"], choices = ["-1"], expect = ["0xffff"] },
  { func = "@fmod", args = ["5.5", "2.0"], expect = ["1.5"] },
  { func = "@fmod", args = ["2.0", "5.5"], expect = ["2.0"] },
  { func = "@fmod", args = ["-5.5", "2.0"], expect = ["-1.5"] },
  { func = "@fmod", args = ["2.0", "-5.5"], expect = ["2.0"] },
  { func = "@fmod", args = ["5.5", "-2.0"], expect = ["1.5"] },
  { func = "@fmod", args = ["-2.0", "5.5"], expect = ["-2.0"] },
  { func = "@fmod", args = ["3.0", "2.0"], expect = ["1.0"] },
  { func = "@fmod", args = ["2.0", "3.0"], expect = ["2.0"] },
  { func = "@fmod", args = ["-4.0", "2.0"], expect = ["-0.0"] },
  { func = "@fmod", args = ["2.0", "-4.0"], expect = ["2.0"] },
  { func = "@fmod", args = ["1.0", "3.0"], expect = ["1.0"] },
  { func = "@fmod", args = ["3.0", "1.0"], expect = ["0.0"] },
  { func = "@fmod", args = ["-65500.0", "6.0e-8"], expect = ["-0.0"] },
  { func = "@fmod", args = ["6.0e-8", "-65500.0"], expect = ["6.0e-8"] },
  { func = "@fmod", args = ["32770.0", "2.0e-7"], expect = ["1.0e-7"] },
  { func = "@fmod", args = ["2.0e-7", "32770.0"], expect = ["2.0e-7"] },
  { func = "@fmod", args = ["65500.0", "65470.0"], expect = ["32.0"] },
  { func = "@fmod", args = ["65470.0", "65500.0"], expect = ["65470.0"] },
  { func = "@fmod", args = ["6.104e-5", "2.0e-7"], expect = ["6.0e-8"] },
  { func = "@fmod", args = ["2.0e-7", "6.104e-5"], expect = ["2.0e-7"] },
  { func = "@fmod", args = ["65500.0", "0xfc00"], expect = ["65500.0"] },
  { func = "@fmod", args = ["0xfc00", "65500.0"], choices = ["1"], expect = ["0x7c01"] },
  { func = "@fmod", args = ["0.0", "1.0"], expect = ["0.0"] },
  { func = "@fmod", args = ["1.0", "0.0"], choices = ["0"], expect = ["0x7e00"] },
  { func = "@fmod", args = ["1.0", "-0.0"], choices = ["-1"], expect = ["0xffff"] },
  { func = "@fmod", args = ["-0.0", "1.0"], expect = ["-0.0"] },
  { func = "@fmod", args = ["0xfc00", "1.0"], choices = ["1"], expect = ["0x7c01"] },
  { func = "@fmod", args = ["1.0", "0xfc00"], expect = ["1.0"] },
  { func = "@fmod", args = ["0xffff", "0x7c00"], choices = ["0"], expect = ["0x7e00"] },
  { func = "@fmod", args = ["0x7c00", "0xffff"], choices = ["-1"], expect = ["0xffff"] },
  { func = "@frem", args = ["poison", "0.0"], expect = ["poison"] },
  { func = "@fmod", args = ["poison", "0.0"], expect = ["poison"] },
]
