# Tests of float-values-f128.fir: values of f128 passed through block
# arguments by br and cond_br, returned one and several at a time, and
# given by calls with one result and with several, each coming back as
# its bits: a NaN with its sign set and a payload, -0, 1 and the smallest
# subnormal, and poison (ADR-2026-11-11-1438, ADR-2026-11-03-0557).
# Each test is interpreter-only, as the backend does not lower f128.
tests = [
  { func = "@choose", args = ["true", "0xffff8000000000000000000000000001", "-0.0"], expect = ["0xffff8000000000000000000000000001"] },
  { func = "@choose", args = ["false", "0xffff8000000000000000000000000001", "-0.0"], expect = ["-0.0"] },
  { func = "@choose", args = ["false", "1.0", "poison"], expect = ["poison"] },
  { func = "@swap", args = ["1.0", "6.0e-4966"], expect = ["6.0e-4966", "1.0"] },
  { func = "@calls", args = ["true", "0xffff8000000000000000000000000001", "1.0"], expect = ["0xffff8000000000000000000000000001", "1.0", "0xffff8000000000000000000000000001"] },
  { func = "@calls", args = ["false", "6.0e-4966", "-0.0"], expect = ["-0.0", "-0.0", "6.0e-4966"] },
]
