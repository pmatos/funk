  { func = "@sdiv", args = ["63", "0"], expect = "ub" },
  { func = "@sdiv", args = ["63", "1"], expect = ["63"] },
  { func = "@sdiv", args = ["63", "-1"], expect = ["-63"] },
  { func = "@sdiv", args = ["63", "-64"], expect = ["0"] },
  { func = "@sdiv", args = ["63", "63"], expect = ["1"] },
  { func = "@sdiv_exact", args = ["0", "0"], expect = "ub" },
  { func = "@sdiv_exact", args = ["0", "1"], expect = ["0"] },
  { func = "@sdiv_exact", args = ["0", "-1"], expect = ["0"] },
