# Tests of div-i16.fir: sdiv and udiv, each with and without exact, srem
# and urem at i16, on every pair of boundary bit patterns: 0, 1, -1, the
# signed minimum and the signed maximum, so dividends and divisors take
# both signs (#18).
# Each test without expect is differential: fir-ref and native code run
# it, and the native result must refine fir-ref's; where fir-ref returns
# poison, a broken exact, any value of the type does.
# A pair that is UB in the spec, a zero divisor or sdiv and srem of the
# signed minimum by -1, would make a differential test invalid, so it is
# an interpreter-only test that expects ub; native code may trap there
# (ADR-2026-10-31-0050). fir-ref's UB reason names its case, such as
# "sdiv by zero" or "srem of the signed minimum by -1", but the harness
# matches ub to any reason (ADR-2026-10-30-2135).
# Each defined pair of sdiv exact and udiv exact is also an
# interpreter-only test, which checks that fir-ref gives poison exactly
# where the division leaves a remainder.
tests = [
  { func = "@sdiv", args = ["0", "0"], expect = "ub" },
  { func = "@sdiv", args = ["0", "1"] },
  { func = "@sdiv", args = ["0", "-1"] },
  { func = "@sdiv", args = ["0", "-32768"] },
  { func = "@sdiv", args = ["0", "32767"] },
  { func = "@sdiv", args = ["1", "0"], expect = "ub" },
  { func = "@sdiv", args = ["1", "1"] },
  { func = "@sdiv", args = ["1", "-1"] },
  { func = "@sdiv", args = ["1", "-32768"] },
