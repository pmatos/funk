  { func = "@mul_nuw_nsw_left", args = ["true", "true"], expect = ["poison"] },
  { func = "@mul_nuw_nsw_left", args = ["false", "true"] },
  { func = "@mul_nuw_nsw_left", args = ["false", "true"], expect = ["poison"] },
  { func = "@mul_nuw_nsw_right", args = ["true", "true"] },
  { func = "@mul_nuw_nsw_right", args = ["true", "true"], expect = ["poison"] },
  { func = "@mul_nuw_nsw_right", args = ["false", "true"] },
  { func = "@mul_nuw_nsw_right", args = ["false", "true"], expect = ["poison"] },
]
