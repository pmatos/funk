  { func = "@sub_left", args = ["false", "true"] },
  { func = "@sub_right", args = ["true", "true"] },
  { func = "@sub_right", args = ["true", "true"], expect = ["poison"] },
  { func = "@sub_right", args = ["false", "true"] },
  { func = "@sub_nuw_left", args = ["true", "true"] },
  { func = "@sub_nuw_left", args = ["true", "true"], expect = ["poison"] },
  { func = "@sub_nuw_left", args = ["false", "true"] },
  { func = "@sub_nuw_right", args = ["true", "true"] },
  { func = "@sub_nuw_right", args = ["true", "true"], expect = ["poison"] },
  { func = "@sub_nuw_right", args = ["false", "true"] },
  { func = "@sub_nsw_left", args = ["true", "true"] },
