# Tests of poison-i1.fir: poison propagates through add, sub and mul,
# whatever their flags, from either operand (ADR-2026-10-30-0818).
# %p = add nsw %a, 1 is poison when %a is the signed maximum, true at
# i1, and the function returns OP %p, %b or OP %b, %p.
# Each test without expect is differential: fir-ref and native code run
# it, and the native result must refine fir-ref's; where fir-ref returns
# poison, any value of the type does.
# Where fir-ref returns poison, an interpreter-only test of the same
# run checks that it is exactly poison. On the row false, true, %p is
# true, and add nuw, add nsw and mul nsw of true, true break their own
# flag, so at i1 those functions return poison on both rows.
tests = [
  { func = "@add_left", args = ["true", "true"] },
  { func = "@add_left", args = ["true", "true"], expect = ["poison"] },
  { func = "@add_left", args = ["false", "true"] },
  { func = "@add_right", args = ["true", "true"] },
  { func = "@add_right", args = ["true", "true"], expect = ["poison"] },
  { func = "@add_right", args = ["false", "true"] },
  { func = "@add_nuw_left", args = ["true", "true"] },
  { func = "@add_nuw_left", args = ["true", "true"], expect = ["poison"] },
  { func = "@add_nuw_left", args = ["false", "true"] },
  { func = "@add_nuw_left", args = ["false", "true"], expect = ["poison"] },
  { func = "@add_nuw_right", args = ["true", "true"] },
  { func = "@add_nuw_right", args = ["true", "true"], expect = ["poison"] },
  { func = "@add_nuw_right", args = ["false", "true"] },
  { func = "@add_nuw_right", args = ["false", "true"], expect = ["poison"] },
  { func = "@add_nsw_left", args = ["true", "true"] },
  { func = "@add_nsw_left", args = ["true", "true"], expect = ["poison"] },
  { func = "@add_nsw_left", args = ["false", "true"] },
  { func = "@add_nsw_left", args = ["false", "true"], expect = ["poison"] },
  { func = "@add_nsw_right", args = ["true", "true"] },
  { func = "@add_nsw_right", args = ["true", "true"], expect = ["poison"] },
  { func = "@add_nsw_right", args = ["false", "true"] },
  { func = "@add_nsw_right", args = ["false", "true"], expect = ["poison"] },
  { func = "@add_nuw_nsw_left", args = ["true", "true"] },
  { func = "@add_nuw_nsw_left", args = ["true", "true"], expect = ["poison"] },
  { func = "@add_nuw_nsw_left", args = ["false", "true"] },
  { func = "@add_nuw_nsw_left", args = ["false", "true"], expect = ["poison"] },
  { func = "@add_nuw_nsw_right", args = ["true", "true"] },
  { func = "@add_nuw_nsw_right", args = ["true", "true"], expect = ["poison"] },
  { func = "@add_nuw_nsw_right", args = ["false", "true"] },
  { func = "@add_nuw_nsw_right", args = ["false", "true"], expect = ["poison"] },
  { func = "@sub_left", args = ["true", "true"] },
