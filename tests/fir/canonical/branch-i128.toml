# Tests of branch-i128.fir: br and cond_br at i128, passing the
# boundary bit patterns, 0, 1, -1, the signed minimum and the signed
# maximum, and values on either side of 2^63 and 2^64, to block arguments
# (#21). br passes %a to ^next, which returns it. cond_br goes to ^then
# with %a when %c is true and to ^else with %b when it is false, on each
# condition and every pair of boundary bit patterns; each block returns
# its argument. Each half of an i128 is a copy of its own.
# Each test without expect is differential: fir-ref and native code run
# it, and the native result must refine fir-ref's.
