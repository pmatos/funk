# Tests of select-i16.fir: select at i16 with each condition, false and
# true, on every pair of boundary bit patterns: 0, 1, -1, the signed
# minimum and the signed maximum (#16). true chooses the first value and
# false the second.
# Each test is differential: fir-ref and native code run it, and the
# native result must equal fir-ref's.
tests = [
  { func = "@select", args = ["false", "0", "0"] },
  { func = "@select", args = ["false", "0", "1"] },
  { func = "@select", args = ["false", "0", "-1"] },
  { func = "@select", args = ["false", "0", "-32768"] },
  { func = "@select", args = ["false", "0", "32767"] },
  { func = "@select", args = ["false", "1", "0"] },
  { func = "@select", args = ["false", "1", "1"] },
  { func = "@select", args = ["false", "1", "-1"] },
  { func = "@select", args = ["false", "1", "-32768"] },
  { func = "@select", args = ["false", "1", "32767"] },
  { func = "@select", args = ["false", "-1", "0"] },
  { func = "@select", args = ["false", "-1", "1"] },
  { func = "@select", args = ["false", "-1", "-1"] },
  { func = "@select", args = ["false", "-1", "-32768"] },
  { func = "@select", args = ["false", "-1", "32767"] },
  { func = "@select", args = ["false", "-32768", "0"] },
  { func = "@select", args = ["false", "-32768", "1"] },
  { func = "@select", args = ["false", "-32768", "-1"] },
  { func = "@select", args = ["false", "-32768", "-32768"] },
  { func = "@select", args = ["false", "-32768", "32767"] },
  { func = "@select", args = ["false", "32767", "0"] },
  { func = "@select", args = ["false", "32767", "1"] },
  { func = "@select", args = ["false", "32767", "-1"] },
  { func = "@select", args = ["false", "32767", "-32768"] },
  { func = "@select", args = ["false", "32767", "32767"] },
  { func = "@select", args = ["true", "0", "0"] },
  { func = "@select", args = ["true", "0", "1"] },
  { func = "@select", args = ["true", "0", "-1"] },
  { func = "@select", args = ["true", "0", "-32768"] },
  { func = "@select", args = ["true", "0", "32767"] },
  { func = "@select", args = ["true", "1", "0"] },
  { func = "@select", args = ["true", "1", "1"] },
  { func = "@select", args = ["true", "1", "-1"] },
  { func = "@select", args = ["true", "1", "-32768"] },
  { func = "@select", args = ["true", "1", "32767"] },
  { func = "@select", args = ["true", "-1", "0"] },
  { func = "@select", args = ["true", "-1", "1"] },
  { func = "@select", args = ["true", "-1", "-1"] },
  { func = "@select", args = ["true", "-1", "-32768"] },
  { func = "@select", args = ["true", "-1", "32767"] },
  { func = "@select", args = ["true", "-32768", "0"] },
  { func = "@select", args = ["true", "-32768", "1"] },
  { func = "@select", args = ["true", "-32768", "-1"] },
  { func = "@select", args = ["true", "-32768", "-32768"] },
  { func = "@select", args = ["true", "-32768", "32767"] },
  { func = "@select", args = ["true", "32767", "0"] },
  { func = "@select", args = ["true", "32767", "1"] },
  { func = "@select", args = ["true", "32767", "-1"] },
  { func = "@select", args = ["true", "32767", "-32768"] },
  { func = "@select", args = ["true", "32767", "32767"] },
]
