# Tests of loop-i33.fir: loops at i33 (#19), each a header ^loop whose
# body ^body branches back to it with block arguments. sum is the loop
# of the spec's example @sum (lean/Fir/Text/Example.lean) at this type:
# it adds 0, 1, ... up to, but not including, %n, with add nsw, so a sum
# past the signed maximum is poison, which the loop carries to the end;
# it does not loop at all on %n of at most 0. fact counts %n down to 0
# as an unsigned number and multiplies with mul, which wraps: it gives
# %n! modulo 2^N. gcd is Euclid's algorithm with urem, on %a and %b read
# as unsigned numbers, on every pair of boundary bit patterns, 0, 1, -1,
# the signed minimum and the signed maximum, and on two consecutive
# Fibonacci numbers, which take the most trips for their size. No loop
# here runs more than a thousand times, well within the default fuel.
# The backend does not lower i33, so each test is interpreter-only and
# states the result that fir-ref must give.
tests = [
  { func = "@sum", args = ["0"], expect = ["0"] },
  { func = "@sum", args = ["1"], expect = ["0"] },
  { func = "@sum", args = ["2"], expect = ["1"] },
  { func = "@sum", args = ["-1"], expect = ["0"] },
  { func = "@sum", args = ["-4294967296"], expect = ["0"] },
  { func = "@sum", args = ["10"], expect = ["45"] },
  { func = "@sum", args = ["100"], expect = ["4950"] },
  { func = "@sum", args = ["1000"], expect = ["499500"] },
  { func = "@fact", args = ["0"], expect = ["1"] },
  { func = "@fact", args = ["1"], expect = ["1"] },
  { func = "@fact", args = ["12"], expect = ["479001600"] },
  { func = "@fact", args = ["13"], expect = ["-2362913792"] },
  { func = "@fact", args = ["34"], expect = ["-4294967296"] },
  { func = "@fact", args = ["36"], expect = ["0"] },
  { func = "@gcd", args = ["0", "0"], expect = ["0"] },
  { func = "@gcd", args = ["0", "1"], expect = ["1"] },
  { func = "@gcd", args = ["0", "-1"], expect = ["-1"] },
  { func = "@gcd", args = ["0", "-4294967296"], expect = ["-4294967296"] },
  { func = "@gcd", args = ["0", "4294967295"], expect = ["4294967295"] },
  { func = "@gcd", args = ["1", "0"], expect = ["1"] },
  { func = "@gcd", args = ["1", "1"], expect = ["1"] },
  { func = "@gcd", args = ["1", "-1"], expect = ["1"] },
  { func = "@gcd", args = ["1", "-4294967296"], expect = ["1"] },
  { func = "@gcd", args = ["1", "4294967295"], expect = ["1"] },
  { func = "@gcd", args = ["-1", "0"], expect = ["-1"] },
  { func = "@gcd", args = ["-1", "1"], expect = ["1"] },
  { func = "@gcd", args = ["-1", "-1"], expect = ["-1"] },
  { func = "@gcd", args = ["-1", "-4294967296"], expect = ["1"] },
  { func = "@gcd", args = ["-1", "4294967295"], expect = ["1"] },
  { func = "@gcd", args = ["-4294967296", "0"], expect = ["-4294967296"] },
  { func = "@gcd", args = ["-4294967296", "1"], expect = ["1"] },
  { func = "@gcd", args = ["-4294967296", "-1"], expect = ["1"] },
  { func = "@gcd", args = ["-4294967296", "-4294967296"], expect = ["-4294967296"] },
  { func = "@gcd", args = ["-4294967296", "4294967295"], expect = ["1"] },
  { func = "@gcd", args = ["4294967295", "0"], expect = ["4294967295"] },
  { func = "@gcd", args = ["4294967295", "1"], expect = ["1"] },
  { func = "@gcd", args = ["4294967295", "-1"], expect = ["1"] },
  { func = "@gcd", args = ["4294967295", "-4294967296"], expect = ["1"] },
  { func = "@gcd", args = ["4294967295", "4294967295"], expect = ["4294967295"] },
  { func = "@gcd", args = ["1836311903", "1134903170"], expect = ["1"] },
]
