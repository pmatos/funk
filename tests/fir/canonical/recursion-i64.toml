# Tests of recursion-i64.fir: recursive calls at i64 (#20). fact calls
# itself on %n - 1 while %n is above zero, read as signed, and
# multiplies with mul, which wraps: it gives %n! modulo 2^N, and 1 for
# %n of at most zero. fib calls itself twice, on %n - 1 and %n - 2,
# while %n is above 1 read as unsigned, and adds with add, which wraps.
# even and odd call each other on %n - 1 down to zero, so -1 counts down
# through every value of the type. Each call takes one step of fuel, and
# its callee runs on the steps that are left (ADR-2026-11-02-0836).
# Each test without expect is differential: fir-ref and native code run
# it, and the native result must refine fir-ref's.
# A differential test recurses at most 20 deep. PR #93 set that cap
# while a built executable's stack was its function's frame, its
# wrapper's and 16 KiB, and the harness ran native code with no data
# limit. Neither holds now, and no limit of either tool sets 20: a
# recursive run's stack follows ulimit -s, 8 MiB by default
# (ADR-2026-11-02-1132), the harness runs native code under a data
# limit of 1 GiB (ADR-2026-11-02-2250), and fir-ref stops at its fuel.
# The cap stays as it is; making deeper runs differential is a decision
# of its own. A deeper run, such as fact on the signed maximum or even
# on -1, is interpreter-only, and states the value that fir-ref returns.
# A run of more than 20,000 steps runs at a budget of 1,000 steps
# instead, and expects fuel-exhausted, which keeps the run short.
# fact on 5 takes 45 steps, its callees' included: eight for each level
# that calls and five for the last. At a budget of 45 it returns, and at
# 44 it runs out of fuel.
tests = [
  { func = "@fact", args = ["0"] },
  { func = "@fact", args = ["1"] },
  { func = "@fact", args = ["-1"] },
  { func = "@fact", args = ["-9223372036854775808"] },
  { func = "@fact", args = ["9223372036854775807"], fuel = 1000, expect = "fuel-exhausted" },
  { func = "@fact", args = ["2"] },
  { func = "@fact", args = ["3"] },
  { func = "@fact", args = ["5"] },
  { func = "@fact", args = ["10"] },
  { func = "@fact", args = ["12"] },
  { func = "@fact", args = ["13"] },
  { func = "@fact", args = ["20"] },
  { func = "@fib", args = ["0"] },
  { func = "@fib", args = ["1"] },
  { func = "@fib", args = ["-1"], fuel = 1000, expect = "fuel-exhausted" },
  { func = "@fib", args = ["-9223372036854775808"], fuel = 1000, expect = "fuel-exhausted" },
  { func = "@fib", args = ["9223372036854775807"], fuel = 1000, expect = "fuel-exhausted" },
  { func = "@fib", args = ["2"] },
  { func = "@fib", args = ["3"] },
  { func = "@fib", args = ["5"] },
  { func = "@fib", args = ["10"] },
  { func = "@fib", args = ["15"] },
  { func = "@even", args = ["0"] },
  { func = "@even", args = ["1"] },
  { func = "@even", args = ["-1"], fuel = 1000, expect = "fuel-exhausted" },
  { func = "@even", args = ["-9223372036854775808"], fuel = 1000, expect = "fuel-exhausted" },
  { func = "@even", args = ["9223372036854775807"], fuel = 1000, expect = "fuel-exhausted" },
  { func = "@even", args = ["2"] },
  { func = "@even", args = ["7"] },
  { func = "@even", args = ["10"] },
  { func = "@even", args = ["20"] },
  { func = "@odd", args = ["0"] },
  { func = "@odd", args = ["1"] },
  { func = "@odd", args = ["-1"], fuel = 1000, expect = "fuel-exhausted" },
  { func = "@odd", args = ["-9223372036854775808"], fuel = 1000, expect = "fuel-exhausted" },
  { func = "@odd", args = ["9223372036854775807"], fuel = 1000, expect = "fuel-exhausted" },
  { func = "@odd", args = ["2"] },
  { func = "@odd", args = ["7"] },
  { func = "@odd", args = ["10"] },
  { func = "@odd", args = ["20"] },
  { func = "@fact", args = ["5"], fuel = 45, expect = ["120"] },
  { func = "@fact", args = ["5"], fuel = 44, expect = "fuel-exhausted" },
]
