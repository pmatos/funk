# Tests of float-fpext-f32-f128.fir: fpext from f32 to f128
# (ADR-2026-11-09-1549) on the edges of the source and of the target:
# zeros, subnormals, the largest finite values, the values halfway
# between two values of the target and next to them, overflow to
# infinity, underflow to zero, infinities and NaNs. Written by
# scripts/harness/float_convert_cases.py, which computes each expected
# result with scripts/harness/float_ref.py, apart from Lean.
# Each test is interpreter-only: the backend does not lower
# f32 and f128 both, so fir-ref alone runs it and must give what it
# expects.
# A NaN operand gives any NaN of the target: its test is
# interpreter-only and names the NaN by a choice of the sign and the
# mantissa. Native code is not compared on a NaN result yet (#219).
tests = [
  { func = "@f32_f128", args = ["0.0"], expect = ["0.0"] },
  { func = "@f32_f128", args = ["1.0e-45"], expect = ["1.4012984643248170709237295832899161e-45"] },
  { func = "@f32_f128", args = ["1.1754942e-38"], expect = ["1.1754942106924410754870294448492873e-38"] },
  { func = "@f32_f128", args = ["1.1754944e-38"], expect = ["1.1754943508222875079687365372222457e-38"] },
  { func = "@f32_f128", args = ["1.0"], expect = ["1.0"] },
  { func = "@f32_f128", args = ["3.4028235e38"], expect = ["3.4028234663852885981170418348451693e38"] },
  { func = "@f32_f128", args = ["0x7f800000"], expect = ["0x7fff0000000000000000000000000000"] },
  { func = "@f32_f128", args = ["-0.0"], expect = ["-0.0"] },
  { func = "@f32_f128", args = ["-1.0e-45"], expect = ["-1.4012984643248170709237295832899161e-45"] },
  { func = "@f32_f128", args = ["-1.1754942e-38"], expect = ["-1.1754942106924410754870294448492873e-38"] },
  { func = "@f32_f128", args = ["-1.1754944e-38"], expect = ["-1.1754943508222875079687365372222457e-38"] },
  { func = "@f32_f128", args = ["-1.0"], expect = ["-1.0"] },
  { func = "@f32_f128", args = ["-3.4028235e38"], expect = ["-3.4028234663852885981170418348451693e38"] },
  { func = "@f32_f128", args = ["0xff800000"], expect = ["0xffff0000000000000000000000000000"] },
  { func = "@f32_f128", args = ["0x7fc00000"], choices = ["0"], expect = ["0x7fff8000000000000000000000000000"] },
  { func = "@f32_f128", args = ["0x7f800001"], choices = ["-1"], expect = ["0xffffffffffffffffffffffffffffffff"] },
  { func = "@f32_f128", args = ["0xffffffff"], choices = ["1"], expect = ["0x7fff0000000000000000000000000001"] },
  { func = "@f32_f128", args = ["poison"], expect = ["poison"] },
]
