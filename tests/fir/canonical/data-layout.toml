# Tests of data-layout.fir: a module whose data layout declares memories 1
# and 2 has their pointer types, which pass through parameters, results,
# block arguments and calls as they are, beside the default memory's ptr
# (ADR-2026-11-12-1821). A run starts with no allocation, so the only
# pointer argument is poison. The backend does not lower pointers yet, so
# each test is interpreter-only.
tests = [
  { func = "@id1", args = ["poison"], expect = ["poison"] },
  { func = "@pick", args = ["true", "poison", "poison"], expect = ["poison"] },
  { func = "@pick", args = ["poison", "poison", "poison"], expect = "ub" },
  { func = "@mixed", args = ["-5", "poison", "poison"], expect = ["poison", "-5"] },
]
