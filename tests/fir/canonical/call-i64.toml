# Tests of call-i64.fir: call at i64 (#20), on the boundary bit
# patterns: 0, 1, -1, the signed minimum and the signed maximum. call_id
# passes its argument to @id and returns what @id returns, so each
# pattern goes into a call as an argument and comes back as its result.
# call_sub passes %a and %b, in that order, to @sub, which returns
# %a - %b, on every pair of patterns: an argument in the wrong place
# changes the result for every pair of different patterns but 0 and the
# signed minimum, and -1 and the signed maximum, which differ by 2^63,
# so that %a - %b is %b - %a.
# Each test without expect is differential: fir-ref and native code run
# it, and the native result must refine fir-ref's.
tests = [
  { func = "@call_id", args = ["0"] },
  { func = "@call_id", args = ["1"] },
  { func = "@call_id", args = ["-1"] },
  { func = "@call_id", args = ["-9223372036854775808"] },
  { func = "@call_id", args = ["9223372036854775807"] },
  { func = "@call_sub", args = ["0", "0"] },
  { func = "@call_sub", args = ["0", "1"] },
  { func = "@call_sub", args = ["0", "-1"] },
  { func = "@call_sub", args = ["0", "-9223372036854775808"] },
  { func = "@call_sub", args = ["0", "9223372036854775807"] },
  { func = "@call_sub", args = ["1", "0"] },
  { func = "@call_sub", args = ["1", "1"] },
  { func = "@call_sub", args = ["1", "-1"] },
  { func = "@call_sub", args = ["1", "-9223372036854775808"] },
  { func = "@call_sub", args = ["1", "9223372036854775807"] },
  { func = "@call_sub", args = ["-1", "0"] },
  { func = "@call_sub", args = ["-1", "1"] },
  { func = "@call_sub", args = ["-1", "-1"] },
  { func = "@call_sub", args = ["-1", "-9223372036854775808"] },
  { func = "@call_sub", args = ["-1", "9223372036854775807"] },
  { func = "@call_sub", args = ["-9223372036854775808", "0"] },
  { func = "@call_sub", args = ["-9223372036854775808", "1"] },
  { func = "@call_sub", args = ["-9223372036854775808", "-1"] },
  { func = "@call_sub", args = ["-9223372036854775808", "-9223372036854775808"] },
  { func = "@call_sub", args = ["-9223372036854775808", "9223372036854775807"] },
  { func = "@call_sub", args = ["9223372036854775807", "0"] },
  { func = "@call_sub", args = ["9223372036854775807", "1"] },
  { func = "@call_sub", args = ["9223372036854775807", "-1"] },
  { func = "@call_sub", args = ["9223372036854775807", "-9223372036854775808"] },
  { func = "@call_sub", args = ["9223372036854775807", "9223372036854775807"] },
]
