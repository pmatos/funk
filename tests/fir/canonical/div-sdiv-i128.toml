# Tests of div-sdiv-i128.fir: sdiv at i128 (#22), on every pair of these
# values: 0, 1, -1, 7, -7, the signed minimum and the minimum plus 1, the
# signed maximum, 2^64 - 1, 2^64 + 1, -2^64 - 3, 2^100 + 12345 and
# -0x0123456789abcdeffedcba9876543210, whose halves differ. So dividends
# and divisors take both signs, and divisors are below 2^64, where the
# helper divides by one 64-bit digit, and above it, where it divides bit
# by bit (ADR-2026-11-03-0415).
# Each test without expect is differential: fir-ref and native code run
# it, and the native code calls the runtime helper, so the native result
# must equal fir-ref's.
# A pair that is UB in the spec, a zero divisor or sdiv of the signed
# minimum by -1, is an interpreter-only test that expects ub; native code
# may trap there or give any value (ADR-2026-11-03-0415). fir-ref's UB
# reason names its case, but the harness matches ub to any reason
# (ADR-2026-10-30-2135).
tests = [
  { func = "@sdiv", args = ["0", "0"], expect = "ub" },
  { func = "@sdiv", args = ["0", "1"] },
  { func = "@sdiv", args = ["0", "-1"] },
  { func = "@sdiv", args = ["0", "7"] },
  { func = "@sdiv", args = ["0", "-7"] },
