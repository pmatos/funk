# Tests of select-i128.fir: select at i128 (#21), with each condition,
# on every pair of boundary bit patterns: 0, 1, -1, the signed minimum and
# the signed maximum; and on values whose halves differ, so that a
# select that took one half from each value would show.
# Each test without expect is differential: fir-ref and native code run
