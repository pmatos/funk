# Tests of poison-arg-i1.fir: functions of each kind run on poison
# arguments at i1 (#123). fir-ref run takes poison as an argument of any
# integer type. Ops that propagate poison give poison: add, sub and xor
# of %a with itself, mul and and with 0, or with -1, the shifts, icmp,
# icmp eq of %a with itself included, the width changes, and a division
# of a poison dividend. select and cond_br give the value they choose,
# poison or not; a select on a poison condition is poison, while a
# branch on poison is UB, as are a poison divisor and a poison dividend
# of sdiv or srem by -1. br, call and ret pass poison on as it is,
# through a loop and a recursion too, and a callee that ignores its
# poison argument returns a value. freeze_sub freezes the poison and
# subtracts it from itself, which gives 0 whatever freeze chooses.
#
# Each test without expect is differential. fir-ref runs it on the
# poison; native code, which holds no poison, runs it once on each
# vector of stand-ins in place of the poison: 0, 1, all ones, the signed
# minimum and the signed maximum of its type, so false and true at i1,
# in every combination (docs/decisions/fir-ref.md#poison-arguments). Each native
# result must refine fir-ref's. Where the poison reaches the result, fir-ref
# returns
# poison, and any value refines it; where it does not, as in select,
# cond_br and call_first on a poison they do not choose, and in
# freeze_sub, native code must give the defined value on every stand-in.
# A run that is UB is interpreter-only, since UB allows any result.
tests = [
  { func = "@add", args = ["poison", "true"] },
  { func = "@add", args = ["true", "poison"] },
  { func = "@add", args = ["poison", "poison"] },
  { func = "@add_nsw", args = ["poison", "false"] },
  { func = "@sub_self", args = ["poison"] },
  { func = "@mul_zero", args = ["poison"] },
  { func = "@and_zero", args = ["poison"] },
  { func = "@or_ones", args = ["poison"] },
  { func = "@xor_self", args = ["poison"] },
  { func = "@shl", args = ["poison", "false"] },
  { func = "@shl", args = ["true", "poison"] },
  { func = "@lshr", args = ["poison", "false"] },
  { func = "@lshr", args = ["true", "poison"] },
  { func = "@ashr", args = ["poison", "false"] },
  { func = "@ashr", args = ["true", "poison"] },
  { func = "@icmp_eq_self", args = ["poison"] },
  { func = "@icmp_ult", args = ["poison", "false"] },
  { func = "@icmp_ult", args = ["false", "poison"] },
  { func = "@select", args = ["poison", "true", "false"] },
  { func = "@select", args = ["true", "true", "poison"] },
  { func = "@select", args = ["false", "poison", "false"] },
  { func = "@select", args = ["true", "poison", "false"] },
  { func = "@select", args = ["false", "true", "poison"] },
  { func = "@zext", args = ["poison"] },
  { func = "@sext", args = ["poison"] },
  { func = "@trunc", args = ["poison"] },
  { func = "@udiv", args = ["poison", "true"] },
  { func = "@urem", args = ["poison", "true"] },
  { func = "@br_arg", args = ["poison"] },
  { func = "@cond_br", args = ["true", "true", "poison"] },
  { func = "@cond_br", args = ["false", "poison", "false"] },
  { func = "@cond_br", args = ["true", "poison", "false"] },
  { func = "@loop", args = ["3", "poison"] },
  { func = "@loop", args = ["0", "poison"] },
  { func = "@call_id", args = ["poison"] },
  { func = "@call_first", args = ["true", "poison"] },
  { func = "@call_first", args = ["poison", "true"] },
  { func = "@rec", args = ["3", "poison"] },
  { func = "@swap", args = ["poison", "true"] },
  { func = "@swap", args = ["true", "poison"] },
  { func = "@swap", args = ["poison", "poison"] },
  { func = "@call_swap", args = ["true", "poison"] },
  { func = "@freeze_sub", args = ["poison"] },
  # Interpreter-only tests: fir-ref alone runs each, and must give
  # the expected result.
  { func = "@add", args = ["poison", "true"], expect = ["poison"] },
  { func = "@add", args = ["true", "poison"], expect = ["poison"] },
  { func = "@add", args = ["poison", "poison"], expect = ["poison"] },
  { func = "@add_nsw", args = ["poison", "false"], expect = ["poison"] },
  { func = "@sub_self", args = ["poison"], expect = ["poison"] },
  { func = "@mul_zero", args = ["poison"], expect = ["poison"] },
  { func = "@and_zero", args = ["poison"], expect = ["poison"] },
  { func = "@or_ones", args = ["poison"], expect = ["poison"] },
  { func = "@xor_self", args = ["poison"], expect = ["poison"] },
  { func = "@shl", args = ["poison", "false"], expect = ["poison"] },
  { func = "@shl", args = ["true", "poison"], expect = ["poison"] },
  { func = "@lshr", args = ["poison", "false"], expect = ["poison"] },
  { func = "@lshr", args = ["true", "poison"], expect = ["poison"] },
  { func = "@ashr", args = ["poison", "false"], expect = ["poison"] },
  { func = "@ashr", args = ["true", "poison"], expect = ["poison"] },
  { func = "@icmp_eq_self", args = ["poison"], expect = ["poison"] },
  { func = "@icmp_ult", args = ["poison", "false"], expect = ["poison"] },
  { func = "@icmp_ult", args = ["false", "poison"], expect = ["poison"] },
  { func = "@select", args = ["poison", "true", "false"], expect = ["poison"] },
  { func = "@select", args = ["true", "true", "poison"], expect = ["true"] },
  { func = "@select", args = ["false", "poison", "false"], expect = ["false"] },
  { func = "@select", args = ["true", "poison", "false"], expect = ["poison"] },
  { func = "@select", args = ["false", "true", "poison"], expect = ["poison"] },
  { func = "@zext", args = ["poison"], expect = ["poison"] },
  { func = "@sext", args = ["poison"], expect = ["poison"] },
  { func = "@trunc", args = ["poison"], expect = ["poison"] },
  { func = "@udiv", args = ["poison", "true"], expect = ["poison"] },
  { func = "@udiv", args = ["true", "poison"], expect = "ub" },
  { func = "@sdiv", args = ["poison", "true"], expect = "ub" },
  { func = "@sdiv", args = ["true", "poison"], expect = "ub" },
  { func = "@urem", args = ["poison", "true"], expect = ["poison"] },
  { func = "@urem", args = ["true", "poison"], expect = "ub" },
  { func = "@srem", args = ["poison", "true"], expect = "ub" },
  { func = "@srem", args = ["true", "poison"], expect = "ub" },
  { func = "@br_arg", args = ["poison"], expect = ["poison"] },
  { func = "@cond_br", args = ["true", "true", "poison"], expect = ["true"] },
  { func = "@cond_br", args = ["false", "poison", "false"], expect = ["false"] },
  { func = "@cond_br", args = ["true", "poison", "false"], expect = ["poison"] },
  { func = "@cond_br", args = ["poison", "true", "false"], expect = "ub" },
  { func = "@loop", args = ["3", "poison"], expect = ["poison"] },
  { func = "@loop", args = ["0", "poison"], expect = ["poison"] },
  { func = "@loop", args = ["poison", "true"], expect = "ub" },
  { func = "@call_id", args = ["poison"], expect = ["poison"] },
  { func = "@call_first", args = ["true", "poison"], expect = ["true"] },
  { func = "@call_first", args = ["poison", "true"], expect = ["poison"] },
  { func = "@rec", args = ["3", "poison"], expect = ["poison"] },
  { func = "@rec", args = ["poison", "true"], expect = "ub" },
  { func = "@swap", args = ["poison", "true"], expect = ["true", "poison"] },
  { func = "@swap", args = ["true", "poison"], expect = ["poison", "true"] },
  { func = "@swap", args = ["poison", "poison"], expect = ["poison", "poison"] },
  { func = "@call_swap", args = ["true", "poison"], expect = ["poison", "true"] },
  { func = "@freeze_sub", args = ["poison"], choices = ["false"], expect = ["false"] },
  { func = "@freeze_sub", args = ["poison"], choices = ["true"], expect = ["false"] },
]
