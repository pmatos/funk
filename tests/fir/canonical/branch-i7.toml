# Tests of branch-i7.fir: br and cond_br at i7, passing the boundary bit
# patterns, 0, 1, -1, the signed minimum and the signed maximum, to
# block arguments (#19). br passes %a to ^next, which returns it.
# cond_br goes to ^then with %a when %c is true and to ^else with %b
# when it is false, on each condition and every pair of boundary bit
# patterns; each block returns its argument.
# The backend does not lower i7, so each test is interpreter-only and
# states the result that fir-ref must give.
tests = [
  { func = "@br", args = ["0"], expect = ["0"] },
  { func = "@br", args = ["1"], expect = ["1"] },
  { func = "@br", args = ["-1"], expect = ["-1"] },
  { func = "@br", args = ["-64"], expect = ["-64"] },
  { func = "@br", args = ["63"], expect = ["63"] },
  { func = "@cond_br", args = ["false", "0", "0"], expect = ["0"] },
  { func = "@cond_br", args = ["false", "0", "1"], expect = ["1"] },
  { func = "@cond_br", args = ["false", "0", "-1"], expect = ["-1"] },
  { func = "@cond_br", args = ["false", "0", "-64"], expect = ["-64"] },
  { func = "@cond_br", args = ["false", "0", "63"], expect = ["63"] },
  { func = "@cond_br", args = ["false", "1", "0"], expect = ["0"] },
  { func = "@cond_br", args = ["false", "1", "1"], expect = ["1"] },
  { func = "@cond_br", args = ["false", "1", "-1"], expect = ["-1"] },
  { func = "@cond_br", args = ["false", "1", "-64"], expect = ["-64"] },
  { func = "@cond_br", args = ["false", "1", "63"], expect = ["63"] },
  { func = "@cond_br", args = ["false", "-1", "0"], expect = ["0"] },
  { func = "@cond_br", args = ["false", "-1", "1"], expect = ["1"] },
  { func = "@cond_br", args = ["false", "-1", "-1"], expect = ["-1"] },
  { func = "@cond_br", args = ["false", "-1", "-64"], expect = ["-64"] },
  { func = "@cond_br", args = ["false", "-1", "63"], expect = ["63"] },
  { func = "@cond_br", args = ["false", "-64", "0"], expect = ["0"] },
  { func = "@cond_br", args = ["false", "-64", "1"], expect = ["1"] },
  { func = "@cond_br", args = ["false", "-64", "-1"], expect = ["-1"] },
  { func = "@cond_br", args = ["false", "-64", "-64"], expect = ["-64"] },
  { func = "@cond_br", args = ["false", "-64", "63"], expect = ["63"] },
  { func = "@cond_br", args = ["false", "63", "0"], expect = ["0"] },
  { func = "@cond_br", args = ["false", "63", "1"], expect = ["1"] },
  { func = "@cond_br", args = ["false", "63", "-1"], expect = ["-1"] },
  { func = "@cond_br", args = ["false", "63", "-64"], expect = ["-64"] },
  { func = "@cond_br", args = ["false", "63", "63"], expect = ["63"] },
  { func = "@cond_br", args = ["true", "0", "0"], expect = ["0"] },
  { func = "@cond_br", args = ["true", "0", "1"], expect = ["0"] },
  { func = "@cond_br", args = ["true", "0", "-1"], expect = ["0"] },
  { func = "@cond_br", args = ["true", "0", "-64"], expect = ["0"] },
  { func = "@cond_br", args = ["true", "0", "63"], expect = ["0"] },
  { func = "@cond_br", args = ["true", "1", "0"], expect = ["1"] },
  { func = "@cond_br", args = ["true", "1", "1"], expect = ["1"] },
  { func = "@cond_br", args = ["true", "1", "-1"], expect = ["1"] },
  { func = "@cond_br", args = ["true", "1", "-64"], expect = ["1"] },
  { func = "@cond_br", args = ["true", "1", "63"], expect = ["1"] },
  { func = "@cond_br", args = ["true", "-1", "0"], expect = ["-1"] },
  { func = "@cond_br", args = ["true", "-1", "1"], expect = ["-1"] },
  { func = "@cond_br", args = ["true", "-1", "-1"], expect = ["-1"] },
  { func = "@cond_br", args = ["true", "-1", "-64"], expect = ["-1"] },
  { func = "@cond_br", args = ["true", "-1", "63"], expect = ["-1"] },
  { func = "@cond_br", args = ["true", "-64", "0"], expect = ["-64"] },
  { func = "@cond_br", args = ["true", "-64", "1"], expect = ["-64"] },
  { func = "@cond_br", args = ["true", "-64", "-1"], expect = ["-64"] },
  { func = "@cond_br", args = ["true", "-64", "-64"], expect = ["-64"] },
  { func = "@cond_br", args = ["true", "-64", "63"], expect = ["-64"] },
  { func = "@cond_br", args = ["true", "63", "0"], expect = ["63"] },
  { func = "@cond_br", args = ["true", "63", "1"], expect = ["63"] },
  { func = "@cond_br", args = ["true", "63", "-1"], expect = ["63"] },
  { func = "@cond_br", args = ["true", "63", "-64"], expect = ["63"] },
  { func = "@cond_br", args = ["true", "63", "63"], expect = ["63"] },
]
