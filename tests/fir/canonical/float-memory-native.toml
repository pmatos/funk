# Tests of float-memory-native.fir: loads, stores and allocas of f32 and
# f64 run on fir-ref and as native code (stage 2 of #264), where the
# backend moves a float with movss or movsd. A float stored and loaded
# back is itself, a NaN's sign and payload included, a signalling NaN's
# too; a float loaded as the integer of its width gives its bits, and an
# integer loaded as a float gives the float with those bits. The bytes
# are in little-endian order, so byte 3 of an f32 holds its sign. An
# alloca of several floats holds each at its own offset: the stores go
# last element first, so an f32 store that wrote more than its 4 bytes
# would clobber the next element. An f64 at offset 4 of an allocation of
# i32s is aligned to 4, which the access writes as align(4). A stored
# poison loads as poison, which native code refines with any value. A NaN
# that fsub chooses keeps its bits through memory, loaded as a float or
# as the integer of its width: native code's NaN must be one that fir-ref
# can choose, and the interpreter-only tests pin some of fir-ref's
# choices. float-memory.fir has the formats the backend does
# not lower, memories of other units, and the UB and poison cases. Each
# test that declares its result pins fir-ref's own as well as native
# code's.
tests = [
  { func = "@round_f32", args = ["1.5"], results = [{ values = ["1.5"], witness = [] }] },
  { func = "@round_f32", args = ["-0.0"], results = [{ values = ["-0.0"], witness = [] }] },
  { func = "@round_f32", args = ["0xffc00123"], results = [{ values = ["0xffc00123"], witness = [] }] },
  { func = "@round_f32", args = ["0x7f800001"], results = [{ values = ["0x7f800001"], witness = [] }] },
  { func = "@round_f32", args = ["0x7f800000"], results = [{ values = ["0x7f800000"], witness = [] }] },
  { func = "@round_f32", args = ["poison"], results = [{ values = ["poison"], witness = [] }] },
  { func = "@round_f64", args = ["0.1"], results = [{ values = ["0.1"], witness = [] }] },
  { func = "@round_f64", args = ["-0.0"], results = [{ values = ["-0.0"], witness = [] }] },
  { func = "@round_f64", args = ["0x7ff0000000000001"], results = [{ values = ["0x7ff0000000000001"], witness = [] }] },
  { func = "@round_f64", args = ["0xfff8000000000123"], results = [{ values = ["0xfff8000000000123"], witness = [] }] },
  { func = "@round_f64", args = ["poison"], results = [{ values = ["poison"], witness = [] }] },
  { func = "@f32_bits", args = ["1.5"], results = [{ values = ["1069547520"], witness = [] }] },
