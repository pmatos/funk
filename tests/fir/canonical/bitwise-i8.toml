# Tests of bitwise-i8.fir: and, or and xor at i8 on every pair of
# boundary bit patterns: 0, 1, -1, the signed minimum and the signed
# maximum, or false and true at i1 (#15).
# Each test without expect is differential: fir-ref and native code
# run it, and the native result must equal fir-ref's.
tests = [
  { func = "@and", args = ["0", "0"] },
  { func = "@and", args = ["0", "1"] },
  { func = "@and", args = ["0", "-1"] },
  { func = "@and", args = ["0", "-128"] },
  { func = "@and", args = ["0", "127"] },
  { func = "@and", args = ["1", "0"] },
  { func = "@and", args = ["1", "1"] },
  { func = "@and", args = ["1", "-1"] },
  { func = "@and", args = ["1", "-128"] },
  { func = "@and", args = ["1", "127"] },
  { func = "@and", args = ["-1", "0"] },
  { func = "@and", args = ["-1", "1"] },
  { func = "@and", args = ["-1", "-1"] },
  { func = "@and", args = ["-1", "-128"] },
  { func = "@and", args = ["-1", "127"] },
  { func = "@and", args = ["-128", "0"] },
  { func = "@and", args = ["-128", "1"] },
  { func = "@and", args = ["-128", "-1"] },
  { func = "@and", args = ["-128", "-128"] },
  { func = "@and", args = ["-128", "127"] },
  { func = "@and", args = ["127", "0"] },
  { func = "@and", args = ["127", "1"] },
  { func = "@and", args = ["127", "-1"] },
  { func = "@and", args = ["127", "-128"] },
  { func = "@and", args = ["127", "127"] },
  { func = "@or", args = ["0", "0"] },
  { func = "@or", args = ["0", "1"] },
  { func = "@or", args = ["0", "-1"] },
  { func = "@or", args = ["0", "-128"] },
  { func = "@or", args = ["0", "127"] },
  { func = "@or", args = ["1", "0"] },
  { func = "@or", args = ["1", "1"] },
  { func = "@or", args = ["1", "-1"] },
  { func = "@or", args = ["1", "-128"] },
  { func = "@or", args = ["1", "127"] },
  { func = "@or", args = ["-1", "0"] },
  { func = "@or", args = ["-1", "1"] },
  { func = "@or", args = ["-1", "-1"] },
  { func = "@or", args = ["-1", "-128"] },
  { func = "@or", args = ["-1", "127"] },
  { func = "@or", args = ["-128", "0"] },
  { func = "@or", args = ["-128", "1"] },
  { func = "@or", args = ["-128", "-1"] },
  { func = "@or", args = ["-128", "-128"] },
  { func = "@or", args = ["-128", "127"] },
  { func = "@or", args = ["127", "0"] },
  { func = "@or", args = ["127", "1"] },
  { func = "@or", args = ["127", "-1"] },
  { func = "@or", args = ["127", "-128"] },
  { func = "@or", args = ["127", "127"] },
  { func = "@xor", args = ["0", "0"] },
  { func = "@xor", args = ["0", "1"] },
  { func = "@xor", args = ["0", "-1"] },
  { func = "@xor", args = ["0", "-128"] },
  { func = "@xor", args = ["0", "127"] },
  { func = "@xor", args = ["1", "0"] },
  { func = "@xor", args = ["1", "1"] },
  { func = "@xor", args = ["1", "-1"] },
  { func = "@xor", args = ["1", "-128"] },
  { func = "@xor", args = ["1", "127"] },
  { func = "@xor", args = ["-1", "0"] },
  { func = "@xor", args = ["-1", "1"] },
  { func = "@xor", args = ["-1", "-1"] },
  { func = "@xor", args = ["-1", "-128"] },
  { func = "@xor", args = ["-1", "127"] },
  { func = "@xor", args = ["-128", "0"] },
  { func = "@xor", args = ["-128", "1"] },
  { func = "@xor", args = ["-128", "-1"] },
  { func = "@xor", args = ["-128", "-128"] },
  { func = "@xor", args = ["-128", "127"] },
  { func = "@xor", args = ["127", "0"] },
  { func = "@xor", args = ["127", "1"] },
  { func = "@xor", args = ["127", "-1"] },
  { func = "@xor", args = ["127", "-128"] },
  { func = "@xor", args = ["127", "127"] },
  # Interpreter-only tests: fir-ref alone runs each, and must give the
  # result it states (the coverage matrix, ADR-2026-11-03-0557).
  { func = "@and", args = ["12", "10"], expect = ["8"] },
  { func = "@or", args = ["12", "10"], expect = ["14"] },
  { func = "@xor", args = ["12", "10"], expect = ["6"] },
  { func = "@and", args = ["-1", "1"], expect = ["1"] },
  { func = "@or", args = ["-1", "1"], expect = ["-1"] },
  { func = "@xor", args = ["-1", "1"], expect = ["-2"] },
  { func = "@and", args = ["-128", "127"], expect = ["0"] },
  { func = "@or", args = ["-128", "127"], expect = ["-1"] },
  { func = "@xor", args = ["-128", "127"], expect = ["-1"] },
]
