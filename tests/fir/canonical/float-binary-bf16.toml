# Tests of float-binary-bf16.fir: fadd, fsub, fmul, fdiv at bf16
# (ADR-2026-11-11-1800), on the hard inputs: results halfway between
# two floats, subnormals, -0, overflow to infinity and NaN operands.
# Written by scripts/harness/float_arith_cases.py, which computes each
# expected result with scripts/harness/float_ref.py, apart from Lean.
# Each test is interpreter-only: the backend does not lower
# bf16, so fir-ref alone runs it and must give what it expects.
# A NaN result is any NaN: its test is interpreter-only and names
# the NaN by a choice of the sign and the mantissa, as signed
# i8. Native code is not compared on a NaN result yet (#219).
tests = [
  { func = "@fadd", args = ["1.0", "1.0"], expect = ["2.0"] },
  { func = "@fadd", args = ["1.0", "0.0039"], expect = ["1.0"] },
  { func = "@fadd", args = ["1.01", "0.0039"], expect = ["1.016"] },
  { func = "@fadd", args = ["1.0", "0.00586"], expect = ["1.01"] },
  { func = "@fadd", args = ["1.0", "0.00195"], expect = ["1.0"] },
  { func = "@fadd", args = ["3.39e38", "3.39e38"], expect = ["0x7f80"] },
  { func = "@fadd", args = ["3.39e38", "6.65e35"], expect = ["0x7f80"] },
  { func = "@fadd", args = ["3.39e38", "3.32e35"], expect = ["3.39e38"] },
  { func = "@fadd", args = ["3.39e38", "9.0e-41"], expect = ["3.39e38"] },
  { func = "@fadd", args = ["9.0e-41", "9.0e-41"], expect = ["2.0e-40"] },
  { func = "@fadd", args = ["1.17e-38", "9.0e-41"], expect = ["1.18e-38"] },
  { func = "@fadd", args = ["1.0", "-1.0"], expect = ["0.0"] },
  { func = "@fadd", args = ["-0.0", "-0.0"], expect = ["-0.0"] },
  { func = "@fadd", args = ["0.0", "-0.0"], expect = ["0.0"] },
  { func = "@fadd", args = ["-9.0e-41", "9.0e-41"], expect = ["0.0"] },
  { func = "@fadd", args = ["0x7f80", "0xff80"], choices = ["0"], expect = ["0x7fc0"] },
  { func = "@fadd", args = ["0xff80", "3.39e38"], expect = ["0xff80"] },
  { func = "@fadd", args = ["0xffff", "1.0"], choices = ["-1"], expect = ["0xffff"] },
  { func = "@fadd", args = ["1.0", "0x7f81"], choices = ["1"], expect = ["0x7f81"] },
  { func = "@fsub", args = ["1.0", "1.0"], expect = ["0.0"] },
  { func = "@fsub", args = ["-0.0", "0.0"], expect = ["-0.0"] },
  { func = "@fsub", args = ["0.0", "-0.0"], expect = ["0.0"] },
  { func = "@fsub", args = ["0.0", "0.0"], expect = ["0.0"] },
  { func = "@fsub", args = ["1.18e-38", "9.0e-41"], expect = ["1.17e-38"] },
  { func = "@fsub", args = ["9.0e-41", "1.18e-38"], expect = ["-1.17e-38"] },
  { func = "@fsub", args = ["1.0", "0.00195"], expect = ["1.0"] },
  { func = "@fsub", args = ["0.00195", "1.0"], expect = ["-1.0"] },
  { func = "@fsub", args = ["-3.39e38", "3.39e38"], expect = ["0xff80"] },
  { func = "@fsub", args = ["3.39e38", "-3.39e38"], expect = ["0x7f80"] },
  { func = "@fsub", args = ["0x7f80", "0x7f80"], choices = ["0"], expect = ["0x7fc0"] },
  { func = "@fsub", args = ["0.0", "0x7f80"], expect = ["0xff80"] },
  { func = "@fsub", args = ["0x7f80", "0.0"], expect = ["0x7f80"] },
  { func = "@fsub", args = ["1.0", "0xffff"], choices = ["-1"], expect = ["0xffff"] },
  { func = "@fsub", args = ["0xffff", "1.0"], choices = ["1"], expect = ["0x7f81"] },
  { func = "@fmul", args = ["1.5", "1.5"], expect = ["2.25"] },
  { func = "@fmul", args = ["1.01", "1.01"], expect = ["1.016"] },
  { func = "@fmul", args = ["1.18e-38", "0.5"], expect = ["5.9e-39"] },
  { func = "@fmul", args = ["9.0e-41", "0.5"], expect = ["0.0"] },
  { func = "@fmul", args = ["3.0e-40", "0.5"], expect = ["2.0e-40"] },
  { func = "@fmul", args = ["9.0e-41", "0.75"], expect = ["9.0e-41"] },
  { func = "@fmul", args = ["-9.0e-41", "0.25"], expect = ["-0.0"] },
  { func = "@fmul", args = ["3.39e38", "2.0"], expect = ["0x7f80"] },
  { func = "@fmul", args = ["-3.39e38", "3.39e38"], expect = ["0xff80"] },
  { func = "@fmul", args = ["9.0e-41", "9.0e-41"], expect = ["0.0"] },
  { func = "@fmul", args = ["-9.0e-41", "1.17e-38"], expect = ["-0.0"] },
  { func = "@fmul", args = ["-0.0", "1.0"], expect = ["-0.0"] },
  { func = "@fmul", args = ["0.0", "0x7f80"], choices = ["0"], expect = ["0x7fc0"] },
  { func = "@fmul", args = ["-1.0", "0x7f80"], expect = ["0xff80"] },
  { func = "@fmul", args = ["0xffff", "0.0"], choices = ["-1"], expect = ["0xffff"] },
  { func = "@fdiv", args = ["1.0", "3.0"], expect = ["0.334"] },
  { func = "@fdiv", args = ["3.0", "1.0"], expect = ["3.0"] },
  { func = "@fdiv", args = ["1.0", "1.01"], expect = ["0.992"] },
  { func = "@fdiv", args = ["1.01", "1.0"], expect = ["1.01"] },
  { func = "@fdiv", args = ["1.0", "0.0"], expect = ["0x7f80"] },
  { func = "@fdiv", args = ["0.0", "1.0"], expect = ["0.0"] },
  { func = "@fdiv", args = ["-1.0", "0.0"], expect = ["0xff80"] },
  { func = "@fdiv", args = ["0.0", "-1.0"], expect = ["-0.0"] },
  { func = "@fdiv", args = ["1.0", "-0.0"], expect = ["0xff80"] },
  { func = "@fdiv", args = ["-0.0", "1.0"], expect = ["-0.0"] },
  { func = "@fdiv", args = ["0.0", "0.0"], choices = ["1"], expect = ["0x7f81"] },
  { func = "@fdiv", args = ["0x7f80", "0x7f80"], choices = ["0"], expect = ["0x7fc0"] },
  { func = "@fdiv", args = ["1.0", "0x7f80"], expect = ["0.0"] },
  { func = "@fdiv", args = ["0x7f80", "1.0"], expect = ["0x7f80"] },
  { func = "@fdiv", args = ["-1.0", "0x7f80"], expect = ["-0.0"] },
  { func = "@fdiv", args = ["0x7f80", "-1.0"], expect = ["0xff80"] },
  { func = "@fdiv", args = ["1.18e-38", "128.0"], expect = ["9.0e-41"] },
  { func = "@fdiv", args = ["128.0", "1.18e-38"], expect = ["0x7f80"] },
  { func = "@fdiv", args = ["9.0e-41", "2.0"], expect = ["0.0"] },
  { func = "@fdiv", args = ["2.0", "9.0e-41"], expect = ["0x7f80"] },
  { func = "@fdiv", args = ["3.0e-40", "2.0"], expect = ["2.0e-40"] },
  { func = "@fdiv", args = ["2.0", "3.0e-40"], expect = ["0x7f80"] },
  { func = "@fdiv", args = ["3.39e38", "0.5"], expect = ["0x7f80"] },
  { func = "@fdiv", args = ["0.5", "3.39e38"], expect = ["1.5e-39"] },
  { func = "@fdiv", args = ["9.0e-41", "3.39e38"], expect = ["0.0"] },
  { func = "@fdiv", args = ["3.39e38", "9.0e-41"], expect = ["0x7f80"] },
  { func = "@fdiv", args = ["3.39e38", "9.0e-41"], expect = ["0x7f80"] },
  { func = "@fdiv", args = ["9.0e-41", "3.39e38"], expect = ["0.0"] },
  { func = "@fdiv", args = ["-0.0", "1.0"], expect = ["-0.0"] },
  { func = "@fdiv", args = ["1.0", "-0.0"], expect = ["0xff80"] },
  { func = "@fdiv", args = ["1.0", "0xffff"], choices = ["-1"], expect = ["0xffff"] },
  { func = "@fdiv", args = ["0xffff", "1.0"], choices = ["1"], expect = ["0x7f81"] },
  { func = "@fadd", args = ["poison", "0.0"], expect = ["poison"] },
  { func = "@fsub", args = ["poison", "0.0"], expect = ["poison"] },
  { func = "@fmul", args = ["poison", "0.0"], expect = ["poison"] },
  { func = "@fdiv", args = ["poison", "0.0"], expect = ["poison"] },
]
