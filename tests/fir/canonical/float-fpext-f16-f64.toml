# Tests of float-fpext-f16-f64.fir: fpext from f16 to f64
# (ADR-2026-11-09-1549) on the edges of the source and of the target:
# zeros, subnormals, the largest finite values, the values halfway
# between two values of the target and next to them, overflow to
# infinity, underflow to zero, infinities and NaNs. Written by
# scripts/harness/float_convert_cases.py, which computes each expected
# result with scripts/harness/float_ref.py, apart from Lean.
# Each test is interpreter-only: the backend does not lower
# f16 and f64 both, so fir-ref alone runs it and must give what it
# expects.
# A NaN operand gives any NaN of the target: its test is
# interpreter-only and names the NaN by a choice of the sign and the
# mantissa. Native code is not compared on a NaN result yet (#219).
tests = [
  { func = "@f16_f64", args = ["0.0"], expect = ["0.0"] },
  { func = "@f16_f64", args = ["6.0e-8"], expect = ["5.960464477539063e-8"] },
  { func = "@f16_f64", args = ["6.1e-5"], expect = ["6.097555160522461e-5"] },
  { func = "@f16_f64", args = ["6.104e-5"], expect = ["6.103515625e-5"] },
  { func = "@f16_f64", args = ["1.0"], expect = ["1.0"] },
  { func = "@f16_f64", args = ["65500.0"], expect = ["65504.0"] },
  { func = "@f16_f64", args = ["0x7c00"], expect = ["0x7ff0000000000000"] },
  { func = "@f16_f64", args = ["-0.0"], expect = ["-0.0"] },
  { func = "@f16_f64", args = ["-6.0e-8"], expect = ["-5.960464477539063e-8"] },
  { func = "@f16_f64", args = ["-6.1e-5"], expect = ["-6.097555160522461e-5"] },
  { func = "@f16_f64", args = ["-6.104e-5"], expect = ["-6.103515625e-5"] },
  { func = "@f16_f64", args = ["-1.0"], expect = ["-1.0"] },
  { func = "@f16_f64", args = ["-65500.0"], expect = ["-65504.0"] },
  { func = "@f16_f64", args = ["0xfc00"], expect = ["0xfff0000000000000"] },
  { func = "@f16_f64", args = ["0x7e00"], choices = ["0"], expect = ["0x7ff8000000000000"] },
  { func = "@f16_f64", args = ["0x7c01"], choices = ["-1"], expect = ["0xffffffffffffffff"] },
  { func = "@f16_f64", args = ["0xffff"], choices = ["1"], expect = ["0x7ff0000000000001"] },
  { func = "@f16_f64", args = ["poison"], expect = ["poison"] },
]
