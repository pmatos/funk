# Tests of div-calls-i128.fir: division at i128 among several results
# and across calls (#22). divmod returns the quotient and the remainder
# of sdiv and srem, two i128s, and udivmod the quotient's low 64 bits and
# the quotient and remainder of udiv and urem: four and five eightbytes,
# so natively both come back in a result area (ADR-2026-11-03-0109).
# recompose multiplies divmod's results back into the dividend. nested
# passes an sdiv's quotient to udivmod, and returns an srem of one of
# udivmod's results. exact_arg passes the quotient of an sdiv exact to
# divmod. The values take both signs, cross 2^64 and are near the signed
# minimum.
# Each test without expect is differential: fir-ref and native code run
# it, and the native results must refine fir-ref's. A zero divisor and
# the signed minimum by -1, in a callee too, are UB, so those tests are
# interpreter-only. nested also has interpreter-only twins that state
# fir-ref's results, and so does exact_arg on a pair that leaves a
# remainder, where it passes poison to divmod and gets poison back.
tests = [
  { func = "@divmod", args = ["-7", "-7"] },
  { func = "@udivmod", args = ["-7", "-7"] },
  { func = "@recompose", args = ["-7", "-7"] },
  { func = "@divmod", args = ["-7", "100"] },
  { func = "@udivmod", args = ["-7", "100"] },
  { func = "@recompose", args = ["-7", "100"] },
