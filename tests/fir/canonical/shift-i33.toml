# Tests of shift-i33.fir: shl, lshr and ashr at i33. Each shifts every
# boundary bit pattern (0, 1, -1, the signed minimum and the signed
# maximum) by the amounts 0, 1, N - 1, N and N + 1, and by -1, the
# signed minimum and the signed maximum (#15). An amount is read as
# unsigned: -1 and the signed minimum have their top bit set and read as
# 8589934591 and 4294967296. An amount of N or more gives poison.
# The backend does not lower i33, so each test is interpreter-only and
# states the result that fir-ref must give.
tests = [
  { func = "@shl", args = ["0", "0"], expect = ["0"] },
  { func = "@shl", args = ["0", "1"], expect = ["0"] },
  { func = "@shl", args = ["0", "32"], expect = ["0"] },
  { func = "@shl", args = ["0", "33"], expect = ["poison"] },
  { func = "@shl", args = ["0", "34"], expect = ["poison"] },
  { func = "@shl", args = ["0", "-1"], expect = ["poison"] },
  { func = "@shl", args = ["0", "-4294967296"], expect = ["poison"] },
  { func = "@shl", args = ["0", "4294967295"], expect = ["poison"] },
  { func = "@shl", args = ["1", "0"], expect = ["1"] },
  { func = "@shl", args = ["1", "1"], expect = ["2"] },
  { func = "@shl", args = ["1", "32"], expect = ["-4294967296"] },
  { func = "@shl", args = ["1", "33"], expect = ["poison"] },
  { func = "@shl", args = ["1", "34"], expect = ["poison"] },
  { func = "@shl", args = ["1", "-1"], expect = ["poison"] },
  { func = "@shl", args = ["1", "-4294967296"], expect = ["poison"] },
  { func = "@shl", args = ["1", "4294967295"], expect = ["poison"] },
  { func = "@shl", args = ["-1", "0"], expect = ["-1"] },
  { func = "@shl", args = ["-1", "1"], expect = ["-2"] },
  { func = "@shl", args = ["-1", "32"], expect = ["-4294967296"] },
  { func = "@shl", args = ["-1", "33"], expect = ["poison"] },
  { func = "@shl", args = ["-1", "34"], expect = ["poison"] },
  { func = "@shl", args = ["-1", "-1"], expect = ["poison"] },
  { func = "@shl", args = ["-1", "-4294967296"], expect = ["poison"] },
  { func = "@shl", args = ["-1", "4294967295"], expect = ["poison"] },
  { func = "@shl", args = ["-4294967296", "0"], expect = ["-4294967296"] },
  { func = "@shl", args = ["-4294967296", "1"], expect = ["0"] },
  { func = "@shl", args = ["-4294967296", "32"], expect = ["0"] },
  { func = "@shl", args = ["-4294967296", "33"], expect = ["poison"] },
  { func = "@shl", args = ["-4294967296", "34"], expect = ["poison"] },
  { func = "@shl", args = ["-4294967296", "-1"], expect = ["poison"] },
  { func = "@shl", args = ["-4294967296", "-4294967296"], expect = ["poison"] },
  { func = "@shl", args = ["-4294967296", "4294967295"], expect = ["poison"] },
  { func = "@shl", args = ["4294967295", "0"], expect = ["4294967295"] },
  { func = "@shl", args = ["4294967295", "1"], expect = ["-2"] },
  { func = "@shl", args = ["4294967295", "32"], expect = ["-4294967296"] },
  { func = "@shl", args = ["4294967295", "33"], expect = ["poison"] },
  { func = "@shl", args = ["4294967295", "34"], expect = ["poison"] },
  { func = "@shl", args = ["4294967295", "-1"], expect = ["poison"] },
  { func = "@shl", args = ["4294967295", "-4294967296"], expect = ["poison"] },
  { func = "@shl", args = ["4294967295", "4294967295"], expect = ["poison"] },
  { func = "@lshr", args = ["0", "0"], expect = ["0"] },
  { func = "@lshr", args = ["0", "1"], expect = ["0"] },
  { func = "@lshr", args = ["0", "32"], expect = ["0"] },
  { func = "@lshr", args = ["0", "33"], expect = ["poison"] },
  { func = "@lshr", args = ["0", "34"], expect = ["poison"] },
  { func = "@lshr", args = ["0", "-1"], expect = ["poison"] },
  { func = "@lshr", args = ["0", "-4294967296"], expect = ["poison"] },
  { func = "@lshr", args = ["0", "4294967295"], expect = ["poison"] },
  { func = "@lshr", args = ["1", "0"], expect = ["1"] },
  { func = "@lshr", args = ["1", "1"], expect = ["0"] },
  { func = "@lshr", args = ["1", "32"], expect = ["0"] },
  { func = "@lshr", args = ["1", "33"], expect = ["poison"] },
  { func = "@lshr", args = ["1", "34"], expect = ["poison"] },
  { func = "@lshr", args = ["1", "-1"], expect = ["poison"] },
  { func = "@lshr", args = ["1", "-4294967296"], expect = ["poison"] },
  { func = "@lshr", args = ["1", "4294967295"], expect = ["poison"] },
  { func = "@lshr", args = ["-1", "0"], expect = ["-1"] },
  { func = "@lshr", args = ["-1", "1"], expect = ["4294967295"] },
  { func = "@lshr", args = ["-1", "32"], expect = ["1"] },
  { func = "@lshr", args = ["-1", "33"], expect = ["poison"] },
  { func = "@lshr", args = ["-1", "34"], expect = ["poison"] },
  { func = "@lshr", args = ["-1", "-1"], expect = ["poison"] },
  { func = "@lshr", args = ["-1", "-4294967296"], expect = ["poison"] },
  { func = "@lshr", args = ["-1", "4294967295"], expect = ["poison"] },
  { func = "@lshr", args = ["-4294967296", "0"], expect = ["-4294967296"] },
  { func = "@lshr", args = ["-4294967296", "1"], expect = ["2147483648"] },
  { func = "@lshr", args = ["-4294967296", "32"], expect = ["1"] },
  { func = "@lshr", args = ["-4294967296", "33"], expect = ["poison"] },
  { func = "@lshr", args = ["-4294967296", "34"], expect = ["poison"] },
  { func = "@lshr", args = ["-4294967296", "-1"], expect = ["poison"] },
  { func = "@lshr", args = ["-4294967296", "-4294967296"], expect = ["poison"] },
  { func = "@lshr", args = ["-4294967296", "4294967295"], expect = ["poison"] },
  { func = "@lshr", args = ["4294967295", "0"], expect = ["4294967295"] },
  { func = "@lshr", args = ["4294967295", "1"], expect = ["2147483647"] },
  { func = "@lshr", args = ["4294967295", "32"], expect = ["0"] },
  { func = "@lshr", args = ["4294967295", "33"], expect = ["poison"] },
  { func = "@lshr", args = ["4294967295", "34"], expect = ["poison"] },
  { func = "@lshr", args = ["4294967295", "-1"], expect = ["poison"] },
  { func = "@lshr", args = ["4294967295", "-4294967296"], expect = ["poison"] },
  { func = "@lshr", args = ["4294967295", "4294967295"], expect = ["poison"] },
  { func = "@ashr", args = ["0", "0"], expect = ["0"] },
  { func = "@ashr", args = ["0", "1"], expect = ["0"] },
  { func = "@ashr", args = ["0", "32"], expect = ["0"] },
  { func = "@ashr", args = ["0", "33"], expect = ["poison"] },
  { func = "@ashr", args = ["0", "34"], expect = ["poison"] },
  { func = "@ashr", args = ["0", "-1"], expect = ["poison"] },
  { func = "@ashr", args = ["0", "-4294967296"], expect = ["poison"] },
  { func = "@ashr", args = ["0", "4294967295"], expect = ["poison"] },
  { func = "@ashr", args = ["1", "0"], expect = ["1"] },
  { func = "@ashr", args = ["1", "1"], expect = ["0"] },
  { func = "@ashr", args = ["1", "32"], expect = ["0"] },
  { func = "@ashr", args = ["1", "33"], expect = ["poison"] },
  { func = "@ashr", args = ["1", "34"], expect = ["poison"] },
  { func = "@ashr", args = ["1", "-1"], expect = ["poison"] },
  { func = "@ashr", args = ["1", "-4294967296"], expect = ["poison"] },
  { func = "@ashr", args = ["1", "4294967295"], expect = ["poison"] },
  { func = "@ashr", args = ["-1", "0"], expect = ["-1"] },
  { func = "@ashr", args = ["-1", "1"], expect = ["-1"] },
  { func = "@ashr", args = ["-1", "32"], expect = ["-1"] },
  { func = "@ashr", args = ["-1", "33"], expect = ["poison"] },
  { func = "@ashr", args = ["-1", "34"], expect = ["poison"] },
  { func = "@ashr", args = ["-1", "-1"], expect = ["poison"] },
  { func = "@ashr", args = ["-1", "-4294967296"], expect = ["poison"] },
  { func = "@ashr", args = ["-1", "4294967295"], expect = ["poison"] },
  { func = "@ashr", args = ["-4294967296", "0"], expect = ["-4294967296"] },
  { func = "@ashr", args = ["-4294967296", "1"], expect = ["-2147483648"] },
  { func = "@ashr", args = ["-4294967296", "32"], expect = ["-1"] },
  { func = "@ashr", args = ["-4294967296", "33"], expect = ["poison"] },
  { func = "@ashr", args = ["-4294967296", "34"], expect = ["poison"] },
  { func = "@ashr", args = ["-4294967296", "-1"], expect = ["poison"] },
  { func = "@ashr", args = ["-4294967296", "-4294967296"], expect = ["poison"] },
  { func = "@ashr", args = ["-4294967296", "4294967295"], expect = ["poison"] },
  { func = "@ashr", args = ["4294967295", "0"], expect = ["4294967295"] },
  { func = "@ashr", args = ["4294967295", "1"], expect = ["2147483647"] },
  { func = "@ashr", args = ["4294967295", "32"], expect = ["0"] },
  { func = "@ashr", args = ["4294967295", "33"], expect = ["poison"] },
  { func = "@ashr", args = ["4294967295", "34"], expect = ["poison"] },
  { func = "@ashr", args = ["4294967295", "-1"], expect = ["poison"] },
  { func = "@ashr", args = ["4294967295", "-4294967296"], expect = ["poison"] },
  { func = "@ashr", args = ["4294967295", "4294967295"], expect = ["poison"] },
