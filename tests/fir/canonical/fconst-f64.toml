# Tests of fconst-f64.fir: float constants at f64 give their bits, each
# NaN's payload and sign included (ADR-2026-11-11-1438): +0, -0, the
# smallest subnormal, -1, the largest finite value, -inf, the quiet NaN,
# a quiet NaN with its sign set and a payload, and a signalling NaN. A
# NaN constant compared with itself is unordered.
# Each test is differential, but the last, which is interpreter-only.
tests = [
  { func = "@consts" },
  { func = "@one" },
  { func = "@nan_is_unordered" },
  { func = "@consts", expect = ["0.0", "-0.0", "5.0e-324", "-1.0", "1.7976931348623157e308", "0xfff0000000000000", "0x7ff8000000000000", "0xfff8000000000001", "0x7ff0000000000001"] },
]
