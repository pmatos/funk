# Tests of trunc-poison.fir: a poison operand gives trunc a poison
# result (ADR-2026-10-30-0818), at every valid pair among i1, i7, i8,
# i16, i32, i33 and i64. %p = add nsw %a, 1 is poison when %a is the
# signed maximum, and the function returns trunc %p. On the row 0, %p is
# 1, and the result is trunc of it.
# Only fir-ref runs these tests, and each states the result that fir-ref
# must give.
tests = [
  { func = "@trunc_i7_to_i1", args = ["63"], expect = ["poison"] },
  { func = "@trunc_i7_to_i1", args = ["0"], expect = ["true"] },
  { func = "@trunc_i8_to_i1", args = ["127"], expect = ["poison"] },
  { func = "@trunc_i8_to_i1", args = ["0"], expect = ["true"] },
  { func = "@trunc_i8_to_i7", args = ["127"], expect = ["poison"] },
  { func = "@trunc_i8_to_i7", args = ["0"], expect = ["1"] },
  { func = "@trunc_i16_to_i1", args = ["32767"], expect = ["poison"] },
  { func = "@trunc_i16_to_i1", args = ["0"], expect = ["true"] },
  { func = "@trunc_i16_to_i7", args = ["32767"], expect = ["poison"] },
  { func = "@trunc_i16_to_i7", args = ["0"], expect = ["1"] },
  { func = "@trunc_i16_to_i8", args = ["32767"], expect = ["poison"] },
  { func = "@trunc_i16_to_i8", args = ["0"], expect = ["1"] },
  { func = "@trunc_i32_to_i1", args = ["2147483647"], expect = ["poison"] },
  { func = "@trunc_i32_to_i1", args = ["0"], expect = ["true"] },
  { func = "@trunc_i32_to_i7", args = ["2147483647"], expect = ["poison"] },
  { func = "@trunc_i32_to_i7", args = ["0"], expect = ["1"] },
  { func = "@trunc_i32_to_i8", args = ["2147483647"], expect = ["poison"] },
  { func = "@trunc_i32_to_i8", args = ["0"], expect = ["1"] },
  { func = "@trunc_i32_to_i16", args = ["2147483647"], expect = ["poison"] },
  { func = "@trunc_i32_to_i16", args = ["0"], expect = ["1"] },
  { func = "@trunc_i33_to_i1", args = ["4294967295"], expect = ["poison"] },
  { func = "@trunc_i33_to_i1", args = ["0"], expect = ["true"] },
  { func = "@trunc_i33_to_i7", args = ["4294967295"], expect = ["poison"] },
  { func = "@trunc_i33_to_i7", args = ["0"], expect = ["1"] },
  { func = "@trunc_i33_to_i8", args = ["4294967295"], expect = ["poison"] },
  { func = "@trunc_i33_to_i8", args = ["0"], expect = ["1"] },
  { func = "@trunc_i33_to_i16", args = ["4294967295"], expect = ["poison"] },
  { func = "@trunc_i33_to_i16", args = ["0"], expect = ["1"] },
  { func = "@trunc_i33_to_i32", args = ["4294967295"], expect = ["poison"] },
  { func = "@trunc_i33_to_i32", args = ["0"], expect = ["1"] },
  { func = "@trunc_i64_to_i1", args = ["9223372036854775807"], expect = ["poison"] },
  { func = "@trunc_i64_to_i1", args = ["0"], expect = ["true"] },
  { func = "@trunc_i64_to_i7", args = ["9223372036854775807"], expect = ["poison"] },
  { func = "@trunc_i64_to_i7", args = ["0"], expect = ["1"] },
  { func = "@trunc_i64_to_i8", args = ["9223372036854775807"], expect = ["poison"] },
  { func = "@trunc_i64_to_i8", args = ["0"], expect = ["1"] },
  { func = "@trunc_i64_to_i16", args = ["9223372036854775807"], expect = ["poison"] },
  { func = "@trunc_i64_to_i16", args = ["0"], expect = ["1"] },
  { func = "@trunc_i64_to_i32", args = ["9223372036854775807"], expect = ["poison"] },
  { func = "@trunc_i64_to_i32", args = ["0"], expect = ["1"] },
  { func = "@trunc_i64_to_i33", args = ["9223372036854775807"], expect = ["poison"] },
  { func = "@trunc_i64_to_i33", args = ["0"], expect = ["1"] },
]
