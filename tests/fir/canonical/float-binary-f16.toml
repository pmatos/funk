# Tests of float-binary-f16.fir: fadd, fsub, fmul, fdiv at f16
# (ADR-2026-11-09-1549), on the hard inputs: results halfway between
# two floats, subnormals, -0, overflow to infinity and NaN operands.
# Written by scripts/harness/float_arith_cases.py, which computes each
# expected result with scripts/harness/float_ref.py, apart from Lean.
# Each test is interpreter-only: the backend does not lower
# f16, so fir-ref alone runs it and must give what it expects.
# A NaN result is any NaN: its test is interpreter-only and names
# the NaN by a choice of the sign and the mantissa, as signed
# i11. Native code is not compared on a NaN result yet (#219).
tests = [
  { func = "@fadd", args = ["1.0", "1.0"], expect = ["2.0"] },
  { func = "@fadd", args = ["1.0", "0.0004883"], expect = ["1.0"] },
  { func = "@fadd", args = ["1.001", "0.0004883"], expect = ["1.002"] },
  { func = "@fadd", args = ["1.0", "0.0007324"], expect = ["1.001"] },
  { func = "@fadd", args = ["1.0", "0.0002441"], expect = ["1.0"] },
  { func = "@fadd", args = ["65500.0", "65500.0"], expect = ["0x7c00"] },
  { func = "@fadd", args = ["65500.0", "16.0"], expect = ["0x7c00"] },
  { func = "@fadd", args = ["65500.0", "8.0"], expect = ["65500.0"] },
  { func = "@fadd", args = ["65500.0", "6.0e-8"], expect = ["65500.0"] },
  { func = "@fadd", args = ["6.0e-8", "6.0e-8"], expect = ["1.0e-7"] },
  { func = "@fadd", args = ["6.1e-5", "6.0e-8"], expect = ["6.104e-5"] },
  { func = "@fadd", args = ["1.0", "-1.0"], expect = ["0.0"] },
  { func = "@fadd", args = ["-0.0", "-0.0"], expect = ["-0.0"] },
  { func = "@fadd", args = ["0.0", "-0.0"], expect = ["0.0"] },
  { func = "@fadd", args = ["-6.0e-8", "6.0e-8"], expect = ["0.0"] },
  { func = "@fadd", args = ["0x7c00", "0xfc00"], choices = ["0"], expect = ["0x7e00"] },
  { func = "@fadd", args = ["0xfc00", "65500.0"], expect = ["0xfc00"] },
  { func = "@fadd", args = ["0xffff", "1.0"], choices = ["-1"], expect = ["0xffff"] },
  { func = "@fadd", args = ["1.0", "0x7c01"], choices = ["1"], expect = ["0x7c01"] },
  { func = "@fsub", args = ["1.0", "1.0"], expect = ["0.0"] },
  { func = "@fsub", args = ["-0.0", "0.0"], expect = ["-0.0"] },
  { func = "@fsub", args = ["0.0", "-0.0"], expect = ["0.0"] },
  { func = "@fsub", args = ["0.0", "0.0"], expect = ["0.0"] },
  { func = "@fsub", args = ["6.104e-5", "6.0e-8"], expect = ["6.1e-5"] },
  { func = "@fsub", args = ["6.0e-8", "6.104e-5"], expect = ["-6.1e-5"] },
  { func = "@fsub", args = ["1.0", "0.0002441"], expect = ["1.0"] },
  { func = "@fsub", args = ["0.0002441", "1.0"], expect = ["-1.0"] },
  { func = "@fsub", args = ["-65500.0", "65500.0"], expect = ["0xfc00"] },
  { func = "@fsub", args = ["65500.0", "-65500.0"], expect = ["0x7c00"] },
  { func = "@fsub", args = ["0x7c00", "0x7c00"], choices = ["0"], expect = ["0x7e00"] },
  { func = "@fsub", args = ["0.0", "0x7c00"], expect = ["0xfc00"] },
  { func = "@fsub", args = ["0x7c00", "0.0"], expect = ["0x7c00"] },
  { func = "@fsub", args = ["1.0", "0xffff"], choices = ["-1"], expect = ["0xffff"] },
  { func = "@fsub", args = ["0xffff", "1.0"], choices = ["1"], expect = ["0x7c01"] },
  { func = "@fmul", args = ["1.5", "1.5"], expect = ["2.25"] },
  { func = "@fmul", args = ["1.001", "1.001"], expect = ["1.002"] },
  { func = "@fmul", args = ["6.104e-5", "0.5"], expect = ["3.05e-5"] },
  { func = "@fmul", args = ["6.0e-8", "0.5"], expect = ["0.0"] },
  { func = "@fmul", args = ["2.0e-7", "0.5"], expect = ["1.0e-7"] },
  { func = "@fmul", args = ["6.0e-8", "0.75"], expect = ["6.0e-8"] },
  { func = "@fmul", args = ["-6.0e-8", "0.25"], expect = ["-0.0"] },
  { func = "@fmul", args = ["65500.0", "2.0"], expect = ["0x7c00"] },
  { func = "@fmul", args = ["-65500.0", "65500.0"], expect = ["0xfc00"] },
  { func = "@fmul", args = ["6.0e-8", "6.0e-8"], expect = ["0.0"] },
  { func = "@fmul", args = ["-6.0e-8", "6.1e-5"], expect = ["-0.0"] },
  { func = "@fmul", args = ["-0.0", "1.0"], expect = ["-0.0"] },
  { func = "@fmul", args = ["0.0", "0x7c00"], choices = ["0"], expect = ["0x7e00"] },
  { func = "@fmul", args = ["-1.0", "0x7c00"], expect = ["0xfc00"] },
  { func = "@fmul", args = ["0xffff", "0.0"], choices = ["-1"], expect = ["0xffff"] },
  { func = "@fdiv", args = ["1.0", "3.0"], expect = ["0.3333"] },
  { func = "@fdiv", args = ["3.0", "1.0"], expect = ["3.0"] },
  { func = "@fdiv", args = ["1.0", "1.001"], expect = ["0.999"] },
  { func = "@fdiv", args = ["1.001", "1.0"], expect = ["1.001"] },
  { func = "@fdiv", args = ["1.0", "0.0"], expect = ["0x7c00"] },
  { func = "@fdiv", args = ["0.0", "1.0"], expect = ["0.0"] },
  { func = "@fdiv", args = ["-1.0", "0.0"], expect = ["0xfc00"] },
  { func = "@fdiv", args = ["0.0", "-1.0"], expect = ["-0.0"] },
  { func = "@fdiv", args = ["1.0", "-0.0"], expect = ["0xfc00"] },
  { func = "@fdiv", args = ["-0.0", "1.0"], expect = ["-0.0"] },
  { func = "@fdiv", args = ["0.0", "0.0"], choices = ["1"], expect = ["0x7c01"] },
  { func = "@fdiv", args = ["0x7c00", "0x7c00"], choices = ["0"], expect = ["0x7e00"] },
  { func = "@fdiv", args = ["1.0", "0x7c00"], expect = ["0.0"] },
  { func = "@fdiv", args = ["0x7c00", "1.0"], expect = ["0x7c00"] },
  { func = "@fdiv", args = ["-1.0", "0x7c00"], expect = ["-0.0"] },
  { func = "@fdiv", args = ["0x7c00", "-1.0"], expect = ["0xfc00"] },
  { func = "@fdiv", args = ["6.104e-5", "1024.0"], expect = ["6.0e-8"] },
  { func = "@fdiv", args = ["1024.0", "6.104e-5"], expect = ["0x7c00"] },
  { func = "@fdiv", args = ["6.0e-8", "2.0"], expect = ["0.0"] },
  { func = "@fdiv", args = ["2.0", "6.0e-8"], expect = ["0x7c00"] },
  { func = "@fdiv", args = ["2.0e-7", "2.0"], expect = ["1.0e-7"] },
  { func = "@fdiv", args = ["2.0", "2.0e-7"], expect = ["0x7c00"] },
  { func = "@fdiv", args = ["65500.0", "0.5"], expect = ["0x7c00"] },
  { func = "@fdiv", args = ["0.5", "65500.0"], expect = ["7.6e-6"] },
  { func = "@fdiv", args = ["6.0e-8", "65500.0"], expect = ["0.0"] },
  { func = "@fdiv", args = ["65500.0", "6.0e-8"], expect = ["0x7c00"] },
  { func = "@fdiv", args = ["65500.0", "6.0e-8"], expect = ["0x7c00"] },
  { func = "@fdiv", args = ["6.0e-8", "65500.0"], expect = ["0.0"] },
  { func = "@fdiv", args = ["-0.0", "1.0"], expect = ["-0.0"] },
  { func = "@fdiv", args = ["1.0", "-0.0"], expect = ["0xfc00"] },
  { func = "@fdiv", args = ["1.0", "0xffff"], choices = ["-1"], expect = ["0xffff"] },
  { func = "@fdiv", args = ["0xffff", "1.0"], choices = ["1"], expect = ["0x7c01"] },
  { func = "@fadd", args = ["poison", "0.0"], expect = ["poison"] },
  { func = "@fsub", args = ["poison", "0.0"], expect = ["poison"] },
  { func = "@fmul", args = ["poison", "0.0"], expect = ["poison"] },
  { func = "@fdiv", args = ["poison", "0.0"], expect = ["poison"] },
]
