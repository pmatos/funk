  { func = "@sdiv", args = ["-1", "-9223372036854775808"] },
  { func = "@sdiv", args = ["-1", "9223372036854775807"] },
  { func = "@sdiv", args = ["-9223372036854775808", "0"], expect = "ub" },
  { func = "@sdiv", args = ["-9223372036854775808", "1"] },
