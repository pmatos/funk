  { func = "@f32_bf16", args = ["-2.29589e-40"], expect = ["-2.0e-40"] },
  { func = "@f32_bf16", args = ["-2.2959e-40"], expect = ["-3.0e-40"] },
  { func = "@f32_bf16", args = ["-1.1754942e-38"], expect = ["-1.18e-38"] },
  { func = "@f32_bf16", args = ["-1.1754944e-38"], expect = ["-1.18e-38"] },
  { func = "@f32_bf16", args = ["-1.0"], expect = ["-1.0"] },
  { func = "@f32_bf16", args = ["-1.0039061"], expect = ["-1.0"] },
  { func = "@f32_bf16", args = ["-1.0039062"], expect = ["-1.0"] },
  { func = "@f32_bf16", args = ["-1.0039064"], expect = ["-1.01"] },
  { func = "@f32_bf16", args = ["-1.0117186"], expect = ["-1.01"] },
  { func = "@f32_bf16", args = ["-1.0117188"], expect = ["-1.016"] },
