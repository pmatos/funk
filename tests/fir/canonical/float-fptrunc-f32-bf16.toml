  { func = "@f32_bf16", args = ["-3.3961777e38"], expect = ["0xff80"] },
  { func = "@f32_bf16", args = ["-3.4028235e38"], expect = ["0xff80"] },
  { func = "@f32_bf16", args = ["0xff800000"], expect = ["0xff80"] },
  { func = "@f32_bf16", args = ["0x7fc00000"], choices = ["0"], expect = ["0x7fc0"] },
  { func = "@f32_bf16", args = ["0x7f800001"], choices = ["-1"], expect = ["0xffff"] },
  { func = "@f32_bf16", args = ["0xffffffff"], choices = ["1"], expect = ["0x7f81"] },
  { func = "@f32_bf16", args = ["poison"], expect = ["poison"] },
]
