# Tests of freeze-i32.fir: freeze at i32. freeze of a value gives it,
# with no choice; freeze of poison chooses a value, the same for every
# use (#14). %p = add nsw %a, 1 is poison when %a is the signed
# maximum, true at i1, and %f freezes it.
# Each test without expect is differential. fir-ref's exhaustive mode
# lists every outcome, and native code must return one of them. Past
# the choice budget of 16 bits, a test declares its results, each
# with a witness, and seeded runs check that the run gives no other.
tests = [
  { func = "@freeze", args = ["0"] },
  { func = "@freeze", args = ["1"] },
  { func = "@freeze", args = ["-1"] },
  { func = "@freeze", args = ["-2147483648"] },
  { func = "@freeze", args = ["2147483647"] },
  { func = "@freeze_poison", args = ["0"] },
  { func = "@freeze_sub", args = ["0"] },
  { func = "@freeze_add", args = ["0"] },
  { func = "@freeze_mul_zero", args = ["0"] },
  { func = "@freeze_square", args = ["0"] },
  { func = "@freeze_sub", args = ["2147483647"], results = [{ values = ["0"], witness = ["5"] }] },
  { func = "@freeze_mul_zero", args = ["2147483647"], results = [{ values = ["0"], witness = ["-1"] }] },
  { func = "@freeze_double", args = ["2147483647"], results = [{ values = ["0"], witness = ["-2147483648"] }] },
  # Interpreter-only tests: fir-ref alone runs each, and must give the
  # result it states (the coverage matrix, ADR-2026-11-03-0557).
  { func = "@freeze", args = ["0"], expect = ["0"] },
  { func = "@freeze", args = ["1"], expect = ["1"] },
  { func = "@freeze", args = ["-1"], expect = ["-1"] },
  { func = "@freeze", args = ["-2147483648"], expect = ["-2147483648"] },
  { func = "@freeze", args = ["2147483647"], expect = ["2147483647"] },
  { func = "@freeze_poison", args = ["2147483647"], choices = ["0"], expect = ["0"] },
  { func = "@freeze_sub", args = ["2147483647"], choices = ["0"], expect = ["0"] },
  { func = "@freeze_add", args = ["2147483647"], choices = ["0"], expect = ["0"] },
  { func = "@freeze_mul_zero", args = ["2147483647"], choices = ["0"], expect = ["0"] },
  { func = "@freeze_square", args = ["2147483647"], choices = ["0"], expect = ["0"] },
  { func = "@freeze_double", args = ["2147483647"], choices = ["0"], expect = ["0"] },
  { func = "@freeze_poison", args = ["2147483647"], choices = ["1"], expect = ["1"] },
  { func = "@freeze_sub", args = ["2147483647"], choices = ["1"], expect = ["0"] },
  { func = "@freeze_add", args = ["2147483647"], choices = ["1"], expect = ["2"] },
  { func = "@freeze_mul_zero", args = ["2147483647"], choices = ["1"], expect = ["0"] },
  { func = "@freeze_square", args = ["2147483647"], choices = ["1"], expect = ["1"] },
  { func = "@freeze_double", args = ["2147483647"], choices = ["1"], expect = ["0"] },
  { func = "@freeze_poison", args = ["2147483647"], choices = ["-1"], expect = ["-1"] },
  { func = "@freeze_sub", args = ["2147483647"], choices = ["-1"], expect = ["0"] },
  { func = "@freeze_add", args = ["2147483647"], choices = ["-1"], expect = ["-2"] },
  { func = "@freeze_mul_zero", args = ["2147483647"], choices = ["-1"], expect = ["0"] },
  { func = "@freeze_square", args = ["2147483647"], choices = ["-1"], expect = ["1"] },
  { func = "@freeze_double", args = ["2147483647"], choices = ["-1"], expect = ["0"] },
  { func = "@freeze_poison", args = ["2147483647"], choices = ["-2147483648"], expect = ["-2147483648"] },
  { func = "@freeze_sub", args = ["2147483647"], choices = ["-2147483648"], expect = ["0"] },
  { func = "@freeze_add", args = ["2147483647"], choices = ["-2147483648"], expect = ["0"] },
  { func = "@freeze_mul_zero", args = ["2147483647"], choices = ["-2147483648"], expect = ["0"] },
  { func = "@freeze_square", args = ["2147483647"], choices = ["-2147483648"], expect = ["poison"] },
  { func = "@freeze_double", args = ["2147483647"], choices = ["-2147483648"], expect = ["0"] },
  { func = "@freeze_poison", args = ["2147483647"], choices = ["2147483647"], expect = ["2147483647"] },
  { func = "@freeze_sub", args = ["2147483647"], choices = ["2147483647"], expect = ["0"] },
  { func = "@freeze_add", args = ["2147483647"], choices = ["2147483647"], expect = ["-2"] },
  { func = "@freeze_mul_zero", args = ["2147483647"], choices = ["2147483647"], expect = ["0"] },
  { func = "@freeze_square", args = ["2147483647"], choices = ["2147483647"], expect = ["poison"] },
  { func = "@freeze_double", args = ["2147483647"], choices = ["2147483647"], expect = ["0"] },
  { func = "@freeze_poison", args = ["2147483647"], choices = ["42"], expect = ["42"] },
  { func = "@freeze_sub", args = ["2147483647"], choices = ["42"], expect = ["0"] },
  { func = "@freeze_add", args = ["2147483647"], choices = ["42"], expect = ["84"] },
  { func = "@freeze_mul_zero", args = ["2147483647"], choices = ["42"], expect = ["0"] },
  { func = "@freeze_square", args = ["2147483647"], choices = ["42"], expect = ["1764"] },
  { func = "@freeze_double", args = ["2147483647"], choices = ["42"], expect = ["0"] },
  { func = "@freeze_twice", args = ["2147483647"], choices = ["0", "0"], expect = ["0"] },
  { func = "@freeze_twice", args = ["2147483647"], choices = ["1", "-1"], expect = ["2"] },
  { func = "@freeze_twice", args = ["2147483647"], choices = ["-2147483648", "2147483647"], expect = ["1"] },
  { func = "@freeze_twice", args = ["2147483647"], choices = ["2147483647", "-2147483648"], expect = ["-1"] },
  { func = "@freeze_poison", args = ["0"], expect = ["1"] },
]
