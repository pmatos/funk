# Each op of gpu in each dimension, on a work-item whose ids and sizes differ
# in every dimension, so that a read of another dimension fails the test
# (#406).
tests = [
  { func = "@dev::@item", expect = ["1", "2", "3"], work_item = { id = [1, 2, 3], group_id = [4, 5, 6], group_size = [7, 8, 9], num_groups = [10, 11, 12] } },
  { func = "@dev::@group", expect = ["4", "5", "6"], work_item = { id = [1, 2, 3], group_id = [4, 5, 6], group_size = [7, 8, 9], num_groups = [10, 11, 12] } },
  { func = "@dev::@size", expect = ["7", "8", "9"], work_item = { id = [1, 2, 3], group_id = [4, 5, 6], group_size = [7, 8, 9], num_groups = [10, 11, 12] } },
  { func = "@dev::@groups", expect = ["10", "11", "12"], work_item = { id = [1, 2, 3], group_id = [4, 5, 6], group_size = [7, 8, 9], num_groups = [10, 11, 12] } },
  { func = "@dev::@groups", expect = ["1", "1", "1"] },
]
