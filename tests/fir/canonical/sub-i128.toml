# Tests of sub-i128.fir: sub at i128, with each set of its flags, on
# every pair of boundary bit patterns: 0, 1, -1, the signed minimum and
# the signed maximum; and on pairs of values that cross the 64-bit
# boundary: borrows out of the low half, such as
# 2^64 - 1 and 0 - (2^64 - 1), and differences that wrap (#21). A broken flag gives poison (#14).
# Each test without expect is differential: fir-ref and native code run
# it, and the native result must refine fir-ref's; where fir-ref returns
# poison, any value of the type does.
