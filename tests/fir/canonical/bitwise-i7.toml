# Tests of bitwise-i7.fir: and, or and xor at i7 on every pair of
# boundary bit patterns: 0, 1, -1, the signed minimum and the signed
# maximum, or false and true at i1 (#15).
# The backend does not lower i7, so each test is interpreter-only and
# states the result that fir-ref must give.
tests = [
  { func = "@and", args = ["0", "0"], expect = ["0"] },
  { func = "@and", args = ["0", "1"], expect = ["0"] },
  { func = "@and", args = ["0", "-1"], expect = ["0"] },
  { func = "@and", args = ["0", "-64"], expect = ["0"] },
  { func = "@and", args = ["0", "63"], expect = ["0"] },
  { func = "@and", args = ["1", "0"], expect = ["0"] },
  { func = "@and", args = ["1", "1"], expect = ["1"] },
  { func = "@and", args = ["1", "-1"], expect = ["1"] },
  { func = "@and", args = ["1", "-64"], expect = ["0"] },
  { func = "@and", args = ["1", "63"], expect = ["1"] },
  { func = "@and", args = ["-1", "0"], expect = ["0"] },
  { func = "@and", args = ["-1", "1"], expect = ["1"] },
  { func = "@and", args = ["-1", "-1"], expect = ["-1"] },
  { func = "@and", args = ["-1", "-64"], expect = ["-64"] },
  { func = "@and", args = ["-1", "63"], expect = ["63"] },
  { func = "@and", args = ["-64", "0"], expect = ["0"] },
  { func = "@and", args = ["-64", "1"], expect = ["0"] },
  { func = "@and", args = ["-64", "-1"], expect = ["-64"] },
  { func = "@and", args = ["-64", "-64"], expect = ["-64"] },
  { func = "@and", args = ["-64", "63"], expect = ["0"] },
  { func = "@and", args = ["63", "0"], expect = ["0"] },
  { func = "@and", args = ["63", "1"], expect = ["1"] },
  { func = "@and", args = ["63", "-1"], expect = ["63"] },
  { func = "@and", args = ["63", "-64"], expect = ["0"] },
  { func = "@and", args = ["63", "63"], expect = ["63"] },
  { func = "@or", args = ["0", "0"], expect = ["0"] },
  { func = "@or", args = ["0", "1"], expect = ["1"] },
  { func = "@or", args = ["0", "-1"], expect = ["-1"] },
  { func = "@or", args = ["0", "-64"], expect = ["-64"] },
  { func = "@or", args = ["0", "63"], expect = ["63"] },
  { func = "@or", args = ["1", "0"], expect = ["1"] },
  { func = "@or", args = ["1", "1"], expect = ["1"] },
  { func = "@or", args = ["1", "-1"], expect = ["-1"] },
  { func = "@or", args = ["1", "-64"], expect = ["-63"] },
  { func = "@or", args = ["1", "63"], expect = ["63"] },
  { func = "@or", args = ["-1", "0"], expect = ["-1"] },
  { func = "@or", args = ["-1", "1"], expect = ["-1"] },
  { func = "@or", args = ["-1", "-1"], expect = ["-1"] },
  { func = "@or", args = ["-1", "-64"], expect = ["-1"] },
  { func = "@or", args = ["-1", "63"], expect = ["-1"] },
  { func = "@or", args = ["-64", "0"], expect = ["-64"] },
  { func = "@or", args = ["-64", "1"], expect = ["-63"] },
  { func = "@or", args = ["-64", "-1"], expect = ["-1"] },
  { func = "@or", args = ["-64", "-64"], expect = ["-64"] },
  { func = "@or", args = ["-64", "63"], expect = ["-1"] },
  { func = "@or", args = ["63", "0"], expect = ["63"] },
  { func = "@or", args = ["63", "1"], expect = ["63"] },
  { func = "@or", args = ["63", "-1"], expect = ["-1"] },
  { func = "@or", args = ["63", "-64"], expect = ["-1"] },
  { func = "@or", args = ["63", "63"], expect = ["63"] },
  { func = "@xor", args = ["0", "0"], expect = ["0"] },
  { func = "@xor", args = ["0", "1"], expect = ["1"] },
  { func = "@xor", args = ["0", "-1"], expect = ["-1"] },
  { func = "@xor", args = ["0", "-64"], expect = ["-64"] },
  { func = "@xor", args = ["0", "63"], expect = ["63"] },
  { func = "@xor", args = ["1", "0"], expect = ["1"] },
  { func = "@xor", args = ["1", "1"], expect = ["0"] },
  { func = "@xor", args = ["1", "-1"], expect = ["-2"] },
  { func = "@xor", args = ["1", "-64"], expect = ["-63"] },
  { func = "@xor", args = ["1", "63"], expect = ["62"] },
  { func = "@xor", args = ["-1", "0"], expect = ["-1"] },
  { func = "@xor", args = ["-1", "1"], expect = ["-2"] },
  { func = "@xor", args = ["-1", "-1"], expect = ["0"] },
  { func = "@xor", args = ["-1", "-64"], expect = ["63"] },
  { func = "@xor", args = ["-1", "63"], expect = ["-64"] },
  { func = "@xor", args = ["-64", "0"], expect = ["-64"] },
  { func = "@xor", args = ["-64", "1"], expect = ["-63"] },
  { func = "@xor", args = ["-64", "-1"], expect = ["63"] },
  { func = "@xor", args = ["-64", "-64"], expect = ["0"] },
  { func = "@xor", args = ["-64", "63"], expect = ["-1"] },
  { func = "@xor", args = ["63", "0"], expect = ["63"] },
  { func = "@xor", args = ["63", "1"], expect = ["62"] },
  { func = "@xor", args = ["63", "-1"], expect = ["-64"] },
  { func = "@xor", args = ["63", "-64"], expect = ["-1"] },
  { func = "@xor", args = ["63", "63"], expect = ["0"] },
]
