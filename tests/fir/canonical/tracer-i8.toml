  { func = "@sum8", args = ["0", "0", "0", "0", "0", "0", "127", "1"] },
  { func = "@sum8", args = ["-128", "127", "-1", "1", "0", "1", "-128", "127"] },
  { func = "@last", args = ["1", "2", "3", "4", "5", "6", "7", "-128"] },
  { func = "@none", args = ["127"] },
