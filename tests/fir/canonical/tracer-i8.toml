  { func = "@double", args = ["0"] },
  { func = "@double", args = ["1"] },
  { func = "@double", args = ["-1"] },
  { func = "@double", args = ["-128"] },
  { func = "@double", args = ["127"] },
  { func = "@inc", args = ["0"] },
  { func = "@inc", args = ["1"] },
  { func = "@inc", args = ["-1"] },
  { func = "@inc", args = ["-128"] },
  { func = "@inc", args = ["127"] },
  { func = "@const_zero" },
