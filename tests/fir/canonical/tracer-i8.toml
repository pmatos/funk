  { func = "@id", args = ["0"] },
  { func = "@id", args = ["1"] },
  { func = "@id", args = ["-1"] },
  { func = "@id", args = ["-128"] },
  { func = "@id", args = ["127"] },
  { func = "@add", args = ["0", "0"] },
  { func = "@add", args = ["0", "1"] },
  { func = "@add", args = ["0", "-1"] },
  { func = "@add", args = ["0", "-128"] },
  { func = "@add", args = ["0", "127"] },
  { func = "@add", args = ["1", "0"] },
  { func = "@add", args = ["1", "1"] },
  { func = "@add", args = ["1", "-1"] },
  { func = "@add", args = ["1", "-128"] },
  { func = "@add", args = ["1", "127"] },
  { func = "@add", args = ["-1", "0"] },
  { func = "@add", args = ["-1", "1"] },
  { func = "@add", args = ["-1", "-1"] },
  { func = "@add", args = ["-1", "-128"] },
  { func = "@add", args = ["-1", "127"] },
  { func = "@add", args = ["-128", "0"] },
  { func = "@add", args = ["-128", "1"] },
  { func = "@add", args = ["-128", "-1"] },
  { func = "@add", args = ["-128", "-128"] },
  { func = "@add", args = ["-128", "127"] },
  { func = "@add", args = ["127", "0"] },
  { func = "@add", args = ["127", "1"] },
  { func = "@add", args = ["127", "-1"] },
  { func = "@add", args = ["127", "-128"] },
