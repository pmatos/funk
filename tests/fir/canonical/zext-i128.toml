# Tests of zext-i128.fir: zext from each of i1, i8, i16, i32 and i64 to
# i128 (#21), on the boundary bit patterns of the operand's type: 0, 1,
# -1, the signed minimum and the signed maximum, or false and true at
# i1. zext puts zeros above the operand's bits, so an operand with its top bit
# set gives a nonnegative result.
# Each test without expect is differential: fir-ref and native code
# run it, and the native result must refine fir-ref's.
tests = [
  { func = "@zext_i1_to_i128", args = ["false"] },
  { func = "@zext_i1_to_i128", args = ["true"] },
  { func = "@zext_i8_to_i128", args = ["0"] },
  { func = "@zext_i8_to_i128", args = ["1"] },
  { func = "@zext_i8_to_i128", args = ["-1"] },
  { func = "@zext_i8_to_i128", args = ["-128"] },
  { func = "@zext_i8_to_i128", args = ["127"] },
  { func = "@zext_i16_to_i128", args = ["0"] },
  { func = "@zext_i16_to_i128", args = ["1"] },
  { func = "@zext_i16_to_i128", args = ["-1"] },
  { func = "@zext_i16_to_i128", args = ["-32768"] },
  { func = "@zext_i16_to_i128", args = ["32767"] },
  { func = "@zext_i32_to_i128", args = ["0"] },
  { func = "@zext_i32_to_i128", args = ["1"] },
  { func = "@zext_i32_to_i128", args = ["-1"] },
  { func = "@zext_i32_to_i128", args = ["-2147483648"] },
  { func = "@zext_i32_to_i128", args = ["2147483647"] },
  { func = "@zext_i64_to_i128", args = ["0"] },
  { func = "@zext_i64_to_i128", args = ["1"] },
  { func = "@zext_i64_to_i128", args = ["-1"] },
  { func = "@zext_i64_to_i128", args = ["-9223372036854775808"] },
  { func = "@zext_i64_to_i128", args = ["9223372036854775807"] },
  # Interpreter-only tests: fir-ref alone runs each, and must give the
  # result it states (the coverage matrix, ADR-2026-11-03-0557).
  { func = "@zext_i1_to_i128", args = ["false"], expect = ["0"] },
  { func = "@zext_i1_to_i128", args = ["true"], expect = ["1"] },
  { func = "@zext_i8_to_i128", args = ["0"], expect = ["0"] },
  { func = "@zext_i8_to_i128", args = ["1"], expect = ["1"] },
  { func = "@zext_i8_to_i128", args = ["-1"], expect = ["255"] },
  { func = "@zext_i8_to_i128", args = ["-128"], expect = ["128"] },
  { func = "@zext_i8_to_i128", args = ["127"], expect = ["127"] },
  { func = "@zext_i16_to_i128", args = ["0"], expect = ["0"] },
  { func = "@zext_i16_to_i128", args = ["1"], expect = ["1"] },
  { func = "@zext_i16_to_i128", args = ["-1"], expect = ["65535"] },
  { func = "@zext_i16_to_i128", args = ["-32768"], expect = ["32768"] },
  { func = "@zext_i16_to_i128", args = ["32767"], expect = ["32767"] },
  { func = "@zext_i32_to_i128", args = ["0"], expect = ["0"] },
  { func = "@zext_i32_to_i128", args = ["1"], expect = ["1"] },
  { func = "@zext_i32_to_i128", args = ["-1"], expect = ["4294967295"] },
  { func = "@zext_i32_to_i128", args = ["-2147483648"], expect = ["2147483648"] },
  { func = "@zext_i32_to_i128", args = ["2147483647"], expect = ["2147483647"] },
  { func = "@zext_i64_to_i128", args = ["0"], expect = ["0"] },
  { func = "@zext_i64_to_i128", args = ["1"], expect = ["1"] },
  { func = "@zext_i64_to_i128", args = ["-1"], expect = ["18446744073709551615"] },
  { func = "@zext_i64_to_i128", args = ["-9223372036854775808"], expect = ["9223372036854775808"] },
  { func = "@zext_i64_to_i128", args = ["9223372036854775807"], expect = ["9223372036854775807"] },
]
