# Tests of permute-i1.fir: block arguments that swap and rotate each
# other at i1 (#19). A branch binds all of a block's arguments at once,
# to values each read before any is bound. ^body passes ^loop's
# arguments back to it %n times: swapped, %y and %x, in swap_first and
# swap_second, and rotated, %y, %z and %x, in rotate_first,
# rotate_second and rotate_third. Each returns one of them, as the
# backend returns at most one value, so together they show the whole
# order. The values are true, false and false, and %n is 0, 1, 2, 3 and
# 7 for a swap, and 0 to 4 for a rotation.
# Each test without expect is differential: fir-ref and native code run
# it, and the native result must refine fir-ref's.
tests = [
  { func = "@swap_first", args = ["true", "false", "0"] },
  { func = "@swap_second", args = ["true", "false", "0"] },
  { func = "@swap_first", args = ["true", "false", "1"] },
  { func = "@swap_second", args = ["true", "false", "1"] },
  { func = "@swap_first", args = ["true", "false", "2"] },
  { func = "@swap_second", args = ["true", "false", "2"] },
  { func = "@swap_first", args = ["true", "false", "3"] },
  { func = "@swap_second", args = ["true", "false", "3"] },
  { func = "@swap_first", args = ["true", "false", "7"] },
  { func = "@swap_second", args = ["true", "false", "7"] },
  { func = "@rotate_first", args = ["true", "false", "false", "0"] },
  { func = "@rotate_second", args = ["true", "false", "false", "0"] },
  { func = "@rotate_third", args = ["true", "false", "false", "0"] },
  { func = "@rotate_first", args = ["true", "false", "false", "1"] },
  { func = "@rotate_second", args = ["true", "false", "false", "1"] },
  { func = "@rotate_third", args = ["true", "false", "false", "1"] },
  { func = "@rotate_first", args = ["true", "false", "false", "2"] },
  { func = "@rotate_second", args = ["true", "false", "false", "2"] },
  { func = "@rotate_third", args = ["true", "false", "false", "2"] },
  { func = "@rotate_first", args = ["true", "false", "false", "3"] },
  { func = "@rotate_second", args = ["true", "false", "false", "3"] },
  { func = "@rotate_third", args = ["true", "false", "false", "3"] },
  { func = "@rotate_first", args = ["true", "false", "false", "4"] },
  { func = "@rotate_second", args = ["true", "false", "false", "4"] },
  { func = "@rotate_third", args = ["true", "false", "false", "4"] },
]
