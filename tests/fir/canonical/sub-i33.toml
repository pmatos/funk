# Tests of sub-i33.fir: sub at i33, with each set of its
# flags, on every pair of boundary bit patterns: 0, 1, -1, the signed
# minimum and the signed maximum, or false and true at i1. A broken
# flag gives poison (#14).
# The backend does not lower i33, so each test is interpreter-only and
# states the result that fir-ref must give.
tests = [
  { func = "@sub", args = ["0", "0"], expect = ["0"] },
  { func = "@sub", args = ["0", "1"], expect = ["-1"] },
  { func = "@sub", args = ["0", "-1"], expect = ["1"] },
  { func = "@sub", args = ["0", "-4294967296"], expect = ["-4294967296"] },
  { func = "@sub", args = ["0", "4294967295"], expect = ["-4294967295"] },
  { func = "@sub", args = ["1", "0"], expect = ["1"] },
  { func = "@sub", args = ["1", "1"], expect = ["0"] },
  { func = "@sub", args = ["1", "-1"], expect = ["2"] },
  { func = "@sub", args = ["1", "-4294967296"], expect = ["-4294967295"] },
  { func = "@sub", args = ["1", "4294967295"], expect = ["-4294967294"] },
  { func = "@sub", args = ["-1", "0"], expect = ["-1"] },
  { func = "@sub", args = ["-1", "1"], expect = ["-2"] },
  { func = "@sub", args = ["-1", "-1"], expect = ["0"] },
  { func = "@sub", args = ["-1", "-4294967296"], expect = ["4294967295"] },
  { func = "@sub", args = ["-1", "4294967295"], expect = ["-4294967296"] },
  { func = "@sub", args = ["-4294967296", "0"], expect = ["-4294967296"] },
  { func = "@sub", args = ["-4294967296", "1"], expect = ["4294967295"] },
  { func = "@sub", args = ["-4294967296", "-1"], expect = ["-4294967295"] },
  { func = "@sub", args = ["-4294967296", "-4294967296"], expect = ["0"] },
  { func = "@sub", args = ["-4294967296", "4294967295"], expect = ["1"] },
  { func = "@sub", args = ["4294967295", "0"], expect = ["4294967295"] },
  { func = "@sub", args = ["4294967295", "1"], expect = ["4294967294"] },
  { func = "@sub", args = ["4294967295", "-1"], expect = ["-4294967296"] },
  { func = "@sub", args = ["4294967295", "-4294967296"], expect = ["-1"] },
  { func = "@sub", args = ["4294967295", "4294967295"], expect = ["0"] },
  { func = "@sub_nuw", args = ["0", "0"], expect = ["0"] },
  { func = "@sub_nuw", args = ["0", "1"], expect = ["poison"] },
  { func = "@sub_nuw", args = ["0", "-1"], expect = ["poison"] },
  { func = "@sub_nuw", args = ["0", "-4294967296"], expect = ["poison"] },
  { func = "@sub_nuw", args = ["0", "4294967295"], expect = ["poison"] },
  { func = "@sub_nuw", args = ["1", "0"], expect = ["1"] },
  { func = "@sub_nuw", args = ["1", "1"], expect = ["0"] },
  { func = "@sub_nuw", args = ["1", "-1"], expect = ["poison"] },
  { func = "@sub_nuw", args = ["1", "-4294967296"], expect = ["poison"] },
  { func = "@sub_nuw", args = ["1", "4294967295"], expect = ["poison"] },
  { func = "@sub_nuw", args = ["-1", "0"], expect = ["-1"] },
  { func = "@sub_nuw", args = ["-1", "1"], expect = ["-2"] },
  { func = "@sub_nuw", args = ["-1", "-1"], expect = ["0"] },
  { func = "@sub_nuw", args = ["-1", "-4294967296"], expect = ["4294967295"] },
  { func = "@sub_nuw", args = ["-1", "4294967295"], expect = ["-4294967296"] },
  { func = "@sub_nuw", args = ["-4294967296", "0"], expect = ["-4294967296"] },
  { func = "@sub_nuw", args = ["-4294967296", "1"], expect = ["4294967295"] },
  { func = "@sub_nuw", args = ["-4294967296", "-1"], expect = ["poison"] },
  { func = "@sub_nuw", args = ["-4294967296", "-4294967296"], expect = ["0"] },
  { func = "@sub_nuw", args = ["-4294967296", "4294967295"], expect = ["1"] },
  { func = "@sub_nuw", args = ["4294967295", "0"], expect = ["4294967295"] },
  { func = "@sub_nuw", args = ["4294967295", "1"], expect = ["4294967294"] },
  { func = "@sub_nuw", args = ["4294967295", "-1"], expect = ["poison"] },
  { func = "@sub_nuw", args = ["4294967295", "-4294967296"], expect = ["poison"] },
  { func = "@sub_nuw", args = ["4294967295", "4294967295"], expect = ["0"] },
  { func = "@sub_nsw", args = ["0", "0"], expect = ["0"] },
  { func = "@sub_nsw", args = ["0", "1"], expect = ["-1"] },
  { func = "@sub_nsw", args = ["0", "-1"], expect = ["1"] },
  { func = "@sub_nsw", args = ["0", "-4294967296"], expect = ["poison"] },
  { func = "@sub_nsw", args = ["0", "4294967295"], expect = ["-4294967295"] },
  { func = "@sub_nsw", args = ["1", "0"], expect = ["1"] },
  { func = "@sub_nsw", args = ["1", "1"], expect = ["0"] },
  { func = "@sub_nsw", args = ["1", "-1"], expect = ["2"] },
  { func = "@sub_nsw", args = ["1", "-4294967296"], expect = ["poison"] },
  { func = "@sub_nsw", args = ["1", "4294967295"], expect = ["-4294967294"] },
  { func = "@sub_nsw", args = ["-1", "0"], expect = ["-1"] },
  { func = "@sub_nsw", args = ["-1", "1"], expect = ["-2"] },
  { func = "@sub_nsw", args = ["-1", "-1"], expect = ["0"] },
  { func = "@sub_nsw", args = ["-1", "-4294967296"], expect = ["4294967295"] },
  { func = "@sub_nsw", args = ["-1", "4294967295"], expect = ["-4294967296"] },
  { func = "@sub_nsw", args = ["-4294967296", "0"], expect = ["-4294967296"] },
  { func = "@sub_nsw", args = ["-4294967296", "1"], expect = ["poison"] },
  { func = "@sub_nsw", args = ["-4294967296", "-1"], expect = ["-4294967295"] },
  { func = "@sub_nsw", args = ["-4294967296", "-4294967296"], expect = ["0"] },
  { func = "@sub_nsw", args = ["-4294967296", "4294967295"], expect = ["poison"] },
  { func = "@sub_nsw", args = ["4294967295", "0"], expect = ["4294967295"] },
  { func = "@sub_nsw", args = ["4294967295", "1"], expect = ["4294967294"] },
  { func = "@sub_nsw", args = ["4294967295", "-1"], expect = ["poison"] },
  { func = "@sub_nsw", args = ["4294967295", "-4294967296"], expect = ["poison"] },
  { func = "@sub_nsw", args = ["4294967295", "4294967295"], expect = ["0"] },
  { func = "@sub_nuw_nsw", args = ["0", "0"], expect = ["0"] },
  { func = "@sub_nuw_nsw", args = ["0", "1"], expect = ["poison"] },
  { func = "@sub_nuw_nsw", args = ["0", "-1"], expect = ["poison"] },
  { func = "@sub_nuw_nsw", args = ["0", "-4294967296"], expect = ["poison"] },
  { func = "@sub_nuw_nsw", args = ["0", "4294967295"], expect = ["poison"] },
  { func = "@sub_nuw_nsw", args = ["1", "0"], expect = ["1"] },
  { func = "@sub_nuw_nsw", args = ["1", "1"], expect = ["0"] },
  { func = "@sub_nuw_nsw", args = ["1", "-1"], expect = ["poison"] },
  { func = "@sub_nuw_nsw", args = ["1", "-4294967296"], expect = ["poison"] },
  { func = "@sub_nuw_nsw", args = ["1", "4294967295"], expect = ["poison"] },
  { func = "@sub_nuw_nsw", args = ["-1", "0"], expect = ["-1"] },
  { func = "@sub_nuw_nsw", args = ["-1", "1"], expect = ["-2"] },
  { func = "@sub_nuw_nsw", args = ["-1", "-1"], expect = ["0"] },
  { func = "@sub_nuw_nsw", args = ["-1", "-4294967296"], expect = ["4294967295"] },
  { func = "@sub_nuw_nsw", args = ["-1", "4294967295"], expect = ["-4294967296"] },
  { func = "@sub_nuw_nsw", args = ["-4294967296", "0"], expect = ["-4294967296"] },
  { func = "@sub_nuw_nsw", args = ["-4294967296", "1"], expect = ["poison"] },
  { func = "@sub_nuw_nsw", args = ["-4294967296", "-1"], expect = ["poison"] },
  { func = "@sub_nuw_nsw", args = ["-4294967296", "-4294967296"], expect = ["0"] },
  { func = "@sub_nuw_nsw", args = ["-4294967296", "4294967295"], expect = ["poison"] },
  { func = "@sub_nuw_nsw", args = ["4294967295", "0"], expect = ["4294967295"] },
  { func = "@sub_nuw_nsw", args = ["4294967295", "1"], expect = ["4294967294"] },
  { func = "@sub_nuw_nsw", args = ["4294967295", "-1"], expect = ["poison"] },
  { func = "@sub_nuw_nsw", args = ["4294967295", "-4294967296"], expect = ["poison"] },
  { func = "@sub_nuw_nsw", args = ["4294967295", "4294967295"], expect = ["0"] },
]
