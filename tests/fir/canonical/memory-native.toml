# Tests of memory-native.fir: the memory ops run on fir-ref and as native
# code (stage 5 of #231). A value stored in its own allocation and loaded
# back is itself at every width the backend lowers. ptradd moves a pointer
# by an integer of each width, read as signed, so an i1 true moves it back
# one byte. A pointer stored and loaded back reaches what it pointed to,
# and each pass of a loop allocates anew, so the first allocation still
# holds 0 after the last pass. Out of bounds is UB, as load.toml and
# store.toml test, so these offsets stay within the allocation.
tests = [
  { func = "@round_i1", args = ["false"] },
  { func = "@round_i1", args = ["true"] },
  { func = "@round_i1", args = ["poison"] },
  { func = "@round_i8", args = ["0"] },
  { func = "@round_i8", args = ["1"] },
  { func = "@round_i8", args = ["-1"] },
  { func = "@round_i8", args = ["-128"] },
  { func = "@round_i8", args = ["127"] },
  { func = "@round_i8", args = ["poison"] },
  { func = "@round_i16", args = ["0"] },
  { func = "@round_i16", args = ["1"] },
  { func = "@round_i16", args = ["-1"] },
  { func = "@round_i16", args = ["-32768"] },
  { func = "@round_i16", args = ["32767"] },
  { func = "@round_i16", args = ["poison"] },
  { func = "@round_i32", args = ["0"] },
  { func = "@round_i32", args = ["1"] },
  { func = "@round_i32", args = ["-1"] },
  { func = "@round_i32", args = ["-2147483648"] },
  { func = "@round_i32", args = ["2147483647"] },
  { func = "@round_i32", args = ["poison"] },
  { func = "@round_i64", args = ["0"] },
  { func = "@round_i64", args = ["1"] },
  { func = "@round_i64", args = ["-1"] },
