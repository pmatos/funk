  { func = "@round_i128", args = ["170141183460469231731687303715884105727"] },
  { func = "@round_i128", args = ["poison"] },
  { func = "@by_i1", args = ["false", "-7"] },
  { func = "@by_i1", args = ["true", "-7"] },
  { func = "@by_i8", args = ["0", "-7"] },
