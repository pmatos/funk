# Tests of memory-native.fir: the memory ops run on fir-ref and as native
# code (stage 5 of #231). A value stored in its own allocation and loaded
# back is itself at every width the backend lowers. ptradd moves a pointer
# by an integer of each width, read as signed, so an i1 true moves it back
# one byte, and the byte it then loads from the i32 67305985, 0x04030201
# stored little-endian, says where it landed. A pointer stored and loaded
# back reaches what it pointed to, and each pass of a loop allocates anew,
# so the first allocation still holds 0 after the last pass. Out of bounds is UB, as load.toml and
# store.toml test, so these offsets stay within the allocation. Each test
# declares its result, so fir-ref's own is pinned as well as native code's.
tests = [
  { func = "@round_i1", args = ["false"], results = [{ values = ["false"], witness = [] }] },
  { func = "@round_i1", args = ["true"], results = [{ values = ["true"], witness = [] }] },
  { func = "@round_i8", args = ["0"], results = [{ values = ["0"], witness = [] }] },
  { func = "@round_i8", args = ["1"], results = [{ values = ["1"], witness = [] }] },
  { func = "@round_i8", args = ["-1"], results = [{ values = ["-1"], witness = [] }] },
