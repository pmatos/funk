# Tests of float-bitcast-f128.fir: bitcast from f128 to i128 and
# back (ADR-2026-11-09-1549), on zeros of both signs, subnormals, the
# smallest normal, one, the largest finite values, infinities and
# NaNs with payloads and either sign. Each result is its operand's
# bits. Written by scripts/harness/float_bitcast_cases.py.
# Each test is interpreter-only: the backend does not lower
# f128, so fir-ref alone runs it and must give what it expects.
tests = [
  { func = "@to_bits", args = ["0.0"], expect = ["0"] },
  { func = "@of_bits", args = ["0"], expect = ["0.0"] },
  { func = "@to_bits", args = ["-0.0"], expect = ["-170141183460469231731687303715884105728"] },
  { func = "@of_bits", args = ["-170141183460469231731687303715884105728"], expect = ["-0.0"] },
  { func = "@to_bits", args = ["6.0e-4966"], expect = ["1"] },
  { func = "@of_bits", args = ["1"], expect = ["6.0e-4966"] },
  { func = "@to_bits", args = ["-6.0e-4966"], expect = ["-170141183460469231731687303715884105727"] },
  { func = "@of_bits", args = ["-170141183460469231731687303715884105727"], expect = ["-6.0e-4966"] },
  { func = "@to_bits", args = ["3.362103143112093506262677817321752e-4932"], expect = ["5192296858534827628530496329220095"] },
  { func = "@of_bits", args = ["5192296858534827628530496329220095"], expect = ["3.362103143112093506262677817321752e-4932"] },
  { func = "@to_bits", args = ["3.3621031431120935062626778173217526e-4932"], expect = ["5192296858534827628530496329220096"] },
  { func = "@of_bits", args = ["5192296858534827628530496329220096"], expect = ["3.3621031431120935062626778173217526e-4932"] },
  { func = "@to_bits", args = ["1.0"], expect = ["85065399433376081038215121361612832768"] },
  { func = "@of_bits", args = ["85065399433376081038215121361612832768"], expect = ["1.0"] },
  { func = "@to_bits", args = ["-1.0"], expect = ["-85075784027093150693472182354271272960"] },
  { func = "@of_bits", args = ["-85075784027093150693472182354271272960"], expect = ["-1.0"] },
  { func = "@to_bits", args = ["1.189731495357231765085759326628007e4932"], expect = ["170135991163610696904058773219554885631"] },
  { func = "@of_bits", args = ["170135991163610696904058773219554885631"], expect = ["1.189731495357231765085759326628007e4932"] },
  { func = "@to_bits", args = ["-1.189731495357231765085759326628007e4932"], expect = ["-5192296858534827628530496329220097"] },
  { func = "@of_bits", args = ["-5192296858534827628530496329220097"], expect = ["-1.189731495357231765085759326628007e4932"] },
  { func = "@to_bits", args = ["0x7fff0000000000000000000000000000"], expect = ["170135991163610696904058773219554885632"] },
  { func = "@of_bits", args = ["170135991163610696904058773219554885632"], expect = ["0x7fff0000000000000000000000000000"] },
  { func = "@to_bits", args = ["0xffff0000000000000000000000000000"], expect = ["-5192296858534827628530496329220096"] },
  { func = "@of_bits", args = ["-5192296858534827628530496329220096"], expect = ["0xffff0000000000000000000000000000"] },
  { func = "@to_bits", args = ["0x7fff8000000000000000000000000000"], expect = ["170138587312039964317873038467719495680"] },
  { func = "@of_bits", args = ["170138587312039964317873038467719495680"], expect = ["0x7fff8000000000000000000000000000"] },
  { func = "@to_bits", args = ["0xffff8000000000000000000000000001"], expect = ["-2596148429267413814265248164610047"] },
  { func = "@of_bits", args = ["-2596148429267413814265248164610047"], expect = ["0xffff8000000000000000000000000001"] },
  { func = "@to_bits", args = ["0x7fff0000000000000000000000000001"], expect = ["170135991163610696904058773219554885633"] },
  { func = "@of_bits", args = ["170135991163610696904058773219554885633"], expect = ["0x7fff0000000000000000000000000001"] },
  { func = "@to_bits", args = ["0xffffffffffffffffffffffffffffffff"], expect = ["-1"] },
  { func = "@of_bits", args = ["-1"], expect = ["0xffffffffffffffffffffffffffffffff"] },
  { func = "@to_bits", args = ["poison"], expect = ["poison"] },
  { func = "@of_bits", args = ["poison"], expect = ["poison"] },
]
