# Tests of sub-i1.fir: sub at i1, with each set of its
# flags, on every pair of boundary bit patterns: 0, 1, -1, the signed
# minimum and the signed maximum, or false and true at i1. A broken
# flag gives poison (#14).
# Each test without expect is differential: fir-ref and native code run
# it, and the native result must refine fir-ref's; where fir-ref returns
# poison, any value of the type does.
tests = [
  { func = "@sub", args = ["false", "false"] },
  { func = "@sub", args = ["false", "true"] },
  { func = "@sub", args = ["true", "false"] },
  { func = "@sub", args = ["true", "true"] },
  { func = "@sub_nuw", args = ["false", "false"] },
  { func = "@sub_nuw", args = ["false", "true"] },
  { func = "@sub_nuw", args = ["true", "false"] },
  { func = "@sub_nuw", args = ["true", "true"] },
  { func = "@sub_nsw", args = ["false", "false"] },
  { func = "@sub_nsw", args = ["false", "true"] },
  { func = "@sub_nsw", args = ["true", "false"] },
  { func = "@sub_nsw", args = ["true", "true"] },
  { func = "@sub_nuw_nsw", args = ["false", "false"] },
  { func = "@sub_nuw_nsw", args = ["false", "true"] },
  { func = "@sub_nuw_nsw", args = ["true", "false"] },
  { func = "@sub_nuw_nsw", args = ["true", "true"] },
]
