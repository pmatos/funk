# Tests of results.fir: functions with no result, one and several. Each
# test is differential: fir-ref and native code run it, and the native
# result must refine fir-ref's, value by value. several returns three
# values, more than the two registers that hold results natively, so
# natively they go in a result area that the caller provides
# (ADR-2026-11-03-0109).
tests = [
  { func = "@none" },
  { func = "@one", args = ["-7"] },
  { func = "@one", args = ["127"] },
  { func = "@several", args = ["1", "2"] },
  { func = "@several", args = ["127", "-32768"] },
  { func = "@several", args = ["-1", "32767"] },
  { func = "@unused", args = ["3"] },
]
