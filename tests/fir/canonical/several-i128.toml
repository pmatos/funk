# Tests of several-i128.fir: an i128 among several results (#21, #31,
# ADR-2026-10-30-1232). Natively, results that take more than two
# eightbytes go in a result area that the caller provides, and an i128
# there takes two eightbytes at an offset that is a multiple of 16, its
# low half first. first, middle and last return an i128 first, between
# two narrower results and last; four returns an i1, an i128, an i8 and
# an i16, and twice two i128s among an i32 and an i1. Each returns its
# arguments plus one, and use_NAME calls NAME and returns its results
# reversed, each i128 doubled and each other plus one. The arguments are
# the boundary bit patterns of their types, and at i128 values on either
# side of 2^63 and 2^64 and a value whose halves differ, rotated so that
# each parameter takes each of them. poison returns x + 1 with nsw, which
# is poison when x is the signed maximum, between two defined results,
# and call_poison returns them reversed through a call; poison_narrow
# returns a + 1 at i8 with nsw, poison when a is 127, between two defined
# i128s, and call_poison_narrow returns them through a call. An
# interpreter-only twin of each run that returns poison checks that
# exactly that value is poison. frozen returns a frozen x + max twice,
# and frozen_use subtracts one from the other: when x + max overflows,
# the frozen value may be any value, the same in both places, so
# frozen_use declares its results with a witness, and an interpreter-only
# twin of frozen names the choice.
# Each test without expect is differential: fir-ref and native code run
# it, and the native result must refine fir-ref's, value by value.
