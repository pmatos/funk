# Tests of call-i16.fir: call at i16 (#20), on the boundary bit
# patterns: 0, 1, -1, the signed minimum and the signed maximum. call_id
# passes its argument to @id and returns what @id returns, so each
# pattern goes into a call as an argument and comes back as its result.
# call_sub passes %a and %b, in that order, to @sub, which returns %a -
# %b, on every pair of patterns: an argument in the wrong place changes
# the result where the two differ.
# Each test without expect is differential: fir-ref and native code run
# it, and the native result must refine fir-ref's.
tests = [
  { func = "@call_id", args = ["0"] },
  { func = "@call_id", args = ["1"] },
  { func = "@call_id", args = ["-1"] },
  { func = "@call_id", args = ["-32768"] },
  { func = "@call_id", args = ["32767"] },
  { func = "@call_sub", args = ["0", "0"] },
  { func = "@call_sub", args = ["0", "1"] },
  { func = "@call_sub", args = ["0", "-1"] },
  { func = "@call_sub", args = ["0", "-32768"] },
  { func = "@call_sub", args = ["0", "32767"] },
  { func = "@call_sub", args = ["1", "0"] },
  { func = "@call_sub", args = ["1", "1"] },
  { func = "@call_sub", args = ["1", "-1"] },
  { func = "@call_sub", args = ["1", "-32768"] },
  { func = "@call_sub", args = ["1", "32767"] },
  { func = "@call_sub", args = ["-1", "0"] },
  { func = "@call_sub", args = ["-1", "1"] },
  { func = "@call_sub", args = ["-1", "-1"] },
  { func = "@call_sub", args = ["-1", "-32768"] },
  { func = "@call_sub", args = ["-1", "32767"] },
  { func = "@call_sub", args = ["-32768", "0"] },
  { func = "@call_sub", args = ["-32768", "1"] },
  { func = "@call_sub", args = ["-32768", "-1"] },
  { func = "@call_sub", args = ["-32768", "-32768"] },
  { func = "@call_sub", args = ["-32768", "32767"] },
  { func = "@call_sub", args = ["32767", "0"] },
  { func = "@call_sub", args = ["32767", "1"] },
  { func = "@call_sub", args = ["32767", "-1"] },
  { func = "@call_sub", args = ["32767", "-32768"] },
  { func = "@call_sub", args = ["32767", "32767"] },
]
