# Tests of select-i7.fir: select at i7 with each condition, false and
# true, on every pair of boundary bit patterns: 0, 1, -1, the signed
# minimum and the signed maximum (#16). true chooses the first value and
# false the second.
# The backend does not lower i7, so each test is interpreter-only and
# states the result that fir-ref must give.
tests = [
  { func = "@select", args = ["false", "0", "0"], expect = ["0"] },
  { func = "@select", args = ["false", "0", "1"], expect = ["1"] },
  { func = "@select", args = ["false", "0", "-1"], expect = ["-1"] },
  { func = "@select", args = ["false", "0", "-64"], expect = ["-64"] },
  { func = "@select", args = ["false", "0", "63"], expect = ["63"] },
  { func = "@select", args = ["false", "1", "0"], expect = ["0"] },
  { func = "@select", args = ["false", "1", "1"], expect = ["1"] },
  { func = "@select", args = ["false", "1", "-1"], expect = ["-1"] },
  { func = "@select", args = ["false", "1", "-64"], expect = ["-64"] },
  { func = "@select", args = ["false", "1", "63"], expect = ["63"] },
  { func = "@select", args = ["false", "-1", "0"], expect = ["0"] },
  { func = "@select", args = ["false", "-1", "1"], expect = ["1"] },
  { func = "@select", args = ["false", "-1", "-1"], expect = ["-1"] },
  { func = "@select", args = ["false", "-1", "-64"], expect = ["-64"] },
  { func = "@select", args = ["false", "-1", "63"], expect = ["63"] },
  { func = "@select", args = ["false", "-64", "0"], expect = ["0"] },
  { func = "@select", args = ["false", "-64", "1"], expect = ["1"] },
  { func = "@select", args = ["false", "-64", "-1"], expect = ["-1"] },
  { func = "@select", args = ["false", "-64", "-64"], expect = ["-64"] },
  { func = "@select", args = ["false", "-64", "63"], expect = ["63"] },
  { func = "@select", args = ["false", "63", "0"], expect = ["0"] },
  { func = "@select", args = ["false", "63", "1"], expect = ["1"] },
  { func = "@select", args = ["false", "63", "-1"], expect = ["-1"] },
  { func = "@select", args = ["false", "63", "-64"], expect = ["-64"] },
  { func = "@select", args = ["false", "63", "63"], expect = ["63"] },
  { func = "@select", args = ["true", "0", "0"], expect = ["0"] },
  { func = "@select", args = ["true", "0", "1"], expect = ["0"] },
  { func = "@select", args = ["true", "0", "-1"], expect = ["0"] },
  { func = "@select", args = ["true", "0", "-64"], expect = ["0"] },
  { func = "@select", args = ["true", "0", "63"], expect = ["0"] },
  { func = "@select", args = ["true", "1", "0"], expect = ["1"] },
  { func = "@select", args = ["true", "1", "1"], expect = ["1"] },
  { func = "@select", args = ["true", "1", "-1"], expect = ["1"] },
  { func = "@select", args = ["true", "1", "-64"], expect = ["1"] },
  { func = "@select", args = ["true", "1", "63"], expect = ["1"] },
  { func = "@select", args = ["true", "-1", "0"], expect = ["-1"] },
  { func = "@select", args = ["true", "-1", "1"], expect = ["-1"] },
  { func = "@select", args = ["true", "-1", "-1"], expect = ["-1"] },
  { func = "@select", args = ["true", "-1", "-64"], expect = ["-1"] },
  { func = "@select", args = ["true", "-1", "63"], expect = ["-1"] },
  { func = "@select", args = ["true", "-64", "0"], expect = ["-64"] },
  { func = "@select", args = ["true", "-64", "1"], expect = ["-64"] },
  { func = "@select", args = ["true", "-64", "-1"], expect = ["-64"] },
  { func = "@select", args = ["true", "-64", "-64"], expect = ["-64"] },
  { func = "@select", args = ["true", "-64", "63"], expect = ["-64"] },
  { func = "@select", args = ["true", "63", "0"], expect = ["63"] },
  { func = "@select", args = ["true", "63", "1"], expect = ["63"] },
  { func = "@select", args = ["true", "63", "-1"], expect = ["63"] },
  { func = "@select", args = ["true", "63", "-64"], expect = ["63"] },
  { func = "@select", args = ["true", "63", "63"], expect = ["63"] },
]
