# Tests of float-bitcast-f64.fir: bitcast from f64 to i64 and
# back (ADR-2026-11-09-1549), on zeros of both signs, subnormals, the
# smallest normal, one, the largest finite values, infinities and
# NaNs with payloads and either sign. Each result is its operand's
# bits. Written by scripts/harness/float_bitcast_cases.py.
# A test without expect is differential: fir-ref and native code
# run it, and the native result must equal fir-ref's. Each case
# is also checked by an interpreter-only test with expect.
tests = [
  { func = "@to_bits", args = ["0.0"] },
  { func = "@to_bits", args = ["0.0"], expect = ["0"] },
  { func = "@of_bits", args = ["0"] },
  { func = "@of_bits", args = ["0"], expect = ["0.0"] },
  { func = "@to_bits", args = ["-0.0"] },
  { func = "@to_bits", args = ["-0.0"], expect = ["-9223372036854775808"] },
  { func = "@of_bits", args = ["-9223372036854775808"] },
  { func = "@of_bits", args = ["-9223372036854775808"], expect = ["-0.0"] },
  { func = "@to_bits", args = ["5.0e-324"] },
  { func = "@to_bits", args = ["5.0e-324"], expect = ["1"] },
  { func = "@of_bits", args = ["1"] },
  { func = "@of_bits", args = ["1"], expect = ["5.0e-324"] },
  { func = "@to_bits", args = ["-5.0e-324"] },
  { func = "@to_bits", args = ["-5.0e-324"], expect = ["-9223372036854775807"] },
  { func = "@of_bits", args = ["-9223372036854775807"] },
  { func = "@of_bits", args = ["-9223372036854775807"], expect = ["-5.0e-324"] },
  { func = "@to_bits", args = ["2.225073858507201e-308"] },
  { func = "@to_bits", args = ["2.225073858507201e-308"], expect = ["4503599627370495"] },
  { func = "@of_bits", args = ["4503599627370495"] },
  { func = "@of_bits", args = ["4503599627370495"], expect = ["2.225073858507201e-308"] },
  { func = "@to_bits", args = ["2.2250738585072014e-308"] },
  { func = "@to_bits", args = ["2.2250738585072014e-308"], expect = ["4503599627370496"] },
  { func = "@of_bits", args = ["4503599627370496"] },
  { func = "@of_bits", args = ["4503599627370496"], expect = ["2.2250738585072014e-308"] },
  { func = "@to_bits", args = ["1.0"] },
  { func = "@to_bits", args = ["1.0"], expect = ["4607182418800017408"] },
  { func = "@of_bits", args = ["4607182418800017408"] },
  { func = "@of_bits", args = ["4607182418800017408"], expect = ["1.0"] },
  { func = "@to_bits", args = ["-1.0"] },
  { func = "@to_bits", args = ["-1.0"], expect = ["-4616189618054758400"] },
  { func = "@of_bits", args = ["-4616189618054758400"] },
  { func = "@of_bits", args = ["-4616189618054758400"], expect = ["-1.0"] },
  { func = "@to_bits", args = ["1.7976931348623157e308"] },
  { func = "@to_bits", args = ["1.7976931348623157e308"], expect = ["9218868437227405311"] },
  { func = "@of_bits", args = ["9218868437227405311"] },
  { func = "@of_bits", args = ["9218868437227405311"], expect = ["1.7976931348623157e308"] },
  { func = "@to_bits", args = ["-1.7976931348623157e308"] },
  { func = "@to_bits", args = ["-1.7976931348623157e308"], expect = ["-4503599627370497"] },
  { func = "@of_bits", args = ["-4503599627370497"] },
  { func = "@of_bits", args = ["-4503599627370497"], expect = ["-1.7976931348623157e308"] },
  { func = "@to_bits", args = ["0x7ff0000000000000"] },
  { func = "@to_bits", args = ["0x7ff0000000000000"], expect = ["9218868437227405312"] },
  { func = "@of_bits", args = ["9218868437227405312"] },
  { func = "@of_bits", args = ["9218868437227405312"], expect = ["0x7ff0000000000000"] },
  { func = "@to_bits", args = ["0xfff0000000000000"] },
  { func = "@to_bits", args = ["0xfff0000000000000"], expect = ["-4503599627370496"] },
  { func = "@of_bits", args = ["-4503599627370496"] },
  { func = "@of_bits", args = ["-4503599627370496"], expect = ["0xfff0000000000000"] },
  { func = "@to_bits", args = ["0x7ff8000000000000"] },
  { func = "@to_bits", args = ["0x7ff8000000000000"], expect = ["9221120237041090560"] },
  { func = "@of_bits", args = ["9221120237041090560"] },
  { func = "@of_bits", args = ["9221120237041090560"], expect = ["0x7ff8000000000000"] },
  { func = "@to_bits", args = ["0xfff8000000000001"] },
  { func = "@to_bits", args = ["0xfff8000000000001"], expect = ["-2251799813685247"] },
  { func = "@of_bits", args = ["-2251799813685247"] },
  { func = "@of_bits", args = ["-2251799813685247"], expect = ["0xfff8000000000001"] },
  { func = "@to_bits", args = ["0x7ff0000000000001"] },
  { func = "@to_bits", args = ["0x7ff0000000000001"], expect = ["9218868437227405313"] },
  { func = "@of_bits", args = ["9218868437227405313"] },
  { func = "@of_bits", args = ["9218868437227405313"], expect = ["0x7ff0000000000001"] },
  { func = "@to_bits", args = ["0xffffffffffffffff"] },
  { func = "@to_bits", args = ["0xffffffffffffffff"], expect = ["-1"] },
  { func = "@of_bits", args = ["-1"] },
  { func = "@of_bits", args = ["-1"], expect = ["0xffffffffffffffff"] },
  { func = "@to_bits", args = ["poison"] },
  { func = "@of_bits", args = ["poison"] },
]
