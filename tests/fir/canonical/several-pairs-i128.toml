# Tests of several-pairs-i128.fir: an i128 next to one more result (#21,
# #31, ADR-2026-10-30-1232). wide returns an i128 and an i64, and narrow
# an i64 and an i128: three eightbytes, so natively they go in a result
# area, the i128 at offset 0 or 16. two returns two i128s, four
# eightbytes. Each returns its arguments plus one, and use_NAME calls
# NAME and returns its results reversed, each i128 doubled and each other
# plus one. chain passes an i128 result of wide on to narrow and to two,
# as an argument and next to other results. divmod returns an i128
# between the quotient and the remainder of a udiv and a urem at i64, and
# call_divmod two of them through a call: a zero divisor is UB in the
# callee, and so in its caller. forever calls itself before it returns
# two i128s and an i8, and runs out of fuel. The arguments are the
# boundary bit patterns of their types, and at i128 values on either side
# of 2^63 and 2^64 and a value whose halves differ.
# Each test without expect is differential: fir-ref and native code run
# it, and the native result must refine fir-ref's. UB and fuel
# exhaustion are interpreter-only.
