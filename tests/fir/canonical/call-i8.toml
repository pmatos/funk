# Tests of call-i8.fir: call at i8 (#20), on the boundary bit patterns:
# 0, 1, -1, the signed minimum and the signed maximum. call_id passes
# its argument to @id and returns what @id returns, so each pattern goes
# into a call as an argument and comes back as its result. call_sub
# passes %a and %b, in that order, to @sub, which returns %a - %b, on
# every pair of patterns: an argument in the wrong place changes the
# result where the two differ.
# Each test without expect is differential: fir-ref and native code run
# it, and the native result must refine fir-ref's.
tests = [
  { func = "@call_id", args = ["0"] },
  { func = "@call_id", args = ["1"] },
  { func = "@call_id", args = ["-1"] },
  { func = "@call_id", args = ["-128"] },
  { func = "@call_id", args = ["127"] },
  { func = "@call_sub", args = ["0", "0"] },
  { func = "@call_sub", args = ["0", "1"] },
  { func = "@call_sub", args = ["0", "-1"] },
  { func = "@call_sub", args = ["0", "-128"] },
  { func = "@call_sub", args = ["0", "127"] },
  { func = "@call_sub", args = ["1", "0"] },
  { func = "@call_sub", args = ["1", "1"] },
  { func = "@call_sub", args = ["1", "-1"] },
  { func = "@call_sub", args = ["1", "-128"] },
  { func = "@call_sub", args = ["1", "127"] },
  { func = "@call_sub", args = ["-1", "0"] },
  { func = "@call_sub", args = ["-1", "1"] },
  { func = "@call_sub", args = ["-1", "-1"] },
  { func = "@call_sub", args = ["-1", "-128"] },
  { func = "@call_sub", args = ["-1", "127"] },
  { func = "@call_sub", args = ["-128", "0"] },
  { func = "@call_sub", args = ["-128", "1"] },
  { func = "@call_sub", args = ["-128", "-1"] },
  { func = "@call_sub", args = ["-128", "-128"] },
  { func = "@call_sub", args = ["-128", "127"] },
  { func = "@call_sub", args = ["127", "0"] },
  { func = "@call_sub", args = ["127", "1"] },
  { func = "@call_sub", args = ["127", "-1"] },
  { func = "@call_sub", args = ["127", "-128"] },
  { func = "@call_sub", args = ["127", "127"] },
]
