# Tests of float-types.fir: values of every float format pass through
# parameters, results, block arguments and calls as their bits, spelled
# as the one float literal of the bits (ADR-2026-11-11-1438), and
# poison passes as poison. The module has formats that the backend does
# not lower, so each test is interpreter-only.
tests = [
  { func = "@aliases", args = ["0xffff", "0x7f81", "0xffc00001", "5.0e-324", "0x7fff8000000000000000000000000001"], expect = ["0x7fff8000000000000000000000000001", "5.0e-324", "0xffc00001", "0x7f81", "0xffff"] },
  { func = "@generic", args = ["-0.0", "0x7f", "0xff", "poison"], expect = ["poison", "0xff", "0x7f", "-0.0"] },
  { func = "@pass", args = ["true", "0x7fc00000", "-0.0"], expect = ["0x7fc00000"] },
  { func = "@pass", args = ["false", "0x7fc00000", "-0.0"], expect = ["-0.0"] },
  { func = "@swap", args = ["0xfff0000000000001", "-0.0"], expect = ["-0.0", "0xfff0000000000001"] },
]
