# Tests of trunc-i128.fir: trunc from i128 to each of i1, i8, i16, i32
# and i64 (#21), on the boundary bit patterns of i128 (0, 1, -1, the
# signed minimum and the signed maximum) and on values on either side of
# 2^63 and 2^64: trunc keeps the low bits of the low half, whatever the
# high half holds.
# Each test without expect is differential: fir-ref and native code
# run it, and the native result must refine fir-ref's.
tests = [
  { func = "@trunc_i128_to_i1", args = ["0"] },
  { func = "@trunc_i128_to_i1", args = ["1"] },
  { func = "@trunc_i128_to_i1", args = ["-1"] },
