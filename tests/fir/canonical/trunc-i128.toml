  { func = "@trunc_i128_to_i1", args = ["-1"], expect = ["true"] },
  { func = "@trunc_i128_to_i1", args = ["-170141183460469231731687303715884105728"], expect = ["false"] },
  { func = "@trunc_i128_to_i1", args = ["170141183460469231731687303715884105727"], expect = ["true"] },
