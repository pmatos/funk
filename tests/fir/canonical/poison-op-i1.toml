# Tests of poison-op-i1.fir: the op poison at i1 (#122,
# ADR-2026-10-29-2006). Its result is poison on every run, and each
# function passes it to one kind of op.
#
# The differential tests run poison as native code, which builds and
# must refine fir-ref's outcome. Native code holds no poison: it gives
# zero for one (docs/decisions/x86-64-backend.md#poison), and any value
# refines a poison result, so these tests show that poison lowers and
# runs, not what it gives (ADR-2026-11-03-0557). A function that
# freezes the poison gives whatever freeze chooses, and sub %f, %f
# gives 0 whatever it chose.
#
# Most interpreter-only tests observe the poison
# (ADR-2026-11-03-0557): fir-ref returns it alone, through add,
# through select on the arm that chooses it, and beside a value; icmp
# eq %p, %p is poison, not true; freeze chooses a value for it; and a
# branch on it or a division by it is UB. @poison_unused,
# @poison_call, whose callee ignores it, and @poison_select on the
# other arm do not observe it: they show that a poison that does not
# reach the result changes nothing. They count towards its cells,
# since the count is static (ADR-2026-11-03-0557), but the tests that
# observe the poison are what fill them.
tests = [
  { func = "@poison" },
  { func = "@poison_unused", args = ["false"] },
  { func = "@poison_unused", args = ["true"] },
  { func = "@poison_add", args = ["false"] },
  { func = "@poison_add", args = ["true"] },
  { func = "@poison_select", args = ["true", "false"] },
  { func = "@poison_select", args = ["true", "true"] },
  { func = "@poison_select", args = ["false", "false"] },
  { func = "@poison_select", args = ["false", "true"] },
  { func = "@poison_icmp" },
  { func = "@poison_freeze" },
  { func = "@poison_freeze_sub" },
  { func = "@poison_pair", args = ["false"] },
  { func = "@poison_pair", args = ["true"] },
  { func = "@poison_call", args = ["false"] },
  { func = "@poison_call", args = ["true"] },
  # Interpreter-only tests: fir-ref alone runs each, and must give the
  # expected result.
  { func = "@poison", expect = ["poison"] },
  { func = "@poison_unused", args = ["false"], expect = ["false"] },
  { func = "@poison_unused", args = ["true"], expect = ["true"] },
  { func = "@poison_add", args = ["false"], expect = ["poison"] },
  { func = "@poison_add", args = ["true"], expect = ["poison"] },
  { func = "@poison_select", args = ["true", "false"], expect = ["poison"] },
  { func = "@poison_select", args = ["true", "true"], expect = ["poison"] },
  { func = "@poison_select", args = ["false", "false"], expect = ["false"] },
  { func = "@poison_select", args = ["false", "true"], expect = ["true"] },
  { func = "@poison_icmp", expect = ["poison"] },
  { func = "@poison_freeze", choices = ["false"], expect = ["false"] },
  { func = "@poison_freeze", choices = ["true"], expect = ["true"] },
  { func = "@poison_freeze_sub", choices = ["false"], expect = ["false"] },
  { func = "@poison_freeze_sub", choices = ["true"], expect = ["false"] },
  { func = "@poison_pair", args = ["false"], expect = ["false", "poison"] },
  { func = "@poison_pair", args = ["true"], expect = ["true", "poison"] },
  { func = "@poison_call", args = ["false"], expect = ["false"] },
  { func = "@poison_call", args = ["true"], expect = ["true"] },
  { func = "@poison_cond_br", args = ["true"], expect = "ub" },
  { func = "@poison_udiv", args = ["false"], expect = "ub" },
  { func = "@poison_udiv", args = ["true"], expect = "ub" },
]
