# Tests of loop-i32.fir: loops at i32 (#19), each a header ^loop whose
# body ^body branches back to it with block arguments. sum is the loop
# of the spec's example @sum (lean/Fir/Text/Example.lean) at this type:
# it adds 0, 1, ... up to, but not including, %n, with add nsw, so a sum
# past the signed maximum is poison, which the loop carries to the end;
# it does not loop at all on %n of at most 0. fact counts %n down to 0
# as an unsigned number and multiplies with mul, which wraps: it gives
# %n! modulo 2^N. gcd is Euclid's algorithm with urem, on %a and %b read
# as unsigned numbers, on every pair of boundary bit patterns, 0, 1, -1,
# the signed minimum and the signed maximum, and on two consecutive
# Fibonacci numbers, which take the most trips for their size. No loop
# here runs more than a thousand times, well within the default fuel.
# Each test without expect is differential: fir-ref and native code run
# it, and the native result must refine fir-ref's.
tests = [
  { func = "@sum", args = ["0"] },
  { func = "@sum", args = ["1"] },
  { func = "@sum", args = ["2"] },
  { func = "@sum", args = ["-1"] },
  { func = "@sum", args = ["-2147483648"] },
  { func = "@sum", args = ["10"] },
  { func = "@sum", args = ["100"] },
  { func = "@sum", args = ["1000"] },
  { func = "@fact", args = ["0"] },
  { func = "@fact", args = ["1"] },
  { func = "@fact", args = ["12"] },
  { func = "@fact", args = ["13"] },
  { func = "@fact", args = ["33"] },
  { func = "@fact", args = ["34"] },
  { func = "@gcd", args = ["0", "0"] },
  { func = "@gcd", args = ["0", "1"] },
  { func = "@gcd", args = ["0", "-1"] },
  { func = "@gcd", args = ["0", "-2147483648"] },
  { func = "@gcd", args = ["0", "2147483647"] },
  { func = "@gcd", args = ["1", "0"] },
  { func = "@gcd", args = ["1", "1"] },
  { func = "@gcd", args = ["1", "-1"] },
  { func = "@gcd", args = ["1", "-2147483648"] },
  { func = "@gcd", args = ["1", "2147483647"] },
  { func = "@gcd", args = ["-1", "0"] },
  { func = "@gcd", args = ["-1", "1"] },
  { func = "@gcd", args = ["-1", "-1"] },
  { func = "@gcd", args = ["-1", "-2147483648"] },
  { func = "@gcd", args = ["-1", "2147483647"] },
  { func = "@gcd", args = ["-2147483648", "0"] },
  { func = "@gcd", args = ["-2147483648", "1"] },
  { func = "@gcd", args = ["-2147483648", "-1"] },
  { func = "@gcd", args = ["-2147483648", "-2147483648"] },
  { func = "@gcd", args = ["-2147483648", "2147483647"] },
  { func = "@gcd", args = ["2147483647", "0"] },
  { func = "@gcd", args = ["2147483647", "1"] },
  { func = "@gcd", args = ["2147483647", "-1"] },
  { func = "@gcd", args = ["2147483647", "-2147483648"] },
  { func = "@gcd", args = ["2147483647", "2147483647"] },
  { func = "@gcd", args = ["1836311903", "1134903170"] },
]
