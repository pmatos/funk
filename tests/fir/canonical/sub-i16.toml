# Tests of sub-i16.fir: sub at i16, with each set of its
# flags, on every pair of boundary bit patterns: 0, 1, -1, the signed
# minimum and the signed maximum, or false and true at i1. A broken
# flag gives poison (#14).
# Each test without expect is differential: fir-ref and native code run
# it, and the native result must refine fir-ref's; where fir-ref returns
# poison, any value of the type does.
tests = [
  { func = "@sub", args = ["0", "0"] },
  { func = "@sub", args = ["0", "1"] },
  { func = "@sub", args = ["0", "-1"] },
  { func = "@sub", args = ["0", "-32768"] },
  { func = "@sub", args = ["0", "32767"] },
  { func = "@sub", args = ["1", "0"] },
  { func = "@sub", args = ["1", "1"] },
  { func = "@sub", args = ["1", "-1"] },
  { func = "@sub", args = ["1", "-32768"] },
  { func = "@sub", args = ["1", "32767"] },
  { func = "@sub", args = ["-1", "0"] },
  { func = "@sub", args = ["-1", "1"] },
  { func = "@sub", args = ["-1", "-1"] },
  { func = "@sub", args = ["-1", "-32768"] },
  { func = "@sub", args = ["-1", "32767"] },
  { func = "@sub", args = ["-32768", "0"] },
  { func = "@sub", args = ["-32768", "1"] },
  { func = "@sub", args = ["-32768", "-1"] },
  { func = "@sub", args = ["-32768", "-32768"] },
  { func = "@sub", args = ["-32768", "32767"] },
  { func = "@sub", args = ["32767", "0"] },
  { func = "@sub", args = ["32767", "1"] },
  { func = "@sub", args = ["32767", "-1"] },
  { func = "@sub", args = ["32767", "-32768"] },
  { func = "@sub", args = ["32767", "32767"] },
  { func = "@sub_nuw", args = ["0", "0"] },
  { func = "@sub_nuw", args = ["0", "1"] },
  { func = "@sub_nuw", args = ["0", "-1"] },
  { func = "@sub_nuw", args = ["0", "-32768"] },
  { func = "@sub_nuw", args = ["0", "32767"] },
  { func = "@sub_nuw", args = ["1", "0"] },
  { func = "@sub_nuw", args = ["1", "1"] },
  { func = "@sub_nuw", args = ["1", "-1"] },
  { func = "@sub_nuw", args = ["1", "-32768"] },
  { func = "@sub_nuw", args = ["1", "32767"] },
  { func = "@sub_nuw", args = ["-1", "0"] },
  { func = "@sub_nuw", args = ["-1", "1"] },
  { func = "@sub_nuw", args = ["-1", "-1"] },
  { func = "@sub_nuw", args = ["-1", "-32768"] },
  { func = "@sub_nuw", args = ["-1", "32767"] },
  { func = "@sub_nuw", args = ["-32768", "0"] },
  { func = "@sub_nuw", args = ["-32768", "1"] },
  { func = "@sub_nuw", args = ["-32768", "-1"] },
  { func = "@sub_nuw", args = ["-32768", "-32768"] },
  { func = "@sub_nuw", args = ["-32768", "32767"] },
  { func = "@sub_nuw", args = ["32767", "0"] },
  { func = "@sub_nuw", args = ["32767", "1"] },
  { func = "@sub_nuw", args = ["32767", "-1"] },
  { func = "@sub_nuw", args = ["32767", "-32768"] },
  { func = "@sub_nuw", args = ["32767", "32767"] },
  { func = "@sub_nsw", args = ["0", "0"] },
  { func = "@sub_nsw", args = ["0", "1"] },
  { func = "@sub_nsw", args = ["0", "-1"] },
  { func = "@sub_nsw", args = ["0", "-32768"] },
  { func = "@sub_nsw", args = ["0", "32767"] },
  { func = "@sub_nsw", args = ["1", "0"] },
