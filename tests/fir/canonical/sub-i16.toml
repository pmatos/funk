  { func = "@sub_nsw", args = ["1", "-32768"] },
  { func = "@sub_nsw", args = ["1", "32767"] },
  { func = "@sub_nsw", args = ["-1", "0"] },
  { func = "@sub_nsw", args = ["-1", "1"] },
  { func = "@sub_nsw", args = ["-1", "-1"] },
  { func = "@sub_nsw", args = ["-1", "-32768"] },
  { func = "@sub_nsw", args = ["-1", "32767"] },
  { func = "@sub_nsw", args = ["-32768", "0"] },
  { func = "@sub_nsw", args = ["-32768", "1"] },
  { func = "@sub_nsw", args = ["-32768", "-1"] },
  { func = "@sub_nsw", args = ["-32768", "-32768"] },
  { func = "@sub_nsw", args = ["-32768", "32767"] },
