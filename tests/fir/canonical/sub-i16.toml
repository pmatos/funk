  { func = "@sub_nuw_nsw", args = ["0", "-1"] },
  { func = "@sub_nuw_nsw", args = ["0", "-32768"] },
  { func = "@sub_nuw_nsw", args = ["0", "32767"] },
  { func = "@sub_nuw_nsw", args = ["1", "0"] },
  { func = "@sub_nuw_nsw", args = ["1", "1"] },
  { func = "@sub_nuw_nsw", args = ["1", "-1"] },
  { func = "@sub_nuw_nsw", args = ["1", "-32768"] },
  { func = "@sub_nuw_nsw", args = ["1", "32767"] },
  { func = "@sub_nuw_nsw", args = ["-1", "0"] },
  { func = "@sub_nuw_nsw", args = ["-1", "1"] },
  { func = "@sub_nuw_nsw", args = ["-1", "-1"] },
  { func = "@sub_nuw_nsw", args = ["-1", "-32768"] },
  { func = "@sub_nuw_nsw", args = ["-1", "32767"] },
  { func = "@sub_nuw_nsw", args = ["-32768", "0"] },
  { func = "@sub_nuw_nsw", args = ["-32768", "1"] },
  { func = "@sub_nuw_nsw", args = ["-32768", "-1"] },
  { func = "@sub_nuw_nsw", args = ["-32768", "-32768"] },
  { func = "@sub_nuw_nsw", args = ["-32768", "32767"] },
  { func = "@sub_nuw_nsw", args = ["32767", "0"] },
  { func = "@sub_nuw_nsw", args = ["32767", "1"] },
  { func = "@sub_nuw_nsw", args = ["32767", "-1"] },
  { func = "@sub_nuw_nsw", args = ["32767", "-32768"] },
  { func = "@sub_nuw_nsw", args = ["32767", "32767"] },
  # Interpreter-only tests: fir-ref alone runs each, and must give the
  # result it states (the coverage matrix, ADR-2026-11-03-0557).
  { func = "@sub", args = ["5", "3"], expect = ["2"] },
  { func = "@sub_nuw", args = ["5", "3"], expect = ["2"] },
  { func = "@sub_nsw", args = ["5", "3"], expect = ["2"] },
  { func = "@sub_nuw_nsw", args = ["5", "3"], expect = ["2"] },
  { func = "@sub", args = ["0", "1"], expect = ["-1"] },
  { func = "@sub_nuw", args = ["0", "1"], expect = ["poison"] },
  { func = "@sub_nsw", args = ["0", "1"], expect = ["-1"] },
  { func = "@sub_nuw_nsw", args = ["0", "1"], expect = ["poison"] },
  { func = "@sub", args = ["-32768", "1"], expect = ["32767"] },
  { func = "@sub_nuw", args = ["-32768", "1"], expect = ["32767"] },
  { func = "@sub_nsw", args = ["-32768", "1"], expect = ["poison"] },
  { func = "@sub_nuw_nsw", args = ["-32768", "1"], expect = ["poison"] },
  { func = "@sub", args = ["32767", "-1"], expect = ["-32768"] },
  { func = "@sub_nuw", args = ["32767", "-1"], expect = ["poison"] },
  { func = "@sub_nsw", args = ["32767", "-1"], expect = ["poison"] },
  { func = "@sub_nuw_nsw", args = ["32767", "-1"], expect = ["poison"] },
]
