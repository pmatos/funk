# Tests of bitwise-i32.fir: and, or and xor at i32 on every pair of
# boundary bit patterns: 0, 1, -1, the signed minimum and the signed
# maximum, or false and true at i1 (#15).
# Each test without expect is differential: fir-ref and native code
# run it, and the native result must equal fir-ref's.
tests = [
  { func = "@and", args = ["0", "0"] },
  { func = "@and", args = ["0", "1"] },
  { func = "@and", args = ["0", "-1"] },
  { func = "@and", args = ["0", "-2147483648"] },
  { func = "@and", args = ["0", "2147483647"] },
  { func = "@and", args = ["1", "0"] },
  { func = "@and", args = ["1", "1"] },
  { func = "@and", args = ["1", "-1"] },
  { func = "@and", args = ["1", "-2147483648"] },
  { func = "@and", args = ["1", "2147483647"] },
  { func = "@and", args = ["-1", "0"] },
  { func = "@and", args = ["-1", "1"] },
  { func = "@and", args = ["-1", "-1"] },
  { func = "@and", args = ["-1", "-2147483648"] },
  { func = "@and", args = ["-1", "2147483647"] },
  { func = "@and", args = ["-2147483648", "0"] },
  { func = "@and", args = ["-2147483648", "1"] },
  { func = "@and", args = ["-2147483648", "-1"] },
  { func = "@and", args = ["-2147483648", "-2147483648"] },
  { func = "@and", args = ["-2147483648", "2147483647"] },
  { func = "@and", args = ["2147483647", "0"] },
  { func = "@and", args = ["2147483647", "1"] },
  { func = "@and", args = ["2147483647", "-1"] },
  { func = "@and", args = ["2147483647", "-2147483648"] },
  { func = "@and", args = ["2147483647", "2147483647"] },
  { func = "@or", args = ["0", "0"] },
  { func = "@or", args = ["0", "1"] },
  { func = "@or", args = ["0", "-1"] },
  { func = "@or", args = ["0", "-2147483648"] },
  { func = "@or", args = ["0", "2147483647"] },
  { func = "@or", args = ["1", "0"] },
  { func = "@or", args = ["1", "1"] },
  { func = "@or", args = ["1", "-1"] },
  { func = "@or", args = ["1", "-2147483648"] },
  { func = "@or", args = ["1", "2147483647"] },
  { func = "@or", args = ["-1", "0"] },
  { func = "@or", args = ["-1", "1"] },
  { func = "@or", args = ["-1", "-1"] },
  { func = "@or", args = ["-1", "-2147483648"] },
  { func = "@or", args = ["-1", "2147483647"] },
  { func = "@or", args = ["-2147483648", "0"] },
  { func = "@or", args = ["-2147483648", "1"] },
  { func = "@or", args = ["-2147483648", "-1"] },
  { func = "@or", args = ["-2147483648", "-2147483648"] },
  { func = "@or", args = ["-2147483648", "2147483647"] },
  { func = "@or", args = ["2147483647", "0"] },
  { func = "@or", args = ["2147483647", "1"] },
  { func = "@or", args = ["2147483647", "-1"] },
  { func = "@or", args = ["2147483647", "-2147483648"] },
  { func = "@or", args = ["2147483647", "2147483647"] },
  { func = "@xor", args = ["0", "0"] },
  { func = "@xor", args = ["0", "1"] },
  { func = "@xor", args = ["0", "-1"] },
  { func = "@xor", args = ["0", "-2147483648"] },
  { func = "@xor", args = ["0", "2147483647"] },
  { func = "@xor", args = ["1", "0"] },
  { func = "@xor", args = ["1", "1"] },
  { func = "@xor", args = ["1", "-1"] },
  { func = "@xor", args = ["1", "-2147483648"] },
  { func = "@xor", args = ["1", "2147483647"] },
  { func = "@xor", args = ["-1", "0"] },
  { func = "@xor", args = ["-1", "1"] },
  { func = "@xor", args = ["-1", "-1"] },
  { func = "@xor", args = ["-1", "-2147483648"] },
  { func = "@xor", args = ["-1", "2147483647"] },
  { func = "@xor", args = ["-2147483648", "0"] },
  { func = "@xor", args = ["-2147483648", "1"] },
  { func = "@xor", args = ["-2147483648", "-1"] },
  { func = "@xor", args = ["-2147483648", "-2147483648"] },
  { func = "@xor", args = ["-2147483648", "2147483647"] },
  { func = "@xor", args = ["2147483647", "0"] },
  { func = "@xor", args = ["2147483647", "1"] },
  { func = "@xor", args = ["2147483647", "-1"] },
  { func = "@xor", args = ["2147483647", "-2147483648"] },
  { func = "@xor", args = ["2147483647", "2147483647"] },
  # Interpreter-only tests: fir-ref alone runs each, and must give the
  # result it states (the coverage matrix, ADR-2026-11-03-0557).
  { func = "@and", args = ["12", "10"], expect = ["8"] },
  { func = "@or", args = ["12", "10"], expect = ["14"] },
  { func = "@xor", args = ["12", "10"], expect = ["6"] },
  { func = "@and", args = ["-1", "1"], expect = ["1"] },
  { func = "@or", args = ["-1", "1"], expect = ["-1"] },
  { func = "@xor", args = ["-1", "1"], expect = ["-2"] },
  { func = "@and", args = ["-2147483648", "2147483647"], expect = ["0"] },
  { func = "@or", args = ["-2147483648", "2147483647"], expect = ["-1"] },
  { func = "@xor", args = ["-2147483648", "2147483647"], expect = ["-1"] },
]
