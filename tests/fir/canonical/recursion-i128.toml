  { func = "@scale", args = ["2", "1512366075204170947332355369683137040"] },
  { func = "@scale", args = ["3", "3"] },
  { func = "@scale", args = ["3", "-3"] },
  { func = "@scale", args = ["3", "18446744073709551617"] },
  { func = "@scale", args = ["3", "9223372036854775808"] },
  { func = "@scale", args = ["3", "1512366075204170947332355369683137040"] },
