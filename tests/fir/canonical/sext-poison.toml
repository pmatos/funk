# Tests of sext-poison.fir: a poison operand gives sext a poison result
# (ADR-2026-10-30-0818), at every valid pair among i1, i7, i8, i16, i32,
# i33 and i64. %p = add nsw %a, 1 is poison when %a is the signed
# maximum, true at i1, and the function returns sext %p. On the row 0,
# false at i1, %p is 1, true at i1, and the result is sext of it.
# Only fir-ref runs these tests, and each states the result that fir-ref
# must give.
tests = [
  { func = "@sext_i1_to_i7", args = ["true"], expect = ["poison"] },
  { func = "@sext_i1_to_i7", args = ["false"], expect = ["-1"] },
  { func = "@sext_i1_to_i8", args = ["true"], expect = ["poison"] },
  { func = "@sext_i1_to_i8", args = ["false"], expect = ["-1"] },
  { func = "@sext_i1_to_i16", args = ["true"], expect = ["poison"] },
  { func = "@sext_i1_to_i16", args = ["false"], expect = ["-1"] },
  { func = "@sext_i1_to_i32", args = ["true"], expect = ["poison"] },
  { func = "@sext_i1_to_i32", args = ["false"], expect = ["-1"] },
  { func = "@sext_i1_to_i33", args = ["true"], expect = ["poison"] },
  { func = "@sext_i1_to_i33", args = ["false"], expect = ["-1"] },
  { func = "@sext_i1_to_i64", args = ["true"], expect = ["poison"] },
  { func = "@sext_i1_to_i64", args = ["false"], expect = ["-1"] },
  { func = "@sext_i7_to_i8", args = ["63"], expect = ["poison"] },
  { func = "@sext_i7_to_i8", args = ["0"], expect = ["1"] },
  { func = "@sext_i7_to_i16", args = ["63"], expect = ["poison"] },
  { func = "@sext_i7_to_i16", args = ["0"], expect = ["1"] },
  { func = "@sext_i7_to_i32", args = ["63"], expect = ["poison"] },
  { func = "@sext_i7_to_i32", args = ["0"], expect = ["1"] },
  { func = "@sext_i7_to_i33", args = ["63"], expect = ["poison"] },
  { func = "@sext_i7_to_i33", args = ["0"], expect = ["1"] },
  { func = "@sext_i7_to_i64", args = ["63"], expect = ["poison"] },
  { func = "@sext_i7_to_i64", args = ["0"], expect = ["1"] },
  { func = "@sext_i8_to_i16", args = ["127"], expect = ["poison"] },
  { func = "@sext_i8_to_i16", args = ["0"], expect = ["1"] },
  { func = "@sext_i8_to_i32", args = ["127"], expect = ["poison"] },
  { func = "@sext_i8_to_i32", args = ["0"], expect = ["1"] },
  { func = "@sext_i8_to_i33", args = ["127"], expect = ["poison"] },
  { func = "@sext_i8_to_i33", args = ["0"], expect = ["1"] },
  { func = "@sext_i8_to_i64", args = ["127"], expect = ["poison"] },
  { func = "@sext_i8_to_i64", args = ["0"], expect = ["1"] },
  { func = "@sext_i16_to_i32", args = ["32767"], expect = ["poison"] },
  { func = "@sext_i16_to_i32", args = ["0"], expect = ["1"] },
  { func = "@sext_i16_to_i33", args = ["32767"], expect = ["poison"] },
  { func = "@sext_i16_to_i33", args = ["0"], expect = ["1"] },
  { func = "@sext_i16_to_i64", args = ["32767"], expect = ["poison"] },
  { func = "@sext_i16_to_i64", args = ["0"], expect = ["1"] },
  { func = "@sext_i32_to_i33", args = ["2147483647"], expect = ["poison"] },
  { func = "@sext_i32_to_i33", args = ["0"], expect = ["1"] },
  { func = "@sext_i32_to_i64", args = ["2147483647"], expect = ["poison"] },
  { func = "@sext_i32_to_i64", args = ["0"], expect = ["1"] },
  { func = "@sext_i33_to_i64", args = ["4294967295"], expect = ["poison"] },
  { func = "@sext_i33_to_i64", args = ["0"], expect = ["1"] },
]
