# Tests of tracer-i16.fir: const, add and ret at i16.
# Each test is differential: fir-ref and native code run it, and the
# native result must refine fir-ref's.
tests = [
  { func = "@id", args = ["0"] },
  { func = "@id", args = ["1"] },
  { func = "@id", args = ["-1"] },
  { func = "@id", args = ["-32768"] },
  { func = "@id", args = ["32767"] },
  { func = "@add", args = ["0", "0"] },
  { func = "@add", args = ["0", "1"] },
  { func = "@add", args = ["0", "-1"] },
  { func = "@add", args = ["0", "-32768"] },
  { func = "@add", args = ["0", "32767"] },
  { func = "@add", args = ["1", "0"] },
  { func = "@add", args = ["1", "1"] },
  { func = "@add", args = ["1", "-1"] },
  { func = "@add", args = ["1", "-32768"] },
  { func = "@add", args = ["1", "32767"] },
  { func = "@add", args = ["-1", "0"] },
  { func = "@add", args = ["-1", "1"] },
  { func = "@add", args = ["-1", "-1"] },
  { func = "@add", args = ["-1", "-32768"] },
  { func = "@add", args = ["-1", "32767"] },
  { func = "@add", args = ["-32768", "0"] },
  { func = "@add", args = ["-32768", "1"] },
  { func = "@add", args = ["-32768", "-1"] },
  { func = "@add", args = ["-32768", "-32768"] },
  { func = "@add", args = ["-32768", "32767"] },
  { func = "@add", args = ["32767", "0"] },
  { func = "@add", args = ["32767", "1"] },
  { func = "@add", args = ["32767", "-1"] },
  { func = "@add", args = ["32767", "-32768"] },
  { func = "@add", args = ["32767", "32767"] },
  { func = "@double", args = ["0"] },
  { func = "@double", args = ["1"] },
  { func = "@double", args = ["-1"] },
  { func = "@double", args = ["-32768"] },
  { func = "@double", args = ["32767"] },
  { func = "@inc", args = ["0"] },
  { func = "@inc", args = ["1"] },
  { func = "@inc", args = ["-1"] },
  { func = "@inc", args = ["-32768"] },
  { func = "@inc", args = ["32767"] },
  { func = "@const_zero" },
  { func = "@const_one" },
  { func = "@const_minus_one" },
  { func = "@const_min" },
