  { func = "@sum8", args = ["32767", "1", "0", "0", "0", "0", "0", "0"] },
  { func = "@sum8", args = ["0", "0", "0", "0", "0", "0", "32767", "1"] },
  { func = "@sum8", args = ["-32768", "32767", "-1", "1", "0", "1", "-32768", "32767"] },
  { func = "@last", args = ["1", "2", "3", "4", "5", "6", "7", "-32768"] },
  { func = "@none", args = ["32767"] },
]
