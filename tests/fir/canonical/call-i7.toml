# Tests of call-i7.fir: call at i7 (#20), on the boundary bit patterns:
# 0, 1, -1, the signed minimum and the signed maximum. call_id passes
# its argument to @id and returns what @id returns, so each pattern goes
# into a call as an argument and comes back as its result. call_sub
# passes %a and %b, in that order, to @sub, which returns %a - %b, on
# every pair of patterns: an argument in the wrong place changes the
# result for every pair of different patterns but 0 and the signed
# minimum, and -1 and the signed maximum, which differ by 2^6, so that
# %a - %b is %b - %a.
# The backend does not lower i7, so each test is interpreter-only and
# states the result that fir-ref must give.
tests = [
  { func = "@call_id", args = ["0"], expect = ["0"] },
  { func = "@call_id", args = ["1"], expect = ["1"] },
  { func = "@call_id", args = ["-1"], expect = ["-1"] },
  { func = "@call_id", args = ["-64"], expect = ["-64"] },
  { func = "@call_id", args = ["63"], expect = ["63"] },
  { func = "@call_sub", args = ["0", "0"], expect = ["0"] },
  { func = "@call_sub", args = ["0", "1"], expect = ["-1"] },
  { func = "@call_sub", args = ["0", "-1"], expect = ["1"] },
  { func = "@call_sub", args = ["0", "-64"], expect = ["-64"] },
  { func = "@call_sub", args = ["0", "63"], expect = ["-63"] },
  { func = "@call_sub", args = ["1", "0"], expect = ["1"] },
  { func = "@call_sub", args = ["1", "1"], expect = ["0"] },
  { func = "@call_sub", args = ["1", "-1"], expect = ["2"] },
  { func = "@call_sub", args = ["1", "-64"], expect = ["-63"] },
  { func = "@call_sub", args = ["1", "63"], expect = ["-62"] },
  { func = "@call_sub", args = ["-1", "0"], expect = ["-1"] },
  { func = "@call_sub", args = ["-1", "1"], expect = ["-2"] },
  { func = "@call_sub", args = ["-1", "-1"], expect = ["0"] },
  { func = "@call_sub", args = ["-1", "-64"], expect = ["63"] },
  { func = "@call_sub", args = ["-1", "63"], expect = ["-64"] },
  { func = "@call_sub", args = ["-64", "0"], expect = ["-64"] },
  { func = "@call_sub", args = ["-64", "1"], expect = ["63"] },
  { func = "@call_sub", args = ["-64", "-1"], expect = ["-63"] },
  { func = "@call_sub", args = ["-64", "-64"], expect = ["0"] },
  { func = "@call_sub", args = ["-64", "63"], expect = ["1"] },
  { func = "@call_sub", args = ["63", "0"], expect = ["63"] },
  { func = "@call_sub", args = ["63", "1"], expect = ["62"] },
  { func = "@call_sub", args = ["63", "-1"], expect = ["-64"] },
  { func = "@call_sub", args = ["63", "-64"], expect = ["-1"] },
  { func = "@call_sub", args = ["63", "63"], expect = ["0"] },
]
