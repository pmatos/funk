# Tests of float-values-f32.fir: values of f32 passed through block
# arguments by br and cond_br, returned one and several at a time, and
# given by calls with one result and with several, each coming back as
# its bits: a NaN with its sign set and a payload, -0, 1 and the smallest
# subnormal, and poison (ADR-2026-11-11-1438, ADR-2026-11-03-0557).
# Each test is differential, but for those with expect: fir-ref and
# native code run it, and the native result must equal fir-ref's. A test
# with expect is interpreter-only, and fir-ref must give the result that
# it names.
tests = [
  { func = "@choose", args = ["true", "0xffc00001", "-0.0"] },
  { func = "@choose", args = ["true", "0xffc00001", "-0.0"], expect = ["0xffc00001"] },
  { func = "@choose", args = ["false", "0xffc00001", "-0.0"] },
  { func = "@choose", args = ["false", "0xffc00001", "-0.0"], expect = ["-0.0"] },
  { func = "@choose", args = ["false", "1.0", "poison"] },
  { func = "@choose", args = ["false", "1.0", "poison"], expect = ["poison"] },
  { func = "@swap", args = ["1.0", "1.0e-45"] },
  { func = "@swap", args = ["1.0", "1.0e-45"], expect = ["1.0e-45", "1.0"] },
  { func = "@calls", args = ["true", "0xffc00001", "1.0"] },
  { func = "@calls", args = ["true", "0xffc00001", "1.0"], expect = ["0xffc00001", "1.0", "0xffc00001"] },
  { func = "@calls", args = ["false", "1.0e-45", "-0.0"] },
  { func = "@calls", args = ["false", "1.0e-45", "-0.0"], expect = ["-0.0", "-0.0", "1.0e-45"] },
]
