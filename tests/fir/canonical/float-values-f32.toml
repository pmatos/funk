# Tests of float-values-f32.fir: values of f32 passed through block
# arguments by br and cond_br, returned one and several at a time, and
# given by calls with one result and with several, each coming back as
# its bits: a NaN with its sign set and a payload, -0, 1 and the smallest
# subnormal, and poison (ADR-2026-11-11-1138, ADR-2026-11-11-1141).
# Each test is differential, but for those with expect: fir-ref and
# native code run it, and the native result must equal fir-ref's. A test
# with expect is interpreter-only, and fir-ref must give the result that
# it names.
tests = [
  { func = "@choose", args = ["true", "-4194303", "-2147483648"] },
  { func = "@choose", args = ["true", "-4194303", "-2147483648"], expect = ["-4194303"] },
  { func = "@choose", args = ["false", "-4194303", "-2147483648"] },
  { func = "@choose", args = ["false", "-4194303", "-2147483648"], expect = ["-2147483648"] },
  { func = "@choose", args = ["false", "1065353216", "poison"] },
  { func = "@choose", args = ["false", "1065353216", "poison"], expect = ["poison"] },
  { func = "@swap", args = ["1065353216", "1"] },
  { func = "@swap", args = ["1065353216", "1"], expect = ["1", "1065353216"] },
  { func = "@calls", args = ["true", "-4194303", "1065353216"] },
  { func = "@calls", args = ["true", "-4194303", "1065353216"], expect = ["-4194303", "1065353216", "-4194303"] },
  { func = "@calls", args = ["false", "1", "-2147483648"] },
  { func = "@calls", args = ["false", "1", "-2147483648"], expect = ["-2147483648", "-2147483648", "1"] },
]
