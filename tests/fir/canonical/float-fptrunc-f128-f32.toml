  { func = "@f128_f32", args = ["0x7fff0000000000000000000000000001"], choices = ["-1"], expect = ["0xffffffff"] },
  { func = "@f128_f32", args = ["0xffffffffffffffffffffffffffffffff"], choices = ["1"], expect = ["0x7f800001"] },
  { func = "@f128_f32", args = ["poison"], expect = ["poison"] },
