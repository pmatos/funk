# Tests of float-fptrunc-f128-f32.fir: fptrunc from f128 to f32
# (ADR-2026-11-09-1549) on the edges of the source and of the target:
# zeros, subnormals, the largest finite values, the values halfway
# between two values of the target and next to them, overflow to
# infinity, underflow to zero, infinities and NaNs. Written by
# scripts/harness/float_convert_cases.py, which computes each expected
# result with scripts/harness/float_ref.py, apart from Lean.
# Each test is interpreter-only: the backend does not lower
# f128 and f32 both, so fir-ref alone runs it and must give what it
# expects.
# A NaN operand gives any NaN of the target: its test is
# interpreter-only and names the NaN by a choice of the sign and the
# mantissa. Native code is not compared on a NaN result yet (#219).
tests = [
  { func = "@f128_f32", args = ["0.0"], expect = ["0.0"] },
  { func = "@f128_f32", args = ["6.0e-4966"], expect = ["0.0"] },
  { func = "@f128_f32", args = ["3.362103143112093506262677817321752e-4932"], expect = ["0.0"] },
  { func = "@f128_f32", args = ["3.3621031431120935062626778173217526e-4932"], expect = ["0.0"] },
  { func = "@f128_f32", args = ["7.00649232162408535461864791644958e-46"], expect = ["0.0"] },
  { func = "@f128_f32", args = ["7.006492321624085354618647916449581e-46"], expect = ["0.0"] },
  { func = "@f128_f32", args = ["7.006492321624085354618647916449582e-46"], expect = ["1.0e-45"] },
  { func = "@f128_f32", args = ["1.4012984643248170709237295832899161e-45"], expect = ["1.0e-45"] },
  { func = "@f128_f32", args = ["2.101947696487225606385594374934874e-45"], expect = ["1.0e-45"] },
  { func = "@f128_f32", args = ["2.1019476964872256063855943749348742e-45"], expect = ["3.0e-45"] },
  { func = "@f128_f32", args = ["2.1019476964872256063855943749348745e-45"], expect = ["3.0e-45"] },
  { func = "@f128_f32", args = ["3.50324616081204267730932395822479e-45"], expect = ["3.0e-45"] },
