  { func = "@f128_f32", args = ["3.503246160812042677309323958224791e-45"], expect = ["4.0e-45"] },
  { func = "@f128_f32", args = ["1.1754943508222875079687365372222457e-38"], expect = ["1.1754944e-38"] },
  { func = "@f128_f32", args = ["1.0"], expect = ["1.0"] },
  { func = "@f128_f32", args = ["1.0000000596046447753906249999999998"], expect = ["1.0"] },
