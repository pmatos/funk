# Tests of fcmp-unordered-f64.fir: fcmp with each of its seven unordered
# predicates, ueq to uno, at f64 (ADR-2026-11-09-1549), on pairs of hard
# values: 1 and 2 in both orders, -0 and +0, the smallest subnormals of
# either sign against a zero, the largest finite values against the
# infinities, the infinities against themselves, and NaNs, quiet and
# signalling, with a payload and with the sign set, against numbers,
# infinities, zeros and each other. A float is spelled as the one float
# literal of its bits (ADR-2026-11-11-1438). A poison operand gives
# poison.
# Each test is differential, but for those with expect: fir-ref and
# native code run it, and the native result must equal fir-ref's. A test
# with expect is interpreter-only, and fir-ref must give the result that
# scripts/harness/float_ref.py computed apart from Lean.
