# Tests of select-i33.fir: select at i33 with each condition, false and
# true, on every pair of boundary bit patterns: 0, 1, -1, the signed
# minimum and the signed maximum (#16). true chooses the first value and
# false the second.
# The backend does not lower i33, so each test is interpreter-only and
# states the result that fir-ref must give.
tests = [
  { func = "@select", args = ["false", "0", "0"], expect = ["0"] },
  { func = "@select", args = ["false", "0", "1"], expect = ["1"] },
  { func = "@select", args = ["false", "0", "-1"], expect = ["-1"] },
  { func = "@select", args = ["false", "0", "-4294967296"], expect = ["-4294967296"] },
  { func = "@select", args = ["false", "0", "4294967295"], expect = ["4294967295"] },
  { func = "@select", args = ["false", "1", "0"], expect = ["0"] },
  { func = "@select", args = ["false", "1", "1"], expect = ["1"] },
  { func = "@select", args = ["false", "1", "-1"], expect = ["-1"] },
  { func = "@select", args = ["false", "1", "-4294967296"], expect = ["-4294967296"] },
  { func = "@select", args = ["false", "1", "4294967295"], expect = ["4294967295"] },
  { func = "@select", args = ["false", "-1", "0"], expect = ["0"] },
  { func = "@select", args = ["false", "-1", "1"], expect = ["1"] },
  { func = "@select", args = ["false", "-1", "-1"], expect = ["-1"] },
  { func = "@select", args = ["false", "-1", "-4294967296"], expect = ["-4294967296"] },
  { func = "@select", args = ["false", "-1", "4294967295"], expect = ["4294967295"] },
  { func = "@select", args = ["false", "-4294967296", "0"], expect = ["0"] },
  { func = "@select", args = ["false", "-4294967296", "1"], expect = ["1"] },
  { func = "@select", args = ["false", "-4294967296", "-1"], expect = ["-1"] },
  { func = "@select", args = ["false", "-4294967296", "-4294967296"], expect = ["-4294967296"] },
  { func = "@select", args = ["false", "-4294967296", "4294967295"], expect = ["4294967295"] },
  { func = "@select", args = ["false", "4294967295", "0"], expect = ["0"] },
  { func = "@select", args = ["false", "4294967295", "1"], expect = ["1"] },
  { func = "@select", args = ["false", "4294967295", "-1"], expect = ["-1"] },
  { func = "@select", args = ["false", "4294967295", "-4294967296"], expect = ["-4294967296"] },
  { func = "@select", args = ["false", "4294967295", "4294967295"], expect = ["4294967295"] },
  { func = "@select", args = ["true", "0", "0"], expect = ["0"] },
  { func = "@select", args = ["true", "0", "1"], expect = ["0"] },
  { func = "@select", args = ["true", "0", "-1"], expect = ["0"] },
  { func = "@select", args = ["true", "0", "-4294967296"], expect = ["0"] },
  { func = "@select", args = ["true", "0", "4294967295"], expect = ["0"] },
  { func = "@select", args = ["true", "1", "0"], expect = ["1"] },
  { func = "@select", args = ["true", "1", "1"], expect = ["1"] },
  { func = "@select", args = ["true", "1", "-1"], expect = ["1"] },
  { func = "@select", args = ["true", "1", "-4294967296"], expect = ["1"] },
  { func = "@select", args = ["true", "1", "4294967295"], expect = ["1"] },
  { func = "@select", args = ["true", "-1", "0"], expect = ["-1"] },
  { func = "@select", args = ["true", "-1", "1"], expect = ["-1"] },
  { func = "@select", args = ["true", "-1", "-1"], expect = ["-1"] },
  { func = "@select", args = ["true", "-1", "-4294967296"], expect = ["-1"] },
  { func = "@select", args = ["true", "-1", "4294967295"], expect = ["-1"] },
  { func = "@select", args = ["true", "-4294967296", "0"], expect = ["-4294967296"] },
  { func = "@select", args = ["true", "-4294967296", "1"], expect = ["-4294967296"] },
  { func = "@select", args = ["true", "-4294967296", "-1"], expect = ["-4294967296"] },
  { func = "@select", args = ["true", "-4294967296", "-4294967296"], expect = ["-4294967296"] },
  { func = "@select", args = ["true", "-4294967296", "4294967295"], expect = ["-4294967296"] },
  { func = "@select", args = ["true", "4294967295", "0"], expect = ["4294967295"] },
  { func = "@select", args = ["true", "4294967295", "1"], expect = ["4294967295"] },
  { func = "@select", args = ["true", "4294967295", "-1"], expect = ["4294967295"] },
  { func = "@select", args = ["true", "4294967295", "-4294967296"], expect = ["4294967295"] },
  { func = "@select", args = ["true", "4294967295", "4294967295"], expect = ["4294967295"] },
]
