# Tests of float-memory.fir: load and store take a float of any format as
# their value, and alloca allocates floats (#264; the human's ruling of
# 2026-11-15 on #397). A float takes the units of the integer of its
# 1 + e + m bits and is stored as its IEEE bit pattern, so it loads back
# as the same float, a NaN's payload and sign included, at every aliased
# format and at float(2, 1), whose 4 bits take one byte with the top 4
# bits zero; a float loaded as the integer of its width gives its bits,
# and an integer loaded as a float gives the float with its bits
# (ADR-2026-11-12-2125). The bytes are in little-endian order, so byte 3
# of an f32 holds its sign. A NaN that fsub chooses keeps its bits through
# memory. A float is aligned to the natural alignment of its size: an f64
# at offset 4 is UB unless the access writes align(4), and an f32 in an
# allocation of bytes is UB. A float load from fresh memory or from a
# pointer's fragments gives poison, a stored poison loads as poison, and a
# poison pointer is UB. In memory 1, of 16-bit units, an f32 takes two
# units, the second holding its top 16 bits, and an f64 four, aligned to
# 4. The backend does not lower f16, bf16, f128, float(2, 1) or a memory
# of 16-bit units, so every test is interpreter-only;
# float-memory-native.fir runs f32 and f64 natively.
tests = [
  { func = "@round_f16", args = ["1.0"], expect = ["1.0"] },
  { func = "@round_f16", args = ["0xfe01"], expect = ["0xfe01"] },
  { func = "@round_f16", args = ["-0.0"], expect = ["-0.0"] },
  { func = "@round_bf16", args = ["0x7fc1"], expect = ["0x7fc1"] },
  { func = "@round_bf16", args = ["0xff80"], expect = ["0xff80"] },
  { func = "@round_f32", args = ["1.5"], expect = ["1.5"] },
  { func = "@round_f32", args = ["0xffc00123"], expect = ["0xffc00123"] },
  { func = "@round_f32", args = ["0x7f800001"], expect = ["0x7f800001"] },
  { func = "@round_f32", args = ["poison"], expect = ["poison"] },
  { func = "@round_f64", args = ["0.1"], expect = ["0.1"] },
  { func = "@round_f64", args = ["0x7ff0000000000001"], expect = ["0x7ff0000000000001"] },
  { func = "@round_f64", args = ["-0.0"], expect = ["-0.0"] },
  { func = "@round_f128", args = ["1.0"], expect = ["1.0"] },
  { func = "@round_f128", args = ["0x7fff8000000000000000000000000001"], expect = ["0x7fff8000000000000000000000000001"] },
  { func = "@round_tiny", args = ["3.0"], expect = ["3.0"] },
  { func = "@round_tiny", args = ["0xf"], expect = ["0xf"] },
  { func = "@round_tiny", args = ["-1.5"], expect = ["-1.5"] },
  { func = "@f16_bits", args = ["1.0"], expect = ["15360"] },
  { func = "@f16_bits", args = ["0x7c01"], expect = ["31745"] },
  { func = "@bf16_of_bits", args = ["-32768"], expect = ["-0.0"] },
  { func = "@bf16_of_bits", args = ["32705"], expect = ["0x7fc1"] },
  { func = "@f32_bits", args = ["1.0"], expect = ["1065353216"] },
  { func = "@f32_bits", args = ["0x7fc00001"], expect = ["2143289345"] },
  { func = "@f32_bits", args = ["0xff800000"], expect = ["-8388608"] },
  { func = "@f32_bits", args = ["poison"], expect = ["poison"] },
  { func = "@f32_of_bits", args = ["1065353216"], expect = ["1.0"] },
  { func = "@f32_of_bits", args = ["-4194304"], expect = ["0xffc00000"] },
  { func = "@f32_of_bits", args = ["2139095041"], expect = ["0x7f800001"] },
  { func = "@f64_bits", args = ["0x7ff8000000000001"], expect = ["9221120237041090561"] },
  { func = "@f64_bits", args = ["-2.0"], expect = ["-4611686018427387904"] },
  { func = "@f64_of_bits", args = ["-9223372036854775808"], expect = ["-0.0"] },
  { func = "@f64_of_bits", args = ["9221120237041090561"], expect = ["0x7ff8000000000001"] },
  { func = "@f128_bits", args = ["0xffff0000000000000000000000000000"], expect = ["-5192296858534827628530496329220096"] },
  { func = "@f128_bits", args = ["1.0"], expect = ["85065399433376081038215121361612832768"] },
  { func = "@tiny_byte", args = ["0xf"], expect = ["15"] },
  { func = "@tiny_byte", args = ["-1.5"], expect = ["11"] },
  { func = "@tiny_of_byte", args = ["-91"], expect = ["3.0"] },
  { func = "@tiny_of_byte", args = ["15"], expect = ["0xf"] },
  { func = "@f32_top_byte", args = ["0xffc00123"], expect = ["-1"] },
  { func = "@f32_top_byte", args = ["1.0"], expect = ["63"] },
  { func = "@nan_constant", expect = ["0xffc00123"] },
  { func = "@nan_result", args = ["1.0", "0.5"], expect = ["0.5"] },
  { func = "@nan_result", args = ["0x7ff0000000000000", "0x7ff0000000000000"], choices = ["0"], expect = ["0x7ff8000000000000"] },
  { func = "@nan_result", args = ["0x7ff0000000000000", "0x7ff0000000000000"], choices = ["-1"], expect = ["0xffffffffffffffff"] },
  { func = "@at_index", args = ["2.5", "0"], expect = ["2.5"] },
  { func = "@at_index", args = ["2.5", "8"], expect = ["2.5"] },
  { func = "@at_index", args = ["2.5", "12"], expect = "ub" },
  { func = "@at_index", args = ["2.5", "2"], expect = "ub" },
  { func = "@at_offset", args = ["0x7ff8000000000001", "8"], expect = ["0x7ff8000000000001"] },
  { func = "@at_offset", args = ["1.0", "4"], expect = "ub" },
  { func = "@at_offset_four", args = ["1.0", "4"], expect = ["1.0"] },
  { func = "@at_offset_four", args = ["1.0", "12"], expect = "ub" },
  { func = "@in_bytes", args = ["1.0"], expect = "ub" },
  { func = "@fresh", expect = ["poison"] },
  { func = "@pointer_units", expect = ["poison"] },
  { func = "@stored_poison", args = ["poison"], expect = ["poison"] },
  { func = "@load_through", args = ["poison"], expect = "ub" },
  { func = "@store_through", args = ["poison", "1.0"], expect = "ub" },
  { func = "@in_units", args = ["0x7fc00123"], expect = ["32704"] },
  { func = "@in_units", args = ["1.0"], expect = ["16256"] },
  { func = "@round_in_units", args = ["0x7ff0000000000001"], expect = ["0x7ff0000000000001"] },
  { func = "@round_in_units", args = ["poison"], expect = ["poison"] },
  { func = "@misaligned_in_units", args = ["1.0"], expect = "ub" },
]
