  { func = "@sdiv_left", args = ["170141183460469231731687303715884105727", "0"], expect = "ub" },
  { func = "@sdiv_left", args = ["170141183460469231731687303715884105727", "1"], expect = ["poison"] },
  { func = "@sdiv_left", args = ["170141183460469231731687303715884105727", "-1"], expect = "ub" },
