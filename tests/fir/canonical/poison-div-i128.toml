# Tests of poison-div-i128.fir: the poison and UB rules of sdiv and
# udiv, each with and without exact, srem and urem at i128 (#22). %p =
# add nsw %a, 1 is poison when %a is the signed maximum,
# 170141183460469231731687303715884105727; OP_left returns OP %p, %b,
# OP_right returns OP %b, %p and OP_both returns OP %p, %p, and each test
# passes that value as %a. The divisors %b are 0, 1, -1, the signed
# minimum and maximum, 2^64 + 1 and -2^64 - 3.
# - A poison divisor is UB, whatever the dividend: OP_right on each %b,
#   and OP_both, whose dividend is poison too.
# - A poison dividend, OP_left by each %b: a zero divisor is UB, and so
#   are sdiv and srem by -1, as the dividend might be the signed minimum;
#   every other divisor gives poison, udiv and urem by all ones included.
# Each test is interpreter-only and states the result that fir-ref must
# give: poison, or ub. fir-ref's UB reason names its case, such as "udiv
# by poison" or "srem of poison by -1", but the harness matches ub to any
# reason (ADR-2026-10-30-2135).
