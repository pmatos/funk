# Tests of freeze-i33.fir: freeze at i33. freeze of a value gives it,
# with no choice; freeze of poison chooses a value, the same for every
# use (#14). %p = add nsw %a, 1 is poison when %a is the signed
# maximum, true at i1, and %f freezes it.
# The backend does not lower i33, so each test is interpreter-only:
# its choices name the path, and it states the result of that path.
tests = [
  { func = "@freeze", args = ["0"], expect = ["0"] },
  { func = "@freeze", args = ["1"], expect = ["1"] },
  { func = "@freeze", args = ["-1"], expect = ["-1"] },
  { func = "@freeze", args = ["-4294967296"], expect = ["-4294967296"] },
  { func = "@freeze", args = ["4294967295"], expect = ["4294967295"] },
  { func = "@freeze_poison", args = ["4294967295"], choices = ["0"], expect = ["0"] },
  { func = "@freeze_sub", args = ["4294967295"], choices = ["0"], expect = ["0"] },
  { func = "@freeze_add", args = ["4294967295"], choices = ["0"], expect = ["0"] },
  { func = "@freeze_mul_zero", args = ["4294967295"], choices = ["0"], expect = ["0"] },
  { func = "@freeze_square", args = ["4294967295"], choices = ["0"], expect = ["0"] },
  { func = "@freeze_double", args = ["4294967295"], choices = ["0"], expect = ["0"] },
  { func = "@freeze_poison", args = ["4294967295"], choices = ["1"], expect = ["1"] },
  { func = "@freeze_sub", args = ["4294967295"], choices = ["1"], expect = ["0"] },
  { func = "@freeze_add", args = ["4294967295"], choices = ["1"], expect = ["2"] },
  { func = "@freeze_mul_zero", args = ["4294967295"], choices = ["1"], expect = ["0"] },
  { func = "@freeze_square", args = ["4294967295"], choices = ["1"], expect = ["1"] },
  { func = "@freeze_double", args = ["4294967295"], choices = ["1"], expect = ["0"] },
  { func = "@freeze_poison", args = ["4294967295"], choices = ["-1"], expect = ["-1"] },
  { func = "@freeze_sub", args = ["4294967295"], choices = ["-1"], expect = ["0"] },
  { func = "@freeze_add", args = ["4294967295"], choices = ["-1"], expect = ["-2"] },
  { func = "@freeze_mul_zero", args = ["4294967295"], choices = ["-1"], expect = ["0"] },
  { func = "@freeze_square", args = ["4294967295"], choices = ["-1"], expect = ["1"] },
  { func = "@freeze_double", args = ["4294967295"], choices = ["-1"], expect = ["0"] },
  { func = "@freeze_poison", args = ["4294967295"], choices = ["-4294967296"], expect = ["-4294967296"] },
  { func = "@freeze_sub", args = ["4294967295"], choices = ["-4294967296"], expect = ["0"] },
  { func = "@freeze_add", args = ["4294967295"], choices = ["-4294967296"], expect = ["0"] },
  { func = "@freeze_mul_zero", args = ["4294967295"], choices = ["-4294967296"], expect = ["0"] },
  { func = "@freeze_square", args = ["4294967295"], choices = ["-4294967296"], expect = ["poison"] },
  { func = "@freeze_double", args = ["4294967295"], choices = ["-4294967296"], expect = ["0"] },
  { func = "@freeze_poison", args = ["4294967295"], choices = ["4294967295"], expect = ["4294967295"] },
  { func = "@freeze_sub", args = ["4294967295"], choices = ["4294967295"], expect = ["0"] },
  { func = "@freeze_add", args = ["4294967295"], choices = ["4294967295"], expect = ["-2"] },
  { func = "@freeze_mul_zero", args = ["4294967295"], choices = ["4294967295"], expect = ["0"] },
  { func = "@freeze_square", args = ["4294967295"], choices = ["4294967295"], expect = ["poison"] },
  { func = "@freeze_double", args = ["4294967295"], choices = ["4294967295"], expect = ["0"] },
  { func = "@freeze_poison", args = ["4294967295"], choices = ["4242424242"], expect = ["4242424242"] },
  { func = "@freeze_sub", args = ["4294967295"], choices = ["4242424242"], expect = ["0"] },
  { func = "@freeze_add", args = ["4294967295"], choices = ["4242424242"], expect = ["-105086108"] },
  { func = "@freeze_mul_zero", args = ["4294967295"], choices = ["4242424242"], expect = ["0"] },
  { func = "@freeze_square", args = ["4294967295"], choices = ["4242424242"], expect = ["poison"] },
  { func = "@freeze_double", args = ["4294967295"], choices = ["4242424242"], expect = ["0"] },
  { func = "@freeze_twice", args = ["4294967295"], choices = ["0", "0"], expect = ["0"] },
  { func = "@freeze_twice", args = ["4294967295"], choices = ["1", "-1"], expect = ["2"] },
  { func = "@freeze_twice", args = ["4294967295"], choices = ["-4294967296", "4294967295"], expect = ["1"] },
  { func = "@freeze_twice", args = ["4294967295"], choices = ["4294967295", "-4294967296"], expect = ["-1"] },
  { func = "@freeze_poison", args = ["0"], expect = ["1"] },
]
