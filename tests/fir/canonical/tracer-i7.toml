# Tests of tracer-i7.fir: const, add and ret at i7.
# The backend does not lower i7, so each test is interpreter-only and
# states the result that fir-ref must give.
tests = [
  { func = "@id", args = ["0"], expect = ["0"] },
  { func = "@id", args = ["1"], expect = ["1"] },
  { func = "@id", args = ["-1"], expect = ["-1"] },
  { func = "@id", args = ["-64"], expect = ["-64"] },
  { func = "@id", args = ["63"], expect = ["63"] },
  { func = "@add", args = ["0", "0"], expect = ["0"] },
  { func = "@add", args = ["0", "1"], expect = ["1"] },
  { func = "@add", args = ["0", "-1"], expect = ["-1"] },
  { func = "@add", args = ["0", "-64"], expect = ["-64"] },
  { func = "@add", args = ["0", "63"], expect = ["63"] },
  { func = "@add", args = ["1", "0"], expect = ["1"] },
  { func = "@add", args = ["1", "1"], expect = ["2"] },
  { func = "@add", args = ["1", "-1"], expect = ["0"] },
  { func = "@add", args = ["1", "-64"], expect = ["-63"] },
  { func = "@add", args = ["1", "63"], expect = ["-64"] },
  { func = "@add", args = ["-1", "0"], expect = ["-1"] },
  { func = "@add", args = ["-1", "1"], expect = ["0"] },
  { func = "@add", args = ["-1", "-1"], expect = ["-2"] },
  { func = "@add", args = ["-1", "-64"], expect = ["63"] },
  { func = "@add", args = ["-1", "63"], expect = ["62"] },
  { func = "@add", args = ["-64", "0"], expect = ["-64"] },
  { func = "@add", args = ["-64", "1"], expect = ["-63"] },
  { func = "@add", args = ["-64", "-1"], expect = ["63"] },
  { func = "@add", args = ["-64", "-64"], expect = ["0"] },
  { func = "@add", args = ["-64", "63"], expect = ["-1"] },
  { func = "@add", args = ["63", "0"], expect = ["63"] },
  { func = "@add", args = ["63", "1"], expect = ["-64"] },
  { func = "@add", args = ["63", "-1"], expect = ["62"] },
  { func = "@add", args = ["63", "-64"], expect = ["-1"] },
  { func = "@add", args = ["63", "63"], expect = ["-2"] },
  { func = "@double", args = ["0"], expect = ["0"] },
  { func = "@double", args = ["1"], expect = ["2"] },
  { func = "@double", args = ["-1"], expect = ["-2"] },
  { func = "@double", args = ["-64"], expect = ["0"] },
  { func = "@double", args = ["63"], expect = ["-2"] },
  { func = "@inc", args = ["0"], expect = ["1"] },
  { func = "@inc", args = ["1"], expect = ["2"] },
  { func = "@inc", args = ["-1"], expect = ["0"] },
  { func = "@inc", args = ["-64"], expect = ["-63"] },
  { func = "@inc", args = ["63"], expect = ["-64"] },
  { func = "@const_zero", expect = ["0"] },
  { func = "@const_one", expect = ["1"] },
  { func = "@const_minus_one", expect = ["-1"] },
  { func = "@const_min", expect = ["-64"] },
  { func = "@const_max", expect = ["63"] },
  { func = "@sum8", args = ["1", "1", "1", "1", "1", "1", "1", "1"], expect = ["8"] },
  { func = "@sum8", args = ["63", "1", "0", "0", "0", "0", "0", "0"], expect = ["-64"] },
  { func = "@sum8", args = ["0", "0", "0", "0", "0", "0", "63", "1"], expect = ["-64"] },
  { func = "@sum8", args = ["-64", "63", "-1", "1", "0", "1", "-64", "63"], expect = ["-1"] },
  { func = "@last", args = ["1", "2", "3", "4", "5", "6", "7", "-64"], expect = ["-64"] },
  { func = "@none", args = ["63"], expect = [] },
  { func = "@sum8", args = ["1", "1", "1", "1", "1", "1", "1", "1"], fuel = 7, expect = "fuel-exhausted" }, # 8 ops need 8 steps
  { func = "@sum8", args = ["1", "1", "1", "1", "1", "1", "1", "1"], fuel = 8, expect = ["8"] },
]
