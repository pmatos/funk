# Tests of tracer-i128.fir: const, add and ret at i128.
# The backend does not lower i128, so each test is interpreter-only and
# states the result that fir-ref must give.
tests = [
  { func = "@id", args = ["0"], expect = ["0"] },
  { func = "@id", args = ["1"], expect = ["1"] },
  { func = "@id", args = ["-1"], expect = ["-1"] },
  { func = "@id", args = ["-170141183460469231731687303715884105728"], expect = ["-170141183460469231731687303715884105728"] },
  { func = "@id", args = ["170141183460469231731687303715884105727"], expect = ["170141183460469231731687303715884105727"] },
  { func = "@add", args = ["0", "0"], expect = ["0"] },
  { func = "@add", args = ["0", "1"], expect = ["1"] },
  { func = "@add", args = ["0", "-1"], expect = ["-1"] },
  { func = "@add", args = ["0", "-170141183460469231731687303715884105728"], expect = ["-170141183460469231731687303715884105728"] },
  { func = "@add", args = ["0", "170141183460469231731687303715884105727"], expect = ["170141183460469231731687303715884105727"] },
  { func = "@add", args = ["1", "0"], expect = ["1"] },
  { func = "@add", args = ["1", "1"], expect = ["2"] },
  { func = "@add", args = ["1", "-1"], expect = ["0"] },
  { func = "@add", args = ["1", "-170141183460469231731687303715884105728"], expect = ["-170141183460469231731687303715884105727"] },
  { func = "@add", args = ["1", "170141183460469231731687303715884105727"], expect = ["-170141183460469231731687303715884105728"] },
  { func = "@add", args = ["-1", "0"], expect = ["-1"] },
  { func = "@add", args = ["-1", "1"], expect = ["0"] },
  { func = "@add", args = ["-1", "-1"], expect = ["-2"] },
  { func = "@add", args = ["-1", "-170141183460469231731687303715884105728"], expect = ["170141183460469231731687303715884105727"] },
  { func = "@add", args = ["-1", "170141183460469231731687303715884105727"], expect = ["170141183460469231731687303715884105726"] },
  { func = "@add", args = ["-170141183460469231731687303715884105728", "0"], expect = ["-170141183460469231731687303715884105728"] },
  { func = "@add", args = ["-170141183460469231731687303715884105728", "1"], expect = ["-170141183460469231731687303715884105727"] },
  { func = "@add", args = ["-170141183460469231731687303715884105728", "-1"], expect = ["170141183460469231731687303715884105727"] },
  { func = "@add", args = ["-170141183460469231731687303715884105728", "-170141183460469231731687303715884105728"], expect = ["0"] },
  { func = "@add", args = ["-170141183460469231731687303715884105728", "170141183460469231731687303715884105727"], expect = ["-1"] },
  { func = "@add", args = ["170141183460469231731687303715884105727", "0"], expect = ["170141183460469231731687303715884105727"] },
  { func = "@add", args = ["170141183460469231731687303715884105727", "1"], expect = ["-170141183460469231731687303715884105728"] },
  { func = "@add", args = ["170141183460469231731687303715884105727", "-1"], expect = ["170141183460469231731687303715884105726"] },
  { func = "@add", args = ["170141183460469231731687303715884105727", "-170141183460469231731687303715884105728"], expect = ["-1"] },
  { func = "@add", args = ["170141183460469231731687303715884105727", "170141183460469231731687303715884105727"], expect = ["-2"] },
  { func = "@double", args = ["0"], expect = ["0"] },
  { func = "@double", args = ["1"], expect = ["2"] },
  { func = "@double", args = ["-1"], expect = ["-2"] },
  { func = "@double", args = ["-170141183460469231731687303715884105728"], expect = ["0"] },
  { func = "@double", args = ["170141183460469231731687303715884105727"], expect = ["-2"] },
  { func = "@inc", args = ["0"], expect = ["1"] },
  { func = "@inc", args = ["1"], expect = ["2"] },
  { func = "@inc", args = ["-1"], expect = ["0"] },
  { func = "@inc", args = ["-170141183460469231731687303715884105728"], expect = ["-170141183460469231731687303715884105727"] },
  { func = "@inc", args = ["170141183460469231731687303715884105727"], expect = ["-170141183460469231731687303715884105728"] },
  { func = "@const_zero", expect = ["0"] },
  { func = "@const_one", expect = ["1"] },
  { func = "@const_minus_one", expect = ["-1"] },
  { func = "@const_min", expect = ["-170141183460469231731687303715884105728"] },
  { func = "@const_max", expect = ["170141183460469231731687303715884105727"] },
  { func = "@sum8", args = ["1", "1", "1", "1", "1", "1", "1", "1"], expect = ["8"] },
  { func = "@sum8", args = ["170141183460469231731687303715884105727", "1", "0", "0", "0", "0", "0", "0"], expect = ["-170141183460469231731687303715884105728"] },
  { func = "@sum8", args = ["0", "0", "0", "0", "0", "0", "170141183460469231731687303715884105727", "1"], expect = ["-170141183460469231731687303715884105728"] },
  { func = "@sum8", args = ["-170141183460469231731687303715884105728", "170141183460469231731687303715884105727", "-1", "1", "0", "1", "-170141183460469231731687303715884105728", "170141183460469231731687303715884105727"], expect = ["-1"] },
  { func = "@last", args = ["1", "2", "3", "4", "5", "6", "7", "-170141183460469231731687303715884105728"], expect = ["-170141183460469231731687303715884105728"] },
  { func = "@none", args = ["170141183460469231731687303715884105727"], expect = [] },
  { func = "@sum8", args = ["1", "1", "1", "1", "1", "1", "1", "1"], fuel = 7, expect = "fuel-exhausted" }, # 8 ops need 8 steps
  { func = "@sum8", args = ["1", "1", "1", "1", "1", "1", "1", "1"], fuel = 8, expect = ["8"] },
]
