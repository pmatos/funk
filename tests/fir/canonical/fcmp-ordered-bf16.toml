  { func = "@oeq", args = ["0xff80", "0xff80"], expect = ["true"] },
  { func = "@oeq", args = ["-1.0", "1.0"], expect = ["false"] },
  { func = "@oeq", args = ["0x7fc0", "1.0"], expect = ["false"] },
  { func = "@oeq", args = ["1.0", "0x7fc0"], expect = ["false"] },
