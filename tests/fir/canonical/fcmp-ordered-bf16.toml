# Tests of fcmp-ordered-bf16.fir: fcmp with each of its seven ordered
# predicates, oeq to ord, at bf16 (ADR-2026-11-11-1139), on pairs of
# hard values: 1 and 2 in both orders, -0 and +0, the smallest
# subnormals of either sign against a zero, the largest finite values
# against the infinities, the infinities against themselves, and NaNs,
# quiet and signalling, with a payload and with the sign set, against
# numbers, infinities, zeros and each other. A float is spelled as its
# bits read as a signed integer (ADR-2026-11-11-1138). A poison operand
# gives poison.
# Each test is interpreter-only: the backend does not lower bf16, so
# fir-ref alone runs it and must give the result it expects, which
# scripts/harness/float_ref.py computed apart from Lean.
tests = [
  { func = "@oeq", args = ["16256", "16384"], expect = ["false"] },
  { func = "@oeq", args = ["16384", "16256"], expect = ["false"] },
  { func = "@oeq", args = ["16256", "16256"], expect = ["true"] },
  { func = "@oeq", args = ["-32768", "0"], expect = ["true"] },
  { func = "@oeq", args = ["0", "-32768"], expect = ["true"] },
  { func = "@oeq", args = ["1", "0"], expect = ["false"] },
  { func = "@oeq", args = ["-32767", "-32768"], expect = ["false"] },
  { func = "@oeq", args = ["32639", "32640"], expect = ["false"] },
  { func = "@oeq", args = ["-128", "-129"], expect = ["false"] },
  { func = "@oeq", args = ["32640", "32640"], expect = ["true"] },
  { func = "@oeq", args = ["-128", "-128"], expect = ["true"] },
  { func = "@oeq", args = ["-16512", "16256"], expect = ["false"] },
  { func = "@oeq", args = ["32704", "16256"], expect = ["false"] },
  { func = "@oeq", args = ["16256", "32704"], expect = ["false"] },
