# Tests of fcmp-ordered-bf16.fir: fcmp with each of its seven ordered
# predicates, oeq to ord, at bf16 (ADR-2026-11-11-1139), on pairs of
# hard values: 1 and 2 in both orders, -0 and +0, the smallest
# subnormals of either sign against a zero, the largest finite values
# against the infinities, the infinities against themselves, and NaNs,
# quiet and signalling, with a payload and with the sign set, against
# numbers, infinities, zeros and each other. A float is spelled as the one
# float literal of its bits (ADR-2026-11-11-1438). A poison operand
# gives poison.
# Each test is interpreter-only: the backend does not lower bf16, so
# fir-ref alone runs it and must give the result it expects, which
# scripts/harness/float_ref.py computed apart from Lean.
tests = [
  { func = "@oeq", args = ["1.0", "2.0"], expect = ["false"] },
  { func = "@oeq", args = ["2.0", "1.0"], expect = ["false"] },
  { func = "@oeq", args = ["1.0", "1.0"], expect = ["true"] },
  { func = "@oeq", args = ["-0.0", "0.0"], expect = ["true"] },
  { func = "@oeq", args = ["0.0", "-0.0"], expect = ["true"] },
  { func = "@oeq", args = ["9.0e-41", "0.0"], expect = ["false"] },
  { func = "@oeq", args = ["-9.0e-41", "-0.0"], expect = ["false"] },
  { func = "@oeq", args = ["3.39e38", "0x7f80"], expect = ["false"] },
  { func = "@oeq", args = ["0xff80", "-3.39e38"], expect = ["false"] },
