# Tests of mul-i32.fir: mul at i32, with each set of its
# flags, on every pair of boundary bit patterns: 0, 1, -1, the signed
# minimum and the signed maximum, or false and true at i1. A broken
# flag gives poison (#14).
# Each test without expect is differential: fir-ref and native code run
# it, and the native result must refine fir-ref's; where fir-ref returns
# poison, any value of the type does.
tests = [
  { func = "@mul", args = ["0", "0"] },
  { func = "@mul", args = ["0", "1"] },
  { func = "@mul", args = ["0", "-1"] },
  { func = "@mul", args = ["0", "-2147483648"] },
  { func = "@mul", args = ["0", "2147483647"] },
  { func = "@mul", args = ["1", "0"] },
  { func = "@mul", args = ["1", "1"] },
  { func = "@mul", args = ["1", "-1"] },
  { func = "@mul", args = ["1", "-2147483648"] },
  { func = "@mul", args = ["1", "2147483647"] },
  { func = "@mul", args = ["-1", "0"] },
  { func = "@mul", args = ["-1", "1"] },
  { func = "@mul", args = ["-1", "-1"] },
  { func = "@mul", args = ["-1", "-2147483648"] },
  { func = "@mul", args = ["-1", "2147483647"] },
  { func = "@mul", args = ["-2147483648", "0"] },
  { func = "@mul", args = ["-2147483648", "1"] },
  { func = "@mul", args = ["-2147483648", "-1"] },
  { func = "@mul", args = ["-2147483648", "-2147483648"] },
  { func = "@mul", args = ["-2147483648", "2147483647"] },
  { func = "@mul", args = ["2147483647", "0"] },
  { func = "@mul", args = ["2147483647", "1"] },
  { func = "@mul", args = ["2147483647", "-1"] },
  { func = "@mul", args = ["2147483647", "-2147483648"] },
  { func = "@mul", args = ["2147483647", "2147483647"] },
  { func = "@mul_nuw", args = ["0", "0"] },
  { func = "@mul_nuw", args = ["0", "1"] },
  { func = "@mul_nuw", args = ["0", "-1"] },
  { func = "@mul_nuw", args = ["0", "-2147483648"] },
  { func = "@mul_nuw", args = ["0", "2147483647"] },
  { func = "@mul_nuw", args = ["1", "0"] },
  { func = "@mul_nuw", args = ["1", "1"] },
  { func = "@mul_nuw", args = ["1", "-1"] },
  { func = "@mul_nuw", args = ["1", "-2147483648"] },
  { func = "@mul_nuw", args = ["1", "2147483647"] },
  { func = "@mul_nuw", args = ["-1", "0"] },
  { func = "@mul_nuw", args = ["-1", "1"] },
  { func = "@mul_nuw", args = ["-1", "-1"] },
  { func = "@mul_nuw", args = ["-1", "-2147483648"] },
  { func = "@mul_nuw", args = ["-1", "2147483647"] },
  { func = "@mul_nuw", args = ["-2147483648", "0"] },
  { func = "@mul_nuw", args = ["-2147483648", "1"] },
  { func = "@mul_nuw", args = ["-2147483648", "-1"] },
  { func = "@mul_nuw", args = ["-2147483648", "-2147483648"] },
  { func = "@mul_nuw", args = ["-2147483648", "2147483647"] },
  { func = "@mul_nuw", args = ["2147483647", "0"] },
  { func = "@mul_nuw", args = ["2147483647", "1"] },
  { func = "@mul_nuw", args = ["2147483647", "-1"] },
  { func = "@mul_nuw", args = ["2147483647", "-2147483648"] },
  { func = "@mul_nuw", args = ["2147483647", "2147483647"] },
  { func = "@mul_nsw", args = ["0", "0"] },
