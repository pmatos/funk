  { func = "@mul_nuw_nsw", args = ["1", "1"] },
  { func = "@mul_nuw_nsw", args = ["1", "-1"] },
  { func = "@mul_nuw_nsw", args = ["1", "-2147483648"] },
  { func = "@mul_nuw_nsw", args = ["1", "2147483647"] },
  { func = "@mul_nuw_nsw", args = ["-1", "0"] },
  { func = "@mul_nuw_nsw", args = ["-1", "1"] },
  { func = "@mul_nuw_nsw", args = ["-1", "-1"] },
  { func = "@mul_nuw_nsw", args = ["-1", "-2147483648"] },
