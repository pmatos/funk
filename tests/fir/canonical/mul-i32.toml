  { func = "@mul_nsw", args = ["0", "-1"] },
  { func = "@mul_nsw", args = ["0", "-2147483648"] },
  { func = "@mul_nsw", args = ["0", "2147483647"] },
  { func = "@mul_nsw", args = ["1", "0"] },
  { func = "@mul_nsw", args = ["1", "1"] },
  { func = "@mul_nsw", args = ["1", "-1"] },
  { func = "@mul_nsw", args = ["1", "-2147483648"] },
  { func = "@mul_nsw", args = ["1", "2147483647"] },
  { func = "@mul_nsw", args = ["-1", "0"] },
  { func = "@mul_nsw", args = ["-1", "1"] },
  { func = "@mul_nsw", args = ["-1", "-1"] },
