  { func = "@mul_nuw_nsw", args = ["2147483647", "-2147483648"] },
  { func = "@mul_nuw_nsw", args = ["2147483647", "2147483647"] },
  # Interpreter-only tests: fir-ref alone runs each, and must give the
  # result it states (the coverage matrix, ADR-2026-11-03-0557).
  { func = "@mul", args = ["3", "5"], expect = ["15"] },
  { func = "@mul_nuw", args = ["3", "5"], expect = ["15"] },
  { func = "@mul_nsw", args = ["3", "5"], expect = ["15"] },
  { func = "@mul_nuw_nsw", args = ["3", "5"], expect = ["15"] },
  { func = "@mul", args = ["-1", "2"], expect = ["-2"] },
  { func = "@mul_nuw", args = ["-1", "2"], expect = ["poison"] },
  { func = "@mul_nsw", args = ["-1", "2"], expect = ["-2"] },
  { func = "@mul_nuw_nsw", args = ["-1", "2"], expect = ["poison"] },
  { func = "@mul", args = ["1073741824", "2"], expect = ["-2147483648"] },
  { func = "@mul_nuw", args = ["1073741824", "2"], expect = ["-2147483648"] },
  { func = "@mul_nsw", args = ["1073741824", "2"], expect = ["poison"] },
  { func = "@mul_nuw_nsw", args = ["1073741824", "2"], expect = ["poison"] },
  { func = "@mul", args = ["-2147483648", "2"], expect = ["0"] },
  { func = "@mul_nuw", args = ["-2147483648", "2"], expect = ["poison"] },
  { func = "@mul_nsw", args = ["-2147483648", "2"], expect = ["poison"] },
  { func = "@mul_nuw_nsw", args = ["-2147483648", "2"], expect = ["poison"] },
]
