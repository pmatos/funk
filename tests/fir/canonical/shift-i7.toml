  { func = "@shl", args = ["-1", "8"], expect = ["poison"] },
  { func = "@shl", args = ["-1", "-1"], expect = ["poison"] },
  { func = "@shl", args = ["-1", "-64"], expect = ["poison"] },
  { func = "@shl", args = ["-1", "63"], expect = ["poison"] },
  { func = "@shl", args = ["-64", "0"], expect = ["-64"] },
  { func = "@shl", args = ["-64", "1"], expect = ["0"] },
  { func = "@shl", args = ["-64", "6"], expect = ["0"] },
  { func = "@shl", args = ["-64", "7"], expect = ["poison"] },
  { func = "@shl", args = ["-64", "8"], expect = ["poison"] },
  { func = "@shl", args = ["-64", "-1"], expect = ["poison"] },
  { func = "@shl", args = ["-64", "-64"], expect = ["poison"] },
  { func = "@shl", args = ["-64", "63"], expect = ["poison"] },
