# Tests of shift-i7.fir: shl, lshr and ashr at i7. Each shifts every
# boundary bit pattern (0, 1, -1, the signed minimum and the signed
# maximum) by the amounts 0, 1, N - 1, N and N + 1, and by -1, the
# signed minimum and the signed maximum (#15). An amount is read as
# unsigned: -1 and the signed minimum have their top bit set and read as
# 127 and 64. An amount of N or more gives poison.
# The backend does not lower i7, so each test is interpreter-only and
# states the result that fir-ref must give.
tests = [
  { func = "@shl", args = ["0", "0"], expect = ["0"] },
  { func = "@shl", args = ["0", "1"], expect = ["0"] },
  { func = "@shl", args = ["0", "6"], expect = ["0"] },
  { func = "@shl", args = ["0", "7"], expect = ["poison"] },
  { func = "@shl", args = ["0", "8"], expect = ["poison"] },
  { func = "@shl", args = ["0", "-1"], expect = ["poison"] },
  { func = "@shl", args = ["0", "-64"], expect = ["poison"] },
  { func = "@shl", args = ["0", "63"], expect = ["poison"] },
  { func = "@shl", args = ["1", "0"], expect = ["1"] },
  { func = "@shl", args = ["1", "1"], expect = ["2"] },
  { func = "@shl", args = ["1", "6"], expect = ["-64"] },
  { func = "@shl", args = ["1", "7"], expect = ["poison"] },
  { func = "@shl", args = ["1", "8"], expect = ["poison"] },
  { func = "@shl", args = ["1", "-1"], expect = ["poison"] },
  { func = "@shl", args = ["1", "-64"], expect = ["poison"] },
  { func = "@shl", args = ["1", "63"], expect = ["poison"] },
  { func = "@shl", args = ["-1", "0"], expect = ["-1"] },
  { func = "@shl", args = ["-1", "1"], expect = ["-2"] },
  { func = "@shl", args = ["-1", "6"], expect = ["-64"] },
