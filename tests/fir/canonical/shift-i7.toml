  { func = "@ashr", args = ["0", "6"], expect = ["0"] },
  { func = "@ashr", args = ["0", "7"], expect = ["poison"] },
  { func = "@ashr", args = ["0", "8"], expect = ["poison"] },
  { func = "@ashr", args = ["0", "-1"], expect = ["poison"] },
  { func = "@ashr", args = ["0", "-64"], expect = ["poison"] },
