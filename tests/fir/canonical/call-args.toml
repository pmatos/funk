# Tests of call-args.fir: calls with more than six arguments of mixed
# widths (#20). System V passes the first six in registers and the rest
# on the stack: call7 passes one on the stack, after eight bytes of
# padding, and call8 two (ADR-2026-10-30-1232). Each caller adds one to
# each of its parameters, with add, which wraps, so a narrow value such
# as 127 + 1 at i8 leaves 128 in its slot: a callee reads only the low N
# bits of an argument, and the caller extends none
# (docs/decisions/x86-64-backend-abi.md#calls-between-funk-functions).
# It passes them in reverse order to @mix7 or @mix8, whose parameters
# have those types in that order. Each sign-extends its arguments to i64
# and folds them in order: it multiplies what it has by 1000003 and adds
# the next one, with mul and add, which wrap. So an argument in the
# wrong place, or read from the wrong bits, changes the result. The
# arguments are the boundary bit patterns of their types, 0, 1, -1, the
# signed minimum and the signed maximum (false and true at i1), rotated
# so that each parameter takes each of them. No test gives two
# parameters of one type the same pattern, so a swap of two arguments of
# one type changes the result: call7 gives %f the opposite of %a and %g
# the i8 pattern two places on from %b's, and call8 starts the two of
# each type at different places in the rotation.
# Each test without expect is differential: fir-ref and native code run
# it, and the native result must refine fir-ref's.
tests = [
  { func = "@call7", args = ["false", "1", "-1", "-2147483648", "9223372036854775807", "true", "-128"] },
  { func = "@call7", args = ["true", "-1", "-32768", "2147483647", "0", "false", "127"] },
  { func = "@call7", args = ["true", "-128", "32767", "0", "1", "false", "0"] },
  { func = "@call7", args = ["true", "127", "0", "1", "-1", "false", "1"] },
  { func = "@call7", args = ["false", "0", "1", "-1", "-9223372036854775808", "true", "-1"] },
  { func = "@call8", args = ["0", "1", "-1", "-128", "false", "0", "1", "-1"] },
  { func = "@call8", args = ["1", "-1", "-32768", "127", "false", "1", "-1", "-2147483648"] },
  { func = "@call8", args = ["-1", "-2147483648", "32767", "0", "true", "-1", "-32768", "2147483647"] },
  { func = "@call8", args = ["-9223372036854775808", "2147483647", "0", "1", "true", "-128", "32767", "0"] },
  { func = "@call8", args = ["9223372036854775807", "0", "1", "-1", "true", "127", "0", "1"] },
]
