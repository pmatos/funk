# Tests of float-binary-f128.fir: fadd, fsub, fmul, fdiv at f128
# (ADR-2026-11-09-1549), on the hard inputs: results halfway between
# two floats, subnormals, -0, overflow to infinity and NaN operands.
# Written by scripts/harness/float_arith_cases.py, which computes each
# expected result with scripts/harness/float_ref.py, apart from Lean.
# Each test is interpreter-only: the backend does not lower
# f128, so fir-ref alone runs it and must give what it expects.
# A NaN result is any NaN: its test is interpreter-only and names
# the NaN by a choice of the sign and the mantissa, as signed
# i113. Native code is not compared on a NaN result yet (#219).
tests = [
  { func = "@fadd", args = ["1.0", "1.0"], expect = ["2.0"] },
  { func = "@fadd", args = ["1.0", "9.629649721936179265279889712924637e-35"], expect = ["1.0"] },
  { func = "@fadd", args = ["1.0000000000000000000000000000000002", "9.629649721936179265279889712924637e-35"], expect = ["1.0000000000000000000000000000000004"] },
  { func = "@fadd", args = ["1.0", "1.4444474582904268897919834569386955e-34"], expect = ["1.0000000000000000000000000000000002"] },
  { func = "@fadd", args = ["1.0", "4.8148248609680896326399448564623183e-35"], expect = ["1.0"] },
  { func = "@fadd", args = ["1.189731495357231765085759326628007e4932", "1.189731495357231765085759326628007e4932"], expect = ["0x7fff0000000000000000000000000000"] },
  { func = "@fadd", args = ["1.189731495357231765085759326628007e4932", "5.728348781722740809597148796851055e4897"], expect = ["0x7fff0000000000000000000000000000"] },
  { func = "@fadd", args = ["1.189731495357231765085759326628007e4932", "2.8641743908613704047985743984255274e4897"], expect = ["1.189731495357231765085759326628007e4932"] },
  { func = "@fadd", args = ["1.189731495357231765085759326628007e4932", "6.0e-4966"], expect = ["1.189731495357231765085759326628007e4932"] },
  { func = "@fadd", args = ["6.0e-4966", "6.0e-4966"], expect = ["1.0e-4965"] },
  { func = "@fadd", args = ["3.362103143112093506262677817321752e-4932", "6.0e-4966"], expect = ["3.3621031431120935062626778173217526e-4932"] },
  { func = "@fadd", args = ["1.0", "-1.0"], expect = ["0.0"] },
  { func = "@fadd", args = ["-0.0", "-0.0"], expect = ["-0.0"] },
  { func = "@fadd", args = ["0.0", "-0.0"], expect = ["0.0"] },
  { func = "@fadd", args = ["-6.0e-4966", "6.0e-4966"], expect = ["0.0"] },
  { func = "@fadd", args = ["0x7fff0000000000000000000000000000", "0xffff0000000000000000000000000000"], choices = ["0"], expect = ["0x7fff8000000000000000000000000000"] },
  { func = "@fadd", args = ["0xffff0000000000000000000000000000", "1.189731495357231765085759326628007e4932"], expect = ["0xffff0000000000000000000000000000"] },
  { func = "@fadd", args = ["0xffffffffffffffffffffffffffffffff", "1.0"], choices = ["-1"], expect = ["0xffffffffffffffffffffffffffffffff"] },
  { func = "@fadd", args = ["1.0", "0x7fff0000000000000000000000000001"], choices = ["1"], expect = ["0x7fff0000000000000000000000000001"] },
  { func = "@fsub", args = ["1.0", "1.0"], expect = ["0.0"] },
  { func = "@fsub", args = ["-0.0", "0.0"], expect = ["-0.0"] },
  { func = "@fsub", args = ["0.0", "-0.0"], expect = ["0.0"] },
  { func = "@fsub", args = ["0.0", "0.0"], expect = ["0.0"] },
  { func = "@fsub", args = ["3.3621031431120935062626778173217526e-4932", "6.0e-4966"], expect = ["3.362103143112093506262677817321752e-4932"] },
  { func = "@fsub", args = ["6.0e-4966", "3.3621031431120935062626778173217526e-4932"], expect = ["-3.362103143112093506262677817321752e-4932"] },
  { func = "@fsub", args = ["1.0", "4.8148248609680896326399448564623183e-35"], expect = ["1.0"] },
  { func = "@fsub", args = ["4.8148248609680896326399448564623183e-35", "1.0"], expect = ["-1.0"] },
  { func = "@fsub", args = ["-1.189731495357231765085759326628007e4932", "1.189731495357231765085759326628007e4932"], expect = ["0xffff0000000000000000000000000000"] },
  { func = "@fsub", args = ["1.189731495357231765085759326628007e4932", "-1.189731495357231765085759326628007e4932"], expect = ["0x7fff0000000000000000000000000000"] },
  { func = "@fsub", args = ["0x7fff0000000000000000000000000000", "0x7fff0000000000000000000000000000"], choices = ["0"], expect = ["0x7fff8000000000000000000000000000"] },
  { func = "@fsub", args = ["0.0", "0x7fff0000000000000000000000000000"], expect = ["0xffff0000000000000000000000000000"] },
  { func = "@fsub", args = ["0x7fff0000000000000000000000000000", "0.0"], expect = ["0x7fff0000000000000000000000000000"] },
  { func = "@fsub", args = ["1.0", "0xffffffffffffffffffffffffffffffff"], choices = ["-1"], expect = ["0xffffffffffffffffffffffffffffffff"] },
  { func = "@fsub", args = ["0xffffffffffffffffffffffffffffffff", "1.0"], choices = ["1"], expect = ["0x7fff0000000000000000000000000001"] },
  { func = "@fmul", args = ["1.5", "1.5"], expect = ["2.25"] },
  { func = "@fmul", args = ["1.0000000000000000000000000000000002", "1.0000000000000000000000000000000002"], expect = ["1.0000000000000000000000000000000004"] },
  { func = "@fmul", args = ["3.3621031431120935062626778173217526e-4932", "0.5"], expect = ["1.681051571556046753131338908660876e-4932"] },
  { func = "@fmul", args = ["6.0e-4966", "0.5"], expect = ["0.0"] },
  { func = "@fmul", args = ["2.0e-4965", "0.5"], expect = ["1.0e-4965"] },
  { func = "@fmul", args = ["6.0e-4966", "0.75"], expect = ["6.0e-4966"] },
  { func = "@fmul", args = ["-6.0e-4966", "0.25"], expect = ["-0.0"] },
  { func = "@fmul", args = ["1.189731495357231765085759326628007e4932", "2.0"], expect = ["0x7fff0000000000000000000000000000"] },
  { func = "@fmul", args = ["-1.189731495357231765085759326628007e4932", "1.189731495357231765085759326628007e4932"], expect = ["0xffff0000000000000000000000000000"] },
  { func = "@fmul", args = ["6.0e-4966", "6.0e-4966"], expect = ["0.0"] },
  { func = "@fmul", args = ["-6.0e-4966", "3.362103143112093506262677817321752e-4932"], expect = ["-0.0"] },
  { func = "@fmul", args = ["-0.0", "1.0"], expect = ["-0.0"] },
  { func = "@fmul", args = ["0.0", "0x7fff0000000000000000000000000000"], choices = ["0"], expect = ["0x7fff8000000000000000000000000000"] },
  { func = "@fmul", args = ["-1.0", "0x7fff0000000000000000000000000000"], expect = ["0xffff0000000000000000000000000000"] },
  { func = "@fmul", args = ["0xffffffffffffffffffffffffffffffff", "0.0"], choices = ["-1"], expect = ["0xffffffffffffffffffffffffffffffff"] },
  { func = "@fdiv", args = ["1.0", "3.0"], expect = ["0.3333333333333333333333333333333333"] },
  { func = "@fdiv", args = ["3.0", "1.0"], expect = ["3.0"] },
  { func = "@fdiv", args = ["1.0", "1.0000000000000000000000000000000002"], expect = ["0.9999999999999999999999999999999998"] },
  { func = "@fdiv", args = ["1.0000000000000000000000000000000002", "1.0"], expect = ["1.0000000000000000000000000000000002"] },
  { func = "@fdiv", args = ["1.0", "0.0"], expect = ["0x7fff0000000000000000000000000000"] },
  { func = "@fdiv", args = ["0.0", "1.0"], expect = ["0.0"] },
  { func = "@fdiv", args = ["-1.0", "0.0"], expect = ["0xffff0000000000000000000000000000"] },
  { func = "@fdiv", args = ["0.0", "-1.0"], expect = ["-0.0"] },
  { func = "@fdiv", args = ["1.0", "-0.0"], expect = ["0xffff0000000000000000000000000000"] },
  { func = "@fdiv", args = ["-0.0", "1.0"], expect = ["-0.0"] },
  { func = "@fdiv", args = ["0.0", "0.0"], choices = ["1"], expect = ["0x7fff0000000000000000000000000001"] },
  { func = "@fdiv", args = ["0x7fff0000000000000000000000000000", "0x7fff0000000000000000000000000000"], choices = ["0"], expect = ["0x7fff8000000000000000000000000000"] },
  { func = "@fdiv", args = ["1.0", "0x7fff0000000000000000000000000000"], expect = ["0.0"] },
  { func = "@fdiv", args = ["0x7fff0000000000000000000000000000", "1.0"], expect = ["0x7fff0000000000000000000000000000"] },
  { func = "@fdiv", args = ["-1.0", "0x7fff0000000000000000000000000000"], expect = ["-0.0"] },
  { func = "@fdiv", args = ["0x7fff0000000000000000000000000000", "-1.0"], expect = ["0xffff0000000000000000000000000000"] },
  { func = "@fdiv", args = ["3.3621031431120935062626778173217526e-4932", "5.192296858534827628530496329220096e33"], expect = ["6.0e-4966"] },
  { func = "@fdiv", args = ["5.192296858534827628530496329220096e33", "3.3621031431120935062626778173217526e-4932"], expect = ["0x7fff0000000000000000000000000000"] },
  { func = "@fdiv", args = ["6.0e-4966", "2.0"], expect = ["0.0"] },
  { func = "@fdiv", args = ["2.0", "6.0e-4966"], expect = ["0x7fff0000000000000000000000000000"] },
  { func = "@fdiv", args = ["2.0e-4965", "2.0"], expect = ["1.0e-4965"] },
  { func = "@fdiv", args = ["2.0", "2.0e-4965"], expect = ["0x7fff0000000000000000000000000000"] },
  { func = "@fdiv", args = ["1.189731495357231765085759326628007e4932", "0.5"], expect = ["0x7fff0000000000000000000000000000"] },
  { func = "@fdiv", args = ["0.5", "1.189731495357231765085759326628007e4932"], expect = ["4.20262892889011688282834727165219e-4933"] },
  { func = "@fdiv", args = ["6.0e-4966", "1.189731495357231765085759326628007e4932"], expect = ["0.0"] },
  { func = "@fdiv", args = ["1.189731495357231765085759326628007e4932", "6.0e-4966"], expect = ["0x7fff0000000000000000000000000000"] },
  { func = "@fdiv", args = ["1.189731495357231765085759326628007e4932", "6.0e-4966"], expect = ["0x7fff0000000000000000000000000000"] },
  { func = "@fdiv", args = ["6.0e-4966", "1.189731495357231765085759326628007e4932"], expect = ["0.0"] },
  { func = "@fdiv", args = ["-0.0", "1.0"], expect = ["-0.0"] },
  { func = "@fdiv", args = ["1.0", "-0.0"], expect = ["0xffff0000000000000000000000000000"] },
  { func = "@fdiv", args = ["1.0", "0xffffffffffffffffffffffffffffffff"], choices = ["-1"], expect = ["0xffffffffffffffffffffffffffffffff"] },
  { func = "@fdiv", args = ["0xffffffffffffffffffffffffffffffff", "1.0"], choices = ["1"], expect = ["0x7fff0000000000000000000000000001"] },
  { func = "@fadd", args = ["poison", "0.0"], expect = ["poison"] },
  { func = "@fsub", args = ["poison", "0.0"], expect = ["poison"] },
  { func = "@fmul", args = ["poison", "0.0"], expect = ["poison"] },
  { func = "@fdiv", args = ["poison", "0.0"], expect = ["poison"] },
]
