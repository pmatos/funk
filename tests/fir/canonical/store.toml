# Tests of store.fir: store writes an integer through a pointer, at the
# natural alignment of its type in the pointer's memory or at the alignment
# it writes, and gives no result (#231, ADR-2026-11-14-2316). A load of what
# a store wrote gives the value back, at every width. The value is written
# in whole units, least significant first in memory 0, with zero bits past
# its width (the human's ruling of 2026-11-11 on #231): an i1 read back as
# an i8 is 0 or 1, and an i20 read back as an i24 has zeros above its 20
# bits. A narrower load gives the low bytes, and a wider load past what was
# stored reads fresh memory, so it is poison, or is UB past the
# allocation. A store of poison makes its units poison. A store through a
# poison pointer, out of bounds, past a freed allocation, or misaligned is
# UB, aligned as for load (the human's ruling of 2026-11-14 on #388). The
# backend lowers store in stage 5 of #231, so each test is
# interpreter-only.
tests = [
  { func = "@round_trip", args = ["67305985"], expect = ["67305985"] },
  { func = "@round_trip", args = ["-1"], expect = ["-1"] },
  { func = "@round_trip", args = ["poison"], expect = ["poison"] },
  { func = "@widths", args = ["true", "-1", "-128", "12345", "-4294967296", "-9223372036854775808", "170141183460469231731687303715884105727"], expect = ["true", "-1", "-128", "12345", "-4294967296", "-9223372036854775808", "170141183460469231731687303715884105727"] },
  { func = "@widths", args = ["false", "63", "poison", "-1", "1", "poison", "-1"], expect = ["false", "63", "poison", "-1", "1", "poison", "-1"] },
  { func = "@padding", args = ["true"], expect = ["1"] },
  { func = "@padding", args = ["false"], expect = ["0"] },
  { func = "@padding_wide", args = ["-1"], expect = ["1048575"] },
  { func = "@narrower", args = ["67305985"], expect = ["513", "2"] },
  { func = "@wider", args = ["67305985"], expect = ["poison"] },
  { func = "@past_end", args = ["67305985"], expect = "ub" },
  { func = "@overwrite", args = ["67305985", "9"], expect = ["67307777"] },
  { func = "@stored_poison", expect = ["poison"] },
  { func = "@at", args = ["0", "5"], expect = ["5"] },
  { func = "@at", args = ["7", "5"], expect = ["5"] },
  { func = "@at", args = ["8", "5"], expect = "ub" },
  { func = "@at", args = ["-1", "5"], expect = "ub" },
  { func = "@at", args = ["poison", "5"], expect = "ub" },
  { func = "@at", args = ["3", "poison"], expect = ["poison"] },
  { func = "@misaligned", args = ["1"], expect = "ub" },
  { func = "@aligned", args = ["7"], expect = ["7"] },
  { func = "@promised", args = ["3", "7"], expect = ["7"] },
  { func = "@promised", args = ["13", "7"], expect = "ub" },
  { func = "@widest_align", args = ["-2"], expect = ["-2"] },
  { func = "@freed", args = ["1"], expect = "ub" },
  { func = "@through", args = ["poison", "1"], expect = "ub" },
]
