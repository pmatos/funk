# Tests of store.fir: store writes an integer through a pointer, at the
# natural alignment of its type in the pointer's memory or at the alignment
# it writes, and gives no result (#231, ADR-2026-11-14-2316). A load of what
# a store wrote gives the value back. The value is written in whole units,
# least significant first in memory 0, with zero bits past its width (the
# human's ruling of 2026-11-11 on #231): an i1 read back as an i8 is 0 or 1.
# A narrower load gives the low bytes, and a wider load past what was
# stored reads fresh memory, so it is poison, or is UB past the
# allocation. A store of poison makes its units poison. A store through a
# poison pointer, out of bounds, past a freed allocation, or misaligned is
# UB, aligned as for load (the human's ruling of 2026-11-14 on #388). A
# test that returns a value runs as native code too (stage 5 of #231); a
# test of poison or UB stays interpreter-only, since native code may give
# any value for either. Stores at widths the backend
# does not lower are in store-widths.fir.
tests = [
  { func = "@round_trip", args = ["67305985"], results = [{ values = ["67305985"], witness = [] }] },
  { func = "@round_trip", args = ["-1"], results = [{ values = ["-1"], witness = [] }] },
  { func = "@round_trip", args = ["poison"], expect = ["poison"] },
  { func = "@padding", args = ["true"], results = [{ values = ["1"], witness = [] }] },
  { func = "@padding", args = ["false"], results = [{ values = ["0"], witness = [] }] },
  { func = "@narrower", args = ["67305985"], results = [{ values = ["513", "2"], witness = [] }] },
  { func = "@wider", args = ["67305985"], expect = ["poison"] },
  { func = "@past_end", args = ["67305985"], expect = "ub" },
  { func = "@overwrite", args = ["67305985", "9"], results = [{ values = ["67307777"], witness = [] }] },
  { func = "@stored_poison", expect = ["poison"] },
  { func = "@at", args = ["0", "5"], results = [{ values = ["5"], witness = [] }] },
  { func = "@at", args = ["7", "5"], results = [{ values = ["5"], witness = [] }] },
  { func = "@at", args = ["8", "5"], expect = "ub" },
  { func = "@at", args = ["-1", "5"], expect = "ub" },
  { func = "@at", args = ["poison", "5"], expect = "ub" },
  { func = "@at", args = ["3", "poison"], expect = ["poison"] },
  { func = "@misaligned", args = ["1"], expect = "ub" },
  { func = "@aligned", args = ["7"], results = [{ values = ["7"], witness = [] }] },
  { func = "@promised", args = ["3", "7"], results = [{ values = ["7"], witness = [] }] },
  { func = "@promised", args = ["13", "7"], expect = "ub" },
  { func = "@widest_align", args = ["-2"], results = [{ values = ["-2"], witness = [] }] },
  { func = "@freed", args = ["1"], expect = "ub" },
  { func = "@through", args = ["poison", "1"], expect = "ub" },
]
