  { func = "@f64_f16", args = ["-1.00146484375"], expect = ["-1.002"] },
  { func = "@f64_f16", args = ["-1.0014648437500002"], expect = ["-1.002"] },
  { func = "@f64_f16", args = ["-65504.0"], expect = ["-65500.0"] },
  { func = "@f64_f16", args = ["-65519.99999999999"], expect = ["-65500.0"] },
  { func = "@f64_f16", args = ["-65520.0"], expect = ["0xfc00"] },
  { func = "@f64_f16", args = ["-65520.00000000001"], expect = ["0xfc00"] },
  { func = "@f64_f16", args = ["-1.7976931348623157e308"], expect = ["0xfc00"] },
  { func = "@f64_f16", args = ["0xfff0000000000000"], expect = ["0xfc00"] },
  { func = "@f64_f16", args = ["0x7ff8000000000000"], choices = ["0"], expect = ["0x7e00"] },
  { func = "@f64_f16", args = ["0x7ff0000000000001"], choices = ["-1"], expect = ["0xffff"] },
  { func = "@f64_f16", args = ["0xffffffffffffffff"], choices = ["1"], expect = ["0x7c01"] },
  { func = "@f64_f16", args = ["poison"], expect = ["poison"] },
