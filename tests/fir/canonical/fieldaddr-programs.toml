# Tests of fieldaddr-programs.fir: struct and array programs in the default
# memory that reach each field and element through fieldaddr (#236), on
# fir-ref and as native code (stage 4 of #236).
# @point_fields stores an integer, two floats and a pointer to itself in a
# struct, and reads them back by their offsets. @row_sum fills a row of
# four i64 in a loop and sums it, and @row_at reads an element by an index:
# index 4, one past the last element, 3, is an address that ptradd could
# give, and reading it leaves the allocation, so it is UB (the human's
# ruling of 2026-11-16 on #236, Q3 A), as is reading by index -1, before
# the first element. Reading by a poison index is UB for another reason:
# fieldaddr gives a poison pointer for it, and a load through a poison
# pointer is UB (the rule of load, #231). @one_past steps back from the
# one-past-the-end address to the last element.
# @list_sum walks a linked list of three nodes. @vec_push appends to an
# array that follows its length, and @flex_tail writes past a flexible
# array member of no elements, up to the end of its allocation, and before
# its start, where index -2 reaches the struct's first field. The elements
# of @i24s are 4 units apart, each 3-unit i24 rounded up to its alignment
# (Q2 B): @i24_elements zeroes an allocation of 16 units with memset,
# stores an i32 at an element by an index of i1, i16 and i128, each from
# the second element, and reads the four back by ptradd. A test that is
# UB is interpreter-only, since a native run of UB proves nothing; every
# other test runs differentially and declares its result.
tests = [
  { func = "@point_fields", args = ["7", "1.5", "-2.25"], results = [{ values = ["7", "1.5", "-2.25"], witness = [] }] },
  { func = "@row_sum", args = ["1"], results = [{ values = ["64"], witness = [] }] },
  { func = "@row_sum", args = ["-5"], results = [{ values = ["40"], witness = [] }] },
  { func = "@row_at", args = ["0"], results = [{ values = ["100"], witness = [] }] },
  { func = "@row_at", args = ["3"], results = [{ values = ["103"], witness = [] }] },
  { func = "@row_at", args = ["4"], expect = "ub" },
  { func = "@row_at", args = ["-1"], expect = "ub" },
  { func = "@row_at", args = ["poison"], expect = "ub" },
  { func = "@one_past", args = ["42"], results = [{ values = ["42"], witness = [] }] },
  { func = "@list_sum", results = [{ values = ["6"], witness = [] }] },
  { func = "@vec_push", args = ["5", "-6"], results = [{ values = ["2", "5", "-6"], witness = [] }] },
  { func = "@flex_tail", args = ["0"], results = [{ values = ["9"], witness = [] }] },
  { func = "@flex_tail", args = ["3"], results = [{ values = ["9"], witness = [] }] },
  { func = "@flex_tail", args = ["4"], expect = "ub" },
  { func = "@flex_tail", args = ["-2"], results = [{ values = ["9"], witness = [] }] },
  { func = "@flex_tail", args = ["-3"], expect = "ub" },
  { func = "@i24_elements", args = ["false", "1", "-1"], results = [{ values = ["3", "1", "2", "0"], witness = [] }] },
  { func = "@i24_elements", args = ["true", "-1", "2"], results = [{ values = ["2", "0", "0", "3"], witness = [] }] },
  { func = "@i24_elements", args = ["true", "0", "0"], results = [{ values = ["1", "3", "0", "0"], witness = [] }] },
]
