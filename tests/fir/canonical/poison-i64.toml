  { func = "@sub_nuw_left", args = ["9223372036854775807", "1"] },
  { func = "@sub_nuw_left", args = ["9223372036854775807", "1"], expect = ["poison"] },
  { func = "@sub_nuw_left", args = ["0", "1"] },
  { func = "@sub_nuw_right", args = ["9223372036854775807", "1"] },
  { func = "@sub_nuw_right", args = ["9223372036854775807", "1"], expect = ["poison"] },
