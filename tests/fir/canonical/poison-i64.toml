# Tests of poison-i64.fir: poison propagates through add, sub and mul,
# whatever their flags, from either operand (ADR-2026-10-30-0818).
# %p = add nsw %a, 1 is poison when %a is the signed maximum, true at
# i1, and the function returns OP %p, %b or OP %b, %p.
# Each test without expect is differential: fir-ref and native code run
# it, and the native result must refine fir-ref's; where fir-ref returns
# poison, any value of the type does.
# Where fir-ref returns poison, an interpreter-only test of the same
# run checks that it is exactly poison.
tests = [
  { func = "@add_left", args = ["9223372036854775807", "1"] },
  { func = "@add_left", args = ["9223372036854775807", "1"], expect = ["poison"] },
  { func = "@add_left", args = ["0", "1"] },
  { func = "@add_right", args = ["9223372036854775807", "1"] },
  { func = "@add_right", args = ["9223372036854775807", "1"], expect = ["poison"] },
  { func = "@add_right", args = ["0", "1"] },
  { func = "@add_nuw_left", args = ["9223372036854775807", "1"] },
  { func = "@add_nuw_left", args = ["9223372036854775807", "1"], expect = ["poison"] },
  { func = "@add_nuw_left", args = ["0", "1"] },
  { func = "@add_nuw_right", args = ["9223372036854775807", "1"] },
  { func = "@add_nuw_right", args = ["9223372036854775807", "1"], expect = ["poison"] },
  { func = "@add_nuw_right", args = ["0", "1"] },
  { func = "@add_nsw_left", args = ["9223372036854775807", "1"] },
  { func = "@add_nsw_left", args = ["9223372036854775807", "1"], expect = ["poison"] },
  { func = "@add_nsw_left", args = ["0", "1"] },
  { func = "@add_nsw_right", args = ["9223372036854775807", "1"] },
  { func = "@add_nsw_right", args = ["9223372036854775807", "1"], expect = ["poison"] },
  { func = "@add_nsw_right", args = ["0", "1"] },
  { func = "@add_nuw_nsw_left", args = ["9223372036854775807", "1"] },
  { func = "@add_nuw_nsw_left", args = ["9223372036854775807", "1"], expect = ["poison"] },
  { func = "@add_nuw_nsw_left", args = ["0", "1"] },
  { func = "@add_nuw_nsw_right", args = ["9223372036854775807", "1"] },
  { func = "@add_nuw_nsw_right", args = ["9223372036854775807", "1"], expect = ["poison"] },
  { func = "@add_nuw_nsw_right", args = ["0", "1"] },
  { func = "@sub_left", args = ["9223372036854775807", "1"] },
  { func = "@sub_left", args = ["9223372036854775807", "1"], expect = ["poison"] },
  { func = "@sub_left", args = ["0", "1"] },
  { func = "@sub_right", args = ["9223372036854775807", "1"] },
  { func = "@sub_right", args = ["9223372036854775807", "1"], expect = ["poison"] },
