# Tests of float-fpext-bf16-f64.fir: fpext from bf16 to f64
# (ADR-2026-11-09-1549) on the edges of the source and of the target:
# zeros, subnormals, the largest finite values, the values halfway
# between two values of the target and next to them, overflow to
# infinity, underflow to zero, infinities and NaNs. Written by
# scripts/harness/float_convert_cases.py, which computes each expected
# result with scripts/harness/float_ref.py, apart from Lean.
# Each test is interpreter-only: the backend does not lower
# bf16 and f64 both, so fir-ref alone runs it and must give what it
# expects.
# A NaN operand gives any NaN of the target: its test is
# interpreter-only and names the NaN by a choice of the sign and the
# mantissa. Native code is not compared on a NaN result yet (#219).
tests = [
  { func = "@bf16_f64", args = ["0.0"], expect = ["0.0"] },
  { func = "@bf16_f64", args = ["9.0e-41"], expect = ["9.183549615799121e-41"] },
  { func = "@bf16_f64", args = ["1.17e-38"], expect = ["1.1663108012064884e-38"] },
  { func = "@bf16_f64", args = ["1.18e-38"], expect = ["1.1754943508222875e-38"] },
  { func = "@bf16_f64", args = ["1.0"], expect = ["1.0"] },
  { func = "@bf16_f64", args = ["3.39e38"], expect = ["3.3895313892515355e38"] },
  { func = "@bf16_f64", args = ["0x7f80"], expect = ["0x7ff0000000000000"] },
  { func = "@bf16_f64", args = ["-0.0"], expect = ["-0.0"] },
  { func = "@bf16_f64", args = ["-9.0e-41"], expect = ["-9.183549615799121e-41"] },
  { func = "@bf16_f64", args = ["-1.17e-38"], expect = ["-1.1663108012064884e-38"] },
  { func = "@bf16_f64", args = ["-1.18e-38"], expect = ["-1.1754943508222875e-38"] },
  { func = "@bf16_f64", args = ["-1.0"], expect = ["-1.0"] },
  { func = "@bf16_f64", args = ["-3.39e38"], expect = ["-3.3895313892515355e38"] },
  { func = "@bf16_f64", args = ["0xff80"], expect = ["0xfff0000000000000"] },
  { func = "@bf16_f64", args = ["0x7fc0"], choices = ["0"], expect = ["0x7ff8000000000000"] },
  { func = "@bf16_f64", args = ["0x7f81"], choices = ["-1"], expect = ["0xffffffffffffffff"] },
  { func = "@bf16_f64", args = ["0xffff"], choices = ["1"], expect = ["0x7ff0000000000001"] },
  { func = "@bf16_f64", args = ["poison"], expect = ["poison"] },
]
