  { func = "@ueq", args = ["0x7fff0000000000000000000000000001", "-0.0"], expect = ["true"] },
  { func = "@ueq", args = ["-0.0", "0x7fff0000000000000000000000000001"], expect = ["true"] },
  { func = "@ueq", args = ["poison", "1.0"], expect = ["poison"] },
  { func = "@ueq", args = ["0x7fff8000000000000000000000000000", "poison"], expect = ["poison"] },
