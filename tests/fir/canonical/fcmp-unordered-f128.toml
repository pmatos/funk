# Tests of fcmp-unordered-f128.fir: fcmp with each of its seven
# unordered predicates, ueq to uno, at f128 (ADR-2026-11-11-1139), on
# pairs of hard values: 1 and 2 in both orders, -0 and +0, the smallest
# subnormals of either sign against a zero, the largest finite values
# against the infinities, the infinities against themselves, and NaNs,
# quiet and signalling, with a payload and with the sign set, against
# numbers, infinities, zeros and each other. A float is spelled as the one
# float literal of its bits (ADR-2026-11-11-1438). A poison operand
# gives poison.
# Each test is interpreter-only: the backend does not lower f128, so
# fir-ref alone runs it and must give the result it expects, which
# scripts/harness/float_ref.py computed apart from Lean.
tests = [
  { func = "@ueq", args = ["1.0", "2.0"], expect = ["false"] },
  { func = "@ueq", args = ["2.0", "1.0"], expect = ["false"] },
  { func = "@ueq", args = ["1.0", "1.0"], expect = ["true"] },
  { func = "@ueq", args = ["-0.0", "0.0"], expect = ["true"] },
  { func = "@ueq", args = ["0.0", "-0.0"], expect = ["true"] },
  { func = "@ueq", args = ["6.0e-4966", "0.0"], expect = ["false"] },
  { func = "@ueq", args = ["-6.0e-4966", "-0.0"], expect = ["false"] },
  { func = "@ueq", args = ["1.189731495357231765085759326628007e4932", "0x7fff0000000000000000000000000000"], expect = ["false"] },
  { func = "@ueq", args = ["0xffff0000000000000000000000000000", "-1.189731495357231765085759326628007e4932"], expect = ["false"] },
  { func = "@ueq", args = ["0x7fff0000000000000000000000000000", "0x7fff0000000000000000000000000000"], expect = ["true"] },
  { func = "@ueq", args = ["0xffff0000000000000000000000000000", "0xffff0000000000000000000000000000"], expect = ["true"] },
  { func = "@ueq", args = ["-1.0", "1.0"], expect = ["false"] },
  { func = "@ueq", args = ["0x7fff8000000000000000000000000000", "1.0"], expect = ["true"] },
  { func = "@ueq", args = ["1.0", "0x7fff8000000000000000000000000000"], expect = ["true"] },
  { func = "@ueq", args = ["0x7fff8000000000000000000000000000", "0x7fff8000000000000000000000000000"], expect = ["true"] },
