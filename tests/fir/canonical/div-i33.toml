  { func = "@udiv_exact", args = ["1", "-4294967296"], expect = ["poison"] },
  { func = "@udiv_exact", args = ["1", "4294967295"], expect = ["poison"] },
  { func = "@udiv_exact", args = ["-1", "0"], expect = "ub" },
  { func = "@udiv_exact", args = ["-1", "1"], expect = ["-1"] },
  { func = "@udiv_exact", args = ["-1", "-1"], expect = ["1"] },
  { func = "@udiv_exact", args = ["-1", "-4294967296"], expect = ["poison"] },
  { func = "@udiv_exact", args = ["-1", "4294967295"], expect = ["poison"] },
  { func = "@udiv_exact", args = ["-4294967296", "0"], expect = "ub" },
  { func = "@udiv_exact", args = ["-4294967296", "1"], expect = ["-4294967296"] },
  { func = "@udiv_exact", args = ["-4294967296", "-1"], expect = ["poison"] },
  { func = "@udiv_exact", args = ["-4294967296", "-4294967296"], expect = ["1"] },
  { func = "@udiv_exact", args = ["-4294967296", "4294967295"], expect = ["poison"] },
  { func = "@udiv_exact", args = ["4294967295", "0"], expect = "ub" },
  { func = "@udiv_exact", args = ["4294967295", "1"], expect = ["4294967295"] },
  { func = "@udiv_exact", args = ["4294967295", "-1"], expect = ["poison"] },
  { func = "@udiv_exact", args = ["4294967295", "-4294967296"], expect = ["poison"] },
  { func = "@udiv_exact", args = ["4294967295", "4294967295"], expect = ["1"] },
  { func = "@srem", args = ["0", "0"], expect = "ub" },
  { func = "@srem", args = ["0", "1"], expect = ["0"] },
  { func = "@srem", args = ["0", "-1"], expect = ["0"] },
  { func = "@srem", args = ["0", "-4294967296"], expect = ["0"] },
  { func = "@srem", args = ["0", "4294967295"], expect = ["0"] },
  { func = "@srem", args = ["1", "0"], expect = "ub" },
  { func = "@srem", args = ["1", "1"], expect = ["0"] },
  { func = "@srem", args = ["1", "-1"], expect = ["0"] },
  { func = "@srem", args = ["1", "-4294967296"], expect = ["1"] },
  { func = "@srem", args = ["1", "4294967295"], expect = ["1"] },
  { func = "@srem", args = ["-1", "0"], expect = "ub" },
  { func = "@srem", args = ["-1", "1"], expect = ["0"] },
  { func = "@srem", args = ["-1", "-1"], expect = ["0"] },
  { func = "@srem", args = ["-1", "-4294967296"], expect = ["-1"] },
