  { func = "@udiv", args = ["-1", "-1"], expect = ["1"] },
  { func = "@udiv", args = ["-1", "-4294967296"], expect = ["1"] },
  { func = "@udiv", args = ["-1", "4294967295"], expect = ["2"] },
  { func = "@udiv", args = ["-4294967296", "0"], expect = "ub" },
  { func = "@udiv", args = ["-4294967296", "1"], expect = ["-4294967296"] },
  { func = "@udiv", args = ["-4294967296", "-1"], expect = ["0"] },
  { func = "@udiv", args = ["-4294967296", "-4294967296"], expect = ["1"] },
  { func = "@udiv", args = ["-4294967296", "4294967295"], expect = ["1"] },
  { func = "@udiv", args = ["4294967295", "0"], expect = "ub" },
  { func = "@udiv", args = ["4294967295", "1"], expect = ["4294967295"] },
  { func = "@udiv", args = ["4294967295", "-1"], expect = ["0"] },
  { func = "@udiv", args = ["4294967295", "-4294967296"], expect = ["0"] },
  { func = "@udiv", args = ["4294967295", "4294967295"], expect = ["1"] },
  { func = "@udiv_exact", args = ["0", "0"], expect = "ub" },
  { func = "@udiv_exact", args = ["0", "1"], expect = ["0"] },
  { func = "@udiv_exact", args = ["0", "-1"], expect = ["0"] },
  { func = "@udiv_exact", args = ["0", "-4294967296"], expect = ["0"] },
  { func = "@udiv_exact", args = ["0", "4294967295"], expect = ["0"] },
  { func = "@udiv_exact", args = ["1", "0"], expect = "ub" },
  { func = "@udiv_exact", args = ["1", "1"], expect = ["1"] },
