# Tests of div-i33.fir: sdiv and udiv, each with and without exact, srem
# and urem at i33, on every pair of boundary bit patterns: 0, 1, -1, the
# signed minimum and the signed maximum, so dividends and divisors take
# both signs (#18).
# The backend does not lower i33, so each test is interpreter-only and
# states the result that fir-ref must give: a value; poison where exact
# is broken, as the division leaves a remainder; or ub for a zero
# divisor and for sdiv and srem of the signed minimum by -1. fir-ref's
# UB reason names its case, such as "sdiv by zero" or "srem of the
# signed minimum by -1", but the harness matches ub to any reason
# (ADR-2026-10-30-2135).
tests = [
  { func = "@sdiv", args = ["0", "0"], expect = "ub" },
  { func = "@sdiv", args = ["0", "1"], expect = ["0"] },
  { func = "@sdiv", args = ["0", "-1"], expect = ["0"] },
  { func = "@sdiv", args = ["0", "-4294967296"], expect = ["0"] },
  { func = "@sdiv", args = ["0", "4294967295"], expect = ["0"] },
  { func = "@sdiv", args = ["1", "0"], expect = "ub" },
  { func = "@sdiv", args = ["1", "1"], expect = ["1"] },
  { func = "@sdiv", args = ["1", "-1"], expect = ["-1"] },
  { func = "@sdiv", args = ["1", "-4294967296"], expect = ["0"] },
  { func = "@sdiv", args = ["1", "4294967295"], expect = ["0"] },
  { func = "@sdiv", args = ["-1", "0"], expect = "ub" },
  { func = "@sdiv", args = ["-1", "1"], expect = ["-1"] },
  { func = "@sdiv", args = ["-1", "-1"], expect = ["1"] },
  { func = "@sdiv", args = ["-1", "-4294967296"], expect = ["0"] },
  { func = "@sdiv", args = ["-1", "4294967295"], expect = ["0"] },
  { func = "@sdiv", args = ["-4294967296", "0"], expect = "ub" },
  { func = "@sdiv", args = ["-4294967296", "1"], expect = ["-4294967296"] },
  { func = "@sdiv", args = ["-4294967296", "-1"], expect = "ub" },
  { func = "@sdiv", args = ["-4294967296", "-4294967296"], expect = ["1"] },
  { func = "@sdiv", args = ["-4294967296", "4294967295"], expect = ["-1"] },
  { func = "@sdiv", args = ["4294967295", "0"], expect = "ub" },
  { func = "@sdiv", args = ["4294967295", "1"], expect = ["4294967295"] },
  { func = "@sdiv", args = ["4294967295", "-1"], expect = ["-4294967295"] },
  { func = "@sdiv", args = ["4294967295", "-4294967296"], expect = ["0"] },
  { func = "@sdiv", args = ["4294967295", "4294967295"], expect = ["1"] },
  { func = "@sdiv_exact", args = ["0", "0"], expect = "ub" },
  { func = "@sdiv_exact", args = ["0", "1"], expect = ["0"] },
  { func = "@sdiv_exact", args = ["0", "-1"], expect = ["0"] },
  { func = "@sdiv_exact", args = ["0", "-4294967296"], expect = ["0"] },
  { func = "@sdiv_exact", args = ["0", "4294967295"], expect = ["0"] },
  { func = "@sdiv_exact", args = ["1", "0"], expect = "ub" },
  { func = "@sdiv_exact", args = ["1", "1"], expect = ["1"] },
  { func = "@sdiv_exact", args = ["1", "-1"], expect = ["-1"] },
  { func = "@sdiv_exact", args = ["1", "-4294967296"], expect = ["poison"] },
  { func = "@sdiv_exact", args = ["1", "4294967295"], expect = ["poison"] },
  { func = "@sdiv_exact", args = ["-1", "0"], expect = "ub" },
  { func = "@sdiv_exact", args = ["-1", "1"], expect = ["-1"] },
  { func = "@sdiv_exact", args = ["-1", "-1"], expect = ["1"] },
  { func = "@sdiv_exact", args = ["-1", "-4294967296"], expect = ["poison"] },
