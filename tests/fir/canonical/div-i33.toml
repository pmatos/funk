  { func = "@sdiv_exact", args = ["-4294967296", "4294967295"], expect = ["poison"] },
  { func = "@sdiv_exact", args = ["4294967295", "0"], expect = "ub" },
  { func = "@sdiv_exact", args = ["4294967295", "1"], expect = ["4294967295"] },
  { func = "@sdiv_exact", args = ["4294967295", "-1"], expect = ["-4294967295"] },
  { func = "@sdiv_exact", args = ["4294967295", "-4294967296"], expect = ["poison"] },
  { func = "@sdiv_exact", args = ["4294967295", "4294967295"], expect = ["1"] },
  { func = "@udiv", args = ["0", "0"], expect = "ub" },
  { func = "@udiv", args = ["0", "1"], expect = ["0"] },
  { func = "@udiv", args = ["0", "-1"], expect = ["0"] },
  { func = "@udiv", args = ["0", "-4294967296"], expect = ["0"] },
