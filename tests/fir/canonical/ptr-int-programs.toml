# Tests of ptr-int-programs.fir: round trips of an address through
# integers, on fir-ref and as native code (stage 5 of #232). An exposed
# address stored in memory and loaded back, passed to a call, or stepped
# by 4 in a loop turns back into a pointer that reaches its allocation.
# @aligned exposes an allocation aligned to 64 and returns its address
# modulo 64 and whether it is 0: every address the spec may give is a
# multiple of the allocation's alignment and at least 1, so the result
# does not depend on which address it is. No test returns an address.
tests = [
  { func = "@through_memory", args = ["77"], results = [{ values = ["77"], witness = [] }] },
  { func = "@through_memory", args = ["-1"], results = [{ values = ["-1"], witness = [] }] },
  { func = "@through_call", args = ["-5"], results = [{ values = ["-5"], witness = [] }] },
  { func = "@walk", args = ["1"], results = [{ values = ["15"], witness = [] }] },
  { func = "@walk", args = ["-3"], results = [{ values = ["-45"], witness = [] }] },
  { func = "@aligned", results = [{ values = ["0", "false"], witness = [] }] },
]
