# Tests of gpu-work-group-floats.fir: gpu.work_group_alloca allocates floats,
# as alloca does (the human's ruling of 2026-11-18 on #432). A float in
# work-group memory takes the units of the integer of its 1 + e + m bits, at
# the natural alignment of its size, and is stored as its IEEE bit pattern,
# so it loads back as the same float, a NaN's payload included, at every
# aliased format and at float(2, 1). Memory 3 has 16-bit units, so an f32
# takes two, the second holding its top 16 bits; memory 5 has bytes, so an
# f64 at offset 4 is UB. Each work-item stores into its own f32 of a tile of
# eight, and an index past the tile is UB. The allocation outlives the call
# that made it, as with integers, and a load from fresh memory gives poison.
# A kernel runs on fir-ref alone, so every test is interpreter-only.
tests = [
  { func = "@dev::@shared", args = ["1.5"], expect = ["1.5"], work_item = { id = [3, 0, 0], group_size = [8, 1, 1] } },
  { func = "@dev::@shared", args = ["0xffc00123"], expect = ["0xffc00123"], work_item = { id = [7, 0, 0], group_size = [8, 1, 1] } },
  { func = "@dev::@shared", args = ["1.0"], expect = "ub", work_item = { id = [8, 0, 0], group_size = [9, 1, 1] } },
  { func = "@dev::@kept", args = ["0x7ff0000000000001"], expect = ["0x7ff0000000000001"] },
  { func = "@dev::@kept", args = ["-0.0"], expect = ["-0.0"] },
  { func = "@dev::@round_f16", args = ["0xfe01"], expect = ["0xfe01"] },
  { func = "@dev::@round_bf16", args = ["0x7fc1"], expect = ["0x7fc1"] },
  { func = "@dev::@round_f128", args = ["0x7fff8000000000000000000000000001"], expect = ["0x7fff8000000000000000000000000001"] },
  { func = "@dev::@round_tiny", args = ["-1.5"], expect = ["-1.5"] },
  { func = "@dev::@f32_bits", args = ["1.0"], expect = ["1065353216"] },
  { func = "@dev::@f32_bits", args = ["0xff800000"], expect = ["-8388608"] },
  { func = "@dev::@top_unit", args = ["1.0"], expect = ["16256"] },
  { func = "@dev::@top_unit", args = ["0x7fc00123"], expect = ["32704"] },
  { func = "@dev::@misaligned", args = ["1.0"], expect = "ub" },
  { func = "@dev::@fresh", expect = ["poison"] },
]
