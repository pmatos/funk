# Tests of several-i8.fir: functions and calls with any number of
# results at i8 (#31, ADR-2026-11-03-0109). none returns nothing, and
# call_none calls it and returns its argument. two returns a + b and a,
# which come back in registers natively; three returns a - b, a + b and
# b, and eight a, a + 1, ... a + 7, with add and sub, which wrap: more
# than the two registers hold, so natively they go in a result area that
# the caller provides. use passes two results of three on to two and one
# of two on to eight, and returns one result of each call. fibs returns
# two consecutive Fibonacci numbers and trib three Tribonacci numbers,
# each calling itself on %n - 1 down to zero; even and odd call each
# other on %n - 1 down to zero and return whether %n is even or odd, %n
# and 2 * %n. poison returns a, a + 1 with nsw, which is poison when it
# overflows, and 1, and call_poison returns them reversed through a
# call. divmod returns the quotient, the remainder and the divisor of a
# udiv and urem, and call_divmod two of them through a call; a zero
# divisor is UB in the callee, and so of its caller. forever calls
# itself before it returns three values, and runs out of fuel.
# Each test without expect is differential: fir-ref and native code run
# it, and the native result must refine fir-ref's, value by value: a
# poison value matches any native value of its type. An interpreter-only
# twin of each run that returns poison checks that exactly that value is
# poison. UB and fuel exhaustion are interpreter-only. Recursion goes at
# most 20 deep.
tests = [
  { func = "@none", args = ["0"] },
  { func = "@call_none", args = ["0"] },
  { func = "@eight", args = ["0"] },
  { func = "@none", args = ["1"] },
  { func = "@call_none", args = ["1"] },
