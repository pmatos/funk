# Tests of fconst-f128.fir: float constants at f128 give their bits, each
# NaN's payload and sign included (ADR-2026-11-11-1138): +0, -0, the
# smallest subnormal, -1, the largest finite value, -inf, the quiet NaN,
# a quiet NaN with its sign set and a payload, and a signalling NaN. A
# NaN constant compared with itself is unordered.
# Each test is interpreter-only, as the backend does not lower f128.
tests = [
  { func = "@consts", expect = ["0", "-170141183460469231731687303715884105728", "1", "-85075784027093150693472182354271272960", "170135991163610696904058773219554885631", "-5192296858534827628530496329220096", "170138587312039964317873038467719495680", "-2596148429267413814265248164610047", "170135991163610696904058773219554885633"] },
  { func = "@one", expect = ["-2596148429267413814265248164610047"] },
  { func = "@nan_is_unordered", expect = ["false", "true"] },
]
