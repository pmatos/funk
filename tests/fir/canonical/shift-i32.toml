# Tests of shift-i32.fir: shl, lshr and ashr at i32. Each shifts every
# boundary bit pattern (0, 1, -1, the signed minimum and the signed
# maximum) by the amounts 0, 1, N - 1, N and N + 1, and by -1, the
# signed minimum and the signed maximum (#15). An amount is read as
# unsigned: -1 and the signed minimum have their top bit set and read as
# 4294967295 and 2147483648. An amount of N or more gives poison.
# Each test without expect is differential: fir-ref and native code run
# it, and the native result must refine fir-ref's; where fir-ref returns
# poison, any value of the type does.
# Where fir-ref returns poison, an interpreter-only test of the same
# run checks that it is exactly poison.
tests = [
  { func = "@shl", args = ["0", "0"] },
  { func = "@shl", args = ["0", "1"] },
  { func = "@shl", args = ["0", "31"] },
  { func = "@shl", args = ["0", "32"] },
  { func = "@shl", args = ["0", "32"], expect = ["poison"] },
  { func = "@shl", args = ["0", "33"] },
  { func = "@shl", args = ["0", "33"], expect = ["poison"] },
  { func = "@shl", args = ["0", "-1"] },
  { func = "@shl", args = ["0", "-1"], expect = ["poison"] },
  { func = "@shl", args = ["0", "-2147483648"] },
