# Tests of float-uitofp-f128.fir: conversions from integers (ADR-2026-11-09-1549) on
# the boundary integers of each width, the integers next to the
# format's precision, the ones halfway between two floats, and the
# ones on either side of overflow. Written by
# scripts/harness/float_itofp_cases.py, which computes each expected
# result with scripts/harness/float_ref.py, apart from Lean.
# Each test is interpreter-only: the backend does not lower this
# module's formats or widths, so fir-ref alone runs it and must
# give what it expects.
tests = [
  { func = "@ui_i1", args = ["false"], expect = ["0.0"] },
  { func = "@ui_i1", args = ["true"], expect = ["1.0"] },
  { func = "@ui_i1", args = ["poison"], expect = ["poison"] },
  { func = "@ui_i8", args = ["0"], expect = ["0.0"] },
  { func = "@ui_i8", args = ["1"], expect = ["1.0"] },
  { func = "@ui_i8", args = ["2"], expect = ["2.0"] },
  { func = "@ui_i8", args = ["-2"], expect = ["254.0"] },
  { func = "@ui_i8", args = ["-1"], expect = ["255.0"] },
  { func = "@ui_i8", args = ["poison"], expect = ["poison"] },
  { func = "@ui_i16", args = ["0"], expect = ["0.0"] },
  { func = "@ui_i16", args = ["1"], expect = ["1.0"] },
  { func = "@ui_i16", args = ["2"], expect = ["2.0"] },
  { func = "@ui_i16", args = ["-2"], expect = ["65534.0"] },
  { func = "@ui_i16", args = ["-1"], expect = ["65535.0"] },
  { func = "@ui_i16", args = ["poison"], expect = ["poison"] },
  { func = "@ui_i32", args = ["0"], expect = ["0.0"] },
  { func = "@ui_i32", args = ["1"], expect = ["1.0"] },
  { func = "@ui_i32", args = ["2"], expect = ["2.0"] },
  { func = "@ui_i32", args = ["-2"], expect = ["4294967294.0"] },
  { func = "@ui_i32", args = ["-1"], expect = ["4294967295.0"] },
  { func = "@ui_i32", args = ["poison"], expect = ["poison"] },
  { func = "@ui_i64", args = ["0"], expect = ["0.0"] },
  { func = "@ui_i64", args = ["1"], expect = ["1.0"] },
  { func = "@ui_i64", args = ["2"], expect = ["2.0"] },
  { func = "@ui_i64", args = ["-2"], expect = ["1.8446744073709551614e19"] },
  { func = "@ui_i64", args = ["-1"], expect = ["1.8446744073709551615e19"] },
  { func = "@ui_i64", args = ["poison"], expect = ["poison"] },
  { func = "@ui_i128", args = ["0"], expect = ["0.0"] },
  { func = "@ui_i128", args = ["1"], expect = ["1.0"] },
  { func = "@ui_i128", args = ["2"], expect = ["2.0"] },
  { func = "@ui_i128", args = ["10384593717069655257060992658440191"], expect = ["1.0384593717069655257060992658440191e34"] },
  { func = "@ui_i128", args = ["10384593717069655257060992658440192"], expect = ["1.0384593717069655257060992658440192e34"] },
  { func = "@ui_i128", args = ["10384593717069655257060992658440193"], expect = ["1.0384593717069655257060992658440192e34"] },
  { func = "@ui_i128", args = ["10384593717069655257060992658440194"], expect = ["1.0384593717069655257060992658440194e34"] },
  { func = "@ui_i128", args = ["10384593717069655257060992658440195"], expect = ["1.0384593717069655257060992658440196e34"] },
  { func = "@ui_i128", args = ["-170141183460469231731687303715884089345"], expect = ["1.701411834604692317316873037158841e38"] },
  { func = "@ui_i128", args = ["-170141183460469231731687303715884089344"], expect = ["1.701411834604692317316873037158841e38"] },
  { func = "@ui_i128", args = ["-170141183460469231731687303715884089343"], expect = ["1.7014118346046923173168730371588414e38"] },
  { func = "@ui_i128", args = ["-170141183460469231731687303715884056576"], expect = ["1.7014118346046923173168730371588417e38"] },
  { func = "@ui_i128", args = ["-2"], expect = ["3.402823669209384634633746074317682e38"] },
  { func = "@ui_i128", args = ["-1"], expect = ["3.402823669209384634633746074317682e38"] },
  { func = "@ui_i128", args = ["poison"], expect = ["poison"] },
]
