# Tests of float-calls.fir: f32 and f64 passed to and returned from
# functions as System V passes them (ADR-2026-11-11-1140): in %xmm0 to
# %xmm7 apart from the integers, then on the stack, and back in %xmm0 and
# %xmm1 or, with three eightbytes or more, in the result area; mixed
# with integers and an i128; through block arguments; and chosen by an
# fcmp. A float is spelled as the one float literal of its bits
# (ADR-2026-11-11-1438), and comes back as the same bits, a NaN with its
# payload and sign included. Each test is differential.
tests = [
  { func = "@many", args = ["2.0", "-1", "1.0000002", "2.0000000000000013", "-4", "1.0000006", "2.0000000000000027", "-7", "1.000001", "2.000000000000004", "-10", "1.0000013", "2.0000000000000053", "-13", "1.0000017", "2.0000000000000067", "-16", "1.000002"] },
  { func = "@call_many", args = ["2.0", "-1", "1.0000002", "2.0000000000000013", "-4", "1.0000006", "2.0000000000000027", "-7", "1.000001", "2.000000000000004", "-10", "1.0000013", "2.0000000000000053", "-13", "1.0000017", "2.0000000000000067", "-16", "1.000002"] },
  { func = "@two", args = ["0xffc00001", "0xfff0000000000001"] },
  { func = "@two", args = ["poison", "0.0"] },
  { func = "@mixed", args = ["-9223372036854775808", "0x7ff8000000000001"] },
  { func = "@wide", args = ["-170141183460469231731687303715884105728", "0x7f800001"] },
  { func = "@choose", args = ["true", "1.0", "0xffffffffffffffff"] },
  { func = "@choose", args = ["false", "1.0", "0xffffffffffffffff"] },
  { func = "@max", args = ["1.0", "2.0"] },
  { func = "@max", args = ["-0.0", "0.0"] },
  { func = "@max", args = ["0x7fc00000", "1.0"] },
  { func = "@max", args = ["1.0", "0x7fc00000"] },
]
