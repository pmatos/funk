# Tests of memops-native.fir: memcpy, memmove and memset run on fir-ref and
# as native code, where they call funk's own runtime routines (stage 4 of
# #234). A pointer copied, or moved over a range that overlaps its own,
# still reaches its allocation. At each width of the length that the backend
# lowers, read as unsigned, a copy carries the low bytes of an i64, and a
# copy onto its own range leaves it; a move whose ranges overlap, 3 bytes up
# or down, or none, takes what the source held before it began; and a set
# writes copies of an i8. A length of 0 does nothing. A poison length is a
# length that fir-ref chooses (the ruling of 2026-11-19), so native code's
# stand-ins for it must each give one of fir-ref's outcomes, and a poison
# value writes poison bytes. Each test without poison declares its result,
# so fir-ref's own is pinned as well as native code's.
