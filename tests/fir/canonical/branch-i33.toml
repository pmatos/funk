# Tests of branch-i33.fir: br and cond_br at i33, passing the boundary
# bit patterns, 0, 1, -1, the signed minimum and the signed maximum, to
# block arguments (#19). br passes %a to ^next, which returns it.
# cond_br goes to ^then with %a when %c is true and to ^else with %b
# when it is false, on each condition and every pair of boundary bit
# patterns; each block returns its argument.
# The backend does not lower i33, so each test is interpreter-only and
# states the result that fir-ref must give.
tests = [
  { func = "@br", args = ["0"], expect = ["0"] },
  { func = "@br", args = ["1"], expect = ["1"] },
  { func = "@br", args = ["-1"], expect = ["-1"] },
  { func = "@br", args = ["-4294967296"], expect = ["-4294967296"] },
  { func = "@br", args = ["4294967295"], expect = ["4294967295"] },
  { func = "@cond_br", args = ["false", "0", "0"], expect = ["0"] },
  { func = "@cond_br", args = ["false", "0", "1"], expect = ["1"] },
  { func = "@cond_br", args = ["false", "0", "-1"], expect = ["-1"] },
  { func = "@cond_br", args = ["false", "0", "-4294967296"], expect = ["-4294967296"] },
  { func = "@cond_br", args = ["false", "0", "4294967295"], expect = ["4294967295"] },
  { func = "@cond_br", args = ["false", "1", "0"], expect = ["0"] },
  { func = "@cond_br", args = ["false", "1", "1"], expect = ["1"] },
  { func = "@cond_br", args = ["false", "1", "-1"], expect = ["-1"] },
  { func = "@cond_br", args = ["false", "1", "-4294967296"], expect = ["-4294967296"] },
  { func = "@cond_br", args = ["false", "1", "4294967295"], expect = ["4294967295"] },
  { func = "@cond_br", args = ["false", "-1", "0"], expect = ["0"] },
  { func = "@cond_br", args = ["false", "-1", "1"], expect = ["1"] },
  { func = "@cond_br", args = ["false", "-1", "-1"], expect = ["-1"] },
  { func = "@cond_br", args = ["false", "-1", "-4294967296"], expect = ["-4294967296"] },
  { func = "@cond_br", args = ["false", "-1", "4294967295"], expect = ["4294967295"] },
  { func = "@cond_br", args = ["false", "-4294967296", "0"], expect = ["0"] },
  { func = "@cond_br", args = ["false", "-4294967296", "1"], expect = ["1"] },
  { func = "@cond_br", args = ["false", "-4294967296", "-1"], expect = ["-1"] },
  { func = "@cond_br", args = ["false", "-4294967296", "-4294967296"], expect = ["-4294967296"] },
  { func = "@cond_br", args = ["false", "-4294967296", "4294967295"], expect = ["4294967295"] },
  { func = "@cond_br", args = ["false", "4294967295", "0"], expect = ["0"] },
  { func = "@cond_br", args = ["false", "4294967295", "1"], expect = ["1"] },
  { func = "@cond_br", args = ["false", "4294967295", "-1"], expect = ["-1"] },
  { func = "@cond_br", args = ["false", "4294967295", "-4294967296"], expect = ["-4294967296"] },
  { func = "@cond_br", args = ["false", "4294967295", "4294967295"], expect = ["4294967295"] },
  { func = "@cond_br", args = ["true", "0", "0"], expect = ["0"] },
  { func = "@cond_br", args = ["true", "0", "1"], expect = ["0"] },
  { func = "@cond_br", args = ["true", "0", "-1"], expect = ["0"] },
  { func = "@cond_br", args = ["true", "0", "-4294967296"], expect = ["0"] },
  { func = "@cond_br", args = ["true", "0", "4294967295"], expect = ["0"] },
  { func = "@cond_br", args = ["true", "1", "0"], expect = ["1"] },
  { func = "@cond_br", args = ["true", "1", "1"], expect = ["1"] },
  { func = "@cond_br", args = ["true", "1", "-1"], expect = ["1"] },
  { func = "@cond_br", args = ["true", "1", "-4294967296"], expect = ["1"] },
  { func = "@cond_br", args = ["true", "1", "4294967295"], expect = ["1"] },
  { func = "@cond_br", args = ["true", "-1", "0"], expect = ["-1"] },
  { func = "@cond_br", args = ["true", "-1", "1"], expect = ["-1"] },
  { func = "@cond_br", args = ["true", "-1", "-1"], expect = ["-1"] },
  { func = "@cond_br", args = ["true", "-1", "-4294967296"], expect = ["-1"] },
  { func = "@cond_br", args = ["true", "-1", "4294967295"], expect = ["-1"] },
  { func = "@cond_br", args = ["true", "-4294967296", "0"], expect = ["-4294967296"] },
  { func = "@cond_br", args = ["true", "-4294967296", "1"], expect = ["-4294967296"] },
  { func = "@cond_br", args = ["true", "-4294967296", "-1"], expect = ["-4294967296"] },
  { func = "@cond_br", args = ["true", "-4294967296", "-4294967296"], expect = ["-4294967296"] },
  { func = "@cond_br", args = ["true", "-4294967296", "4294967295"], expect = ["-4294967296"] },
  { func = "@cond_br", args = ["true", "4294967295", "0"], expect = ["4294967295"] },
  { func = "@cond_br", args = ["true", "4294967295", "1"], expect = ["4294967295"] },
  { func = "@cond_br", args = ["true", "4294967295", "-1"], expect = ["4294967295"] },
  { func = "@cond_br", args = ["true", "4294967295", "-4294967296"], expect = ["4294967295"] },
  { func = "@cond_br", args = ["true", "4294967295", "4294967295"], expect = ["4294967295"] },
]
