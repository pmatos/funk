# Tests of float-fptrunc-f64-bf16.fir: fptrunc from f64 to bf16
# (ADR-2026-11-09-1549) on the edges of the source and of the target:
# zeros, subnormals, the largest finite values, the values halfway
# between two values of the target and next to them, overflow to
# infinity, underflow to zero, infinities and NaNs. Written by
# scripts/harness/float_convert_cases.py, which computes each expected
# result with scripts/harness/float_ref.py, apart from Lean.
# Each test is interpreter-only: the backend does not lower
# f64 and bf16 both, so fir-ref alone runs it and must give what it
# expects.
# A NaN operand gives any NaN of the target: its test is
# interpreter-only and names the NaN by a choice of the sign and the
# mantissa. Native code is not compared on a NaN result yet (#219).
tests = [
  { func = "@f64_bf16", args = ["0.0"], expect = ["0.0"] },
  { func = "@f64_bf16", args = ["5.0e-324"], expect = ["0.0"] },
  { func = "@f64_bf16", args = ["2.225073858507201e-308"], expect = ["0.0"] },
  { func = "@f64_bf16", args = ["2.2250738585072014e-308"], expect = ["0.0"] },
  { func = "@f64_bf16", args = ["4.59177480789956e-41"], expect = ["0.0"] },
  { func = "@f64_bf16", args = ["4.591774807899561e-41"], expect = ["0.0"] },
  { func = "@f64_bf16", args = ["4.591774807899562e-41"], expect = ["9.0e-41"] },
  { func = "@f64_bf16", args = ["9.183549615799121e-41"], expect = ["9.0e-41"] },
  { func = "@f64_bf16", args = ["1.377532442369868e-40"], expect = ["9.0e-41"] },
  { func = "@f64_bf16", args = ["1.3775324423698682e-40"], expect = ["2.0e-40"] },
  { func = "@f64_bf16", args = ["1.3775324423698684e-40"], expect = ["2.0e-40"] },
  { func = "@f64_bf16", args = ["2.29588740394978e-40"], expect = ["2.0e-40"] },
  { func = "@f64_bf16", args = ["2.2958874039497803e-40"], expect = ["2.0e-40"] },
  { func = "@f64_bf16", args = ["2.2958874039497807e-40"], expect = ["3.0e-40"] },
  { func = "@f64_bf16", args = ["1.1754943508222875e-38"], expect = ["1.18e-38"] },
  { func = "@f64_bf16", args = ["1.0"], expect = ["1.0"] },
  { func = "@f64_bf16", args = ["1.0039062499999998"], expect = ["1.0"] },
  { func = "@f64_bf16", args = ["1.00390625"], expect = ["1.0"] },
  { func = "@f64_bf16", args = ["1.0039062500000002"], expect = ["1.01"] },
  { func = "@f64_bf16", args = ["1.0117187499999998"], expect = ["1.01"] },
  { func = "@f64_bf16", args = ["1.01171875"], expect = ["1.016"] },
  { func = "@f64_bf16", args = ["1.0117187500000002"], expect = ["1.016"] },
  { func = "@f64_bf16", args = ["3.3895313892515355e38"], expect = ["3.39e38"] },
