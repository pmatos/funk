  { func = "@f64_bf16", args = ["3.39617752923046e38"], expect = ["0x7f80"] },
  { func = "@f64_bf16", args = ["3.3961775292304604e38"], expect = ["0x7f80"] },
  { func = "@f64_bf16", args = ["1.7976931348623157e308"], expect = ["0x7f80"] },
  { func = "@f64_bf16", args = ["0x7ff0000000000000"], expect = ["0x7f80"] },
  { func = "@f64_bf16", args = ["-0.0"], expect = ["-0.0"] },
  { func = "@f64_bf16", args = ["-5.0e-324"], expect = ["-0.0"] },
