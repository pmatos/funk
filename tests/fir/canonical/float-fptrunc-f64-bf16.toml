  { func = "@f64_bf16", args = ["-3.3895313892515355e38"], expect = ["-3.39e38"] },
  { func = "@f64_bf16", args = ["-3.3961775292304597e38"], expect = ["-3.39e38"] },
  { func = "@f64_bf16", args = ["-3.39617752923046e38"], expect = ["0xff80"] },
  { func = "@f64_bf16", args = ["-3.3961775292304604e38"], expect = ["0xff80"] },
  { func = "@f64_bf16", args = ["-1.7976931348623157e308"], expect = ["0xff80"] },
  { func = "@f64_bf16", args = ["0xfff0000000000000"], expect = ["0xff80"] },
  { func = "@f64_bf16", args = ["0x7ff8000000000000"], choices = ["0"], expect = ["0x7fc0"] },
  { func = "@f64_bf16", args = ["0x7ff0000000000001"], choices = ["-1"], expect = ["0xffff"] },
  { func = "@f64_bf16", args = ["0xffffffffffffffff"], choices = ["1"], expect = ["0x7f81"] },
