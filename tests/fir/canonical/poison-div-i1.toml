# Tests of poison-div-i1.fir: the poison and UB rules of sdiv and udiv,
# each with and without exact, srem and urem at i1 (#18). %p = add nsw
# %a, true is poison when %a is true; OP_left returns OP %p, %b,
# OP_right returns OP %b, %p and OP_both returns OP %p, %p, and each
# test passes that value as %a.
# - A poison divisor is UB, whatever the dividend: OP_right on each
#   boundary bit pattern %b, and OP_both, whose dividend is poison too.
# - A poison dividend, OP_left by each boundary bit pattern %b: a zero
#   divisor is UB, and so are sdiv and srem by -1, as the dividend
#   might be the signed minimum; every other divisor gives poison,
#   udiv and urem by all ones included.
# At i1 the boundary bit patterns are false and true, and true is -1 and
# all ones, so a poison dividend gives poison only in udiv and urem by
# true.
# Each test is interpreter-only and states the result that fir-ref must
# give: poison, or ub. fir-ref's UB reason names its case, such as "udiv
# by poison", "urem by zero" or "srem of poison by -1", but the harness
# matches ub to any reason (ADR-2026-10-30-2135).
tests = [
  { func = "@sdiv_left", args = ["true", "false"], expect = "ub" },
  { func = "@sdiv_left", args = ["true", "true"], expect = "ub" },
  { func = "@sdiv_right", args = ["true", "false"], expect = "ub" },
  { func = "@sdiv_right", args = ["true", "true"], expect = "ub" },
  { func = "@sdiv_both", args = ["true"], expect = "ub" },
  { func = "@sdiv_exact_left", args = ["true", "false"], expect = "ub" },
  { func = "@sdiv_exact_left", args = ["true", "true"], expect = "ub" },
  { func = "@sdiv_exact_right", args = ["true", "false"], expect = "ub" },
  { func = "@sdiv_exact_right", args = ["true", "true"], expect = "ub" },
  { func = "@sdiv_exact_both", args = ["true"], expect = "ub" },
  { func = "@udiv_left", args = ["true", "false"], expect = "ub" },
  { func = "@udiv_left", args = ["true", "true"], expect = ["poison"] },
  { func = "@udiv_right", args = ["true", "false"], expect = "ub" },
  { func = "@udiv_right", args = ["true", "true"], expect = "ub" },
  { func = "@udiv_both", args = ["true"], expect = "ub" },
  { func = "@udiv_exact_left", args = ["true", "false"], expect = "ub" },
  { func = "@udiv_exact_left", args = ["true", "true"], expect = ["poison"] },
  { func = "@udiv_exact_right", args = ["true", "false"], expect = "ub" },
  { func = "@udiv_exact_right", args = ["true", "true"], expect = "ub" },
  { func = "@udiv_exact_both", args = ["true"], expect = "ub" },
  { func = "@srem_left", args = ["true", "false"], expect = "ub" },
  { func = "@srem_left", args = ["true", "true"], expect = "ub" },
  { func = "@srem_right", args = ["true", "false"], expect = "ub" },
  { func = "@srem_right", args = ["true", "true"], expect = "ub" },
  { func = "@srem_both", args = ["true"], expect = "ub" },
  { func = "@urem_left", args = ["true", "false"], expect = "ub" },
  { func = "@urem_left", args = ["true", "true"], expect = ["poison"] },
  { func = "@urem_right", args = ["true", "false"], expect = "ub" },
  { func = "@urem_right", args = ["true", "true"], expect = "ub" },
  { func = "@urem_both", args = ["true"], expect = "ub" },
]
