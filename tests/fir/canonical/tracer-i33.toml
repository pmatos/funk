# Tests of tracer-i33.fir: const, add and ret at i33.
# The backend does not lower i33, so each test is interpreter-only and
# states the result that fir-ref must give.
tests = [
  { func = "@id", args = ["0"], expect = ["0"] },
  { func = "@id", args = ["1"], expect = ["1"] },
  { func = "@id", args = ["-1"], expect = ["-1"] },
  { func = "@id", args = ["-4294967296"], expect = ["-4294967296"] },
  { func = "@id", args = ["4294967295"], expect = ["4294967295"] },
  { func = "@add", args = ["0", "0"], expect = ["0"] },
  { func = "@add", args = ["0", "1"], expect = ["1"] },
  { func = "@add", args = ["0", "-1"], expect = ["-1"] },
  { func = "@add", args = ["0", "-4294967296"], expect = ["-4294967296"] },
  { func = "@add", args = ["0", "4294967295"], expect = ["4294967295"] },
  { func = "@add", args = ["1", "0"], expect = ["1"] },
  { func = "@add", args = ["1", "1"], expect = ["2"] },
  { func = "@add", args = ["1", "-1"], expect = ["0"] },
  { func = "@add", args = ["1", "-4294967296"], expect = ["-4294967295"] },
  { func = "@add", args = ["1", "4294967295"], expect = ["-4294967296"] },
  { func = "@add", args = ["-1", "0"], expect = ["-1"] },
  { func = "@add", args = ["-1", "1"], expect = ["0"] },
  { func = "@add", args = ["-1", "-1"], expect = ["-2"] },
  { func = "@add", args = ["-1", "-4294967296"], expect = ["4294967295"] },
  { func = "@add", args = ["-1", "4294967295"], expect = ["4294967294"] },
  { func = "@add", args = ["-4294967296", "0"], expect = ["-4294967296"] },
  { func = "@add", args = ["-4294967296", "1"], expect = ["-4294967295"] },
  { func = "@add", args = ["-4294967296", "-1"], expect = ["4294967295"] },
  { func = "@add", args = ["-4294967296", "-4294967296"], expect = ["0"] },
  { func = "@add", args = ["-4294967296", "4294967295"], expect = ["-1"] },
  { func = "@add", args = ["4294967295", "0"], expect = ["4294967295"] },
  { func = "@add", args = ["4294967295", "1"], expect = ["-4294967296"] },
  { func = "@add", args = ["4294967295", "-1"], expect = ["4294967294"] },
  { func = "@add", args = ["4294967295", "-4294967296"], expect = ["-1"] },
  { func = "@add", args = ["4294967295", "4294967295"], expect = ["-2"] },
  { func = "@double", args = ["0"], expect = ["0"] },
  { func = "@double", args = ["1"], expect = ["2"] },
  { func = "@double", args = ["-1"], expect = ["-2"] },
  { func = "@double", args = ["-4294967296"], expect = ["0"] },
  { func = "@double", args = ["4294967295"], expect = ["-2"] },
  { func = "@inc", args = ["0"], expect = ["1"] },
  { func = "@inc", args = ["1"], expect = ["2"] },
  { func = "@inc", args = ["-1"], expect = ["0"] },
  { func = "@inc", args = ["-4294967296"], expect = ["-4294967295"] },
  { func = "@inc", args = ["4294967295"], expect = ["-4294967296"] },
  { func = "@const_zero", expect = ["0"] },
  { func = "@const_one", expect = ["1"] },
  { func = "@const_minus_one", expect = ["-1"] },
  { func = "@const_min", expect = ["-4294967296"] },
  { func = "@const_max", expect = ["4294967295"] },
  { func = "@sum8", args = ["1", "1", "1", "1", "1", "1", "1", "1"], expect = ["8"] },
  { func = "@sum8", args = ["4294967295", "1", "0", "0", "0", "0", "0", "0"], expect = ["-4294967296"] },
  { func = "@sum8", args = ["0", "0", "0", "0", "0", "0", "4294967295", "1"], expect = ["-4294967296"] },
  { func = "@sum8", args = ["-4294967296", "4294967295", "-1", "1", "0", "1", "-4294967296", "4294967295"], expect = ["-1"] },
  { func = "@last", args = ["1", "2", "3", "4", "5", "6", "7", "-4294967296"], expect = ["-4294967296"] },
  { func = "@none", args = ["4294967295"], expect = [] },
  { func = "@sum8", args = ["1", "1", "1", "1", "1", "1", "1", "1"], fuel = 7, expect = "fuel-exhausted" }, # 8 ops need 8 steps
  { func = "@sum8", args = ["1", "1", "1", "1", "1", "1", "1", "1"], fuel = 8, expect = ["8"] },
]
