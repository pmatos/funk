# Tests of float-fpext-f16-f32.fir: fpext from f16 to f32
# (ADR-2026-11-09-1549) on the edges of the source and of the target:
# zeros, subnormals, the largest finite values, the values halfway
# between two values of the target and next to them, overflow to
# infinity, underflow to zero, infinities and NaNs. Written by
# scripts/harness/float_convert_cases.py, which computes each expected
# result with scripts/harness/float_ref.py, apart from Lean.
# Each test is interpreter-only: the backend does not lower
# f16 and f32 both, so fir-ref alone runs it and must give what it
# expects.
# A NaN operand gives any NaN of the target: its test is
# interpreter-only and names the NaN by a choice of the sign and the
# mantissa. Native code is not compared on a NaN result yet (#219).
tests = [
  { func = "@f16_f32", args = ["0.0"], expect = ["0.0"] },
  { func = "@f16_f32", args = ["6.0e-8"], expect = ["5.9604645e-8"] },
  { func = "@f16_f32", args = ["6.1e-5"], expect = ["6.097555e-5"] },
  { func = "@f16_f32", args = ["6.104e-5"], expect = ["6.1035156e-5"] },
  { func = "@f16_f32", args = ["1.0"], expect = ["1.0"] },
  { func = "@f16_f32", args = ["65500.0"], expect = ["65504.0"] },
  { func = "@f16_f32", args = ["0x7c00"], expect = ["0x7f800000"] },
  { func = "@f16_f32", args = ["-0.0"], expect = ["-0.0"] },
  { func = "@f16_f32", args = ["-6.0e-8"], expect = ["-5.9604645e-8"] },
  { func = "@f16_f32", args = ["-6.1e-5"], expect = ["-6.097555e-5"] },
  { func = "@f16_f32", args = ["-6.104e-5"], expect = ["-6.1035156e-5"] },
  { func = "@f16_f32", args = ["-1.0"], expect = ["-1.0"] },
  { func = "@f16_f32", args = ["-65500.0"], expect = ["-65504.0"] },
  { func = "@f16_f32", args = ["0xfc00"], expect = ["0xff800000"] },
  { func = "@f16_f32", args = ["0x7e00"], choices = ["0"], expect = ["0x7fc00000"] },
  { func = "@f16_f32", args = ["0x7c01"], choices = ["-1"], expect = ["0xffffffff"] },
  { func = "@f16_f32", args = ["0xffff"], choices = ["1"], expect = ["0x7f800001"] },
  { func = "@f16_f32", args = ["poison"], expect = ["poison"] },
]
