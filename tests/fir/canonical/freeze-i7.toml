# Tests of freeze-i7.fir: freeze at i7. freeze of a value gives it,
# with no choice; freeze of poison chooses a value, the same for every
# use (#14). %p = add nsw %a, 1 is poison when %a is the signed
# maximum, true at i1, and %f freezes it.
# The backend does not lower i7, so each test is interpreter-only:
# its choices name the path, and it states the result of that path.
tests = [
  { func = "@freeze", args = ["0"], expect = ["0"] },
  { func = "@freeze", args = ["1"], expect = ["1"] },
  { func = "@freeze", args = ["-1"], expect = ["-1"] },
  { func = "@freeze", args = ["-64"], expect = ["-64"] },
  { func = "@freeze", args = ["63"], expect = ["63"] },
  { func = "@freeze_poison", args = ["63"], choices = ["0"], expect = ["0"] },
  { func = "@freeze_sub", args = ["63"], choices = ["0"], expect = ["0"] },
  { func = "@freeze_add", args = ["63"], choices = ["0"], expect = ["0"] },
  { func = "@freeze_mul_zero", args = ["63"], choices = ["0"], expect = ["0"] },
  { func = "@freeze_square", args = ["63"], choices = ["0"], expect = ["0"] },
  { func = "@freeze_double", args = ["63"], choices = ["0"], expect = ["0"] },
  { func = "@freeze_poison", args = ["63"], choices = ["1"], expect = ["1"] },
  { func = "@freeze_sub", args = ["63"], choices = ["1"], expect = ["0"] },
  { func = "@freeze_add", args = ["63"], choices = ["1"], expect = ["2"] },
  { func = "@freeze_mul_zero", args = ["63"], choices = ["1"], expect = ["0"] },
  { func = "@freeze_square", args = ["63"], choices = ["1"], expect = ["1"] },
  { func = "@freeze_double", args = ["63"], choices = ["1"], expect = ["0"] },
  { func = "@freeze_poison", args = ["63"], choices = ["-1"], expect = ["-1"] },
  { func = "@freeze_sub", args = ["63"], choices = ["-1"], expect = ["0"] },
  { func = "@freeze_add", args = ["63"], choices = ["-1"], expect = ["-2"] },
  { func = "@freeze_mul_zero", args = ["63"], choices = ["-1"], expect = ["0"] },
  { func = "@freeze_square", args = ["63"], choices = ["-1"], expect = ["1"] },
  { func = "@freeze_double", args = ["63"], choices = ["-1"], expect = ["0"] },
  { func = "@freeze_poison", args = ["63"], choices = ["-64"], expect = ["-64"] },
  { func = "@freeze_sub", args = ["63"], choices = ["-64"], expect = ["0"] },
  { func = "@freeze_add", args = ["63"], choices = ["-64"], expect = ["0"] },
  { func = "@freeze_mul_zero", args = ["63"], choices = ["-64"], expect = ["0"] },
  { func = "@freeze_square", args = ["63"], choices = ["-64"], expect = ["poison"] },
  { func = "@freeze_double", args = ["63"], choices = ["-64"], expect = ["0"] },
  { func = "@freeze_poison", args = ["63"], choices = ["63"], expect = ["63"] },
  { func = "@freeze_sub", args = ["63"], choices = ["63"], expect = ["0"] },
  { func = "@freeze_add", args = ["63"], choices = ["63"], expect = ["-2"] },
  { func = "@freeze_mul_zero", args = ["63"], choices = ["63"], expect = ["0"] },
  { func = "@freeze_square", args = ["63"], choices = ["63"], expect = ["poison"] },
  { func = "@freeze_double", args = ["63"], choices = ["63"], expect = ["0"] },
  { func = "@freeze_poison", args = ["63"], choices = ["42"], expect = ["42"] },
  { func = "@freeze_sub", args = ["63"], choices = ["42"], expect = ["0"] },
  { func = "@freeze_add", args = ["63"], choices = ["42"], expect = ["-44"] },
  { func = "@freeze_mul_zero", args = ["63"], choices = ["42"], expect = ["0"] },
  { func = "@freeze_square", args = ["63"], choices = ["42"], expect = ["poison"] },
  { func = "@freeze_double", args = ["63"], choices = ["42"], expect = ["0"] },
  { func = "@freeze_twice", args = ["63"], choices = ["0", "0"], expect = ["0"] },
  { func = "@freeze_twice", args = ["63"], choices = ["1", "-1"], expect = ["2"] },
  { func = "@freeze_twice", args = ["63"], choices = ["-64", "63"], expect = ["1"] },
  { func = "@freeze_twice", args = ["63"], choices = ["63", "-64"], expect = ["-1"] },
  { func = "@freeze_poison", args = ["0"], expect = ["1"] },
]
