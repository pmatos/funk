# Tests of branch-i8.fir: br and cond_br at i8, passing the boundary bit
# patterns, 0, 1, -1, the signed minimum and the signed maximum, to
# block arguments (#19). br passes %a to ^next, which returns it.
# cond_br goes to ^then with %a when %c is true and to ^else with %b
# when it is false, on each condition and every pair of boundary bit
# patterns; each block returns its argument.
# Each test without expect is differential: fir-ref and native code run
# it, and the native result must refine fir-ref's.
tests = [
  { func = "@br", args = ["0"] },
  { func = "@br", args = ["1"] },
  { func = "@br", args = ["-1"] },
  { func = "@br", args = ["-128"] },
  { func = "@br", args = ["127"] },
  { func = "@cond_br", args = ["false", "0", "0"] },
  { func = "@cond_br", args = ["false", "0", "1"] },
  { func = "@cond_br", args = ["false", "0", "-1"] },
  { func = "@cond_br", args = ["false", "0", "-128"] },
  { func = "@cond_br", args = ["false", "0", "127"] },
  { func = "@cond_br", args = ["false", "1", "0"] },
  { func = "@cond_br", args = ["false", "1", "1"] },
  { func = "@cond_br", args = ["false", "1", "-1"] },
  { func = "@cond_br", args = ["false", "1", "-128"] },
  { func = "@cond_br", args = ["false", "1", "127"] },
  { func = "@cond_br", args = ["false", "-1", "0"] },
  { func = "@cond_br", args = ["false", "-1", "1"] },
  { func = "@cond_br", args = ["false", "-1", "-1"] },
  { func = "@cond_br", args = ["false", "-1", "-128"] },
  { func = "@cond_br", args = ["false", "-1", "127"] },
  { func = "@cond_br", args = ["false", "-128", "0"] },
  { func = "@cond_br", args = ["false", "-128", "1"] },
  { func = "@cond_br", args = ["false", "-128", "-1"] },
  { func = "@cond_br", args = ["false", "-128", "-128"] },
  { func = "@cond_br", args = ["false", "-128", "127"] },
  { func = "@cond_br", args = ["false", "127", "0"] },
  { func = "@cond_br", args = ["false", "127", "1"] },
  { func = "@cond_br", args = ["false", "127", "-1"] },
  { func = "@cond_br", args = ["false", "127", "-128"] },
  { func = "@cond_br", args = ["false", "127", "127"] },
  { func = "@cond_br", args = ["true", "0", "0"] },
  { func = "@cond_br", args = ["true", "0", "1"] },
  { func = "@cond_br", args = ["true", "0", "-1"] },
  { func = "@cond_br", args = ["true", "0", "-128"] },
  { func = "@cond_br", args = ["true", "0", "127"] },
  { func = "@cond_br", args = ["true", "1", "0"] },
  { func = "@cond_br", args = ["true", "1", "1"] },
  { func = "@cond_br", args = ["true", "1", "-1"] },
  { func = "@cond_br", args = ["true", "1", "-128"] },
  { func = "@cond_br", args = ["true", "1", "127"] },
  { func = "@cond_br", args = ["true", "-1", "0"] },
  { func = "@cond_br", args = ["true", "-1", "1"] },
  { func = "@cond_br", args = ["true", "-1", "-1"] },
  { func = "@cond_br", args = ["true", "-1", "-128"] },
  { func = "@cond_br", args = ["true", "-1", "127"] },
  { func = "@cond_br", args = ["true", "-128", "0"] },
  { func = "@cond_br", args = ["true", "-128", "1"] },
  { func = "@cond_br", args = ["true", "-128", "-1"] },
  { func = "@cond_br", args = ["true", "-128", "-128"] },
  { func = "@cond_br", args = ["true", "-128", "127"] },
  { func = "@cond_br", args = ["true", "127", "0"] },
  { func = "@cond_br", args = ["true", "127", "1"] },
  { func = "@cond_br", args = ["true", "127", "-1"] },
  { func = "@cond_br", args = ["true", "127", "-128"] },
  { func = "@cond_br", args = ["true", "127", "127"] },
]
