# Tests of float-flags-f16.fir: each float op with each fast-math flag
# at f16 (#242, ADR-2026-11-09-1549): a NaN operand or result gives
# poison under nnan, an infinite operand or result under ninf, and a
# zero result is either zero under nsz, which the choice true flips;
# fcmp nsz is the op without the flag. The last case of each op is
# one the flag does not decide.
# Written by scripts/harness/float_flag_cases.py, which computes each
# expected result with scripts/harness/float_ref.py, apart from Lean.
# Each test is interpreter-only: the backend does not lower
# f16, so fir-ref alone runs it and must give what it expects.
tests = [
  { func = "@fcmp_nnan", args = ["0x7e00", "1.0"], expect = ["poison"] },
  { func = "@fcmp_nnan", args = ["1.0", "2.0"], expect = ["false"] },
  { func = "@fadd_nnan", args = ["0x7e00", "1.0"], expect = ["poison"] },
  { func = "@fadd_nnan", args = ["0x7c00", "0xfc00"], expect = ["poison"] },
  { func = "@fadd_nnan", args = ["1.0", "2.0"], expect = ["3.0"] },
  { func = "@fsub_nnan", args = ["1.0", "0x7e00"], expect = ["poison"] },
  { func = "@fsub_nnan", args = ["0x7c00", "0x7c00"], expect = ["poison"] },
  { func = "@fsub_nnan", args = ["3.0", "1.0"], expect = ["2.0"] },
  { func = "@fmul_nnan", args = ["0x7e00", "2.0"], expect = ["poison"] },
  { func = "@fmul_nnan", args = ["0.0", "0x7c00"], expect = ["poison"] },
  { func = "@fmul_nnan", args = ["2.0", "2.0"], expect = ["4.0"] },
  { func = "@fdiv_nnan", args = ["0x7e00", "1.0"], expect = ["poison"] },
  { func = "@fdiv_nnan", args = ["0.0", "0.0"], expect = ["poison"] },
  { func = "@fdiv_nnan", args = ["1.0", "2.0"], expect = ["0.5"] },
  { func = "@frem_nnan", args = ["0x7e00", "1.0"], expect = ["poison"] },
  { func = "@frem_nnan", args = ["1.0", "0.0"], expect = ["poison"] },
  { func = "@frem_nnan", args = ["3.0", "2.0"], expect = ["-1.0"] },
  { func = "@fmod_nnan", args = ["1.0", "0x7e00"], expect = ["poison"] },
  { func = "@fmod_nnan", args = ["0x7c00", "1.0"], expect = ["poison"] },
  { func = "@fmod_nnan", args = ["3.0", "2.0"], expect = ["1.0"] },
  { func = "@fneg_nnan", args = ["0x7e00"], expect = ["poison"] },
  { func = "@fneg_nnan", args = ["1.0"], expect = ["-1.0"] },
  { func = "@fabs_nnan", args = ["0x7e00"], expect = ["poison"] },
  { func = "@fabs_nnan", args = ["-1.0"], expect = ["1.0"] },
  { func = "@sqrt_nnan", args = ["0x7e00"], expect = ["poison"] },
  { func = "@sqrt_nnan", args = ["-1.0"], expect = ["poison"] },
  { func = "@sqrt_nnan", args = ["4.0"], expect = ["2.0"] },
  { func = "@fma_nnan", args = ["0x7e00", "1.0", "1.0"], expect = ["poison"] },
  { func = "@fma_nnan", args = ["0.0", "0x7c00", "1.0"], expect = ["poison"] },
  { func = "@fma_nnan", args = ["1.0", "2.0", "3.0"], expect = ["5.0"] },
  { func = "@fcmp_ninf", args = ["1.0", "0x7c00"], expect = ["poison"] },
  { func = "@fcmp_ninf", args = ["1.0", "2.0"], expect = ["true"] },
  { func = "@fadd_ninf", args = ["0x7c00", "1.0"], expect = ["poison"] },
  { func = "@fadd_ninf", args = ["65500.0", "65500.0"], expect = ["poison"] },
  { func = "@fadd_ninf", args = ["1.0", "2.0"], expect = ["3.0"] },
  { func = "@fsub_ninf", args = ["1.0", "0xfc00"], expect = ["poison"] },
  { func = "@fsub_ninf", args = ["65500.0", "-65500.0"], expect = ["poison"] },
  { func = "@fsub_ninf", args = ["3.0", "1.0"], expect = ["2.0"] },
  { func = "@fmul_ninf", args = ["0x7c00", "2.0"], expect = ["poison"] },
  { func = "@fmul_ninf", args = ["65500.0", "2.0"], expect = ["poison"] },
  { func = "@fmul_ninf", args = ["2.0", "2.0"], expect = ["4.0"] },
  { func = "@fdiv_ninf", args = ["1.0", "0x7c00"], expect = ["poison"] },
  { func = "@fdiv_ninf", args = ["1.0", "0.0"], expect = ["poison"] },
  { func = "@fdiv_ninf", args = ["1.0", "2.0"], expect = ["0.5"] },
  { func = "@frem_ninf", args = ["1.0", "0x7c00"], expect = ["poison"] },
  { func = "@frem_ninf", args = ["3.0", "2.0"], expect = ["-1.0"] },
  { func = "@fmod_ninf", args = ["-1.0", "0xfc00"], expect = ["poison"] },
  { func = "@fmod_ninf", args = ["3.0", "2.0"], expect = ["1.0"] },
  { func = "@fneg_ninf", args = ["0x7c00"], expect = ["poison"] },
  { func = "@fneg_ninf", args = ["1.0"], expect = ["-1.0"] },
  { func = "@fabs_ninf", args = ["0xfc00"], expect = ["poison"] },
  { func = "@fabs_ninf", args = ["-1.0"], expect = ["1.0"] },
  { func = "@sqrt_ninf", args = ["0x7c00"], expect = ["poison"] },
  { func = "@sqrt_ninf", args = ["4.0"], expect = ["2.0"] },
  { func = "@fma_ninf", args = ["0x7c00", "1.0", "1.0"], expect = ["poison"] },
  { func = "@fma_ninf", args = ["65500.0", "2.0", "0.0"], expect = ["poison"] },
  { func = "@fma_ninf", args = ["1.0", "2.0", "3.0"], expect = ["5.0"] },
  { func = "@fcmp_nsz", args = ["-0.0", "0.0"], expect = ["true"] },
  { func = "@fcmp_nsz", args = ["1.0", "2.0"], expect = ["false"] },
  { func = "@fadd_nsz", args = ["-0.0", "-0.0"], choices = ["false"], expect = ["-0.0"] },
  { func = "@fadd_nsz", args = ["-0.0", "-0.0"], choices = ["true"], expect = ["0.0"] },
  { func = "@fadd_nsz", args = ["1.0", "-1.0"], choices = ["false"], expect = ["0.0"] },
  { func = "@fadd_nsz", args = ["1.0", "-1.0"], choices = ["true"], expect = ["-0.0"] },
  { func = "@fadd_nsz", args = ["1.0", "2.0"], expect = ["3.0"] },
  { func = "@fsub_nsz", args = ["1.0", "1.0"], choices = ["false"], expect = ["0.0"] },
  { func = "@fsub_nsz", args = ["1.0", "1.0"], choices = ["true"], expect = ["-0.0"] },
  { func = "@fsub_nsz", args = ["3.0", "1.0"], expect = ["2.0"] },
  { func = "@fmul_nsz", args = ["-0.0", "1.0"], choices = ["false"], expect = ["-0.0"] },
  { func = "@fmul_nsz", args = ["-0.0", "1.0"], choices = ["true"], expect = ["0.0"] },
  { func = "@fmul_nsz", args = ["2.0", "2.0"], expect = ["4.0"] },
  { func = "@fdiv_nsz", args = ["0.0", "1.0"], choices = ["false"], expect = ["0.0"] },
  { func = "@fdiv_nsz", args = ["0.0", "1.0"], choices = ["true"], expect = ["-0.0"] },
  { func = "@fdiv_nsz", args = ["1.0", "2.0"], expect = ["0.5"] },
  { func = "@frem_nsz", args = ["4.0", "2.0"], choices = ["false"], expect = ["0.0"] },
  { func = "@frem_nsz", args = ["4.0", "2.0"], choices = ["true"], expect = ["-0.0"] },
  { func = "@frem_nsz", args = ["-4.0", "2.0"], choices = ["false"], expect = ["-0.0"] },
  { func = "@frem_nsz", args = ["-4.0", "2.0"], choices = ["true"], expect = ["0.0"] },
  { func = "@frem_nsz", args = ["3.0", "2.0"], expect = ["-1.0"] },
  { func = "@fmod_nsz", args = ["-4.0", "2.0"], choices = ["false"], expect = ["-0.0"] },
  { func = "@fmod_nsz", args = ["-4.0", "2.0"], choices = ["true"], expect = ["0.0"] },
  { func = "@fmod_nsz", args = ["3.0", "2.0"], expect = ["1.0"] },
  { func = "@fneg_nsz", args = ["0.0"], choices = ["false"], expect = ["-0.0"] },
  { func = "@fneg_nsz", args = ["0.0"], choices = ["true"], expect = ["0.0"] },
  { func = "@fneg_nsz", args = ["1.0"], expect = ["-1.0"] },
  { func = "@fabs_nsz", args = ["-0.0"], choices = ["false"], expect = ["0.0"] },
  { func = "@fabs_nsz", args = ["-0.0"], choices = ["true"], expect = ["-0.0"] },
  { func = "@fabs_nsz", args = ["-1.0"], expect = ["1.0"] },
  { func = "@sqrt_nsz", args = ["-0.0"], choices = ["false"], expect = ["-0.0"] },
  { func = "@sqrt_nsz", args = ["-0.0"], choices = ["true"], expect = ["0.0"] },
  { func = "@sqrt_nsz", args = ["4.0"], expect = ["2.0"] },
  { func = "@fma_nsz", args = ["1.0", "-1.0", "1.0"], choices = ["false"], expect = ["0.0"] },
  { func = "@fma_nsz", args = ["1.0", "-1.0", "1.0"], choices = ["true"], expect = ["-0.0"] },
  { func = "@fma_nsz", args = ["1.0", "2.0", "3.0"], expect = ["5.0"] },
]
