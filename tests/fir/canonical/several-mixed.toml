# Tests of several-mixed.fir: several results of mixed widths, and calls
# with six or more arguments whose results go in memory (#31,
# ADR-2026-10-30-1232). mixed returns seven results of i1, i8, i16, i32
# and i64: more than the two registers hold, so natively they go in a
# result area that the caller provides, at eight bytes each. Its i1
# result !a is a + true, whose slot natively holds 2 for true, and b + 1
# at i8 wraps; each reader reads only the low bits. flip returns an i1
# and an i16, in registers. mixed_use passes two results of mixed on to
# flip, compares one with icmp slt, sign-extends another and adds it to
# a third. spread takes eight arguments and returns five results, so
# natively the area's address goes first and three arguments go on the
# stack; spread_call returns them reversed. six takes six arguments,
# the sixth then on the stack, and six_call passes results of one call
# of six on to another. The arguments are the boundary bit patterns of
# their types, 0, 1, -1, the signed minimum and the signed maximum
# (false and true at i1), rotated so that each parameter takes each of
# them. Each test is differential: fir-ref and native code run it, and
# the native result must refine fir-ref's.
tests = [
  { func = "@mixed", args = ["false", "1", "-1", "-2147483648", "9223372036854775807"] },
  { func = "@mixed", args = ["true", "-1", "-32768", "2147483647", "0"] },
  { func = "@mixed", args = ["false", "-128", "32767", "0", "1"] },
  { func = "@mixed", args = ["true", "127", "0", "1", "-1"] },
  { func = "@mixed", args = ["false", "0", "1", "-1", "-9223372036854775808"] },
  { func = "@mixed_use", args = ["false", "1", "-1", "-2147483648", "9223372036854775807"] },
  { func = "@mixed_use", args = ["true", "-1", "-32768", "2147483647", "0"] },
  { func = "@mixed_use", args = ["false", "-128", "32767", "0", "1"] },
  { func = "@mixed_use", args = ["true", "127", "0", "1", "-1"] },
  { func = "@mixed_use", args = ["false", "0", "1", "-1", "-9223372036854775808"] },
  { func = "@spread", args = ["false", "1", "-1", "-2147483648", "9223372036854775807", "true", "1", "-1"] },
  { func = "@spread", args = ["true", "-1", "-32768", "2147483647", "0", "false", "-1", "-32768"] },
  { func = "@spread", args = ["false", "-128", "32767", "0", "1", "true", "-128", "32767"] },
  { func = "@spread", args = ["true", "127", "0", "1", "-1", "false", "127", "0"] },
  { func = "@spread", args = ["false", "0", "1", "-1", "-9223372036854775808", "true", "0", "1"] },
  { func = "@spread_call", args = ["false", "1", "-1", "-2147483648", "9223372036854775807", "true", "1", "-1"] },
  { func = "@spread_call", args = ["true", "-1", "-32768", "2147483647", "0", "false", "-1", "-32768"] },
  { func = "@spread_call", args = ["false", "-128", "32767", "0", "1", "true", "-128", "32767"] },
  { func = "@spread_call", args = ["true", "127", "0", "1", "-1", "false", "127", "0"] },
  { func = "@spread_call", args = ["false", "0", "1", "-1", "-9223372036854775808", "true", "0", "1"] },
  { func = "@six", args = ["0", "1", "-1", "-9223372036854775808", "false", "0"] },
  { func = "@six", args = ["1", "-1", "-2147483648", "9223372036854775807", "true", "1"] },
  { func = "@six", args = ["-1", "-32768", "2147483647", "0", "false", "-1"] },
  { func = "@six", args = ["-128", "32767", "0", "1", "true", "-9223372036854775808"] },
  { func = "@six", args = ["127", "0", "1", "-1", "false", "9223372036854775807"] },
  { func = "@six_call", args = ["0", "1", "-1", "-9223372036854775808", "false", "0"] },
  { func = "@six_call", args = ["1", "-1", "-2147483648", "9223372036854775807", "true", "1"] },
  { func = "@six_call", args = ["-1", "-32768", "2147483647", "0", "false", "-1"] },
  { func = "@six_call", args = ["-128", "32767", "0", "1", "true", "-9223372036854775808"] },
  { func = "@six_call", args = ["127", "0", "1", "-1", "false", "9223372036854775807"] },
]
