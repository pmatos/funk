# Tests of add-i8.fir: add at i8, with each set of its
# flags, on every pair of boundary bit patterns: 0, 1, -1, the signed
# minimum and the signed maximum, or false and true at i1. A broken
# flag gives poison (#14).
# Each test without expect is differential: fir-ref and native code run
# it, and the native result must refine fir-ref's; where fir-ref returns
# poison, any value of the type does.
