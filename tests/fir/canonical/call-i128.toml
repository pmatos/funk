# Tests of call-i128.fir: call at i128 (#21), on the boundary bit
# patterns: 0, 1, -1, the signed minimum and the signed maximum, and on
# values on either side of 2^63 and 2^64. call_id passes its argument to
# @id, in %rdi and %rsi, and returns what @id returns, in %rdx and %rax,
# so each pattern goes into a call as an argument and comes back as its
# result. call_sub passes %a and %b, in that order, to @sub, which
# returns %a - %b, on every pair of patterns: an argument in the wrong
# place, or a half from the wrong argument, changes the result.
# Each test without expect is differential: fir-ref and native code run
# it, and the native result must refine fir-ref's.
tests = [
  { func = "@call_id", args = ["0"] },
  { func = "@call_id", args = ["1"] },
  { func = "@call_id", args = ["-1"] },
  { func = "@call_id", args = ["-170141183460469231731687303715884105728"] },
  { func = "@call_id", args = ["170141183460469231731687303715884105727"] },
  { func = "@call_id", args = ["18446744073709551615"] },
  { func = "@call_id", args = ["18446744073709551616"] },
  { func = "@call_id", args = ["-18446744073709551616"] },
  { func = "@call_id", args = ["9223372036854775807"] },
  { func = "@call_id", args = ["9223372036854775808"] },
  { func = "@call_id", args = ["-9223372036854775809"] },
  { func = "@call_id", args = ["1512366075204170947332355369683137040"] },
  { func = "@call_sub", args = ["0", "0"] },
  { func = "@call_sub", args = ["0", "1"] },
  { func = "@call_sub", args = ["0", "-1"] },
  { func = "@call_sub", args = ["0", "-170141183460469231731687303715884105728"] },
  { func = "@call_sub", args = ["0", "170141183460469231731687303715884105727"] },
  { func = "@call_sub", args = ["1", "0"] },
  { func = "@call_sub", args = ["1", "1"] },
  { func = "@call_sub", args = ["1", "-1"] },
