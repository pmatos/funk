# Tests of float-nan-memory.fir: a NaN that goes through memory as an
# integer (#219, ADR-2026-11-16-1630). Each function computes inf - inf,
# or a NaN operand minus a number, which is any NaN; casts it to the
# integer of its width; stores that and loads it back. A float has no
# loads or stores in M1, so the NaN reaches memory through bitcast.
# @f32_bits and @f64_bits return the integer whole: native code's result
# is a NaN's bits, and the harness has fir-ref try them as a NaN, so the
# differential test passes when a NaN choice gives them. @f32_top and
# @f64_top return the byte that holds the sign and the top of the
# exponent, which integer ops cut from the NaN: fir-ref does not list
# every such byte, so those tests declare both, each with a witness that
# chooses the sign. A difference that is no NaN chooses nothing.
tests = [
  { func = "@f32_bits", args = ["0x7f800000", "0x7f800000"] },
  { func = "@f32_bits", args = ["0x7fc00001", "1.0"] },
  { func = "@f32_bits", args = ["1.0", "0.5"] },
  { func = "@f32_bits", args = ["0x7f800000", "0x7f800000"], choices = ["0"], expect = ["2143289344"] },
  { func = "@f32_bits", args = ["0x7f800000", "0x7f800000"], choices = ["-1"], expect = ["-1"] },
  { func = "@f32_top", args = ["0x7f800000", "0x7f800000"], results = [
    { values = ["127"], witness = ["0"] },
    { values = ["-1"], witness = ["-1"] },
  ] },
  { func = "@f64_bits", args = ["0x7ff0000000000000", "0x7ff0000000000000"] },
  { func = "@f64_bits", args = ["0x7ff8000000000001", "1.0"] },
  { func = "@f64_bits", args = ["1.0", "0.5"] },
  { func = "@f64_bits", args = ["0x7ff0000000000000", "0x7ff0000000000000"], choices = ["0"], expect = ["9221120237041090560"] },
  { func = "@f64_bits", args = ["0x7ff0000000000000", "0x7ff0000000000000"], choices = ["-1"], expect = ["-1"] },
  { func = "@f64_top", args = ["0x7ff0000000000000", "0x7ff0000000000000"], results = [
    { values = ["127"], witness = ["0"] },
    { values = ["-1"], witness = ["-1"] },
  ] },
]
