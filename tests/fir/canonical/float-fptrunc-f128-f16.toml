# Tests of float-fptrunc-f128-f16.fir: fptrunc from f128 to f16
# (ADR-2026-11-09-1549) on the edges of the source and of the target:
# zeros, subnormals, the largest finite values, the values halfway
# between two values of the target and next to them, overflow to
# infinity, underflow to zero, infinities and NaNs. Written by
# scripts/harness/float_convert_cases.py, which computes each expected
# result with scripts/harness/float_ref.py, apart from Lean.
# Each test is interpreter-only: the backend does not lower
# f128 and f16 both, so fir-ref alone runs it and must give what it
# expects.
# A NaN operand gives any NaN of the target: its test is
# interpreter-only and names the NaN by a choice of the sign and the
# mantissa. Native code is not compared on a NaN result yet (#219).
tests = [
  { func = "@f128_f16", args = ["0.0"], expect = ["0.0"] },
  { func = "@f128_f16", args = ["6.0e-4966"], expect = ["0.0"] },
  { func = "@f128_f16", args = ["3.362103143112093506262677817321752e-4932"], expect = ["0.0"] },
  { func = "@f128_f16", args = ["3.3621031431120935062626778173217526e-4932"], expect = ["0.0"] },
  { func = "@f128_f16", args = ["2.9802322387695312499999999999999997e-8"], expect = ["0.0"] },
  { func = "@f128_f16", args = ["2.98023223876953125e-8"], expect = ["0.0"] },
  { func = "@f128_f16", args = ["2.9802322387695312500000000000000006e-8"], expect = ["6.0e-8"] },
  { func = "@f128_f16", args = ["5.9604644775390625e-8"], expect = ["6.0e-8"] },
  { func = "@f128_f16", args = ["8.940696716308593749999999999999999e-8"], expect = ["6.0e-8"] },
  { func = "@f128_f16", args = ["8.94069671630859375e-8"], expect = ["1.0e-7"] },
  { func = "@f128_f16", args = ["8.940696716308593750000000000000001e-8"], expect = ["1.0e-7"] },
  { func = "@f128_f16", args = ["1.4901161193847656249999999999999998e-7"], expect = ["1.0e-7"] },
  { func = "@f128_f16", args = ["1.490116119384765625e-7"], expect = ["1.0e-7"] },
  { func = "@f128_f16", args = ["1.4901161193847656250000000000000002e-7"], expect = ["2.0e-7"] },
  { func = "@f128_f16", args = ["6.103515625e-5"], expect = ["6.104e-5"] },
  { func = "@f128_f16", args = ["1.0"], expect = ["1.0"] },
  { func = "@f128_f16", args = ["1.0004882812499999999999999999999998"], expect = ["1.0"] },
  { func = "@f128_f16", args = ["1.00048828125"], expect = ["1.0"] },
  { func = "@f128_f16", args = ["1.0004882812500000000000000000000002"], expect = ["1.001"] },
  { func = "@f128_f16", args = ["1.0014648437499999999999999999999998"], expect = ["1.001"] },
  { func = "@f128_f16", args = ["1.00146484375"], expect = ["1.002"] },
  { func = "@f128_f16", args = ["1.0014648437500000000000000000000002"], expect = ["1.002"] },
  { func = "@f128_f16", args = ["65504.0"], expect = ["65500.0"] },
  { func = "@f128_f16", args = ["65519.999999999999999999999999999994"], expect = ["65500.0"] },
  { func = "@f128_f16", args = ["65520.0"], expect = ["0x7c00"] },
  { func = "@f128_f16", args = ["65520.000000000000000000000000000006"], expect = ["0x7c00"] },
  { func = "@f128_f16", args = ["1.189731495357231765085759326628007e4932"], expect = ["0x7c00"] },
  { func = "@f128_f16", args = ["0x7fff0000000000000000000000000000"], expect = ["0x7c00"] },
  { func = "@f128_f16", args = ["-0.0"], expect = ["-0.0"] },
  { func = "@f128_f16", args = ["-6.0e-4966"], expect = ["-0.0"] },
  { func = "@f128_f16", args = ["-3.362103143112093506262677817321752e-4932"], expect = ["-0.0"] },
  { func = "@f128_f16", args = ["-3.3621031431120935062626778173217526e-4932"], expect = ["-0.0"] },
  { func = "@f128_f16", args = ["-2.9802322387695312499999999999999997e-8"], expect = ["-0.0"] },
  { func = "@f128_f16", args = ["-2.98023223876953125e-8"], expect = ["-0.0"] },
  { func = "@f128_f16", args = ["-2.9802322387695312500000000000000006e-8"], expect = ["-6.0e-8"] },
  { func = "@f128_f16", args = ["-5.9604644775390625e-8"], expect = ["-6.0e-8"] },
  { func = "@f128_f16", args = ["-8.940696716308593749999999999999999e-8"], expect = ["-6.0e-8"] },
  { func = "@f128_f16", args = ["-8.94069671630859375e-8"], expect = ["-1.0e-7"] },
  { func = "@f128_f16", args = ["-8.940696716308593750000000000000001e-8"], expect = ["-1.0e-7"] },
  { func = "@f128_f16", args = ["-1.4901161193847656249999999999999998e-7"], expect = ["-1.0e-7"] },
  { func = "@f128_f16", args = ["-1.490116119384765625e-7"], expect = ["-1.0e-7"] },
  { func = "@f128_f16", args = ["-1.4901161193847656250000000000000002e-7"], expect = ["-2.0e-7"] },
  { func = "@f128_f16", args = ["-6.103515625e-5"], expect = ["-6.104e-5"] },
  { func = "@f128_f16", args = ["-1.0"], expect = ["-1.0"] },
  { func = "@f128_f16", args = ["-1.0004882812499999999999999999999998"], expect = ["-1.0"] },
  { func = "@f128_f16", args = ["-1.00048828125"], expect = ["-1.0"] },
  { func = "@f128_f16", args = ["-1.0004882812500000000000000000000002"], expect = ["-1.001"] },
  { func = "@f128_f16", args = ["-1.0014648437499999999999999999999998"], expect = ["-1.001"] },
  { func = "@f128_f16", args = ["-1.00146484375"], expect = ["-1.002"] },
  { func = "@f128_f16", args = ["-1.0014648437500000000000000000000002"], expect = ["-1.002"] },
  { func = "@f128_f16", args = ["-65504.0"], expect = ["-65500.0"] },
  { func = "@f128_f16", args = ["-65519.999999999999999999999999999994"], expect = ["-65500.0"] },
  { func = "@f128_f16", args = ["-65520.0"], expect = ["0xfc00"] },
  { func = "@f128_f16", args = ["-65520.000000000000000000000000000006"], expect = ["0xfc00"] },
  { func = "@f128_f16", args = ["-1.189731495357231765085759326628007e4932"], expect = ["0xfc00"] },
  { func = "@f128_f16", args = ["0xffff0000000000000000000000000000"], expect = ["0xfc00"] },
  { func = "@f128_f16", args = ["0x7fff8000000000000000000000000000"], choices = ["0"], expect = ["0x7e00"] },
  { func = "@f128_f16", args = ["0x7fff0000000000000000000000000001"], choices = ["-1"], expect = ["0xffff"] },
  { func = "@f128_f16", args = ["0xffffffffffffffffffffffffffffffff"], choices = ["1"], expect = ["0x7c01"] },
  { func = "@f128_f16", args = ["poison"], expect = ["poison"] },
]
