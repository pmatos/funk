# Tests of freeze-i8.fir: freeze at i8. freeze of a value gives it,
# with no choice; freeze of poison chooses a value, the same for every
# use (#14). %p = add nsw %a, 1 is poison when %a is the signed
# maximum, true at i1, and %f freezes it.
# Each test without expect is differential. fir-ref's exhaustive mode
# lists every outcome, and native code must return one of them. Past
# the choice budget of 16 bits, a test declares its results, each
# with a witness, and seeded runs check that the run gives no other.
# freeze_square of poison overflows mul nsw on most frozen values, so
# its set holds poison: it checks fir-ref's set, and native code may
# return any value of the type.
tests = [
  { func = "@freeze", args = ["0"] },
  { func = "@freeze", args = ["1"] },
  { func = "@freeze", args = ["-1"] },
  { func = "@freeze", args = ["-128"] },
  { func = "@freeze", args = ["127"] },
  { func = "@freeze_poison", args = ["0"] },
  { func = "@freeze_sub", args = ["0"] },
  { func = "@freeze_add", args = ["0"] },
  { func = "@freeze_mul_zero", args = ["0"] },
  { func = "@freeze_square", args = ["0"] },
  { func = "@freeze_poison", args = ["127"] },
  { func = "@freeze_add", args = ["127"] },
  { func = "@freeze_mul_zero", args = ["127"] },
  { func = "@freeze_square", args = ["127"] },
  { func = "@freeze_sub", args = ["127"] },
  { func = "@freeze_twice", args = ["127"] },
  { func = "@freeze_double", args = ["127"] },
  # Interpreter-only tests: fir-ref alone runs each, and must give the
  # result it states (the coverage matrix, ADR-2026-11-03-0557).
  { func = "@freeze", args = ["0"], expect = ["0"] },
  { func = "@freeze", args = ["1"], expect = ["1"] },
  { func = "@freeze", args = ["-1"], expect = ["-1"] },
  { func = "@freeze", args = ["-128"], expect = ["-128"] },
  { func = "@freeze", args = ["127"], expect = ["127"] },
  { func = "@freeze_poison", args = ["127"], choices = ["0"], expect = ["0"] },
  { func = "@freeze_sub", args = ["127"], choices = ["0"], expect = ["0"] },
  { func = "@freeze_add", args = ["127"], choices = ["0"], expect = ["0"] },
  { func = "@freeze_mul_zero", args = ["127"], choices = ["0"], expect = ["0"] },
  { func = "@freeze_square", args = ["127"], choices = ["0"], expect = ["0"] },
  { func = "@freeze_double", args = ["127"], choices = ["0"], expect = ["0"] },
  { func = "@freeze_poison", args = ["127"], choices = ["1"], expect = ["1"] },
  { func = "@freeze_sub", args = ["127"], choices = ["1"], expect = ["0"] },
  { func = "@freeze_add", args = ["127"], choices = ["1"], expect = ["2"] },
  { func = "@freeze_mul_zero", args = ["127"], choices = ["1"], expect = ["0"] },
  { func = "@freeze_square", args = ["127"], choices = ["1"], expect = ["1"] },
  { func = "@freeze_double", args = ["127"], choices = ["1"], expect = ["0"] },
  { func = "@freeze_poison", args = ["127"], choices = ["-1"], expect = ["-1"] },
  { func = "@freeze_sub", args = ["127"], choices = ["-1"], expect = ["0"] },
  { func = "@freeze_add", args = ["127"], choices = ["-1"], expect = ["-2"] },
  { func = "@freeze_mul_zero", args = ["127"], choices = ["-1"], expect = ["0"] },
  { func = "@freeze_square", args = ["127"], choices = ["-1"], expect = ["1"] },
  { func = "@freeze_double", args = ["127"], choices = ["-1"], expect = ["0"] },
  { func = "@freeze_poison", args = ["127"], choices = ["-128"], expect = ["-128"] },
  { func = "@freeze_sub", args = ["127"], choices = ["-128"], expect = ["0"] },
  { func = "@freeze_add", args = ["127"], choices = ["-128"], expect = ["0"] },
  { func = "@freeze_mul_zero", args = ["127"], choices = ["-128"], expect = ["0"] },
  { func = "@freeze_square", args = ["127"], choices = ["-128"], expect = ["poison"] },
  { func = "@freeze_double", args = ["127"], choices = ["-128"], expect = ["0"] },
  { func = "@freeze_poison", args = ["127"], choices = ["127"], expect = ["127"] },
  { func = "@freeze_sub", args = ["127"], choices = ["127"], expect = ["0"] },
  { func = "@freeze_add", args = ["127"], choices = ["127"], expect = ["-2"] },
  { func = "@freeze_mul_zero", args = ["127"], choices = ["127"], expect = ["0"] },
  { func = "@freeze_square", args = ["127"], choices = ["127"], expect = ["poison"] },
  { func = "@freeze_double", args = ["127"], choices = ["127"], expect = ["0"] },
  { func = "@freeze_poison", args = ["127"], choices = ["42"], expect = ["42"] },
  { func = "@freeze_sub", args = ["127"], choices = ["42"], expect = ["0"] },
  { func = "@freeze_add", args = ["127"], choices = ["42"], expect = ["84"] },
  { func = "@freeze_mul_zero", args = ["127"], choices = ["42"], expect = ["0"] },
  { func = "@freeze_square", args = ["127"], choices = ["42"], expect = ["poison"] },
  { func = "@freeze_double", args = ["127"], choices = ["42"], expect = ["0"] },
  { func = "@freeze_twice", args = ["127"], choices = ["0", "0"], expect = ["0"] },
  { func = "@freeze_twice", args = ["127"], choices = ["1", "-1"], expect = ["2"] },
  { func = "@freeze_twice", args = ["127"], choices = ["-128", "127"], expect = ["1"] },
  { func = "@freeze_twice", args = ["127"], choices = ["127", "-128"], expect = ["-1"] },
  { func = "@freeze_poison", args = ["0"], expect = ["1"] },
]
