# Tests of permute-i33.fir: block arguments that swap and rotate each
# other at i33 (#19). A branch binds all of a block's arguments at once,
# to values each read before any is bound. ^loop passes its arguments
# back to itself %n times: swapped, %y and %x, in swap_first and
# swap_second, and rotated, %y, %z and %x, in rotate_first,
# rotate_second and rotate_third. Each returns one of them, as the
# backend returns at most one value, so together they show the whole
# order. The values are the signed minimum, the signed maximum and -1,
# and %n is 0, 1, 2, 3 and 7 for a swap, and 0 to 4 for a rotation.
# The backend does not lower i33, so each test is interpreter-only and
# states the result that fir-ref must give.
tests = [
  { func = "@swap_first", args = ["-4294967296", "4294967295", "0"], expect = ["-4294967296"] },
  { func = "@swap_second", args = ["-4294967296", "4294967295", "0"], expect = ["4294967295"] },
  { func = "@swap_first", args = ["-4294967296", "4294967295", "1"], expect = ["4294967295"] },
  { func = "@swap_second", args = ["-4294967296", "4294967295", "1"], expect = ["-4294967296"] },
  { func = "@swap_first", args = ["-4294967296", "4294967295", "2"], expect = ["-4294967296"] },
  { func = "@swap_second", args = ["-4294967296", "4294967295", "2"], expect = ["4294967295"] },
  { func = "@swap_first", args = ["-4294967296", "4294967295", "3"], expect = ["4294967295"] },
  { func = "@swap_second", args = ["-4294967296", "4294967295", "3"], expect = ["-4294967296"] },
  { func = "@swap_first", args = ["-4294967296", "4294967295", "7"], expect = ["4294967295"] },
  { func = "@swap_second", args = ["-4294967296", "4294967295", "7"], expect = ["-4294967296"] },
  { func = "@rotate_first", args = ["-4294967296", "4294967295", "-1", "0"], expect = ["-4294967296"] },
  { func = "@rotate_second", args = ["-4294967296", "4294967295", "-1", "0"], expect = ["4294967295"] },
  { func = "@rotate_third", args = ["-4294967296", "4294967295", "-1", "0"], expect = ["-1"] },
  { func = "@rotate_first", args = ["-4294967296", "4294967295", "-1", "1"], expect = ["4294967295"] },
  { func = "@rotate_second", args = ["-4294967296", "4294967295", "-1", "1"], expect = ["-1"] },
  { func = "@rotate_third", args = ["-4294967296", "4294967295", "-1", "1"], expect = ["-4294967296"] },
  { func = "@rotate_first", args = ["-4294967296", "4294967295", "-1", "2"], expect = ["-1"] },
  { func = "@rotate_second", args = ["-4294967296", "4294967295", "-1", "2"], expect = ["-4294967296"] },
  { func = "@rotate_third", args = ["-4294967296", "4294967295", "-1", "2"], expect = ["4294967295"] },
  { func = "@rotate_first", args = ["-4294967296", "4294967295", "-1", "3"], expect = ["-4294967296"] },
  { func = "@rotate_second", args = ["-4294967296", "4294967295", "-1", "3"], expect = ["4294967295"] },
  { func = "@rotate_third", args = ["-4294967296", "4294967295", "-1", "3"], expect = ["-1"] },
  { func = "@rotate_first", args = ["-4294967296", "4294967295", "-1", "4"], expect = ["4294967295"] },
  { func = "@rotate_second", args = ["-4294967296", "4294967295", "-1", "4"], expect = ["-1"] },
  { func = "@rotate_third", args = ["-4294967296", "4294967295", "-1", "4"], expect = ["-4294967296"] },
]
