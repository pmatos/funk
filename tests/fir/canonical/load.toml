# Tests of load.fir: load reads an integer through a pointer, at the
# natural alignment of its type in the pointer's memory or at the alignment
# it writes (#231). These functions store nothing, so every load that does
# not fault reads fresh memory, which holds poison; store.fir loads what a
# store wrote. A load through a poison pointer, out of bounds, past a freed
# allocation, or misaligned is UB. An access is aligned only when it is
# aligned at every address its block may get (the human's ruling of
# 2026-11-14 on #388): an i32 at its natural alignment, 4, from sixteen i8
# aligned to 1 is UB even at offset 0, and is not with align(4) on the
# alloca or align(1) on the load. Punned loads of a pointer's fragments are
# tested in pointer-store.fir. Each test gives poison or UB, so each stays
# interpreter-only even though the backend lowers load (stage 5 of #231):
# native code may give any value for poison, so a differential test would
# pin nothing of the spec. store.fir and memory-native.fir run loads
# natively. Loads at widths the backend does not lower are in
# load-widths.fir.
tests = [
  { func = "@fresh", expect = ["poison"] },
  { func = "@fresh_odd", expect = ["poison"] },
  { func = "@at", args = ["0"], expect = ["poison"] },
  { func = "@at", args = ["7"], expect = ["poison"] },
  { func = "@at", args = ["8"], expect = "ub" },
  { func = "@at", args = ["-1"], expect = "ub" },
  { func = "@at", args = ["poison"], expect = "ub" },
  { func = "@misaligned", expect = "ub" },
  { func = "@aligned", expect = ["poison"] },
  { func = "@promised", args = ["0"], expect = ["poison"] },
  { func = "@promised", args = ["3"], expect = ["poison"] },
  { func = "@promised", args = ["13"], expect = "ub" },
  { func = "@widest_align", expect = ["poison"] },
  { func = "@freed", expect = "ub" },
  { func = "@through", args = ["poison"], expect = "ub" },
]
