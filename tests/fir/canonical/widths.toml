# Tests of widths.fir: several results, and widths that the backend does
# not lower (i7, i33, i128 and the widest, i16777215). Each test is
# interpreter-only and states fir-ref's result.
tests = [
  { func = "@booleans", expect = ["true", "false"] },
  { func = "@bytes", expect = ["-128", "127", "0", "-1"] },
  { func = "@odd", args = ["1", "1"], expect = ["-63", "-4294967296"] },
  { func = "@odd", args = ["63", "-4294967296"], expect = ["-1", "-1"] },
  { func = "@odd", args = ["-64", "0"], expect = ["0", "4294967295"] },
  { func = "@wide", expect = [
    "-9223372036854775808",
    "170141183460469231731687303715884105727",
    "-170141183460469231731687303715884105728",
  ] },
  { func = "@widest", args = ["0"], expect = ["-1"] },
  { func = "@widest", args = ["1"], expect = ["0"] },
  { func = "@widest", args = ["-1"], expect = ["-2"] },
]
