# Tests of lshr-i128.fir: lshr at i128 (#21); lshr shifts right, filling with zeros. It
# shifts every boundary bit pattern (0, 1, -1, the signed minimum and the
# signed maximum), 2^64 - 1, 2^64, -2^64, 2^63 and
# 0x0123456789abcdeffedcba9876543210 by 0, 1, 63, 64, 65, 127, 128 and
# 129, by 2^64 and 2^64 + 1, whose low halves are 0 and 1, and by -1, the
# signed minimum and the signed maximum. A shift by 64 or more moves bits
# from one half into the other; an amount is read as unsigned, and one
# of 128 or more gives poison.
# Each test without expect is differential: fir-ref and native code run
# it, and the native result must refine fir-ref's; where fir-ref returns
# poison, any value of the type does.
# Where fir-ref returns poison, an interpreter-only test of the same
# run checks that it is exactly poison.
