# Tests of float-binary-f64.fir: fadd, fsub, fmul, fdiv at f64
# (ADR-2026-11-09-1549), on the hard inputs: results halfway between
# two floats, subnormals, -0, overflow to infinity and NaN operands.
# Written by scripts/harness/float_arith_cases.py, which computes each
# expected result with scripts/harness/float_ref.py, apart from Lean.
# A test without expect is differential: fir-ref and native code
# run it, and the native result must equal fir-ref's. Each
# result that is not a NaN is also checked by an interpreter-only
# test with expect.
# A NaN result is any NaN: its test is interpreter-only and names
# the NaN by a choice of the sign and the mantissa, as signed
# i53. Native code is not compared on a NaN result yet (#219).
tests = [
  { func = "@fadd", args = ["1.0", "1.0"] },
  { func = "@fadd", args = ["1.0", "1.0"], expect = ["2.0"] },
  { func = "@fadd", args = ["1.0", "1.1102230246251565e-16"] },
  { func = "@fadd", args = ["1.0", "1.1102230246251565e-16"], expect = ["1.0"] },
  { func = "@fadd", args = ["1.0000000000000002", "1.1102230246251565e-16"] },
  { func = "@fadd", args = ["1.0000000000000002", "1.1102230246251565e-16"], expect = ["1.0000000000000004"] },
  { func = "@fadd", args = ["1.0", "1.6653345369377348e-16"] },
  { func = "@fadd", args = ["1.0", "1.6653345369377348e-16"], expect = ["1.0000000000000002"] },
  { func = "@fadd", args = ["1.0", "5.551115123125783e-17"] },
  { func = "@fadd", args = ["1.0", "5.551115123125783e-17"], expect = ["1.0"] },
  { func = "@fadd", args = ["1.7976931348623157e308", "1.7976931348623157e308"] },
  { func = "@fadd", args = ["1.7976931348623157e308", "1.7976931348623157e308"], expect = ["0x7ff0000000000000"] },
  { func = "@fadd", args = ["1.7976931348623157e308", "9.9792015476736e291"] },
  { func = "@fadd", args = ["1.7976931348623157e308", "9.9792015476736e291"], expect = ["0x7ff0000000000000"] },
  { func = "@fadd", args = ["1.7976931348623157e308", "4.9896007738368e291"] },
  { func = "@fadd", args = ["1.7976931348623157e308", "4.9896007738368e291"], expect = ["1.7976931348623157e308"] },
  { func = "@fadd", args = ["1.7976931348623157e308", "5.0e-324"] },
  { func = "@fadd", args = ["1.7976931348623157e308", "5.0e-324"], expect = ["1.7976931348623157e308"] },
  { func = "@fadd", args = ["5.0e-324", "5.0e-324"] },
  { func = "@fadd", args = ["5.0e-324", "5.0e-324"], expect = ["1.0e-323"] },
  { func = "@fadd", args = ["2.225073858507201e-308", "5.0e-324"] },
  { func = "@fadd", args = ["2.225073858507201e-308", "5.0e-324"], expect = ["2.2250738585072014e-308"] },
  { func = "@fadd", args = ["1.0", "-1.0"] },
  { func = "@fadd", args = ["1.0", "-1.0"], expect = ["0.0"] },
  { func = "@fadd", args = ["-0.0", "-0.0"] },
  { func = "@fadd", args = ["-0.0", "-0.0"], expect = ["-0.0"] },
