# Tests of add-i1.fir: add at i1, with each set of its
# flags, on every pair of boundary bit patterns: 0, 1, -1, the signed
# minimum and the signed maximum, or false and true at i1. A broken
# flag gives poison (#14).
# Each test without expect is differential: fir-ref and native code run
# it, and the native result must refine fir-ref's; where fir-ref returns
# poison, any value of the type does.
tests = [
  { func = "@add", args = ["false", "false"] },
  { func = "@add", args = ["false", "true"] },
  { func = "@add", args = ["true", "false"] },
  { func = "@add", args = ["true", "true"] },
  { func = "@add_nuw", args = ["false", "false"] },
  { func = "@add_nuw", args = ["false", "true"] },
  { func = "@add_nuw", args = ["true", "false"] },
  { func = "@add_nuw", args = ["true", "true"] },
  { func = "@add_nsw", args = ["false", "false"] },
  { func = "@add_nsw", args = ["false", "true"] },
  { func = "@add_nsw", args = ["true", "false"] },
  { func = "@add_nsw", args = ["true", "true"] },
  { func = "@add_nuw_nsw", args = ["false", "false"] },
  { func = "@add_nuw_nsw", args = ["false", "true"] },
  { func = "@add_nuw_nsw", args = ["true", "false"] },
  { func = "@add_nuw_nsw", args = ["true", "true"] },
]
