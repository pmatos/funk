# Tests of branch-i64.fir: br and cond_br at i64, passing the boundary
# bit patterns, 0, 1, -1, the signed minimum and the signed maximum, to
# block arguments (#19). br passes %a to ^next, which returns it.
# cond_br goes to ^then with %a when %c is true and to ^else with %b
# when it is false, on each condition and every pair of boundary bit
# patterns; each block returns its argument.
# Each test without expect is differential: fir-ref and native code run
# it, and the native result must refine fir-ref's.
tests = [
  { func = "@br", args = ["0"] },
  { func = "@br", args = ["1"] },
  { func = "@br", args = ["-1"] },
  { func = "@br", args = ["-9223372036854775808"] },
  { func = "@br", args = ["9223372036854775807"] },
  { func = "@cond_br", args = ["false", "0", "0"] },
  { func = "@cond_br", args = ["false", "0", "1"] },
  { func = "@cond_br", args = ["false", "0", "-1"] },
  { func = "@cond_br", args = ["false", "0", "-9223372036854775808"] },
  { func = "@cond_br", args = ["false", "0", "9223372036854775807"] },
  { func = "@cond_br", args = ["false", "1", "0"] },
  { func = "@cond_br", args = ["false", "1", "1"] },
  { func = "@cond_br", args = ["false", "1", "-1"] },
  { func = "@cond_br", args = ["false", "1", "-9223372036854775808"] },
  { func = "@cond_br", args = ["false", "1", "9223372036854775807"] },
  { func = "@cond_br", args = ["false", "-1", "0"] },
  { func = "@cond_br", args = ["false", "-1", "1"] },
  { func = "@cond_br", args = ["false", "-1", "-1"] },
  { func = "@cond_br", args = ["false", "-1", "-9223372036854775808"] },
  { func = "@cond_br", args = ["false", "-1", "9223372036854775807"] },
  { func = "@cond_br", args = ["false", "-9223372036854775808", "0"] },
  { func = "@cond_br", args = ["false", "-9223372036854775808", "1"] },
  { func = "@cond_br", args = ["false", "-9223372036854775808", "-1"] },
  { func = "@cond_br", args = ["false", "-9223372036854775808", "-9223372036854775808"] },
  { func = "@cond_br", args = ["false", "-9223372036854775808", "9223372036854775807"] },
  { func = "@cond_br", args = ["false", "9223372036854775807", "0"] },
  { func = "@cond_br", args = ["false", "9223372036854775807", "1"] },
  { func = "@cond_br", args = ["false", "9223372036854775807", "-1"] },
  { func = "@cond_br", args = ["false", "9223372036854775807", "-9223372036854775808"] },
  { func = "@cond_br", args = ["false", "9223372036854775807", "9223372036854775807"] },
  { func = "@cond_br", args = ["true", "0", "0"] },
  { func = "@cond_br", args = ["true", "0", "1"] },
  { func = "@cond_br", args = ["true", "0", "-1"] },
  { func = "@cond_br", args = ["true", "0", "-9223372036854775808"] },
  { func = "@cond_br", args = ["true", "0", "9223372036854775807"] },
  { func = "@cond_br", args = ["true", "1", "0"] },
  { func = "@cond_br", args = ["true", "1", "1"] },
  { func = "@cond_br", args = ["true", "1", "-1"] },
  { func = "@cond_br", args = ["true", "1", "-9223372036854775808"] },
  { func = "@cond_br", args = ["true", "1", "9223372036854775807"] },
  { func = "@cond_br", args = ["true", "-1", "0"] },
  { func = "@cond_br", args = ["true", "-1", "1"] },
