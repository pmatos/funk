  { func = "@cond_br", args = ["true", "-9223372036854775808", "0"] },
  { func = "@cond_br", args = ["true", "-9223372036854775808", "1"] },
  { func = "@cond_br", args = ["true", "-9223372036854775808", "-1"] },
  { func = "@cond_br", args = ["true", "-9223372036854775808", "-9223372036854775808"] },
  { func = "@cond_br", args = ["true", "-9223372036854775808", "9223372036854775807"] },
  { func = "@cond_br", args = ["true", "9223372036854775807", "0"] },
  { func = "@cond_br", args = ["true", "9223372036854775807", "1"] },
  { func = "@cond_br", args = ["true", "9223372036854775807", "-1"] },
  { func = "@cond_br", args = ["true", "9223372036854775807", "-9223372036854775808"] },
