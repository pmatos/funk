  { func = "@fadd", args = ["-1.0e-45", "1.0e-45"], expect = ["0.0"] },
  { func = "@fadd", args = ["0x7f800000", "0xff800000"], choices = ["0"], expect = ["0x7fc00000"] },
  { func = "@fadd", args = ["0xff800000", "3.4028235e38"] },
  { func = "@fadd", args = ["0xff800000", "3.4028235e38"], expect = ["0xff800000"] },
