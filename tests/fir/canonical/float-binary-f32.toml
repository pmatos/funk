# Tests of float-binary-f32.fir: fadd, fsub, fmul, fdiv at f32
# (ADR-2026-11-09-1549), on the hard inputs: results halfway between
# two floats, subnormals, -0, overflow to infinity and NaN operands.
# Written by scripts/harness/float_arith_cases.py, which computes each
# expected result with scripts/harness/float_ref.py, apart from Lean.
# A test without expect is differential: fir-ref and native code
# run it, and the native result must equal fir-ref's. Each
# result that is not a NaN is also checked by an interpreter-only
# test with expect.
# A NaN result is any NaN: its test is interpreter-only and names
# the NaN by a choice of the sign and the mantissa, as signed
# i24. Native code is not compared on a NaN result yet (#219).
tests = [
  { func = "@fadd", args = ["1.0", "1.0"] },
  { func = "@fadd", args = ["1.0", "1.0"], expect = ["2.0"] },
  { func = "@fadd", args = ["1.0", "5.9604645e-8"] },
  { func = "@fadd", args = ["1.0", "5.9604645e-8"], expect = ["1.0"] },
  { func = "@fadd", args = ["1.0000001", "5.9604645e-8"] },
  { func = "@fadd", args = ["1.0000001", "5.9604645e-8"], expect = ["1.0000002"] },
  { func = "@fadd", args = ["1.0", "8.940697e-8"] },
  { func = "@fadd", args = ["1.0", "8.940697e-8"], expect = ["1.0000001"] },
  { func = "@fadd", args = ["1.0", "2.9802322e-8"] },
  { func = "@fadd", args = ["1.0", "2.9802322e-8"], expect = ["1.0"] },
  { func = "@fadd", args = ["3.4028235e38", "3.4028235e38"] },
  { func = "@fadd", args = ["3.4028235e38", "3.4028235e38"], expect = ["0x7f800000"] },
  { func = "@fadd", args = ["3.4028235e38", "1.0141205e31"] },
  { func = "@fadd", args = ["3.4028235e38", "1.0141205e31"], expect = ["0x7f800000"] },
  { func = "@fadd", args = ["3.4028235e38", "5.0706024e30"] },
  { func = "@fadd", args = ["3.4028235e38", "5.0706024e30"], expect = ["3.4028235e38"] },
  { func = "@fadd", args = ["3.4028235e38", "1.0e-45"] },
  { func = "@fadd", args = ["3.4028235e38", "1.0e-45"], expect = ["3.4028235e38"] },
  { func = "@fadd", args = ["1.0e-45", "1.0e-45"] },
  { func = "@fadd", args = ["1.0e-45", "1.0e-45"], expect = ["3.0e-45"] },
  { func = "@fadd", args = ["1.1754942e-38", "1.0e-45"] },
  { func = "@fadd", args = ["1.1754942e-38", "1.0e-45"], expect = ["1.1754944e-38"] },
  { func = "@fadd", args = ["1.0", "-1.0"] },
  { func = "@fadd", args = ["1.0", "-1.0"], expect = ["0.0"] },
  { func = "@fadd", args = ["-0.0", "-0.0"] },
  { func = "@fadd", args = ["-0.0", "-0.0"], expect = ["-0.0"] },
