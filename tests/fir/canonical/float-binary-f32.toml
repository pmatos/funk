  { func = "@fmul", args = ["-3.4028235e38", "3.4028235e38"], expect = ["0xff800000"] },
  { func = "@fmul", args = ["1.0e-45", "1.0e-45"] },
  { func = "@fmul", args = ["1.0e-45", "1.0e-45"], expect = ["0.0"] },
