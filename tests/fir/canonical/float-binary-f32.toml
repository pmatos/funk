  { func = "@fmul", args = ["-0.0", "1.0"] },
  { func = "@fmul", args = ["-0.0", "1.0"], expect = ["-0.0"] },
  { func = "@fmul", args = ["0.0", "0x7f800000"], choices = ["0"], expect = ["0x7fc00000"] },
  { func = "@fmul", args = ["-1.0", "0x7f800000"] },
  { func = "@fmul", args = ["-1.0", "0x7f800000"], expect = ["0xff800000"] },
  { func = "@fmul", args = ["0xffffffff", "0.0"], choices = ["-1"], expect = ["0xffffffff"] },
  { func = "@fdiv", args = ["1.0", "3.0"] },
