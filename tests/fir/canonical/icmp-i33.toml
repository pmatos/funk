# Tests of icmp-i33.fir: icmp with each of its ten predicates at i33, on
# every pair of boundary bit patterns: 0, 1, -1, the signed minimum and
# the signed maximum (#16). Pairs such as -1 and 0, or the signed
# minimum and the signed maximum, are in one order read as signed and in
# the other read as unsigned.
# The backend does not lower i33, so each test is interpreter-only and
# states the result that fir-ref must give.
