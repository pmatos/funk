# Tests of float-fpext-f64-f128.fir: fpext from f64 to f128
# (ADR-2026-11-09-1549) on the edges of the source and of the target:
# zeros, subnormals, the largest finite values, the values halfway
# between two values of the target and next to them, overflow to
# infinity, underflow to zero, infinities and NaNs. Written by
# scripts/harness/float_convert_cases.py, which computes each expected
# result with scripts/harness/float_ref.py, apart from Lean.
# Each test is interpreter-only: the backend does not lower
# f64 and f128 both, so fir-ref alone runs it and must give what it
# expects.
# A NaN operand gives any NaN of the target: its test is
# interpreter-only and names the NaN by a choice of the sign and the
# mantissa. Native code is not compared on a NaN result yet (#219).
tests = [
  { func = "@f64_f128", args = ["0.0"], expect = ["0.0"] },
  { func = "@f64_f128", args = ["5.0e-324"], expect = ["4.940656458412465441765687928682214e-324"] },
  { func = "@f64_f128", args = ["2.225073858507201e-308"], expect = ["2.2250738585072008890245868760858599e-308"] },
  { func = "@f64_f128", args = ["2.2250738585072014e-308"], expect = ["2.225073858507201383090232717332404e-308"] },
  { func = "@f64_f128", args = ["1.0"], expect = ["1.0"] },
  { func = "@f64_f128", args = ["1.7976931348623157e308"], expect = ["1.7976931348623157081452742373170436e308"] },
  { func = "@f64_f128", args = ["0x7ff0000000000000"], expect = ["0x7fff0000000000000000000000000000"] },
  { func = "@f64_f128", args = ["-0.0"], expect = ["-0.0"] },
  { func = "@f64_f128", args = ["-5.0e-324"], expect = ["-4.940656458412465441765687928682214e-324"] },
  { func = "@f64_f128", args = ["-2.225073858507201e-308"], expect = ["-2.2250738585072008890245868760858599e-308"] },
  { func = "@f64_f128", args = ["-2.2250738585072014e-308"], expect = ["-2.225073858507201383090232717332404e-308"] },
  { func = "@f64_f128", args = ["-1.0"], expect = ["-1.0"] },
  { func = "@f64_f128", args = ["-1.7976931348623157e308"], expect = ["-1.7976931348623157081452742373170436e308"] },
  { func = "@f64_f128", args = ["0xfff0000000000000"], expect = ["0xffff0000000000000000000000000000"] },
  { func = "@f64_f128", args = ["0x7ff8000000000000"], choices = ["0"], expect = ["0x7fff8000000000000000000000000000"] },
  { func = "@f64_f128", args = ["0x7ff0000000000001"], choices = ["-1"], expect = ["0xffffffffffffffffffffffffffffffff"] },
  { func = "@f64_f128", args = ["0xffffffffffffffff"], choices = ["1"], expect = ["0x7fff0000000000000000000000000001"] },
  { func = "@f64_f128", args = ["poison"], expect = ["poison"] },
]
