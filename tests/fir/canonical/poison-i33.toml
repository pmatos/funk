# Tests of poison-i33.fir: poison propagates through add, sub and mul,
# whatever their flags, from either operand (ADR-2026-10-30-0818).
# %p = add nsw %a, 1 is poison when %a is the signed maximum, true at
# i1, and the function returns OP %p, %b or OP %b, %p.
# The backend does not lower i33, so each test is interpreter-only and
# states the result that fir-ref must give.
tests = [
  { func = "@add_left", args = ["4294967295", "1"], expect = ["poison"] },
  { func = "@add_left", args = ["0", "1"], expect = ["2"] },
  { func = "@add_right", args = ["4294967295", "1"], expect = ["poison"] },
  { func = "@add_right", args = ["0", "1"], expect = ["2"] },
  { func = "@add_nuw_left", args = ["4294967295", "1"], expect = ["poison"] },
  { func = "@add_nuw_left", args = ["0", "1"], expect = ["2"] },
  { func = "@add_nuw_right", args = ["4294967295", "1"], expect = ["poison"] },
  { func = "@add_nuw_right", args = ["0", "1"], expect = ["2"] },
  { func = "@add_nsw_left", args = ["4294967295", "1"], expect = ["poison"] },
  { func = "@add_nsw_left", args = ["0", "1"], expect = ["2"] },
  { func = "@add_nsw_right", args = ["4294967295", "1"], expect = ["poison"] },
  { func = "@add_nsw_right", args = ["0", "1"], expect = ["2"] },
  { func = "@add_nuw_nsw_left", args = ["4294967295", "1"], expect = ["poison"] },
  { func = "@add_nuw_nsw_left", args = ["0", "1"], expect = ["2"] },
  { func = "@add_nuw_nsw_right", args = ["4294967295", "1"], expect = ["poison"] },
  { func = "@add_nuw_nsw_right", args = ["0", "1"], expect = ["2"] },
  { func = "@sub_left", args = ["4294967295", "1"], expect = ["poison"] },
  { func = "@sub_left", args = ["0", "1"], expect = ["0"] },
  { func = "@sub_right", args = ["4294967295", "1"], expect = ["poison"] },
  { func = "@sub_right", args = ["0", "1"], expect = ["0"] },
  { func = "@sub_nuw_left", args = ["4294967295", "1"], expect = ["poison"] },
  { func = "@sub_nuw_left", args = ["0", "1"], expect = ["0"] },
  { func = "@sub_nuw_right", args = ["4294967295", "1"], expect = ["poison"] },
  { func = "@sub_nuw_right", args = ["0", "1"], expect = ["0"] },
  { func = "@sub_nsw_left", args = ["4294967295", "1"], expect = ["poison"] },
  { func = "@sub_nsw_left", args = ["0", "1"], expect = ["0"] },
  { func = "@sub_nsw_right", args = ["4294967295", "1"], expect = ["poison"] },
  { func = "@sub_nsw_right", args = ["0", "1"], expect = ["0"] },
  { func = "@sub_nuw_nsw_left", args = ["4294967295", "1"], expect = ["poison"] },
  { func = "@sub_nuw_nsw_left", args = ["0", "1"], expect = ["0"] },
  { func = "@sub_nuw_nsw_right", args = ["4294967295", "1"], expect = ["poison"] },
  { func = "@sub_nuw_nsw_right", args = ["0", "1"], expect = ["0"] },
  { func = "@mul_left", args = ["4294967295", "1"], expect = ["poison"] },
  { func = "@mul_left", args = ["0", "1"], expect = ["1"] },
  { func = "@mul_right", args = ["4294967295", "1"], expect = ["poison"] },
  { func = "@mul_right", args = ["0", "1"], expect = ["1"] },
  { func = "@mul_nuw_left", args = ["4294967295", "1"], expect = ["poison"] },
  { func = "@mul_nuw_left", args = ["0", "1"], expect = ["1"] },
  { func = "@mul_nuw_right", args = ["4294967295", "1"], expect = ["poison"] },
  { func = "@mul_nuw_right", args = ["0", "1"], expect = ["1"] },
  { func = "@mul_nsw_left", args = ["4294967295", "1"], expect = ["poison"] },
  { func = "@mul_nsw_left", args = ["0", "1"], expect = ["1"] },
  { func = "@mul_nsw_right", args = ["4294967295", "1"], expect = ["poison"] },
  { func = "@mul_nsw_right", args = ["0", "1"], expect = ["1"] },
  { func = "@mul_nuw_nsw_left", args = ["4294967295", "1"], expect = ["poison"] },
  { func = "@mul_nuw_nsw_left", args = ["0", "1"], expect = ["1"] },
  { func = "@mul_nuw_nsw_right", args = ["4294967295", "1"], expect = ["poison"] },
  { func = "@mul_nuw_nsw_right", args = ["0", "1"], expect = ["1"] },
]
