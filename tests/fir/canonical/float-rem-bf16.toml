# Tests of float-rem-bf16.fir: frem, fmod at bf16
# (ADR-2026-11-09-1549), on the hard inputs: quotients halfway
# between two integers, subnormals, -0, operands far apart,
# infinities and NaN operands.
# Written by scripts/harness/float_arith_cases.py, which computes each
# expected result with scripts/harness/float_ref.py, apart from Lean.
# Each test is interpreter-only: the backend does not lower
# bf16, so fir-ref alone runs it and must give what it expects.
# A NaN result is any NaN: its test is interpreter-only and names
# the NaN by a choice of the sign and the mantissa, as signed
# i8. Native code is not compared on a NaN result yet (#219).
tests = [
  { func = "@frem", args = ["5.5", "2.0"], expect = ["-0.5"] },
  { func = "@frem", args = ["2.0", "5.5"], expect = ["2.0"] },
  { func = "@frem", args = ["-5.5", "2.0"], expect = ["0.5"] },
  { func = "@frem", args = ["2.0", "-5.5"], expect = ["2.0"] },
  { func = "@frem", args = ["5.5", "-2.0"], expect = ["-0.5"] },
  { func = "@frem", args = ["-2.0", "5.5"], expect = ["-2.0"] },
  { func = "@frem", args = ["3.0", "2.0"], expect = ["-1.0"] },
  { func = "@frem", args = ["2.0", "3.0"], expect = ["-1.0"] },
  { func = "@frem", args = ["5.0", "2.0"], expect = ["1.0"] },
  { func = "@frem", args = ["2.0", "5.0"], expect = ["2.0"] },
  { func = "@frem", args = ["1.0", "3.0"], expect = ["1.0"] },
  { func = "@frem", args = ["3.0", "1.0"], expect = ["0.0"] },
  { func = "@frem", args = ["2.0", "3.0"], expect = ["-1.0"] },
  { func = "@frem", args = ["3.0", "2.0"], expect = ["-1.0"] },
  { func = "@frem", args = ["4.0", "2.0"], expect = ["0.0"] },
  { func = "@frem", args = ["2.0", "4.0"], expect = ["2.0"] },
  { func = "@frem", args = ["-4.0", "2.0"], expect = ["-0.0"] },
  { func = "@frem", args = ["2.0", "-4.0"], expect = ["2.0"] },
  { func = "@frem", args = ["3.39e38", "9.0e-41"], expect = ["0.0"] },
  { func = "@frem", args = ["9.0e-41", "3.39e38"], expect = ["9.0e-41"] },
  { func = "@frem", args = ["1.7e38", "3.0e-40"], expect = ["9.0e-41"] },
  { func = "@frem", args = ["3.0e-40", "1.7e38"], expect = ["3.0e-40"] },
  { func = "@frem", args = ["1.17e-38", "2.0e-40"], expect = ["-9.0e-41"] },
  { func = "@frem", args = ["2.0e-40", "1.17e-38"], expect = ["2.0e-40"] },
  { func = "@frem", args = ["1.18e-38", "3.0e-40"], expect = ["-9.0e-41"] },
  { func = "@frem", args = ["3.0e-40", "1.18e-38"], expect = ["3.0e-40"] },
  { func = "@frem", args = ["1.0", "0x7f80"], expect = ["1.0"] },
  { func = "@frem", args = ["0x7f80", "1.0"], choices = ["0"], expect = ["0x7fc0"] },
  { func = "@frem", args = ["-0.0", "0x7f80"], expect = ["-0.0"] },
  { func = "@frem", args = ["0x7f80", "-0.0"], choices = ["-1"], expect = ["0xffff"] },
  { func = "@frem", args = ["-0.0", "1.0"], expect = ["-0.0"] },
  { func = "@frem", args = ["1.0", "-0.0"], choices = ["1"], expect = ["0x7f81"] },
  { func = "@frem", args = ["1.0", "0.0"], choices = ["0"], expect = ["0x7fc0"] },
  { func = "@frem", args = ["0.0", "1.0"], expect = ["0.0"] },
  { func = "@frem", args = ["0x7f80", "1.0"], choices = ["-1"], expect = ["0xffff"] },
  { func = "@frem", args = ["1.0", "0x7f80"], expect = ["1.0"] },
  { func = "@frem", args = ["0x7f80", "0x7f80"], choices = ["1"], expect = ["0x7f81"] },
  { func = "@frem", args = ["0.0", "0.0"], choices = ["0"], expect = ["0x7fc0"] },
  { func = "@frem", args = ["0xffff", "1.0"], choices = ["-1"], expect = ["0xffff"] },
  { func = "@frem", args = ["1.0", "0xffff"], choices = ["1"], expect = ["0x7f81"] },
  { func = "@frem", args = ["1.0", "0x7f81"], choices = ["0"], expect = ["0x7fc0"] },
  { func = "@frem", args = ["0x7f81", "1.0"], choices = ["-1"], expect = ["0xffff"] },
  { func = "@fmod", args = ["5.5", "2.0"], expect = ["1.5"] },
  { func = "@fmod", args = ["2.0", "5.5"], expect = ["2.0"] },
  { func = "@fmod", args = ["-5.5", "2.0"], expect = ["-1.5"] },
  { func = "@fmod", args = ["2.0", "-5.5"], expect = ["2.0"] },
  { func = "@fmod", args = ["5.5", "-2.0"], expect = ["1.5"] },
  { func = "@fmod", args = ["-2.0", "5.5"], expect = ["-2.0"] },
  { func = "@fmod", args = ["3.0", "2.0"], expect = ["1.0"] },
  { func = "@fmod", args = ["2.0", "3.0"], expect = ["2.0"] },
  { func = "@fmod", args = ["-4.0", "2.0"], expect = ["-0.0"] },
  { func = "@fmod", args = ["2.0", "-4.0"], expect = ["2.0"] },
  { func = "@fmod", args = ["1.0", "3.0"], expect = ["1.0"] },
  { func = "@fmod", args = ["3.0", "1.0"], expect = ["0.0"] },
  { func = "@fmod", args = ["-3.39e38", "9.0e-41"], expect = ["-0.0"] },
  { func = "@fmod", args = ["9.0e-41", "-3.39e38"], expect = ["9.0e-41"] },
  { func = "@fmod", args = ["1.7e38", "3.0e-40"], expect = ["9.0e-41"] },
  { func = "@fmod", args = ["3.0e-40", "1.7e38"], expect = ["3.0e-40"] },
  { func = "@fmod", args = ["3.39e38", "3.38e38"], expect = ["1.33e36"] },
  { func = "@fmod", args = ["3.38e38", "3.39e38"], expect = ["3.38e38"] },
  { func = "@fmod", args = ["1.18e-38", "3.0e-40"], expect = ["2.0e-40"] },
  { func = "@fmod", args = ["3.0e-40", "1.18e-38"], expect = ["3.0e-40"] },
  { func = "@fmod", args = ["3.39e38", "0xff80"], expect = ["3.39e38"] },
  { func = "@fmod", args = ["0xff80", "3.39e38"], choices = ["1"], expect = ["0x7f81"] },
  { func = "@fmod", args = ["0.0", "1.0"], expect = ["0.0"] },
  { func = "@fmod", args = ["1.0", "0.0"], choices = ["0"], expect = ["0x7fc0"] },
  { func = "@fmod", args = ["1.0", "-0.0"], choices = ["-1"], expect = ["0xffff"] },
  { func = "@fmod", args = ["-0.0", "1.0"], expect = ["-0.0"] },
  { func = "@fmod", args = ["0xff80", "1.0"], choices = ["1"], expect = ["0x7f81"] },
  { func = "@fmod", args = ["1.0", "0xff80"], expect = ["1.0"] },
  { func = "@fmod", args = ["0xffff", "0x7f80"], choices = ["0"], expect = ["0x7fc0"] },
  { func = "@fmod", args = ["0x7f80", "0xffff"], choices = ["-1"], expect = ["0xffff"] },
  { func = "@frem", args = ["poison", "0.0"], expect = ["poison"] },
  { func = "@fmod", args = ["poison", "0.0"], expect = ["poison"] },
]
