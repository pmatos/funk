# Tests of float-values-f64.fir: values of f64 passed through block
# arguments by br and cond_br, returned one and several at a time, and
# given by calls with one result and with several, each coming back as
# its bits: a NaN with its sign set and a payload, -0, 1 and the smallest
# subnormal, and poison (ADR-2026-11-11-1138, ADR-2026-11-11-1141).
# Each test is differential, but for those with expect: fir-ref and
# native code run it, and the native result must equal fir-ref's. A test
# with expect is interpreter-only, and fir-ref must give the result that
# it names.
tests = [
  { func = "@choose", args = ["true", "-2251799813685247", "-9223372036854775808"] },
  { func = "@choose", args = ["true", "-2251799813685247", "-9223372036854775808"], expect = ["-2251799813685247"] },
  { func = "@choose", args = ["false", "-2251799813685247", "-9223372036854775808"] },
  { func = "@choose", args = ["false", "-2251799813685247", "-9223372036854775808"], expect = ["-9223372036854775808"] },
  { func = "@choose", args = ["false", "4607182418800017408", "poison"] },
  { func = "@choose", args = ["false", "4607182418800017408", "poison"], expect = ["poison"] },
  { func = "@swap", args = ["4607182418800017408", "1"] },
  { func = "@swap", args = ["4607182418800017408", "1"], expect = ["1", "4607182418800017408"] },
  { func = "@calls", args = ["true", "-2251799813685247", "4607182418800017408"] },
  { func = "@calls", args = ["true", "-2251799813685247", "4607182418800017408"], expect = ["-2251799813685247", "4607182418800017408", "-2251799813685247"] },
  { func = "@calls", args = ["false", "1", "-9223372036854775808"] },
  { func = "@calls", args = ["false", "1", "-9223372036854775808"], expect = ["-9223372036854775808", "-9223372036854775808", "1"] },
]
