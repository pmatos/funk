# Tests of several-i33.fir: the functions of several-i8.fir, with
# several results, at i33, a width that the backend does not lower, so
# every test is interpreter-only and states fir-ref's result, a list of
# the returned values, each a value or poison (#31,
# ADR-2026-11-03-0109). Recursion goes at most 20 deep. UB in a callee
# that returns several values is UB of its caller, and recursion that
# never ends runs out of fuel.
tests = [
  { func = "@none", args = ["0"], expect = [] },
  { func = "@call_none", args = ["0"], expect = ["0"] },
  { func = "@eight", args = ["0"], expect = ["0", "1", "2", "3", "4", "5", "6", "7"] },
