  { func = "@call_none", args = ["1"], expect = ["1"] },
  { func = "@eight", args = ["1"], expect = ["1", "2", "3", "4", "5", "6", "7", "8"] },
  { func = "@none", args = ["-1"], expect = [] },
  { func = "@call_none", args = ["-1"], expect = ["-1"] },
