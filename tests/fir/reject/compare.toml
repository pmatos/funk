# Must-reject texts of #16's ops: icmp and select. icmp decodes with one
# attribute, its predicate, one of eq, ne, slt, sle, sgt, sge, ult, ule,
# ugt and uge; two operands of one iN; and one i1 result. select decodes
# with no attributes, an i1 condition and two values of one iN, and one
# iN result. Neither op has a validation rule beyond its signature, so a
# text that breaks one does not decode: each is a parse error at the
# op's name (ADR-2026-10-30-0815). Every operand is defined, so both
# tools report the op, even for the old spelling icmp.slt, which names
# no op.

[[reject]]
verdict = "parse-error"
rule = "icmp has one predicate, not none"
text = '''
func @f(%a: i32, %b: i64) -> i32 {
^entry:
  %r: i1 = icmp %a, %a @0
  ret %a @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "icmp's predicate is eq, ne, slt, sle, sgt, sge, ult, ule, ugt or uge: lt is not one"
text = '''
func @f(%a: i32, %b: i64) -> i32 {
^entry:
  %r: i1 = icmp lt %a, %a @0
  ret %a @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "icmp's predicate is eq, ne, slt, sle, sgt, sge, ult, ule, ugt or uge, in lower case: SLT is not one"
text = '''
func @f(%a: i32, %b: i64) -> i32 {
^entry:
  %r: i1 = icmp SLT %a, %a @0
  ret %a @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "icmp's predicate is eq, ne, slt, sle, sgt, sge, ult, ule, ugt or uge: oeq, a predicate of LLVM's fcmp, is not one"
text = '''
func @f(%a: i32, %b: i64) -> i32 {
