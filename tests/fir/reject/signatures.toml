# Must-reject texts of a function's signature (#239): the attributes
# after a parameter's or a result's type, which the dialect of that type
# reads, and `...` at the end of the parameters. The core accepts one
# marker, sext or zext, on an integer narrower than 32 bits, and nothing
# else (ADR-2026-11-09-1547). A fir function is not variadic: only an
# external declaration will be (ADR-2026-11-09-1548). Only a func's
# parameters and results carry attributes, and only its parameters end
# in `...`: any other item is a parse error at the first attribute or at
# the `...`, and a func with no results has no attributes after its `)`.

[[reject]]
verdict = "validation-error"
rule = "only an integer narrower than 32 bits carries an extension marker: not i32"
text = '''
func @f(%a: i32 sext) {
^e:
  ret @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "validation-error"
rule = "only an integer narrower than 32 bits carries an extension marker: not a result of i64"
text = '''
func @f(%a: i64) -> i64 zext {
^e:
  ret %a @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "validation-error"
rule = "only an integer narrower than 32 bits carries an extension marker: not f32"
text = '''
func @f(%a: f32 zext) {
^e:
  ret @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "validation-error"
rule = "only an integer narrower than 32 bits carries an extension marker: not ptr"
text = '''
func @f(%a: ptr sext) {
^e:
  ret @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "validation-error"
rule = "the core's markers are sext and zext: not nsw"
text = '''
func @f(%a: i8 nsw) {
^e:
  ret @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "validation-error"
rule = "an extension marker is a word: not sext applied to an argument"
text = '''
func @f(%a: i8 sext(1)) {
^e:
  ret @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "validation-error"
rule = "a parameter carries one extension marker, not two"
text = '''
func @f(%a: i8 sext zext) {
^e:
  ret @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "validation-error"
rule = "a result carries one extension marker, not two"
text = '''
func @f(%a: i8) -> i8 zext zext {
^e:
  ret %a @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "validation-error"
rule = "a fir function is not variadic: its parameters do not end in ..."
text = '''
func @f(%a: i32, ...) {
^e:
  ret @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "validation-error"
rule = "a fir function is not variadic: not even with no other parameter"
text = '''
func @f(...) {
^e:
  ret @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "a func with no results carries no attributes after its )"
text = '''
func @f(%a: i8) sext {
^e:
  ret @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "... ends the parameters: no parameter follows it"
text = '''
func @f(..., %a: i32) {
^e:
  ret @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "... follows a comma after a parameter"
text = '''
func @f(%a: i32 ...) {
^e:
  ret @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "only a func's parameters carry attributes: not a module's"
text = '''
module @m(%a: i8 sext) {
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "only a func's parameters end in ...: not a module's"
text = '''
module @m(...) {
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "only a func's results carry attributes: not a result of a dialect's item that a comma follows"
text = '''
toy.cell @c() -> i8 sext, i8 {
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "only a func's parameters carry attributes: not those of an item of an unknown kind"
text = '''
thing @t(%a: i8 sext) {
}

locs {
  @0 = unknown
}
'''
