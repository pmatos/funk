# Must-reject texts of #17's width changes: zext, sext and trunc. Each
# decodes with no attributes, one iM operand and one iN result, at any
# widths M and N; a text that does not decode is a parse error at the
# op's name (ADR-2026-10-30-0815). A zext or sext that does not strictly
# widen, or a trunc that does not strictly narrow, the same width
# included, decodes, and validation rejects it (ADR-2026-10-30-0818).

[[reject]]
verdict = "validation-error"
rule = "zext strictly widens: from i32 to i32 is the same width"
text = '''
func @f(%a: i32) -> i32 {
^entry:
  %r: i32 = zext %a @0
  ret %r @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "validation-error"
rule = "zext strictly widens: from i32 to i8 narrows"
text = '''
func @f(%a: i32) -> i8 {
^entry:
  %r: i8 = zext %a @0
  ret %r @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "validation-error"
rule = "sext strictly widens: from i32 to i32 is the same width"
text = '''
func @f(%a: i32) -> i32 {
^entry:
  %r: i32 = sext %a @0
  ret %r @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "validation-error"
rule = "sext strictly widens: from i32 to i8 narrows"
text = '''
func @f(%a: i32) -> i8 {
^entry:
  %r: i8 = sext %a @0
  ret %r @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "validation-error"
rule = "trunc strictly narrows: from i32 to i32 is the same width"
