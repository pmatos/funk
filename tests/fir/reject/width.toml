'''

[[reject]]
verdict = "validation-error"
rule = "trunc strictly narrows: from i8 to i32 widens"
text = '''
func @f(%a: i8) -> i32 {
^entry:
  %r: i32 = trunc %a @0
  ret %r @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "zext takes no attributes: nneg is not one"
text = '''
func @f(%a: i32) -> i32 {
^entry:
  %r: i64 = zext nneg %a @0
  ret %a @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "zext takes no attributes: an integer is not one"
text = '''
func @f(%a: i32) -> i32 {
^entry:
  %r: i64 = zext 0 %a @0
  ret %a @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "zext takes one operand, not none"
text = '''
func @f(%a: i32) -> i32 {
^entry:
