}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "zext takes an integer operand, not a ptr; the ptr parameter also breaks a rule of validation, as ptr is reserved"
text = '''
func @f(%a: i32, %p: ptr) -> i32 {
^entry:
  %r: i64 = zext %p @0
