# Must-reject texts of #15's bitwise ops: and, or and xor. These ops have
# no validation rule beyond their signatures, so a text that breaks one
# does not decode: each is a parse error at the op's name
# (ADR-2026-10-30-0815). shift.toml holds those of the shifts.

[[reject]]
verdict = "parse-error"
rule = "and takes two operands of one type: an i32 and an i64 are a type mismatch"
text = '''
func @f(%a: i32, %b: i64) -> i32 {
^entry:
  %r: i32 = and %a, %b @0
  ret %a @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "and's result has its operands' type: i32 operands give no i64"
text = '''
func @f(%a: i32, %b: i64) -> i32 {
^entry:
  %r: i64 = and %a, %a @0
  ret %a @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "and takes two operands, not one"
text = '''
func @f(%a: i32, %b: i64) -> i32 {
^entry:
  %r: i32 = and %a @0
  ret %a @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "and takes two operands, not three"
text = '''
