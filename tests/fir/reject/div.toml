# Must-reject texts of #18's ops: sdiv and udiv with their flag exact,
# srem and urem. These ops have no validation rule beyond their
# signatures, so a text that breaks one does not decode: each is a parse
# error at the op's name (ADR-2026-10-30-0815). A text with a ptr operand
# or result also breaks validation, as ptr is reserved; the parse error
# comes first.

[[reject]]
verdict = "parse-error"
rule = "sdiv takes two operands of one type: an i32 and an i64 are a type mismatch"
text = '''
func @f(%a: i32, %b: i64) -> i32 {
^entry:
  %r: i32 = sdiv %a, %b @0
  ret %a @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "sdiv's result has its operands' type: i32 operands give no i64"
text = '''
func @f(%a: i32, %b: i64) -> i32 {
^entry:
  %r: i64 = sdiv %a, %a @0
  ret %a @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "sdiv takes two operands, not one"
text = '''
func @f(%a: i32, %b: i64) -> i32 {
^entry:
  %r: i32 = sdiv %a @0
  ret %a @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "sdiv takes two operands, not three"
text = '''
func @f(%a: i32, %b: i64) -> i32 {
^entry:
  %r: i32 = sdiv %a, %a, %a @0
  ret %a @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "sdiv defines one value, not none"
text = '''
func @f(%a: i32, %b: i64) -> i32 {
^entry:
  sdiv %a, %a @0
  ret %a @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "sdiv defines one value, not two"
text = '''
func @f(%a: i32, %b: i64) -> i32 {
^entry:
  %r: i32, %s: i32 = sdiv %a, %a @0
  ret %a @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "sdiv takes integers: ptr operands, with a ptr result, do not decode; the parameter %p also breaks validation, as ptr is reserved"
text = '''
func @f(%a: i32, %p: ptr) -> i32 {
^entry:
  %r: ptr = sdiv %p, %p @0
  ret %a @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "sdiv defines an integer: a ptr result does not decode; it also breaks validation, as ptr is reserved"
text = '''
func @f(%a: i32, %b: i64) -> i32 {
^entry:
  %r: ptr = sdiv %a, %a @0
  ret %a @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "sdiv takes integers: a ptr left operand does not decode, with an i32 right operand and result; the parameter %p also breaks validation, as ptr is reserved"
text = '''
func @f(%a: i32, %p: ptr) -> i32 {
