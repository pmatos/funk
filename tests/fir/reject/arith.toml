# Must-reject texts of #14's ops: sub and mul, the flags nuw and nsw of
# add, sub and mul, and freeze. These ops have no validation rule beyond
# their signatures, so a text that breaks one does not decode: each is a
# parse error at the op's name (ADR-2026-10-30-0815). decoding.toml holds
# add's other texts.

[[reject]]
verdict = "parse-error"
rule = "sub takes two operands of one type: an i32 and an i64 are a type mismatch"
text = '''
func @f(%a: i32, %b: i64) -> i32 {
^entry:
  %r: i32 = sub %a, %b @0
  ret %a @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "sub's result has its operands' type: i32 operands give no i64"
text = '''
func @f(%a: i32, %b: i64) -> i32 {
^entry:
  %r: i64 = sub %a, %a @0
  ret %a @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "sub takes two operands, not one"
text = '''
func @f(%a: i32, %b: i64) -> i32 {
^entry:
  %r: i32 = sub %a @0
  ret %a @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "sub takes two operands, not three"
text = '''
func @f(%a: i32, %b: i64) -> i32 {
^entry:
