# Must-reject texts of #15's shifts: shl, lshr and ashr. The spec gives
# the shifts no flags, so LLVM's nuw and nsw of shl, and exact of lshr
# and ashr, do not decode, nor does any other attribute. These ops have
# no validation rule beyond their signatures, so a text that breaks one
# does not decode: each is a parse error at the op's name
# (ADR-2026-10-30-0815). bitwise.toml holds those of and, or and xor.

[[reject]]
verdict = "parse-error"
rule = "shl takes a value and an amount of one type: an i32 and an i64 are a type mismatch"
text = '''
func @f(%a: i32, %b: i64) -> i32 {
^entry:
  %r: i32 = shl %a, %b @0
  ret %a @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "shl's result has its operands' type: i32 operands give no i64"
text = '''
func @f(%a: i32, %b: i64) -> i32 {
^entry:
  %r: i64 = shl %a, %a @0
  ret %a @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "shl takes two operands, a value and an amount, not one"
text = '''
func @f(%a: i32, %b: i64) -> i32 {
^entry:
  %r: i32 = shl %a @0
  ret %a @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "shl takes two operands, a value and an amount, not three"
text = '''
func @f(%a: i32, %b: i64) -> i32 {
^entry:
  %r: i32 = shl %a, %a, %a @0
  ret %a @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "shl defines one value, not none"
text = '''
func @f(%a: i32, %b: i64) -> i32 {
^entry:
