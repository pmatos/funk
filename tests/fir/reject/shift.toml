  ret %a @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "shl defines one value, not two"
text = '''
func @f(%a: i32, %b: i64) -> i32 {
^entry:
  %r: i32, %s: i32 = shl %a, %a @0
  ret %a @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "shl takes no attributes: nuw is not one"
text = '''
func @f(%a: i32, %b: i64) -> i32 {
