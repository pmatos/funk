[[reject]]
verdict = "validation-error"
rule = "store aligns to at most 16777215 units, as the data layout does: align(16777216), 2^24, is above it"
text = '''
func @f(%p: ptr, %v: i32) -> i32 {
^e:
  store nonatomic align(16777216) %v, %p @0
