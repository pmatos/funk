# Must-reject texts of store (#231). It takes an integer, the value it
# stores, then a pointer, and defines nothing; its attributes are those of
# load, its ordering and align(A), in that order, separated by spaces
# (ADR-2026-11-14-2316). Every ordering decodes, and validation accepts
# only nonatomic (ADR-2026-11-09-1542); an alignment decodes when it is not
# negative, and validation accepts a power of two no larger than 16777215,
# the data layout's bound, as for alloca and load. A pointer of a memory
# that the module does not declare is rejected by validation, as for every
# pointer type.

[[reject]]
verdict = "validation-error"
rule = "store is nonatomic in M1: the ordering unordered decodes and is rejected"
text = '''
func @f(%p: ptr, %v: i32) -> i32 {
^e:
  store unordered %v, %p @0
  ret %v @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "validation-error"
rule = "store is nonatomic in M1: the ordering monotonic decodes and is rejected"
text = '''
func @f(%p: ptr, %v: i32) -> i32 {
