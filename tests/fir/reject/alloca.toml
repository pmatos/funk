# Must-reject texts of the stack allocation alloca (#231,
# ADR-2026-11-14-0915). It takes no operands and defines a pointer; its
# attributes are its kind, its type, its count when it is not 1 and
# align(A), in that order, separated by spaces. A kind, a type, a count of 0
# and an alignment decode when they are well formed, and validation says
# which M1 accepts: the kind stack, a count of at least 1, a power of two no
# larger than 16777215, the data layout's bound, and a valid integer,
# pointer (stage 4d-2b of #231) or float type (#264). The count has no bound. A result of a
# memory that the module does not declare is rejected by validation, as for
# every pointer type, and so is a pointer type that it allocates values of.

[[reject]]
verdict = "validation-error"
rule = "alloca aligns to a power of two of units: align(3) is not one"
text = '''
func @f() -> ptr {
^e:
  %p: ptr = alloca stack i32 align(3) @0
  ret %p @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "validation-error"
rule = "alloca aligns to a power of two of units: align(0) is not one"
text = '''
func @f() -> ptr {
^e:
  %p: ptr = alloca stack i32 align(0) @0
  ret %p @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "validation-error"
rule = "alloca aligns to at most 16777215 units, as the data layout does: align(16777216), 2^24, is above it"
text = '''
func @f() -> ptr {
^e:
  %p: ptr = alloca stack i8 align(16777216) @0
  ret %p @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "validation-error"
rule = "alloca aligns to at most 16777215 units: align(2^70) is above it, though a power of two"
text = '''
func @f() -> ptr {
^e:
  %p: ptr = alloca stack i8 align(1180591620717411303424) @0
  ret %p @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "validation-error"
rule = "alloca allocates at least one value: a count of 0 is rejected"
text = '''
func @f() -> ptr {
^e:
  %p: ptr = alloca stack i32 0 @0
  ret %p @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "a count of 1 is not written: alloca stack i32 1 does not decode"
text = '''
func @f() -> ptr {
^e:
  %p: ptr = alloca stack i32 1 @0
  ret %p @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "alloca's count is not negative: -4 does not decode"
text = '''
func @f() -> ptr {
^e:
  %p: ptr = alloca stack i32 -4 @0
  ret %p @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "alloca's count is an integer after its type: a word in its place does not decode"
text = '''
func @f() -> ptr {
^e:
  %p: ptr = alloca stack i32 four @0
  ret %p @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "alloca's attributes are its kind, its type, its count and align(A), in that order: a count after align does not decode"
text = '''
func @f() -> ptr {
^e:
  %p: ptr = alloca stack i32 align(4) 2 @0
  ret %p @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "alloca's attributes are separated by spaces: a comma before the count does not decode"
text = '''
func @f() -> ptr {
^e:
  %p: ptr = alloca stack i32, 4 @0
  ret %p @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "validation-error"
rule = "alloca allocates on the stack in M1: the kind heap decodes and is rejected"
text = '''
func @f() -> ptr {
^e:
  %p: ptr = alloca heap i32 @0
  ret %p @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "validation-error"
rule = "alloca allocates on the stack in M1: the kind global decodes and is rejected"
text = '''
func @f() -> ptr {
^e:
  %p: ptr = alloca global i32 @0
  ret %p @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "alloca's kind is stack, global or heap: frame does not decode"
text = '''
func @f() -> ptr {
^e:
  %p: ptr = alloca frame i32 @0
  ret %p @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "alloca writes its kind: an alloca with its type first does not decode"
text = '''
func @f() -> ptr {
^e:
  %p: ptr = alloca i32 @0
  ret %p @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "alloca defines a pointer: an i64 result does not decode"
text = '''
func @f() -> i64 {
^e:
  %p: i64 = alloca stack i32 @0
  ret %p @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "parse-error"
rule = "alloca takes no operands: an operand does not decode"
text = '''
func @f(%n: i32) -> ptr {
^e:
  %p: ptr = alloca stack i32 %n @0
  ret %p @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "validation-error"
rule = "alloca allocates a valid float type: float(1, 23), with too few exponent bits, is rejected"
text = '''
func @f() -> ptr {
^e:
  %p: ptr = alloca stack float(1, 23) @0
  ret %p @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "validation-error"
rule = "alloca allocates a valid integer type: i0 is rejected"
text = '''
func @f() -> ptr {
^e:
  %p: ptr = alloca stack i0 @0
  ret %p @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "validation-error"
rule = "alloca allocates a valid integer type: i16777216, past the widest, is rejected"
text = '''
func @f() -> ptr {
^e:
  %p: ptr = alloca stack i16777216 @0
  ret %p @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "validation-error"
rule = "alloca defines a pointer of a memory that the module has: ptr(1) without memory 1 in the layout is rejected"
text = '''
func @f() -> ptr(1) {
^e:
  %p: ptr(1) = alloca stack i32 @0
  ret %p @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "validation-error"
rule = "alloca allocates pointers of a memory that the module has: ptr(2) without memory 2 in the layout is rejected"
text = '''
func @f() -> ptr {
^e:
  %p: ptr = alloca stack ptr(2) 4 @0
  ret %p @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "validation-error"
rule = "alloca allocates pointers of a valid memory: ptr(16777216) is above the bound and is rejected"
text = '''
func @f() -> ptr {
^e:
  %p: ptr = alloca stack ptr(16777216) @0
  ret %p @0
}

locs {
  @0 = unknown
}
'''

[[reject]]
verdict = "validation-error"
rule = "alloca allocates a valid float type: float(3, 0), with no mantissa bit, is rejected"
text = '''
func @f() -> ptr {
^e:
  %p: ptr = alloca stack float(3, 0) 2 @0
  ret %p @0
}

locs {
  @0 = unknown
}
'''
