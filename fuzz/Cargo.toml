# The fuzz targets (#165,
# docs/decisions/testing-and-harness-generated.md#fuzzing). A crate of its
# own, outside the workspace: cargo-fuzz needs a nightly compiler, and the
# workspace pins a stable one. Only the nightly workflow builds it.
[package]
name = "funk-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
funk-ir = { path = "../crates/funk-ir" }
libfuzzer-sys = "0.4.12"

[lints]
workspace = true

[workspace]

[workspace.lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify"
path = "fuzz_targets/verify.rs"
test = false
doc = false
bench = false
