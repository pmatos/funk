# Publishes the rendered fir spec to GitHub Pages from every push to main
# (ADR-2026-10-30-1031). Pull requests never deploy; CI builds the document
# through the fir-spec pre-commit hook instead.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One run per ref at a time, and none is cancelled half way. A newer run
# replaces one still waiting, so main deploys its latest commit.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build the spec
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    # Lakefiles and elaboration run arbitrary code: this job may only read.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Copied from the lean job of ci.yml, all but its save step: that job
      # saves the caches restored here. Its cross job copies them too;
      # change all three together.
      # docs/spec/.lake/build is never cached.
      - name: Restore the elan installer
        id: elan-installer
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          ELAN_VERSION: v4.2.4
          ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
        with:
          path: ${{ runner.temp }}/elan.tar.gz
          key: elan-installer-${{ runner.os }}-${{ env.ELAN_VERSION }}-${{ env.ELAN_SHA256 }}
      - name: Install elan
        env:
          ELAN_VERSION: v4.2.4
          ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
        run: scripts/ci-install.sh elan
      - name: Restore the Lean toolchain and Verso build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan/toolchains
            docs/spec/.lake/packages
          key: lean-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'docs/spec/lake-manifest.json') }}
      - name: Install the Lean toolchain
        run: elan toolchain install "$(cat lean/lean-toolchain)"
      - name: Build and render the spec
        run: scripts/build-spec.sh "$RUNNER_TEMP/spec"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/spec/html-multi

  deploy:
    name: Deploy to GitHub Pages
    # Skipped with build off main, since it needs build.
    needs: build
    runs-on: ubuntu-26.04
    # Only this job, which runs no code from the repository, may deploy.
    permissions:
      pages: write # deploy the artifact to Pages
      id-token: write # prove to Pages that this run is the deployer
    environment:
      name: github-pages
      url: ${{ steps.deploy-1.outputs.page_url || steps.deploy-2.outputs.page_url || steps.deploy-3.outputs.page_url }}
    # GitHub's side sometimes never finishes syncing a deployment's files, and
    # the action times out although the artifact is fine; a new attempt then
    # deploys it. So the job tries up to three times, each attempt only if the
    # one before failed. A deploy that works takes under two minutes, so each
    # attempt waits five, not the action's default ten.
    steps:
      - id: deploy-1
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 300000
      - id: deploy-2
        if: steps.deploy-1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 300000
      - id: deploy-3
        if: steps.deploy-2.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 300000
