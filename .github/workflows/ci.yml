# Runs every pre-commit hook on every tracked file, the same checks as the
# local hooks, in one job per suite, so that each suite is its own check
# (ADR-2026-11-05-1408). Each step runs one hook by id with --verbose, so the
# log shows what it ran, and its counts go to the job summary. The ci-hooks
# hook checks that each hook runs in exactly one job. The job pre-commit is
# the required status check: it passes only when every suite passed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRE_COMMIT_COLOR: always

# In each job, every hook's step runs even when one before it failed.
jobs:
  static:
    name: Static checks
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-static-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run file-size-budget --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run hidden-chars --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run adr-ids --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run adr-ids-test --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run adr-citations --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run adr-citations-test --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run g0 --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run g0-test --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run ci-hooks --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run ci-hooks-test --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run suite-summary-test --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run check-added-large-files --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run check-case-conflict --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run check-executables-have-shebangs --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run check-json --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run check-merge-conflict --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run check-shebang-scripts-are-executable --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run check-symlinks --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run check-toml --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run check-yaml --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run detect-private-key --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run end-of-file-fixer --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run mixed-line-ending --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run trailing-whitespace --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run typos --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run ruff-check --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run ruff-format --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run shellcheck --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run actionlint --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        env:
          # Enables zizmor's online audits (e.g. known-vulnerable actions).
          GH_TOKEN: ${{ github.token }}
        run: uvx pre-commit@4.6.2 run zizmor --all-files --verbose --show-diff-on-failure

  rust:
    name: Rust suite
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-rust-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # The rust-* hooks build, lint and test the Cargo workspace with the
      # toolchain that rust-toolchain.toml pins (ADR-2026-10-30-1030). The
      # cross job copies the next three steps; change both together.
      - name: Install rustup
        env:
          RUSTUP_VERSION: 1.29.2
          RUSTUP_SHA256: 5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4
        run: |
          curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors -o "$RUNNER_TEMP/rustup-init" \
            "https://static.rust-lang.org/rustup/archive/$RUSTUP_VERSION/x86_64-unknown-linux-gnu/rustup-init"
          echo "$RUSTUP_SHA256  $RUNNER_TEMP/rustup-init" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/rustup-init"
          "$RUNNER_TEMP/rustup-init" -y --no-modify-path --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # Only the pinned toolchain: the runner image ships its own stable one.
      # The cache archives each matched directory whole, so the exclusion
      # works on the toolchain directories, not on their parent. This job
      # saves it; the cross job only restores it.
      - name: Restore the Rust toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/*
            !~/.rustup/toolchains/stable-*
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          cargo --version
      # The verus-proof hook proves the unsafe code with Verus, which runs on
      # the Rust toolchain above (ADR-2026-11-03-0809). scripts/check-verus.sh
      # pins the same release; change both together.
      - name: Install Verus
        env:
          VERUS_VERSION: 0.2026.11.02.8bf68ee
          VERUS_SHA256: f3a0119292df8855e4435da8130bee1873b0e6a60c306accf81a08ea687bba3c
        run: |
          curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors -o "$RUNNER_TEMP/verus.zip" \
            "https://github.com/verus-lang/verus/releases/download/release/$VERUS_VERSION/verus-$VERUS_VERSION-x86-linux.zip"
          echo "$VERUS_SHA256  $RUNNER_TEMP/verus.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/verus.zip" -d "$RUNNER_TEMP/verus"
          "$RUNNER_TEMP/verus/verus-x86-linux/verus" --version
          echo "$RUNNER_TEMP/verus/verus-x86-linux" >> "$GITHUB_PATH"
      # funk build runs GNU as and ld, and the rust-test hook runs what it
      # builds (ADR-2026-10-30-1229). The runner image ships binutils; this
      # step installs it on an image that does not. The cross job copies it.
      - name: Install the assembler and linker
        run: |
          if ! command -v as >/dev/null || ! command -v ld >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends binutils
          fi
          as --version
          ld --version
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run rust-fmt --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run rust-clippy --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run rust-test --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run verus-proof --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run verus-report-test --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run unsafe-code --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run unsafe-code-test --all-files --verbose --show-diff-on-failure

  lean:
    name: Lean suite
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # The fir-spec hook builds the Lean code and the spec (ADR-2026-10-29-2135).
      # pages.yml and the cross job copy the next three steps; change all
      # three together.
      - name: Install elan
        env:
          ELAN_VERSION: v4.2.4
          ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
        run: |
          curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors -o "$RUNNER_TEMP/elan.tar.gz" \
            "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ELAN_SHA256  $RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore the Lean toolchain and Verso build
        id: lean-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan/toolchains
            docs/spec/.lake/packages
          key: lean-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'docs/spec/lake-manifest.json') }}
      - name: Install the Lean toolchain
        run: elan toolchain install "$(cat lean/lean-toolchain)"
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run fir-spec --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run fir-ref-test --all-files --verbose --show-diff-on-failure
      # Saved even when a hook fails, so the next run need not rebuild Verso,
      # but only once Verso is built and never from a cancelled run: a partial
      # cache would take the key. docs/spec/.lake/build is never cached, so
      # the document is always rebuilt from its sources. Only this job, which
      # builds Verso, saves it.
      - name: Save the Lean toolchain and Verso build
        if: >-
          !cancelled() && steps.lean-cache.outputs.cache-hit != 'true' &&
          hashFiles('docs/spec/.lake/packages/verso/.lake/build/lib/lean/VersoManual.olean') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan/toolchains
            docs/spec/.lake/packages
          key: ${{ steps.lean-cache.outputs.cache-primary-key }}

  # The checks that run Rust and Lean together: they build both fir-ref and
  # funk, and lean/ is built here again, beside the lean job.
  cross:
    name: Cross-language suite
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-cross-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # Copied from the lean job; change both, and pages.yml, together.
      - name: Install elan
        env:
          ELAN_VERSION: v4.2.4
          ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
        run: |
          curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors -o "$RUNNER_TEMP/elan.tar.gz" \
            "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ELAN_SHA256  $RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore the Lean toolchain and Verso build
        id: lean-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan/toolchains
            docs/spec/.lake/packages
          key: lean-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'docs/spec/lake-manifest.json') }}
      - name: Install the Lean toolchain
        run: elan toolchain install "$(cat lean/lean-toolchain)"
      # Copied from the rust job; change both together.
      - name: Install rustup
        env:
          RUSTUP_VERSION: 1.29.2
          RUSTUP_SHA256: 5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4
        run: |
          curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors -o "$RUNNER_TEMP/rustup-init" \
            "https://static.rust-lang.org/rustup/archive/$RUSTUP_VERSION/x86_64-unknown-linux-gnu/rustup-init"
          echo "$RUSTUP_SHA256  $RUNNER_TEMP/rustup-init" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/rustup-init"
          "$RUNNER_TEMP/rustup-init" -y --no-modify-path --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Restore the Rust toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/*
            !~/.rustup/toolchains/stable-*
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          cargo --version
      - name: Install the assembler and linker
        run: |
          if ! command -v as >/dev/null || ! command -v ld >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends binutils
          fi
          as --version
          ld --version
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run fir-round-trip --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run fir-harness --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run fir-harness-test --all-files --verbose --show-diff-on-failure
      - if: ${{ !cancelled() }}
        run: uvx pre-commit@4.6.2 run coverage-matrix --all-files --verbose --show-diff-on-failure

  # The required status check (ADR-2026-10-28-0725). It always runs, and
  # passes only when every suite passed: a suite that failed, was cancelled
  # or was skipped fails it. The ci-hooks hook checks that it needs every
  # other job.
  pre-commit:
    name: pre-commit
    needs: [static, rust, lean, cross]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    steps:
      - name: Check that every suite passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'length > 0 and all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null
