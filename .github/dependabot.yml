version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let a release age a week before adopting it (supply-chain safety).
    cooldown:
      default-days: 7
    # Keeps Dependabot PR titles valid Conventional Commits.
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5
  # The workspace's crates (ADR-2026-10-30-1030). vstd and the verus_*
  # crates move only with the Verus release that CI pins
  # (ADR-2026-11-03-0809). vstd is the only direct dependency, so this entry
  # opens no version updates, only security updates for the other nine
  # crates in Cargo.lock. An advisory against vstd or a verus_* crate needs
  # a bump by hand: the release and its SHA-256 in ci.yml, the pin in
  # scripts/check-verus.sh and vstd's version, together.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: vstd
      - dependency-name: "verus_*"
