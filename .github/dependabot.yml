version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let a release age a week before adopting it (supply-chain safety).
    cooldown:
      default-days: 7
    # Keeps Dependabot PR titles valid Conventional Commits.
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5
  # The workspace's crates (ADR-2026-10-30-1030). It takes no third-party
  # crates yet, so this entry opens nothing until the first one arrives.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
