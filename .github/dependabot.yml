version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let a release age a week before adopting it (supply-chain safety).
    cooldown:
      default-days: 7
    # Keeps Dependabot PR titles valid Conventional Commits.
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5
  # The workspace's crates (ADR-2026-10-30-1030). vstd and the verus_*
  # crates move only with the Verus release that CI pins
  # (ADR-2026-11-03-0809).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: vstd
      - dependency-name: "verus_*"
