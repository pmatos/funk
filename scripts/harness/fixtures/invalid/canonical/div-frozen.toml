# #18's differential test with a frozen divisor that can be zero.
# %p = add nsw %b, 1 is poison when %b is the signed maximum, 127, and %f
# freezes it, so %f may be any i8, 0 included: on that path sdiv %a, %f
# is UB, "sdiv by zero". UB in the set makes the test invalid
# (ADR-2026-10-31-0003), and an invalid test fails the run, so the test
# lives here, outside tests/fir/. check_invalid.py runs the harness on
# this corpus and passes only when the harness reports this test invalid
# because "the set holds UB (sdiv by zero)" (ADR-2026-10-31-0208).
tests = [
  { func = "@sdiv_frozen", args = ["7", "127"] },
]
