default_install_hook_types: [pre-commit, commit-msg]
# The fir-spec hook's `unsupported_script` language needs pre-commit 4.4.0.
minimum_pre_commit_version: 4.4.0

repos:
  - repo: local
    hooks:
      - id: file-size-budget
        name: Text files are at most 20,000 bytes
        entry: python scripts/check_file_size.py
        language: python
        types: [text]
        # Generated or vendored files only; never exclude authored code.
        exclude: (^|/)(package-lock\.json|[^/]*\.lock)$
      - id: hidden-chars
        name: Text files hold no raw bidi controls, marks, BOM or separators
        entry: python scripts/check_hidden_chars.py
        language: python
        types: [text]
      # It reads every tracked ADR, so a new one is checked against main's.
      - id: adr-ids
        name: ADRs are well named and no two share a timestamp id
        entry: python scripts/check_adr_ids.py
        language: python
        pass_filenames: false
        files: ^(docs/adrs/|scripts/check_adr_ids\.py$)
      - id: adr-ids-test
        name: The adr-ids check passes its tests
        entry: python scripts/test_check_adr_ids.py
        language: python
        pass_filenames: false
        files: ^scripts/(test_)?check_adr_ids\.py$
      # G0's source check on the Lean side (ADR-2026-11-03-0600). The Rust
      # side is crates/funk-ir/tests/g0.rs, which rust-test runs.
      - id: g0
        name: Lean code written for every dialect names no part of the core dialect
        entry: python scripts/check_g0.py
        language: python
        pass_filenames: false
        files: ^(lean/|scripts/check_g0\.py$)
      - id: g0-test
        name: The G0 check passes its tests
        entry: python scripts/test_check_g0.py
        language: python
        pass_filenames: false
        files: ^(lean/|scripts/(test_)?check_g0\.py$)
      # The spec renders the ADRs as its appendix and checks every ADR
      # citation in lean/, the top-level files of docs/spec/ and docs/adrs/
      # (ADR-2026-10-30-1439).
      - id: fir-spec
        name: Build fir's Lean package, check its axioms and render the spec
        entry: scripts/build-spec.sh
        language: unsupported_script
        pass_filenames: false
        files: ^(lean/|docs/spec/|docs/adrs/|scripts/build-spec\.sh$)
      # The Rust checks run over the whole workspace (ADR-2026-10-30-1030).
      # rust-test also builds and runs native code with funk build, which
      # needs GNU as and ld (ADR-2026-10-30-1229).
      - id: rust-fmt
        name: Rust code is formatted (cargo fmt)
        entry: scripts/check-rust.sh
        args: [fmt]
        language: unsupported_script
        pass_filenames: false
        files: ^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|scripts/(check-rust|rust-env)\.sh$)
      - id: rust-clippy
        name: Rust code passes clippy with no warnings
        entry: scripts/check-rust.sh
        args: [clippy]
        language: unsupported_script
        pass_filenames: false
        files: ^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|scripts/(check-rust|rust-env)\.sh$)
      - id: rust-test
        name: Rust tests pass (cargo test)
        entry: scripts/check-rust.sh
        args: [test]
        language: unsupported_script
        pass_filenames: false
        files: ^(crates/|tests/fir/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|scripts/(check-rust|rust-env)\.sh$)
      # Verus proves the unsafe code of each crate that opts in
      # (ADR-2026-11-03-0808, ADR-2026-11-03-0809). It needs the Verus
      # release that check-verus.sh pins on PATH, and rustup.
      - id: verus-proof
        name: Verus proves the crates that opt in (cargo verus verify)
        entry: scripts/check-verus.sh
        language: unsupported_script
        pass_filenames: false
        files: ^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|scripts/(check-verus|rust-env)\.sh$|scripts/verus_report\.py$)
      - id: verus-report-test
        name: The verus-proof hook's script and report reader pass their tests
        entry: python -m unittest discover -s scripts -p "test_*verus*.py"
        language: python
        pass_filenames: false
        files: ^(crates/[^/]+/Cargo\.toml$|rust-toolchain\.toml$|scripts/((test_)?verus_report\.py|test_check_verus\.py|(check-verus|rust-env)\.sh)$)
      # Unsafe code only where Verus proves it, and no assumption outside the
      # trusted base that ADR-2026-11-03-0808 lists.
      - id: unsafe-code
        name: Unsafe Rust is only in verified modules, trusting only the listed base
        entry: python scripts/check_unsafe_code.py
        language: python
        pass_filenames: false
        files: (\.rs$|(^|/)Cargo\.toml$|^scripts/(check_unsafe_code|rust_items|unsafe_[a-z]+)\.py$)
      - id: unsafe-code-test
        name: The unsafe-code check passes its tests
        entry: python -m unittest discover -s scripts -p "test_*unsafe*.py"
        language: python
        pass_filenames: false
        files: ^(crates/funk-start-fds/|(crates/(funk|funk-ir)/)?Cargo\.toml$|docs/adrs/|scripts/((test_)?check_unsafe_code|rust_items|(test_)?unsafe_[a-z]+)\.py$)
      # fir-ref's checks build lean/ through build-spec.sh --lean, under its
      # git guards (ADR-2026-10-29-2135, ADR-2026-10-30-1250).
      - id: fir-ref-test
        name: The Lean tests pass, and fir-ref round-trips the corpus
        entry: scripts/check-fir-ref.sh
        args: [test]
        language: unsupported_script
        pass_filenames: false
        files: ^(lean/|tests/fir/|scripts/(build-spec|check-fir-ref(-run|-deep)?)\.sh$)
      - id: fir-round-trip
        name: Lean reprints the texts that Rust prints, byte for byte
        entry: scripts/check-fir-ref.sh
        args: [round-trip]
        language: unsupported_script
        pass_filenames: false
        files: ^(lean/|crates/|tests/fir/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|scripts/(build-spec|check-fir-ref|rust-env)\.sh$)
      # The differential harness (ADR-2026-10-30-2049): funk verify and
      # fir-ref validate give every text of tests/fir/ and every generated
      # module the same verdict, and native code refines fir-ref on every
      # test. It needs elan, rustup and GNU as and ld.
      - id: fir-harness
        name: fir-ref and native code agree on the corpus (the differential harness)
        entry: scripts/check-harness.sh
        language: unsupported_script
        pass_filenames: false
        files: ^(lean/|crates/|tests/fir/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|scripts/(build-spec\.sh$|check-harness\.sh$|rust-env\.sh$|harness/))
      - id: fir-harness-test
        name: The differential harness passes its tests
        entry: python -m unittest discover -s scripts/harness -p test_*.py
        language: python
        pass_filenames: false
        files: ^scripts/harness/
      # The corpus's coverage matrix (ADR-2026-11-03-0557): the committed
      # docs/coverage/README.md is the one that coverage.py makes, and
      # every cell has a test.
      - id: coverage-matrix
        name: The corpus's coverage matrix is current, and every cell has a test
        entry: python scripts/harness/coverage.py
        language: python
        pass_filenames: false
        files: ^(tests/fir/|docs/coverage/|scripts/harness/)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos
        args: []

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
