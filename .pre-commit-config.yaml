default_install_hook_types: [pre-commit, commit-msg]
# The fir-spec hook's `unsupported_script` language needs pre-commit 4.4.0.
minimum_pre_commit_version: 4.4.0

repos:
  - repo: local
    hooks:
      - id: file-size-budget
        name: Text files are at most 20,000 bytes
        entry: python scripts/check_file_size.py
        language: python
        types: [text]
        # Generated or vendored files only; never exclude authored code.
        exclude: (^|/)(package-lock\.json|[^/]*\.lock)$|^docs/adrs/INDEX\.md$
      - id: hidden-chars
        name: Text files hold no raw bidi controls, marks, BOM or separators
        entry: python scripts/check_hidden_chars.py
        language: python
        types: [text]
      # It reads every tracked ADR, so a new one is checked against main's.
      - id: adr-ids
        name: ADRs are well named and no two share a timestamp id
        entry: python scripts/check_adr_ids.py
        language: python
        pass_filenames: false
        files: ^(docs/adrs/|scripts/check_adr_ids\.py$)
      - id: adr-ids-test
        name: The adr-ids check passes its tests
        entry: python scripts/run_unittests.py adr-ids-test scripts/test_check_adr_ids.py
        language: python
        pass_filenames: false
        files: ^scripts/((test_)?check_adr_ids|run_unittests)\.py$
      # The committed docs/adrs/INDEX.md is the one that adr_index.py makes,
      # every ADR has a tier and an area, and every accepted ADR is cited by
      # a page of its area in docs/decisions/ (ADR-2026-11-09-1610).
      - id: adr-index
        name: The ADR index is current, and every ADR has a tier, an area and a page
        entry: python scripts/adr_index.py
        language: python
        pass_filenames: false
        files: ^(docs/adrs/|docs/decisions/|scripts/(adr_index|check_adr_ids|check_adr_citations)\.py$)
      - id: adr-index-test
        name: The adr-index check passes its tests
        entry: python scripts/run_unittests.py adr-index-test scripts/test_adr_index.py
        language: python
        pass_filenames: false
        files: ^scripts/((test_)?adr_index|check_adr_(ids|citations)|run_unittests)\.py$
      # Every ADR citation in every tracked text file names an ADR, by the
      # spec checker's grammar and cases (ADR-2026-11-05-1709). It runs on
      # every commit: a deleted or renamed ADR breaks citations in files the
      # commit does not touch, and pre-commit passes no deleted file.
      - id: adr-citations
        name: Every ADR citation in a tracked text file names an ADR
        entry: python scripts/check_adr_citations.py
        language: python
        pass_filenames: false
        always_run: true
      - id: adr-citations-test
        name: The adr-citations check passes its tests and the shared cases
        entry: python scripts/run_unittests.py adr-citations-test scripts/test_check_adr_citations.py
        language: python
        pass_filenames: false
        files: ^(scripts/((test_)?check_adr_(citations|ids)|run_unittests)\.py|docs/spec/FirSpecSite/citation-cases\.json)$
      # G0's source check on the Lean side (ADR-2026-11-03-0600). The Rust
      # side is crates/funk-ir/tests/g0.rs, which rust-test runs.
      - id: g0
        name: Lean code written for every dialect names no part of the core dialect
        entry: python scripts/check_g0.py
        language: python
        pass_filenames: false
        files: ^(lean/|scripts/check_g0\.py$)
      - id: g0-test
        name: The G0 check passes its tests
        entry: python scripts/run_unittests.py g0-test scripts/test_check_g0.py
        language: python
        pass_filenames: false
        files: ^(lean/|scripts/((test_)?check_g0|run_unittests)\.py$)
      # The spec renders the ADRs as its appendix and checks every ADR
      # citation in lean/, the top-level files of docs/spec/ and docs/adrs/
      # (docs/decisions/spec-site.md#the-adr-appendix-and-its-citations).
      - id: fir-spec
        name: Build fir's Lean package, check its axioms and render the spec
        entry: scripts/build-spec.sh
        language: unsupported_script
        pass_filenames: false
        files: ^(lean/|docs/spec/|docs/adrs/|scripts/build-spec\.sh$)
      # The Rust checks run over the whole workspace (ADR-2026-10-30-1030).
      # rust-test also builds and runs native code with funk build, which
      # needs GNU as and ld
      # (docs/decisions/x86-64-backend.md#assembly-and-linking).
      - id: rust-fmt
        name: Rust code is formatted (cargo fmt)
        entry: scripts/check-rust.sh
        args: [fmt]
        language: unsupported_script
        pass_filenames: false
        files: ^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|scripts/(check-rust|rust-env)\.sh$)
      - id: rust-clippy
        name: Rust code passes clippy with no warnings
        entry: scripts/check-rust.sh
        args: [clippy]
        language: unsupported_script
        pass_filenames: false
        files: ^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|scripts/(check-rust|rust-env)\.sh$)
      - id: rust-test
        name: Rust tests pass (cargo test)
        entry: scripts/check-rust.sh
        args: [test]
        language: unsupported_script
        pass_filenames: false
        files: ^(crates/|tests/fir/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|scripts/(check-rust|rust-env)\.sh$)
      # Counts funk's instructions on large inputs against a committed
      # baseline (ADR-2026-11-09-1645). It needs valgrind. It reports on any
      # host, and a count over the margin fails only in CI. pre-commit hides
      # what a passing hook prints, so verbose keeps the report visible.
      - id: rust-speed
        name: funk's instruction counts stay within 10% of the baseline
        entry: scripts/check-rust-speed.sh
        language: unsupported_script
        pass_filenames: false
        verbose: true
        files: ^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|scripts/((check-rust-speed|rust-env)\.sh|rust_speed\.py|rust-speed-baseline\.json)$)
      - id: rust-speed-test
        name: The rust-speed comparison passes its tests
        entry: python scripts/run_unittests.py rust-speed-test scripts/test_rust_speed.py
        language: python
        pass_filenames: false
        files: ^scripts/((test_)?rust_speed\.py|rust-speed-baseline\.json|run_unittests\.py)$
      # fir-ref's checks build lean/ through build-spec.sh --lean, under its
      # git guards (ADR-2026-10-29-2135,
      # docs/decisions/testing-and-harness.md#lean-tests-and-the-checks-of-fir-ref).
      - id: fir-ref-test
        name: The Lean tests pass, and fir-ref round-trips the corpus
        entry: scripts/check-fir-ref.sh
        args: [test]
        language: unsupported_script
        pass_filenames: false
        files: ^(lean/|tests/fir/|scripts/(build-spec|check-fir-ref(-run|-deep)?)\.sh$)
      - id: fir-round-trip
        name: Lean reprints the texts that Rust prints, byte for byte
        entry: scripts/check-fir-ref.sh
        args: [round-trip]
        language: unsupported_script
        pass_filenames: false
        files: ^(lean/|crates/|tests/fir/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|scripts/(build-spec|check-fir-ref|rust-env)\.sh$)
      # The differential harness
      # (docs/decisions/testing-and-harness.md#the-harness-program): funk verify
      # and fir-ref validate give every text of tests/fir/ and every generated
      # module the same verdict, and native code refines fir-ref on every
      # test. It needs elan, rustup and GNU as and ld.
      - id: fir-harness
        name: fir-ref and native code agree on the corpus (the differential harness)
        entry: scripts/check-harness.sh
        language: unsupported_script
        pass_filenames: false
        files: ^(lean/|crates/|tests/fir/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|scripts/(build-spec\.sh$|check-harness\.sh$|rust-env\.sh$|harness/))
      # Generated programs on fir-ref and as native code, and random texts
      # through fir-ref fmt (ADR-2026-11-08-2115), on fixed seeds.
      - id: fir-random
        name: fir-ref and native code agree on generated programs
        entry: scripts/check-random-programs.sh
        language: unsupported_script
        pass_filenames: false
        files: ^(lean/|crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|scripts/(build-spec\.sh$|check-random-programs\.sh$|rust-env\.sh$|harness/))
      # The same script with fresh seeds, and the fuzzers. Only the nightly
      # workflow runs them (ADR-2026-11-08-2116,
      # docs/decisions/testing-and-harness-generated.md#fuzzing).
      - id: fir-random-nightly
        name: fir-ref and native code agree on fresh generated programs
        entry: scripts/check-random-programs.sh --fresh 10000
        language: unsupported_script
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: fir-fuzz
        name: The Rust parser and verifier survive fuzzing
        entry: scripts/check-fuzz.sh
        language: unsupported_script
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: fir-harness-test
        name: The differential harness passes its tests
        entry: python scripts/run_unittests.py fir-harness-test -m unittest discover -s scripts/harness -p test_*.py
        language: python
        pass_filenames: false
        files: ^scripts/(harness/|run_unittests\.py$)
      # The corpus's coverage matrix (ADR-2026-11-03-0557): the committed
      # docs/coverage/README.md is the one that coverage.py makes, and
      # every cell has a test.
      - id: coverage-matrix
        name: The corpus's coverage matrix is current, and every cell has a test
        entry: python scripts/harness/coverage.py
        language: python
        pass_filenames: false
        files: ^(tests/fir/|docs/coverage/|scripts/harness/)
      # CI runs each hook above and below in exactly one job of
      # .github/workflows/, and its required check needs every job
      # (ADR-2026-11-05-1408).
      - id: ci-hooks
        name: CI runs every hook in exactly one job
        entry: python scripts/check_ci_hooks.py
        language: python
        additional_dependencies: [pyyaml==6.0.3]
        pass_filenames: false
        files: ^(\.pre-commit-config\.yaml|\.github/workflows/.*|scripts/check_ci_hooks\.py)$
      - id: ci-hooks-test
        name: The ci-hooks check passes its tests
        entry: python scripts/run_unittests.py ci-hooks-test scripts/test_check_ci_hooks.py
        language: python
        additional_dependencies: [pyyaml==6.0.3]
        pass_filenames: false
        files: ^(\.pre-commit-config\.yaml|\.github/workflows/.*|scripts/((test_)?check_ci_hooks|run_unittests)\.py)$
      # The test hooks' scripts write their counts to the job summary in CI.
      - id: suite-summary-test
        name: The test suites' summary writer passes its tests
        entry: python scripts/run_unittests.py suite-summary-test scripts/test_suite_summary.py
        language: python
        pass_filenames: false
        files: ^(rust-toolchain\.toml|scripts/((test_)?suite_summary\.py|run_unittests\.py|check-rust\.sh|rust-env\.sh))$
      # The Python test hooks above run their tests through run_unittests.py,
      # which writes their counts to the job summary in CI (#150).
      - id: run-unittests-test
        name: The Python test hooks' runner passes its tests
        entry: python scripts/run_unittests.py run-unittests-test scripts/test_run_unittests.py
        language: python
        pass_filenames: false
        files: ^scripts/((test_)?run_unittests|suite_summary)\.py$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos
        args: []

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
