[package]
name = "funk-start-fds"
description = "Which of the standard file descriptors were closed when funk started"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Verus proves the crate's unsafe code (ADR-2026-11-03-0808). vstd is
# Verus's standard library: the `verus!` macro of the version that the
# pinned Verus release ships keeps the proof for Verus and erases it when
# cargo builds the crate (ADR-2026-11-03-0809).
[dependencies]
vstd = "=0.0.0-2026-11-01-0251"

# The verus-proof hook runs `cargo verus verify` on every crate that opts in.
[package.metadata.verus]
verify = true

# Cargo cannot inherit [workspace.lints] and change one of them, and the
# workspace's `forbid` cannot be lifted by an `allow`. So this crate repeats
# the workspace's lints with `unsafe_code` at `deny`, and one module allows
# it (ADR-2026-11-02-2253). Keep the rest in step with [workspace.lints].
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
