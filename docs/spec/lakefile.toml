name = "firspec"
defaultTargets = ["firspec", "FirSpecSite"]

[[require]]
name = "fir"
path = "../../lean"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.35.0"

# FirSpec renders the sources of `fir` with includeLiterate, so it is rebuilt
# whenever one of them changes, not only when their compiled form does.
[[input_dir]]
name = "firSources"
path = "../../lean/Fir"
text = true

[[lean_lib]]
name = "FirSpec"
needs = ["firSources"]

# The cases of ADR citations, which FirSpecSite's tests read with include_str and
# the adr-citations hook's tests also read (ADR-2026-11-05-1709).
[[input_file]]
name = "citationCases"
path = "FirSpecSite/citation-cases.json"
text = true

# The appendix of ADRs and the links of ADR citations, which firspec adds to the
# document when it renders it
# (docs/decisions/spec-site.md#the-adr-appendix-and-its-citations). Its tests run
# when it builds.
[[lean_lib]]
name = "FirSpecSite"
globs = ["FirSpecSite.*"]
needs = ["citationCases"]

[[lean_exe]]
name = "firspec"
root = "FirSpecMain"
supportInterpreter = true
