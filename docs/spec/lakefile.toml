name = "firspec"
defaultTargets = ["firspec", "FirSpecSite"]

[[require]]
name = "fir"
path = "../../lean"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.35.0"

# FirSpec renders the sources of `fir` with includeLiterate, so it is rebuilt
# whenever one of them changes, not only when their compiled form does.
[[input_dir]]
name = "firSources"
path = "../../lean/Fir"
text = true

[[lean_lib]]
name = "FirSpec"
needs = ["firSources"]

# The appendix of ADRs and the links of ADR citations, which firspec adds to the
# document when it renders it (ADR-2026-10-30-1439). Its tests run when it builds.
[[lean_lib]]
name = "FirSpecSite"
globs = ["FirSpecSite.*"]

[[lean_exe]]
name = "firspec"
root = "FirSpecMain"
supportInterpreter = true
