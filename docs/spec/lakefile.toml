name = "firspec"
defaultTargets = ["firspec"]

[[require]]
name = "fir"
path = "../../lean"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.35.0"

# FirSpec renders the sources of `fir` with includeLiterate, so it is rebuilt
# whenever one of them changes, not only when their compiled form does.
[[input_dir]]
name = "firSources"
path = "../../lean/Fir"
text = true

[[lean_lib]]
name = "FirSpec"
needs = ["firSources"]

[[lean_exe]]
name = "firspec"
root = "FirSpecMain"
supportInterpreter = true
